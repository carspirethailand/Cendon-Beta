<!DOCTYPE html>
<html lang="th" data-ctheme="midnight">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#05070F"/>
<title>SpireONE — AI Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Anuphan:wght@300;400;500;600;700&family=Trirong:wght@500;600&display=swap">
<style>
/* ============ THEMES ============ */
:root, [data-ctheme="midnight"]{
  --c-bg0:#05070F; --c-bg1:#0B1226; --c-bg2:#0E1530;
  --c-aura1:rgba(232,148,60,.14); --c-aura2:rgba(84,110,255,.13); --c-aura3:rgba(155,93,229,.10);
  --c-ink:#EEF2FB; --c-mut:#9AA6BE; --c-faint:#5E6B85;
  --c-glass:rgba(255,255,255,.055); --c-glass2:rgba(255,255,255,.10); --c-line:rgba(255,255,255,.10); --c-line2:rgba(255,255,255,.06);
  --c-grad:linear-gradient(135deg,#E8943C,#D95E3C); --c-acc:#E8943C; --c-acc-soft:rgba(232,148,60,.16);
  --c-user:linear-gradient(135deg,#E8943C,#D9553C);
  --c-ai-bubble:rgba(255,255,255,.06);
  --pill-bg:rgba(13,18,36,.62); --sheet-bg:rgba(14,20,38,.92);
  --star-op:1; --star-c:255,255,255;
  --kd:'Fraunces','Trirong',Georgia,serif; --kb:'Inter','Anuphan',system-ui,sans-serif;
}
[data-ctheme="aurora"]{
  --c-bg0:#040D0E; --c-bg1:#081722; --c-bg2:#0A1B2C;
  --c-aura1:rgba(0,245,212,.13); --c-aura2:rgba(155,93,229,.15); --c-aura3:rgba(34,211,167,.09);
  --c-grad:linear-gradient(135deg,#22D3A7,#7C5CFF); --c-acc:#2BE0B4; --c-acc-soft:rgba(43,224,180,.14);
  --c-user:linear-gradient(135deg,#18B98E,#6D4DF2);
  --pill-bg:rgba(9,20,28,.62); --sheet-bg:rgba(10,22,32,.92);
}
[data-ctheme="sunset"]{
  --c-bg0:#150910; --c-bg1:#241019; --c-bg2:#2C1420;
  --c-aura1:rgba(255,94,98,.17); --c-aura2:rgba(255,158,60,.14); --c-aura3:rgba(255,70,130,.09);
  --c-grad:linear-gradient(135deg,#FF9E3C,#FF5E62); --c-acc:#FF8A4C; --c-acc-soft:rgba(255,138,76,.15);
  --c-user:linear-gradient(135deg,#FF8E3C,#F4504F);
  --pill-bg:rgba(34,15,24,.62); --sheet-bg:rgba(38,17,26,.93);
}
[data-ctheme="pearl"]{
  --c-bg0:#F4F1EB; --c-bg1:#FBF9F4; --c-bg2:#FFFFFF;
  --c-aura1:rgba(232,148,60,.16); --c-aura2:rgba(120,150,255,.12); --c-aura3:rgba(217,94,60,.08);
  --c-ink:#26221B; --c-mut:#6F6A5D; --c-faint:#A59E8E;
  --c-glass:rgba(255,255,255,.72); --c-glass2:rgba(255,255,255,.92); --c-line:rgba(40,34,18,.13); --c-line2:rgba(40,34,18,.07);
  --c-grad:linear-gradient(135deg,#E8943C,#D95E3C); --c-acc:#D9733C; --c-acc-soft:rgba(217,115,60,.13);
  --c-user:linear-gradient(135deg,#E8943C,#D9553C);
  --c-ai-bubble:rgba(255,255,255,.85);
  --pill-bg:rgba(255,255,255,.72); --sheet-bg:rgba(255,255,255,.96);
  --star-op:0; --star-c:120,100,60;
}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
html,body{height:100%}
body{font-family:var(--kb);color:var(--c-ink);background:var(--c-bg0);overflow:hidden;line-height:1.6;font-size:15.5px;
  -webkit-font-smoothing:antialiased;height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.ti{line-height:1}
::selection{background:var(--c-acc);color:#fff}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--c-line);border-radius:8px}

/* ============ STAGE (background) ============ */
.stage{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-grad{position:absolute;inset:0;background:
  radial-gradient(130% 100% at 50% -10%,var(--c-bg2) 0%,var(--c-bg1) 42%,var(--c-bg0) 100%)}
.aura{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform;transform:translateZ(0)}
.aura.a1{width:56vw;height:56vw;min-width:480px;min-height:480px;left:-14vw;top:-18vh;background:radial-gradient(circle,var(--c-aura1),transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.aura.a2{width:52vw;height:52vw;min-width:440px;min-height:440px;right:-16vw;bottom:-22vh;background:radial-gradient(circle,var(--c-aura2),transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
.aura.a3{width:34vw;height:34vw;min-width:300px;min-height:300px;left:38vw;top:44vh;background:radial-gradient(circle,var(--c-aura3),transparent 65%);animation:drift1 40s ease-in-out infinite alternate-reverse}
@keyframes drift1{from{transform:translate3d(0,0,0)}to{transform:translate3d(6vw,4vh,0)}}
@keyframes drift2{from{transform:translate3d(0,0,0)}to{transform:translate3d(-5vw,-4vh,0)}}
.stars{position:absolute;inset:0;opacity:calc(var(--star-op)*.9);background-repeat:repeat;background-size:520px 520px}
.stars.s1{background-image:
  radial-gradient(1.4px 1.4px at 40px 60px,rgba(var(--star-c),.9),transparent 55%),
  radial-gradient(1px 1px at 190px 120px,rgba(var(--star-c),.6),transparent 55%),
  radial-gradient(1.6px 1.6px at 320px 40px,rgba(var(--star-c),.85),transparent 55%),
  radial-gradient(1px 1px at 460px 210px,rgba(var(--star-c),.5),transparent 55%),
  radial-gradient(1.2px 1.2px at 90px 300px,rgba(var(--star-c),.7),transparent 55%),
  radial-gradient(1px 1px at 260px 380px,rgba(var(--star-c),.55),transparent 55%),
  radial-gradient(1.5px 1.5px at 410px 330px,rgba(var(--star-c),.8),transparent 55%),
  radial-gradient(1px 1px at 150px 470px,rgba(var(--star-c),.5),transparent 55%)}
.stars.s2{background-size:780px 780px;animation:twinkle 5.5s ease-in-out infinite alternate;background-image:
  radial-gradient(1.8px 1.8px at 120px 90px,rgba(var(--star-c),.95),transparent 55%),
  radial-gradient(1.2px 1.2px at 420px 170px,rgba(var(--star-c),.7),transparent 55%),
  radial-gradient(2px 2px at 640px 60px,rgba(var(--star-c),.85),transparent 55%),
  radial-gradient(1.2px 1.2px at 240px 420px,rgba(var(--star-c),.6),transparent 55%),
  radial-gradient(1.6px 1.6px at 560px 520px,rgba(var(--star-c),.8),transparent 55%),
  radial-gradient(1.2px 1.2px at 70px 640px,rgba(var(--star-c),.65),transparent 55%)}
@keyframes twinkle{from{opacity:calc(var(--star-op)*.35)}to{opacity:calc(var(--star-op)*.95)}}
/* shooting stars — setup phases only */
.meteor{position:absolute;top:-140px;width:2px;height:120px;opacity:0;border-radius:2px;
  background:linear-gradient(180deg,rgba(var(--star-c),.95),rgba(var(--star-c),0));
  will-change:transform;transform:rotate(38deg) translateZ(0)}
.meteor::after{content:"";position:absolute;top:-3px;left:-2px;width:6px;height:6px;border-radius:50%;
  background:rgba(var(--star-c),.95);box-shadow:0 0 14px 3px rgba(var(--star-c),.6)}
.meteor.m1{left:18%;animation:shoot 7s linear 1.2s infinite}
.meteor.m2{left:55%;height:90px;animation:shoot 9s linear 4.6s infinite}
.meteor.m3{left:78%;height:140px;animation:shoot 11s linear 7.8s infinite}
.meteor.m4{left:36%;height:80px;animation:shoot 13s linear 10.4s infinite}
@keyframes shoot{
  0%{opacity:0;transform:rotate(38deg) translateY(0)}
  2%{opacity:calc(var(--star-op)*.95)}
  11%{opacity:0;transform:rotate(38deg) translateY(118vh)}
  100%{opacity:0;transform:rotate(38deg) translateY(118vh)}}
body[data-phase="thread"] .meteor{display:none}

/* ============ PILL NAV ============ */
.pill{position:relative;z-index:40;margin:calc(12px + env(safe-area-inset-top)) auto 0;flex-shrink:0;
  display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:44px;max-width:calc(100vw - 24px);
  background:var(--pill-bg);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--c-line);box-shadow:0 14px 40px -14px rgba(0,0,0,.5);animation:pillIn .6s cubic-bezier(.2,.9,.25,1)}
@keyframes pillIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.p-brand{display:flex;align-items:center;gap:8px;padding:2px 8px 2px 4px}
.p-mark{width:30px;height:30px;border-radius:9px;background:var(--c-grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 16px -6px var(--c-acc)}
.p-mark svg{width:56%;height:56%}.p-mark path{fill:currentColor}
.p-brand b{font-size:14.5px;font-weight:800;font-family:var(--kd);letter-spacing:.4px;white-space:nowrap}
.p-sep{width:1px;height:22px;background:var(--c-line);flex-shrink:0}
.p-car{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:30px;font-weight:600;font-size:13px;
  color:var(--c-ink);transition:.18s;position:relative;max-width:190px}
.p-car:hover{background:var(--c-glass2)}
.p-car span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-car i{font-size:15px;color:var(--c-acc);flex-shrink:0}
.p-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--c-mut);transition:.18s;flex-shrink:0}
.p-btn:hover{background:var(--c-glass2);color:var(--c-ink)}
.p-close{background:rgba(214,74,74,.85);color:#fff}
.p-close:hover{background:#D64A4A;color:#fff}
.p-drop{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);min-width:230px;
  background:var(--sheet-bg);backdrop-filter:blur(24px);border:1px solid var(--c-line);border-radius:18px;
  box-shadow:0 22px 54px -14px rgba(0,0,0,.55);padding:8px;display:none;z-index:50}
.p-drop.open{display:block;animation:dropIn .22s cubic-bezier(.2,.9,.3,1)}
@keyframes dropIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%)}}
.p-item{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:11px;font-size:13.5px;
  font-weight:500;text-align:left;color:var(--c-ink);transition:.14s}
.p-item:hover{background:var(--c-glass2)}
.p-item.sel{background:var(--c-acc-soft);color:var(--c-acc);font-weight:600}
.p-item i{font-size:16px;color:var(--c-acc)}

/* ============ MAIN / PANES ============ */
.wrap{position:relative;z-index:10;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;width:100%}
.pane{display:none;flex-direction:column;align-items:center;width:100%;height:100%;overflow-y:auto;
  padding:26px 20px calc(28px + env(safe-area-inset-bottom))}
.pane.on{display:flex;animation:paneIn .45s cubic-bezier(.2,.9,.25,1)}
@keyframes paneIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pane-center{justify-content:center}
.pane-inner{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center}

/* welcome */
.logo-halo{position:relative;width:96px;height:96px;display:grid;place-items:center;margin-bottom:6px}
.logo-halo::before{content:"";position:absolute;inset:-16px;border-radius:50%;
  background:radial-gradient(circle,var(--c-acc-soft),transparent 70%);animation:haloPulse 3.6s ease-in-out infinite}
@keyframes haloPulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
.big-logo{position:relative;width:76px;height:76px;border-radius:22px;background:var(--c-grad);color:#fff;
  display:grid;place-items:center;box-shadow:0 20px 44px -12px var(--c-acc),inset 0 1px 0 rgba(255,255,255,.35);
  animation:logoFloat 4.2s ease-in-out infinite;will-change:transform}
.big-logo svg{width:52%;height:52%}.big-logo path{fill:currentColor}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.w-greet{font-family:var(--kd);font-weight:600;font-size:clamp(24px,5.4vw,32px);text-align:center;line-height:1.2;
  margin-top:18px;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--c-ink) 30%,var(--c-acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.w-sub{color:var(--c-mut);font-size:14px;margin-top:8px;text-align:center;max-width:400px}
.w-car-tag{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 16px;border-radius:30px;
  background:var(--c-glass);border:1px solid var(--c-line);font-size:13px;font-weight:600;color:var(--c-ink)}
.w-car-tag i{color:var(--c-acc)}
.w-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;margin-top:26px}
.act-btn{position:relative;display:flex;align-items:center;gap:14px;padding:17px 20px;border-radius:20px;
  font-size:15px;font-weight:700;overflow:hidden;isolation:isolate;transition:transform .28s cubic-bezier(.2,.9,.3,1.4),box-shadow .28s;
  border:1px solid var(--c-line)}
.act-btn:hover{transform:translateY(-3px)}
.act-btn:active{transform:translateY(-1px) scale(.985)}
.act-btn .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.act-btn small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:1px}
.act-btn.primary{background:var(--c-grad);color:#fff;border:none;box-shadow:0 16px 36px -12px var(--c-acc)}
.act-btn.primary .ic{background:rgba(255,255,255,.2)}
.act-btn.primary::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  transform:translateX(-110%);animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-110%)}85%,100%{transform:translateX(110%)}}
.act-btn.ghost{background:var(--c-glass);backdrop-filter:blur(14px);color:var(--c-ink)}
.act-btn.ghost:hover{border-color:var(--c-acc);box-shadow:0 14px 32px -16px var(--c-acc)}
.act-btn.ghost .ic{background:var(--c-acc-soft);color:var(--c-acc)}

/* gate — car chooser */
.gate-list{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;margin-top:24px}
.gate-car{display:flex;align-items:center;gap:13px;padding:15px 18px;border-radius:18px;text-align:left;
  background:var(--c-glass);backdrop-filter:blur(14px);border:1px solid var(--c-line);
  transition:transform .25s cubic-bezier(.2,.9,.3,1.3),border-color .25s,box-shadow .25s}
.gate-car:hover{transform:translateY(-3px);border-color:var(--c-acc);box-shadow:0 14px 34px -16px var(--c-acc)}
.gate-car .ic{width:42px;height:42px;border-radius:13px;background:var(--c-grad);color:#fff;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.gate-car b{font-size:14.5px;display:block}
.gate-car small{font-size:12px;color:var(--c-mut)}
.gate-car i.arrow{margin-left:auto;color:var(--c-faint);font-size:16px}

/* choice tiles */
.back-row{width:100%;max-width:560px;display:flex;margin-bottom:16px}
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;
  color:var(--c-mut);background:var(--c-glass);border:1px solid var(--c-line);transition:.18s}
.back-btn:hover{color:var(--c-ink);border-color:var(--c-acc)}
.pane-title{font-family:var(--kd);font-size:clamp(20px,4vw,25px);font-weight:600;text-align:center;margin-bottom:4px}
.pane-sub{color:var(--c-mut);font-size:13.5px;text-align:center;margin-bottom:24px}
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:480px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 12px 22px;border-radius:22px;
  background:linear-gradient(165deg,var(--c-glass2),var(--c-glass));backdrop-filter:blur(16px);
  border:1px solid var(--c-line);overflow:hidden;isolation:isolate;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.3),border-color .3s,box-shadow .3s;
  opacity:0;transform:translateY(16px);animation:tileIn .5s cubic-bezier(.2,.9,.25,1) forwards}
.tile:nth-child(1){animation-delay:.03s}.tile:nth-child(2){animation-delay:.09s}
.tile:nth-child(3){animation-delay:.15s}.tile:nth-child(4){animation-delay:.21s}
@keyframes tileIn{to{opacity:1;transform:none}}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(130% 110% at 50% -10%,var(--tc-soft,var(--c-acc-soft)),transparent 62%)}
.tile:hover{transform:translateY(-5px);border-color:var(--tc,var(--c-acc));box-shadow:0 18px 40px -16px var(--tc,var(--c-acc))}
.tile:hover::after{opacity:1}
.tile:active{transform:translateY(-2px) scale(.97)}
.tile .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;color:#fff;
  background:linear-gradient(135deg,var(--tc,var(--c-acc)),var(--tc2,var(--c-acc)));
  box-shadow:0 12px 26px -10px var(--tc,var(--c-acc));transform:rotate(-7deg);transition:transform .35s cubic-bezier(.3,1.5,.6,1)}
.tile:hover .ic{transform:rotate(0) scale(1.08)}
.tile b{font-size:14px;font-weight:700}
.tile[data-c="orange"]{--tc:#E8943C;--tc2:#D95E3C;--tc-soft:rgba(232,148,60,.16)}
.tile[data-c="blue"]{--tc:#3A8CC5;--tc2:#62B6DE;--tc-soft:rgba(58,140,197,.16)}
.tile[data-c="purple"]{--tc:#9B5DE0;--tc2:#C470DB;--tc-soft:rgba(155,93,224,.16)}
.tile[data-c="green"]{--tc:#3E9E6E;--tc2:#5BC28C;--tc-soft:rgba(62,158,110,.16)}

/* symptom list */
.sym-list{width:100%;max-width:520px;display:flex;flex-direction:column;gap:9px}
.sym-item{display:flex;align-items:center;gap:12px;padding:14px 17px;border-radius:16px;text-align:left;font-size:14px;font-weight:500;
  background:var(--c-glass);backdrop-filter:blur(12px);border:1px solid var(--c-line);
  transition:.2s;opacity:0;transform:translateY(12px);animation:tileIn .4s cubic-bezier(.2,.9,.25,1) forwards}
.sym-item:nth-child(1){animation-delay:.02s}.sym-item:nth-child(2){animation-delay:.07s}.sym-item:nth-child(3){animation-delay:.12s}
.sym-item:nth-child(4){animation-delay:.17s}.sym-item:nth-child(5){animation-delay:.22s}
.sym-item:hover{border-color:var(--c-acc);transform:translateX(4px)}
.sym-item i{color:var(--c-acc);flex-shrink:0}

/* ============ THREAD ============ */
#v-thread{padding:14px 0 0}
.thread-scroll{flex:1;min-height:0;width:100%;overflow-y:auto;padding:12px 18px 8px;scroll-behavior:smooth}
.thread-col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.center-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;pointer-events:none;padding:0 24px;z-index:1}
.center-hint .hint-logo{width:58px;height:58px;border-radius:18px;background:var(--c-grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 16px 36px -12px var(--c-acc);animation:logoFloat 4.2s ease-in-out infinite;margin-bottom:2px}
.center-hint .hint-logo svg{width:52%;height:52%}.center-hint .hint-logo path{fill:currentColor}
.center-txt{font-family:var(--kd);font-weight:600;font-size:clamp(21px,5vw,29px);text-align:center;line-height:1.25;
  background:linear-gradient(100deg,var(--c-ink) 25%,var(--c-acc));-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;max-width:520px}
.center-txt.show{opacity:1;transform:none}
.center-sub{color:var(--c-mut);font-size:13px;opacity:.9}
.msg{display:flex;gap:11px;animation:msgIn .38s cubic-bezier(.2,.9,.3,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg .av{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:16px;color:#fff;margin-top:2px;overflow:hidden}
.msg.ai .av{background:var(--c-grad);box-shadow:0 8px 18px -8px var(--c-acc)}
.msg.ai .av svg{width:52%;height:52%}.msg.ai .av path{fill:currentColor}
.msg.me{flex-direction:row-reverse}
.msg.me .av{background:var(--c-glass2);border:1px solid var(--c-line);color:var(--c-mut)}
.msg.me .av img{width:100%;height:100%;object-fit:cover}
.bubble{padding:12px 16px;border-radius:18px;font-size:15px;max-width:76%;word-wrap:break-word;overflow-wrap:anywhere;line-height:1.65}
.msg.ai .bubble{background:var(--c-ai-bubble);border:1px solid var(--c-line);border-top-left-radius:6px;backdrop-filter:blur(10px)}
.msg.me .bubble{background:var(--c-user);color:#fff;border-top-right-radius:6px;box-shadow:0 10px 26px -12px var(--c-acc)}
.bubble strong{font-weight:700}
.bubble ul{margin:6px 0;list-style:none}
.bubble li{padding:2.5px 0 2.5px 16px;position:relative}
.bubble li::before{content:"•";position:absolute;left:2px;color:var(--c-acc)}
.bubble .matt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.bubble .matt img,.bubble .matt video{width:110px;height:78px;object-fit:cover;border-radius:11px}
.bubble .matt .au{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(0,0,0,.18);padding:6px 10px;border-radius:10px}
.typing{display:flex;gap:5px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--c-mut);animation:td 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.cursor{display:inline-block;width:2px;height:1em;background:var(--c-acc);vertical-align:-2px;margin-left:1px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* summary card */
.sum-card{width:100%;max-width:640px;margin:2px auto;border-radius:22px;overflow:hidden;position:relative;
  background:linear-gradient(170deg,var(--c-glass2),var(--c-glass));backdrop-filter:blur(16px);
  border:1px solid var(--c-line);animation:msgIn .45s cubic-bezier(.2,.9,.3,1)}
.sum-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c-grad)}
.sum-head{display:flex;align-items:center;gap:10px;padding:18px 22px 4px}
.sum-head .ic{width:36px;height:36px;border-radius:11px;background:var(--c-grad);color:#fff;display:grid;place-items:center;font-size:17px}
.sum-head b{font-family:var(--kd);font-size:17px}
.sum-body{padding:12px 22px 20px;display:flex;flex-direction:column;gap:13px}
.sum-row{display:flex;gap:11px;font-size:14px}
.sum-row i{color:var(--c-acc);font-size:17px;flex-shrink:0;margin-top:2px}
.sum-row .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--c-faint);font-weight:700;display:block}
.sum-row ul{list-style:none;margin-top:2px}
.sum-row li{padding:1.5px 0 1.5px 14px;position:relative}
.sum-row li::before{content:"•";position:absolute;left:0;color:var(--c-acc)}
.urg{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-top:3px}
.urg.low{background:rgba(62,158,110,.16);color:#4CC287}
.urg.medium{background:rgba(232,162,60,.16);color:#E8A23C}
.urg.high{background:rgba(214,74,74,.16);color:#F26D6D}

/* ============ CHIPS ============ */
.chip-row{position:relative;z-index:20;display:none;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:4px 18px 10px;max-width:820px;margin:0 auto;width:100%}
body[data-phase="thread"] .chip-row{display:flex}
.chip{padding:9px 15px;border-radius:30px;background:var(--c-glass);backdrop-filter:blur(12px);
  border:1px solid var(--c-line);font-size:12.5px;font-weight:600;color:var(--c-mut);transition:.18s;
  animation:paneIn .4s cubic-bezier(.2,.9,.25,1)}
.chip:hover{border-color:var(--c-acc);color:var(--c-acc);transform:translateY(-2px)}
.chip.sumchip{background:var(--c-acc-soft);color:var(--c-acc);border-color:transparent}
.chip.sumchip i{margin-right:4px}

/* ============ COMPOSER ============ */
.composer{position:relative;z-index:20;display:none;flex-shrink:0;width:calc(100% - 28px);max-width:800px;
  margin:0 auto calc(14px + env(safe-area-inset-bottom));border-radius:26px;padding:7px;
  background:var(--c-glass2);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--c-line);box-shadow:0 18px 44px -14px rgba(0,0,0,.45);transition:border-color .25s,box-shadow .25s}
body[data-phase="thread"] .composer{display:block;animation:compIn .5s cubic-bezier(.2,.9,.25,1)}
@keyframes compIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.composer:focus-within{border-color:var(--c-acc);box-shadow:0 18px 44px -14px rgba(0,0,0,.45),0 0 0 3px var(--c-acc-soft)}
.atts{display:flex;gap:8px;flex-wrap:wrap;padding:6px 8px 2px}.atts:empty{display:none}
.att-chip{display:flex;align-items:center;gap:7px;background:var(--c-glass);border:1px solid var(--c-line);border-radius:12px;padding:5px 9px;font-size:12px}
.att-chip img,.att-chip video{width:34px;height:34px;border-radius:8px;object-fit:cover}
.att-chip .x{cursor:pointer;color:var(--c-faint);font-size:15px}.att-chip .x:hover{color:#F26D6D}
.crow{display:flex;align-items:flex-end;gap:3px}
.att-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--c-mut);font-size:19px;flex-shrink:0;transition:.16s}
.att-btn:hover{background:var(--c-glass2);color:var(--c-acc)}
.att-btn.rec{background:#D64A4A;color:#fff;animation:recPulse 1.2s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(214,74,74,.5)}50%{box-shadow:0 0 0 10px rgba(214,74,74,0)}}
.att-btn.hint{animation:hintPulse 1.4s ease-in-out 3;color:var(--c-acc)}
@keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 var(--c-acc-soft)}50%{box-shadow:0 0 0 10px transparent;background:var(--c-acc-soft)}}
#inp{flex:1;border:none;outline:none;background:transparent;resize:none;font-family:inherit;font-size:15.5px;
  color:var(--c-ink);max-height:140px;padding:10px 6px;line-height:1.55}
#inp::placeholder{color:var(--c-faint)}
.send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--c-grad);color:#fff;
  font-size:19px;flex-shrink:0;transition:.2s;box-shadow:0 10px 22px -8px var(--c-acc)}
.send:hover:not(:disabled){transform:translateY(-2px) scale(1.05)}
.send:disabled{opacity:.4;box-shadow:none;cursor:default}

/* ============ SHEETS ============ */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .28s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:90;right:14px;top:50%;transform:translateY(-50%) translateX(30px);width:min(360px,calc(100vw - 28px));
  max-height:min(620px,calc(100dvh - 40px));display:flex;flex-direction:column;border-radius:24px;overflow:hidden;
  background:var(--sheet-bg);backdrop-filter:blur(26px);border:1px solid var(--c-line);
  box-shadow:0 28px 70px -18px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.32s cubic-bezier(.2,.9,.3,1)}
.sheet.show{opacity:1;pointer-events:auto;transform:translateY(-50%)}
@media(max-width:560px){
  .sheet{right:0;left:0;top:auto;bottom:0;width:100%;max-height:78dvh;border-radius:26px 26px 0 0;
    transform:translateY(100%)}
  .sheet.show{transform:none}
}
.sheet-head{display:flex;align-items:center;gap:10px;padding:18px 20px 12px;flex-shrink:0}
.sheet-head b{font-family:var(--kd);font-size:18px;flex:1}
.sheet-head .p-btn{width:32px;height:32px}
.sheet-body{padding:4px 20px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.theme-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.th-opt{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:15px;
  border:1.5px solid var(--c-line);transition:.18s;font-size:11px;font-weight:600;color:var(--c-mut)}
.th-opt:hover{border-color:var(--c-acc)}
.th-opt.sel{border-color:var(--c-acc);background:var(--c-acc-soft);color:var(--c-ink)}
.th-dot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.th-dot.midnight{background:linear-gradient(135deg,#0B1226 45%,#E8943C)}
.th-dot.aurora{background:linear-gradient(135deg,#081722 45%,#22D3A7 75%,#7C5CFF)}
.th-dot.sunset{background:linear-gradient(135deg,#241019 45%,#FF9E3C 75%,#FF5E62)}
.th-dot.pearl{background:linear-gradient(135deg,#FBF9F4 45%,#E8943C)}
.sheet-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--c-faint);font-weight:700;margin-top:6px}
.sheet-btn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 15px;border-radius:14px;font-size:14px;font-weight:600;
  background:var(--c-glass);border:1px solid var(--c-line);color:var(--c-ink);transition:.16s;text-align:left}
.sheet-btn:hover{border-color:var(--c-acc)}
.sheet-btn.danger{color:#F26D6D}
.sheet-btn.danger:hover{border-color:#F26D6D;background:rgba(214,74,74,.08)}
/* history list */
.hist-item{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;border-radius:15px;text-align:left;
  background:var(--c-glass);border:1px solid var(--c-line);transition:.16s}
.hist-item:hover{border-color:var(--c-acc)}
.hist-item.cur{border-color:var(--c-acc);background:var(--c-acc-soft)}
.hist-item .tx{flex:1;min-width:0}
.hist-item b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-item small{font-size:11.5px;color:var(--c-faint)}
.hist-del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--c-faint);flex-shrink:0}
.hist-del:hover{color:#F26D6D;background:rgba(214,74,74,.1)}
.hist-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:15px;
  background:var(--c-grad);color:#fff;font-weight:700;font-size:14px;box-shadow:0 12px 26px -10px var(--c-acc);transition:.2s}
.hist-new:hover{transform:translateY(-2px)}

/* toast */
.toast{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(130px);
  background:var(--sheet-bg);backdrop-filter:blur(18px);color:var(--c-ink);padding:13px 20px;border-radius:16px;font-weight:600;
  font-size:13.5px;border:1px solid var(--c-line);box-shadow:0 18px 44px -12px rgba(0,0,0,.5);z-index:200;transition:.32s cubic-bezier(.2,.9,.3,1);
  display:flex;gap:9px;align-items:center;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .ti{font-size:18px;color:var(--c-acc)}

@media(max-width:480px){
  .p-brand b{display:none}
  .p-car{max-width:130px}
  .tile-grid{gap:11px}
  .bubble{max-width:84%}
}
@media(prefers-reduced-motion:reduce){
  .meteor,.aura,.stars.s2,.big-logo,.hint-logo,.logo-halo::before,.act-btn.primary::after{animation:none!important}
}
</style>
</head>
<body data-phase="welcome">

<!-- BACKGROUND STAGE -->
<div class="stage">
  <div class="bg-grad"></div>
  <div class="aura a1"></div><div class="aura a2"></div><div class="aura a3"></div>
  <div class="stars s1"></div><div class="stars s2"></div>
  <div class="meteor m1"></div><div class="meteor m2"></div><div class="meteor m3"></div><div class="meteor m4"></div>
</div>

<!-- PILL NAV -->
<header class="pill">
  <div class="p-brand">
    <div class="p-mark"><svg viewBox="0 0 100 100"><path d="M66 9 L21 41.5 L37.5 41.5 L37.5 95 L66 95 Z"/></svg></div>
    <b>SpireONE</b>
  </div>
  <div class="p-sep"></div>
  <button class="p-car" id="pCar" onclick="toggleCarDrop(event)">
    <i class="ti ti-car"></i><span id="pCarName">เลือกรถ</span><i class="ti ti-chevron-down" style="font-size:11px;color:var(--c-faint)"></i>
    <div class="p-drop" id="carDrop"></div>
  </button>
  <div class="p-sep"></div>
  <button class="p-btn" onclick="openSheet('hist')" title="ประวัติบทสนทนา"><i class="ti ti-history"></i></button>
  <button class="p-btn" onclick="openSheet('set')" title="ตั้งค่า"><i class="ti ti-settings"></i></button>
  <button class="p-btn p-close" onclick="goHome()" title="กลับหน้าหลัก"><i class="ti ti-x"></i></button>
</header>

<!-- MAIN -->
<main class="wrap">

  <!-- GATE: no car selected -->
  <section class="pane pane-center" id="v-gate">
    <div class="pane-inner">
      <div class="logo-halo"><div class="big-logo"><svg viewBox="0 0 100 100"><path d="M66 9 L21 41.5 L37.5 41.5 L37.5 95 L66 95 Z"/></svg></div></div>
      <div class="w-greet" data-t="gate.title">เลือกรถของคุณ</div>
      <div class="w-sub" data-t="gate.sub">SpireONE จะวิเคราะห์ได้แม่นยำขึ้นเมื่อรู้จักรถของคุณ</div>
      <div class="gate-list" id="gateList"></div>
    </div>
  </section>

  <!-- WELCOME: car ready -->
  <section class="pane pane-center" id="v-welcome">
    <div class="pane-inner">
      <div class="logo-halo"><div class="big-logo"><svg viewBox="0 0 100 100"><path d="M66 9 L21 41.5 L37.5 41.5 L37.5 95 L66 95 Z"/></svg></div></div>
      <div class="w-greet" id="wGreet">สวัสดี</div>
      <div class="w-sub" data-t="w.sub">ผู้ช่วย AI ดูแลรถของคุณ พร้อมวิเคราะห์ทุกอาการ</div>
      <div class="w-car-tag" id="wCarTag"><i class="ti ti-car"></i><span></span></div>
      <div class="w-actions">
        <button class="act-btn primary" onclick="showChoices()">
          <span class="ic"><i class="ti ti-stethoscope"></i></span>
          <span><span data-t="w.diag">วินิจฉัยปัญหารถ</span><small data-t="w.diagsub">พิมพ์ · ถ่ายรูป · วิดีโอ · อัดเสียง</small></span>
        </button>
        <button class="act-btn ghost" onclick="showSymCats()">
          <span class="ic"><i class="ti ti-alert-triangle"></i></span>
          <span><span data-t="w.sym">บอกอาการหรือปัญหา</span><small data-t="w.symsub">เลือกจากอาการยอดนิยม</small></span>
        </button>
        <button class="act-btn ghost" onclick="enterThread({focus:true})">
          <span class="ic"><i class="ti ti-message-2"></i></span>
          <span><span data-t="w.free">คุยกับ SpireONE เลย</span><small data-t="w.freesub">ถามอะไรก็ได้เกี่ยวกับรถ</small></span>
        </button>
      </div>
    </div>
  </section>

  <!-- CHOICES: diagnosis method -->
  <section class="pane pane-center" id="v-choices">
    <div class="pane-inner">
      <div class="back-row"><button class="back-btn" onclick="setPhase('welcome')"><i class="ti ti-arrow-left"></i> <span data-t="ch.back">ย้อนกลับ</span></button></div>
      <div class="pane-title" data-t="ch.how">เลือกวิธีวินิจฉัย</div>
      <div class="pane-sub" data-t="ch.howsub">ส่งข้อมูลให้ SpireONE ในแบบที่สะดวกที่สุด</div>
      <div class="tile-grid">
        <button class="tile" data-c="orange" onclick="startMode('text')"><span class="ic"><i class="ti ti-message-2"></i></span><b data-t="qa.text">พิมพ์ถาม</b></button>
        <button class="tile" data-c="blue" onclick="startMode('image')"><span class="ic"><i class="ti ti-camera"></i></span><b data-t="qa.image">ถ่ายรูป</b></button>
        <button class="tile" data-c="purple" onclick="startMode('video')"><span class="ic"><i class="ti ti-video"></i></span><b data-t="qa.video">วิดีโอ</b></button>
        <button class="tile" data-c="green" onclick="startMode('mic')"><span class="ic"><i class="ti ti-microphone"></i></span><b data-t="qa.mic">อัดเสียง</b></button>
      </div>
    </div>
  </section>

  <!-- SYMPTOM CATEGORIES -->
  <section class="pane pane-center" id="v-symcats">
    <div class="pane-inner">
      <div class="back-row"><button class="back-btn" onclick="setPhase('welcome')"><i class="ti ti-arrow-left"></i> <span data-t="ch.back">ย้อนกลับ</span></button></div>
      <div class="pane-title" data-t="ch.cat">เลือกหมวดหมู่อาการ</div>
      <div class="pane-sub" data-t="ch.catsub">อาการอยู่ส่วนไหนของรถ?</div>
      <div class="tile-grid">
        <button class="tile" data-c="orange" onclick="showSymList('engine')"><span class="ic"><i class="ti ti-engine"></i></span><b data-t="sym.engine">เครื่องยนต์</b></button>
        <button class="tile" data-c="blue" onclick="showSymList('ac')"><span class="ic"><i class="ti ti-wind"></i></span><b data-t="sym.ac">ระบบแอร์</b></button>
        <button class="tile" data-c="purple" onclick="showSymList('gear')"><span class="ic"><i class="ti ti-settings-2"></i></span><b data-t="sym.gear">ระบบเกียร์</b></button>
        <button class="tile" data-c="green" onclick="showSymList('wheels')"><span class="ic"><i class="ti ti-steering-wheel"></i></span><b data-t="sym.wheels">ล้อและยาง</b></button>
      </div>
    </div>
  </section>

  <!-- SYMPTOM LIST -->
  <section class="pane" id="v-symlist" style="justify-content:center">
    <div class="pane-inner">
      <div class="back-row"><button class="back-btn" onclick="setPhase('symcats')"><i class="ti ti-arrow-left"></i> <span data-t="ch.back">ย้อนกลับ</span></button></div>
      <div class="pane-title" id="symTitle" style="margin-bottom:18px">อาการยอดนิยม</div>
      <div class="sym-list" id="symList"></div>
    </div>
  </section>

  <!-- THREAD -->
  <section class="pane" id="v-thread">
    <div class="center-hint" id="centerHint">
      <div class="hint-logo"><svg viewBox="0 0 100 100"><path d="M66 9 L21 41.5 L37.5 41.5 L37.5 95 L66 95 Z"/></svg></div>
      <div class="center-txt" id="centerTxt"></div>
      <div class="center-sub" id="centerSub"></div>
    </div>
    <div class="thread-scroll" id="threadScroll"><div class="thread-col" id="thread"></div></div>
  </section>
</main>

<!-- CHIPS -->
<div class="chip-row" id="chipRow"></div>

<!-- COMPOSER -->
<footer class="composer" id="composer">
  <div class="atts" id="atts"></div>
  <div class="crow">
    <button class="att-btn" id="attImg" title="รูป"><i class="ti ti-photo"></i></button>
    <button class="att-btn" id="attVid" title="วิดีโอ"><i class="ti ti-video"></i></button>

    <button class="send" id="sendBtn" disabled><i class="ti ti-arrow-up"></i></button>
  </div>
</footer>

<!-- SHEETS -->
<div class="sheet-bg" id="sheetBg" onclick="closeSheets()"></div>
<div class="sheet" id="sheetSet">
  <div class="sheet-head"><b data-t="s.title">ตั้งค่า</b><button class="p-btn" onclick="closeSheets()"><i class="ti ti-x"></i></button></div>
  <div class="sheet-body">
    <div class="sheet-label" data-t="s.theme">ธีมห้องแชต</div>
    <div class="theme-row">
      <button class="th-opt" data-th="midnight" onclick="setChatTheme('midnight')"><span class="th-dot midnight"></span>Midnight</button>
      <button class="th-opt" data-th="aurora" onclick="setChatTheme('aurora')"><span class="th-dot aurora"></span>Aurora</button>
      <button class="th-opt" data-th="sunset" onclick="setChatTheme('sunset')"><span class="th-dot sunset"></span>Sunset</button>
      <button class="th-opt" data-th="pearl" onclick="setChatTheme('pearl')"><span class="th-dot pearl"></span>Pearl</button>

/* ===== GEMINI ===== */
async function gemini(contents,opts){opts=opts||{};
  const body={contents,generationConfig:{temperature:opts.temp!=null?opts.temp:0.5}};
  if(opts.system)body.systemInstruction={parts:[{text:opts.system}]};
  if(opts.search)body.tools=[{google_search:{}}];
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,150));
  const d=await r.json(),c=(d.candidates&&d.candidates[0])||{};
  return ((c.content&&c.content.parts)||[]).map(p=>p.text||"").join("").trim();
}
function gParse(t){if(!t)return null;let s=t.replace(/```json/gi,"").replace(/```/g,"").trim();const m=s.match(/[\[{][\s\S]*[\]}]/);if(m)s=m[0];try{return JSON.parse(s)}catch{return null}}

function addHistory(carId,q,a){const g=garage();const c=g.find(x=>x.id===carId);if(!c)return;
  c.history=c.history||[];c.history.unshift({t:Date.now(),q,a:(a||"").slice(0,200)});
  if(c.history.length>30)c.history.length=30;saveGarage(g)}
function carsAreRemote(){return !!(currentUser&&useFb&&auth&&auth.currentUser&&location.protocol!=="file:")}
async function syncCars(){
  if(!carsAreRemote())return;
  try{
    const tok=await auth.currentUser.getIdToken();
    const r=await fetch(`${BACKEND_URL}/api/cars`,{headers:{Authorization:"Bearer "+tok}});
    if(!r.ok)return;
    const arr=await r.json();if(!Array.isArray(arr))return;
    const local=garage();
    const merged=arr.map(c=>{const name=`${c.make||""} ${c.model||""}`.trim();const prev=local.find(x=>x.id===c.id)||{};
      return{id:c.id,make:c.make||"",model:c.model||"",name,year:c.year!=null?String(c.year):"",mileage:c.mileage!=null?String(c.mileage):"",type:prev.type||"sedan",history:prev.history||[]}});
    saveGarage(merged);renderCarUI();
  }catch(e){console.warn("syncCars",e)}
}

});

/* ===== SESSIONS (multi-conversation per car) ===== */
let messages=[],pending=[],mediaRec=null,recChunks=[],sending=false;
function sessKey(){const c=selCar();return c?"sess_"+c.id:null}
function curKey(){const c=selCar();return c?"cursess_"+c.id:null}
function getSessions(){const k=sessKey();return k?LS.get(k,[]):[]}
function setSessions(list){const k=sessKey();if(k)LS.set(k,list)}
function migrateLegacy(){
  const c=selCar();if(!c)return;
  const old=LS.get("chatMsgs_"+c.id,null);
  if(old&&old.length&&!LS.get("sessmig_"+c.id,false)){
    const list=getSessions();
    list.unshift({id:"s"+Date.now(),t:Date.now(),title:sessTitle(old),msgs:old});
    setSessions(list);LS.set("sessmig_"+c.id,true);
  }
}
function sessTitle(msgs){const u=(msgs||[]).find(m=>m.role==="user"&&m.text);return u?u.text.slice(0,42):tr("h.new")}
function stripForSave(msgs){return msgs.filter(m=>!m.typing).slice(-40).map(m=>{
  const o={role:m.role,text:m.text||""};
  if(m.data)o.data=m.data;
  if(m.atts&&m.atts.length)o.atts=m.atts.map(a=>({kind:a.kind}));
  return o})}
function currentSessionId(){const k=curKey();return k?LS.get(k,null):null}
function loadSession(){
  migrateLegacy();
  const list=getSessions();
  let id=currentSessionId();
  let s=list.find(x=>x.id===id);
  if(!s&&list.length){s=list[0];if(curKey())LS.set(curKey(),s.id)}
  messages=s?JSON.parse(JSON.stringify(s.msgs||[])):[];
}
function saveSession(){
  const k=sessKey();if(!k)return;
  let list=getSessions();
  let id=currentSessionId();
  let s=list.find(x=>x.id===id);
  if(!s){s={id:"s"+Date.now(),t:Date.now(),title:"",msgs:[]};list.unshift(s);if(curKey())LS.set(curKey(),s.id)}
  s.msgs=stripForSave(messages);
  s.title=sessTitle(s.msgs)||s.title||tr("h.new");
  s.t=Date.now();
  list=list.filter(x=>x.msgs&&x.msgs.length||x.id===s.id).slice(0,10);
  try{setSessions(list)}catch(e){console.warn("save quota",e)}
}
function newSession(){
  if(messages.filter(m=>!m.typing).length)saveSession();
  const k=curKey();if(!k){toast(tr("gate.empty"),"ti-car");return}
  const id="s"+Date.now();
  const list=getSessions();list.unshift({id,t:Date.now(),title:tr("h.new"),msgs:[]});
  setSessions(list);LS.set(k,id);
  messages=[];renderMessages();updateHint();renderChips();
  setPhase("thread");
  toast(tr("h.new"),"ti-plus");
}
function switchSession(id){
  saveSession();
  if(curKey())LS.set(curKey(),id);
  loadSession();renderMessages();updateHint();renderChips();closeSheets();setPhase("thread");
}
function deleteSession(id,ev){
  if(ev)ev.stopPropagation();
  let list=getSessions().filter(x=>x.id!==id);
  setSessions(list);
  if(currentSessionId()===id){if(curKey())LS.del(curKey());messages=[];loadSession();renderMessages();updateHint();renderChips()}
  renderHist();
}
function clearCurrent(){
  messages=[];
  const id=currentSessionId();
  if(id){let list=getSessions();const s=list.find(x=>x.id===id);if(s){s.msgs=[];s.title=tr("h.new")}setSessions(list)}
  renderMessages();updateHint();renderChips();closeSheets();
  toast(tr("s.clear"),"ti-trash");
}

function md(t){let s=esc(t);const lines=s.split("\n");let out="",inList=false;
  lines.forEach(l=>{if(/^\s*[-*]\s+/.test(l)){if(!inList){out+="<ul>";inList=true}out+="<li>"+l.replace(/^\s*[-*]\s+/,"")+"</li>"}else{if(inList){out+="</ul>";inList=false}out+=l+"<br>"}});
  if(inList)out+="</ul>";return out.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(<br>)+$/,"")}

    :a.kind==="image"?`<span class="au"><i class="ti ti-photo"></i> รูปภาพ</span>`

}

/* typewriter streaming effect */
function typewrite(fullText,done){
  messages.pop(); // remove typing
  const m={role:"ai",text:fullText};
  messages.push(m);
  const holder=document.createElement("div");
  holder.innerHTML=`<div class="msg ai"><div class="av">${LOGO_SVG}</div><div class="bubble"><span class="tw"></span><span class="cursor"></span></div></div>`;
  const lastTyping=$("thread").querySelector(".msg.ai:last-child");
  if(lastTyping)lastTyping.remove();
  $("thread").appendChild(holder.firstElementChild);
  const bubble=$("thread").querySelector(".msg.ai:last-child .bubble");
  const words=fullText.split(/(\s+)/);
  let i=0;
  function step(){
    if(i>=words.length){bubble.innerHTML=md(fullText);scrollBottom();if(done)done();return}
    i=Math.min(words.length,i+2);
    bubble.innerHTML=md(words.slice(0,i).join(""))+`<span class="cursor"></span>`;
    scrollBottom();
    setTimeout(step,16);
  }
  step();
}

    </div></div>`;
}
async function makeSummary(){
  if(sending)return;
  sending=true;renderChips();
  messages.push({role:"ai",typing:true});renderMessages();
  try{
    const convo=messages.filter(m=>!m.typing&&m.role!=="sum").slice(-14)
      .map(m=>(m.role==="user"?"USER: ":"AI: ")+(m.text||"")).join("\n");
    const langName={th:"ไทย",en:"English",ja:"日本語",zh:"中文",de:"Deutsch",es:"Español"}[lang]||"ไทย";
    const txt=await gemini([{role:"user",parts:[{text:
`จากบทสนทนาวินิจฉัยรถต่อไปนี้ สรุปผลเป็น JSON เท่านั้น ห้ามมีข้อความอื่น:
{"symptom":"อาการหลักโดยย่อ","causes":["สาเหตุที่เป็นไปได้ เรียงจากน่าจะเป็นมากสุด 2-4 ข้อ"],"urgency":"low|medium|high","cost":"ช่วงค่าซ่อมโดยประมาณ (ระบุสกุลเงินบาท)","advice":"คำแนะนำขั้นตอนถัดไป 1-2 ประโยค"}
เขียนค่าทุกฟิลด์เป็นภาษา${langName}

บทสนทนา:
${convo}`}]}],{temp:0.3});
    const d=gParse(txt);
    messages.pop();
    if(d&&d.symptom){messages.push({role:"sum",data:d});renderMessages();saveSession()}
    else{messages.push({role:"ai",text:txt||"(สรุปไม่สำเร็จ)"});renderMessages();saveSession()}
  }catch(e){
    messages.pop();
    messages.push({role:"ai",text:(lang==="en"?"Summary failed 🙏 ":"สรุปผลไม่สำเร็จ 🙏 ")+e.message});
    renderMessages();
  }
  sending=false;renderChips();updateSend();
}

    mediaRec.onstop=async()=>{$("micBtn").classList.remove("rec");$("micBtn").innerHTML='<i class="ti ti-microphone"></i>';st.getTracks().forEach(t=>t.stop());
      const blob=new Blob(recChunks,{type:"audio/webm"});addAtt("audio","audio/webm",await blobB64(blob),"เสียงเครื่อง")};
    mediaRec.start();$("micBtn").classList.add("rec");$("micBtn").innerHTML='<i class="ti ti-player-stop"></i>';toast(lang==="en"?"Recording... tap again to stop":"กำลังอัดเสียง... แตะอีกครั้งเพื่อหยุด","ti-microphone")}
  catch{toast(lang==="en"?"Microphone unavailable":"ใช้ไมโครโฟนไม่ได้","ti-microphone-off")}};

async function sendMsg(){
  if(sending)return;
  const text=$("inp").value.trim();
  if(!text&&pending.length===0)return;
  const atts=pending.slice();pending=[];renderAtts();
  messages.push({role:"user",text,atts});
  $("inp").value="";autoSize();sending=true;updateSend();
  updateHint();renderMessages();renderChips();
  messages.push({role:"ai",typing:true});renderMessages();
  try{
    const hasMedia=messages.some(m=>m.atts&&m.atts.some(a=>a.b64));
    const contents=messages.filter(m=>!m.typing&&m.role!=="sum").slice(-12).map(m=>{
      const parts=[];if(m.text)parts.push({text:m.text});
      (m.atts||[]).forEach(a=>{if(a.b64)parts.push({inline_data:{mime_type:a.mime,data:a.b64}})});
      if(!parts.length)parts.push({text:""});
      return{role:m.role==="user"?"user":"model",parts}});
    const ans=await gemini(contents,{system:sysPrompt(),search:!hasMedia,temp:0.5});
    typewrite(ans||"(ไม่มีคำตอบ)",()=>{
      saveSession();
      if(selCar())addHistory(selCar().id,text||(lang==="en"?"media":"แนบสื่อ"),ans);
      sending=false;updateSend();renderChips();
    });
  }catch(e){
    messages.pop();
    messages.push({role:"ai",text:(lang==="en"?"Sorry, AI error 🙏\n":"ขออภัย AI ขัดข้อง 🙏\n")+e.message+(location.protocol==="file:"?"\n\n(เปิดผ่าน localhost ถ้า AI ไม่ทำงานบน file://)":"")});
    renderMessages();saveSession();
    sending=false;updateSend();renderChips();
  }
}

/* ===== SHEETS ===== */
function openSheet(which){
  closeSheets();
  $("sheetBg").classList.add("show");
  if(which==="set"){$("sheetSet").classList.add("show");markTheme()}
  else{renderHist();$("sheetHist").classList.add("show")}
}
function closeSheets(){$("sheetBg").classList.remove("show");$("sheetSet").classList.remove("show");$("sheetHist").classList.remove("show")}
function renderHist(){
  const list=getSessions(),cur=currentSessionId();
  $("histBody").innerHTML=`<button class="hist-new" onclick="newSession();closeSheets()"><i class="ti ti-plus"></i>${tr("h.new")}</button>`+
    (list.length?list.map(s=>`<button class="hist-item ${s.id===cur?"cur":""}" onclick="switchSession('${s.id}')">
      <div class="tx"><b>${esc(s.title||tr("h.new"))}</b><small>${new Date(s.t).toLocaleString(lang==="en"?"en-US":"th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} · ${(s.msgs||[]).length} ข้อความ</small></div>
      <span class="hist-del" onclick="deleteSession('${s.id}',event)"><i class="ti ti-trash"></i></span></button>`).join("")
    :`<div style="text-align:center;color:var(--c-mut);font-size:13.5px;padding:14px 0">${tr("h.empty")}</div>`);
}

/* ===== THEME ===== */
function setChatTheme(t){
  LS.set("chatTheme",t);
  document.documentElement.setAttribute("data-ctheme",t);
  document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue("--c-bg0").trim()||"#05070F";
  markTheme();
}
function markTheme(){
  const cur=LS.get("chatTheme","midnight");
  document.querySelectorAll(".th-opt").forEach(b=>b.classList.toggle("sel",b.dataset.th===cur));
}

/* ===== NAVIGATION ===== */
function goHome(){try{sessionStorage.setItem("spire_stayHome","1")}catch(e){}location.href="index.html"}
function goGarage(){try{sessionStorage.setItem("spire_stayHome","1")}catch(e){}location.href="index.html?view=garage"}

/* ===== TOAST ===== */
let tt;function toast(m,ic){const el=$("toast");el.innerHTML=`<i class="ti ${ic||"ti-check"}"></i>${esc(m)}`;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),3200)}

/* ===== INIT ===== */
setChatTheme(LS.get("chatTheme","midnight"));
applyT();
updateGreeting();
(function(){
  const q=new URLSearchParams(location.search);
  const car=q.get("car");if(car)LS.set("selCar",car);
  decideStart();
  const attach=q.get("attach");
  const starter=q.get("starter");
  if(selCar()){
    if(attach==="text"){enterThread({focus:true})}
    else if(attach){
      enterThread({});
      if(attach==="image")hintAttach("attImg",()=>{});
      else if(attach==="video")hintAttach("attVid",()=>{});
      else if(attach==="mic")hintAttach("micBtn",()=>{});
      toast(lang==="en"?"Tap the highlighted button to attach":"แตะปุ่มที่กะพริบเพื่อแนบไฟล์","ti-hand-click");
    }else if(starter&&!messages.length){
      enterThread({});
      const c=selCar();
      $("inp").value=lang==="en"?`Please check my ${c?c.name:"car"} — any issues to look at?`:`ช่วยตรวจรถ ${c?c.name:""} ให้หน่อย มีอะไรต้องดูไหม?`;
      autoSize();updateSend();setTimeout(()=>$("inp").focus(),150);
    }
  }
  if(location.search)history.replaceState(null,"",location.pathname);
})();
</script>
