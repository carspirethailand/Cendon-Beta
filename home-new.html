<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>Cendon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ════════════════════════════════════════════════════════════════════
   Cendon — หน้าหลักออกแบบใหม่ ในสไตล์เดิมของแอป
   (โลโก้ C เล็กด้านบน · ช่องค้นหา · การ์ดสรุปวันนี้แบบภาพวาด · ตารางเครื่องมือสี · ทั้งหมด · แถบล่าง)
   สิ่งที่ทำใหม่: สีนุ่มลง ระยะหายใจมากขึ้น ปุ่มเป็นวัสดุนูนนุ่ม การ์ดสรุปมีหลายใบเลื่อนได้
   และ "ทั้งหมด" เปิดแผ่นรวมเครื่องมือทุกอย่าง แบ่งเป็นหมวด
   ════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#121110;--bg2:#1B1917;--bg3:#24211E;--ink:#F2EDE7;--mut:#9B938A;--faint:#625B54;
  --or:#EE8132;--or2:#F7A456;--line:rgba(255,255,255,.06);
  --hi:rgba(255,255,255,.08);--sh:rgba(0,0,0,.55);
  --kd:'Kanit',system-ui,sans-serif;
}
html[data-theme="light"]{--bg:#F4F0EA;--bg2:#FFFDFA;--bg3:#ECE6DD;--ink:#1F1A15;--mut:#7B7268;--faint:#B3A99E;
  --line:rgba(0,0,0,.06);--hi:rgba(255,255,255,.95);--sh:rgba(110,80,45,.2)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--kd);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:460px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}

/* ── โลโก้เล็กกลางบน ── */
.logo{display:block;width:26px;height:30px;margin:6px auto 22px;color:var(--or)}

/* ── ค้นหา ── */
.find{display:flex;gap:10px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;border-radius:25px;background:var(--bg2);color:var(--faint);font-size:14.5px;
  box-shadow:inset 0 1px 0 var(--hi),0 10px 22px -14px var(--sh)}
.search i{font-size:19px;color:var(--mut)}
.fab{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:21px;flex:none;
  background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.12),0 10px 20px -10px var(--or)}
.fab:active,.key:active{transform:scale(.93)}

/* ── การ์ดสรุป (เลื่อนซ้ายขวา) ── */
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:18px -16px 0;padding:4px 16px 14px;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.brief{position:relative;flex:0 0 100%;scroll-snap-align:center;height:168px;border-radius:24px;overflow:hidden;padding:18px 20px;color:#fff;isolation:isolate;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 16px 30px -18px rgba(0,0,0,.6)}
.brief.sky{background:linear-gradient(165deg,#6FA3D9,#4F84C4 55%,#3E6FAF)}
.brief.dusk{background:linear-gradient(165deg,#E9A06A,#D9784F 60%,#B85B45)}
.brief.night{background:linear-gradient(165deg,#3B4468,#2A3152 60%,#1E2440)}
.brief .art{position:absolute;inset:0;z-index:-1;width:100%;height:100%}
.brief small{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.brief h3{font-size:22px;font-weight:600;margin:6px 0 1px}
.brief p{font-size:13px;opacity:.85}
.brief .pill{position:absolute;left:20px;bottom:16px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brief .open{position:absolute;right:18px;bottom:18px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:4px}
.brief .temp{position:absolute;right:20px;top:16px;font-size:26px;font-weight:600;display:flex;align-items:center;gap:6px}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:6px;background:var(--bg3);transition:width .3s,background .3s}
.dots i.on{width:20px;background:var(--or)}

/* ── เครื่องมือ ── */
.h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 16px}
.h b{font-size:17px;font-weight:600}
.h button{font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px}
.tool{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.key{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;font-size:24px;color:#fff;transition:transform .12s;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 82%,#fff),var(--c));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.12),0 10px 18px -12px var(--c)}

/* ── รถของฉัน / คุยล่าสุด ── */
.duo{display:grid;grid-template-columns:1fr;gap:4px}
.more{font-size:13px;color:var(--mut)}
.pane{display:block;background:var(--bg2);border-radius:22px;padding:16px 18px;box-shadow:inset 0 1px 0 var(--hi),0 12px 26px -16px var(--sh)}
.carrow{display:flex;align-items:center;gap:14px}
.carrow .key{width:48px;height:48px;border-radius:16px;font-size:22px}
.carrow b{display:block;font-size:16px;font-weight:600}.carrow small{font-size:12.5px;color:var(--mut)}
.km{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:14px}
.km b{color:var(--ink);font-weight:600}
.trk{height:8px;border-radius:8px;background:var(--bg3);margin-top:8px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:8px;background:linear-gradient(180deg,var(--or2),var(--or))}
.list{padding:4px 18px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;font-size:14px}
.row+.row{border-top:1px solid var(--line)}
.row i{color:var(--faint);font-size:17px}
.row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:900px){.duo{grid-template-columns:1fr 1fr;gap:20px}}

/* ── แถบล่าง ── */
.tab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(428px,calc(100% - 24px));height:66px;border-radius:24px;
  display:grid;grid-template-columns:repeat(5,1fr);z-index:20;background:color-mix(in srgb,var(--bg2) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 var(--hi),0 14px 30px -14px var(--sh)}
.tab a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--faint)}
.tab a i{font-size:21px;width:40px;height:26px;display:grid;place-items:center;border-radius:13px}
.tab a.on{color:var(--or)}
.tab a.on i{background:color-mix(in srgb,var(--or) 16%,transparent)}

/* ── แผ่น "ทั้งหมด" ── */
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(460px,100%);max-height:84vh;overflow:auto;border-radius:28px 28px 0 0;background:var(--bg2);
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 -20px 40px -20px var(--sh)}
.open-all .veil{opacity:1;pointer-events:auto}
.open-all .sheet{transform:translate(-50%,0)}
.grab{width:38px;height:5px;border-radius:5px;background:var(--bg3);margin:0 auto 14px}
.sheet h4{font-size:12.5px;font-weight:500;color:var(--mut);margin:16px 4px 12px}
.sheet h4:first-of-type{margin-top:4px}
.sheet .grid{row-gap:18px}
.in{animation:in .6s cubic-bezier(.2,.9,.25,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ════ จอคอม: แถบเมนูซ้าย · เนื้อหากว้าง · การ์ดสรุปเรียงสามใบ · เครื่องมือแถวยาว ════ */
@media(min-width:900px){
  body{display:block}
  .app{max-width:1180px;padding:36px 40px 60px 290px}
  .logo{position:fixed;top:34px;left:max(40px,calc(50% - 590px + 40px));margin:0;width:24px;height:28px}
  .tab{left:max(24px,calc(50% - 590px + 24px));top:88px;bottom:auto;transform:none;width:220px;height:auto;display:flex;flex-direction:column;gap:4px;
    padding:10px;border-radius:24px}
  .tab a{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:14px;font-size:14.5px}
  .tab a i{width:auto;height:auto;background:none!important;font-size:20px}
  .tab a.on{background:color-mix(in srgb,var(--or) 14%,transparent)}
  .tab a:hover:not(.on){background:var(--bg3);color:var(--ink)}
  .search{height:54px;font-size:15px}.fab{width:54px;height:54px}
  .deck{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;overflow:visible;margin:22px 0 0;padding:0}
  .brief{height:190px}
  .dots{display:none}
  .h{margin:34px 4px 18px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .key{width:64px;height:64px;border-radius:21px;font-size:27px}
  .tool{font-size:13px}
  .tool:hover .key{transform:translateY(-3px)}
  .sheet{top:50%;bottom:auto;width:min(720px,92vw);max-height:80vh;border-radius:28px;padding:22px 28px 30px;
    transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s}
  .open-all .sheet{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grid{grid-template-columns:repeat(6,1fr)}
  .grab{display:none}
}
@media(prefers-reduced-motion:reduce){.in{animation:none}.sheet{transition:none}}
</style>
</head>

  <div class="find in" style="animation-delay:.05s">

  <!-- ล่าง: รถของฉัน + คุยล่าสุด (บนคอมเรียงคู่กัน บนมือถือเรียงลงมา) -->
  <div class="duo in" style="animation-delay:.22s">
    <div><div class="h"><b>รถของฉัน</b><a href="garage.html" class="more">การาจ</a></div><a class="pane" id="myCar" href="garage.html"></a></div>

</main>

<script>
(function(){
  var D=document,$=function(i){return D.getElementById(i)};
  function rd(k,d){try{var v=JSON.parse(localStorage.getItem("spire_"+k));return v==null?d:v}catch(e){return d}}
  if(rd("theme","")==="light")D.documentElement.dataset.theme="light";

  /* ── เครื่องมือทั้งหมด (ชุดเดียวกับแอปเดิม) ── */
  var T={
    text:  {ic:"ti-message-2",   c:"#5B8FE0",n:"พิมพ์ถาม",   go:"chat.html?attach=text"},
    image: {ic:"ti-camera",      c:"#9A6FE0",n:"ถ่ายรูป",     go:"chat.html?attach=image"},
    video: {ic:"ti-video",       c:"#D9679F",n:"วิดีโอ",      go:"chat.html?attach=video"},
    listen:{ic:"ti-ear",         c:"#3FAE83",n:"ฟังเสียง",    go:"chat.html?attach=mic"},
    call:  {ic:"ti-phone",       c:"#3FAE83",n:"โทรคุย AI",   go:"chat.html?attach=call"},
    techs: {ic:"ti-tool",        c:"#E07B45",n:"หาช่าง",      go:"tech.html"},
    quote: {ic:"ti-receipt-2",   c:"#D9A04A",n:"เช็กราคา",    go:"index.html#quote"},
    shake: {ic:"ti-activity",    c:"#45AFC0",n:"วัดการสั่น",   go:"index.html#shake"},
    park:  {ic:"ti-map-pin",     c:"#DE6560",n:"จำที่จอด",    go:"index.html#park"},
    own:   {ic:"ti-report-money",c:"#7E8BE0",n:"ต้นทุน",      go:"index.html#own"},
    spares:{ic:"ti-package",     c:"#E0894A",n:"อะไหล่",      go:"spares.html"},
    garage:{ic:"ti-car-garage",  c:"#6C7A8E",n:"การาจ",       go:"garage.html"},
    desk:  {ic:"ti-layout-board",c:"#6479D6",n:"โต๊ะทำงาน",   go:"chat.html?pane=desk"},
    news:  {ic:"ti-book-2",      c:"#B07A5A",n:"นิตยสาร",     go:"news.html"},
    hb:    {ic:"ti-book",        c:"#8C7A6A",n:"คู่มือรถ",    go:"handbook.html"},
    plan:  {ic:"ti-rocket",      c:"#E0894A",n:"แพ็กเกจ",     go:"plan.html"},
    set:   {ic:"ti-settings",    c:"#6C7A8E",n:"ตั้งค่า",      go:"profile.html"},
    help:  {ic:"ti-help-circle", c:"#6C7A8E",n:"ช่วยเหลือ",   go:"help.html"}
  };
  function tile(k){var t=T[k];return '<a class="tool" href="'+t.go+'"><span class="key" style="--c:'+t.c+'"><i class="ti '+t.ic+'"></i></span>'+t.n+'</a>'}
  $("home").innerHTML=["text","image","techs","listen","quote","shake","park"].map(tile).join("")+
    '<button class="tool" id="allTile"><span class="key" style="--c:#6C7686"><i class="ti ti-layout-grid"></i></span>ทั้งหมด</button>';
  var GROUPS=[["ถาม AI",["text","image","video","listen","call"]],["ดูแลรถ",["techs","quote","shake","park","own","spares"]],["อื่น ๆ",["garage","desk","news","hb","plan","set","help"]]];
  $("allBody").innerHTML=GROUPS.map(function(g){return '<h4>'+g[0]+'</h4><div class="grid">'+g[1].map(tile).join("")+'</div>'}).join("");
  function openAll(on){D.body.classList.toggle("open-all",on)}
  $("allBtn").onclick=$("allTile").onclick=function(){openAll(true)};
  $("veil").onclick=function(){openAll(false)};
  addEventListener("keydown",function(e){if(e.key==="Escape")openAll(false)});

  /* ── การ์ดสรุป 3 ใบ ภาพวาดแบบเดิม (ฟ้า เมือง รถ) สีตามช่วงเวลา ── */
  var g=rd("garage",[])||[], c=g.find(function(x){return x.id===rd("selCar","")})||g[0]||null;
  var km=c?+String(c.mileage||"").replace(/\D/g,""):0, h=new Date().getHours();
  var tone=h>=6&&h<16?"sky":h<19&&h>=16?"dusk":"night", when=h<11?"สรุปเช้านี้":h<16?"สรุปบ่ายนี้":h<19?"สรุปเย็นนี้":"สรุปคืนนี้";
  var date=new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long"});
  function art(){var b="";for(var i=0;i<14;i++){var w=16+(i*7)%12,hh=14+(i*37)%26;b+='<rect x="'+(i*30)+'" y="'+(140-hh)+'" width="'+w+'" height="'+hh+'" rx="2" fill="rgba(255,255,255,.1)"/>'}
    return '<svg class="art" viewBox="0 0 420 176" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+
      '<ellipse cx="250" cy="40" rx="40" ry="13" fill="rgba(255,255,255,.12)"/><ellipse cx="280" cy="34" rx="24" ry="11" fill="rgba(255,255,255,.12)"/>'+b+
      '<rect y="140" width="420" height="36" fill="rgba(0,0,0,.08)"/><g fill="rgba(255,255,255,.35)">'+[0,1,2,3,4,5,6].map(function(i){return '<rect x="'+(40+i*60)+'" y="160" width="30" height="3" rx="1.5"/>'}).join("")+'</g>'+
      '<g transform="translate(150 12) scale(.8)"><path d="M28 146 Q30 132 52 129 L74 127 Q86 116 106 114 Q128 113 140 121 L156 128 Q164 131 164 140 L163 146Z" fill="rgba(255,255,255,.6)"/>'+
      '<circle cx="62" cy="147" r="8" fill="rgba(0,0,0,.3)"/><circle cx="140" cy="147" r="8" fill="rgba(0,0,0,.3)"/></g></svg>'}
  var cards=[
    {cls:tone,eye:"ti-sunrise",k:"TODAY'S BRIEF",t:when,p:date,pill:c?"วันนี้ไม่มีอะไรต้องทำ":"เพิ่มรถเพื่อเริ่ม",temp:'<i class="ti ti-sun"></i>31°',go:"chat.html"},
    {cls:"dusk",eye:"ti-gauge",k:"รอบเช็กระยะ",t:c?(km?(10000-km%10000).toLocaleString("en-US")+" กม.":"ใส่เลขไมล์"):"ยังไม่มีรถ",p:c?(c.name||"")+" · อีกเท่านี้ค่อยเข้าศูนย์":"เพิ่มรถในการาจ",pill:c?"เลขไมล์ "+(km?km.toLocaleString("en-US"):"—")+" กม.":"เพิ่มรถ",temp:"",go:"garage.html"},
    {cls:"night",eye:"ti-sparkles",k:"ถาม CENDON",t:"รถเป็นอะไร?",p:"เล่าอาการ ส่งรูป หรืออัดเสียงก็ได้",pill:"แอร์ไม่เย็น · เสียงดังตอนเบรก",temp:"",go:"chat.html?attach=text"}
  ];
  $("deck").innerHTML=cards.map(function(x){return '<a class="brief '+x.cls+'" href="'+x.go+'">'+art()+'<small><i class="ti '+x.eye+'"></i>'+x.k+'</small><h3>'+x.t+'</h3><p>'+x.p+'</p>'+(x.temp?'<div class="temp">'+x.temp+'</div>':'')+'<span class="pill">'+x.pill+'</span><span class="open">เปิด <i class="ti ti-arrow-right"></i></span></a>'}).join("");
  var kmL=km?10000-km%10000:0, pc=km?(km%10000)/100:0;
  $("myCar").innerHTML=c?'<div class="carrow"><span class="key" style="--c:#E07B45"><i class="ti ti-car"></i></span><div><b>'+(c.name||"")+'</b><small>'+[c.year,c.make].filter(Boolean).join(" · ")+'</small></div></div>'+
    '<div class="km"><span>เลขไมล์ <b>'+(km?km.toLocaleString("en-US"):"—")+'</b> กม.</span><span>เช็กระยะอีก <b>'+(km?kmL.toLocaleString("en-US"):"—")+'</b> กม.</span></div><div class="trk"><i style="width:'+pc+'%"></i></div>'
    :'<div class="carrow"><span class="key" style="--c:#6C7686"><i class="ti ti-plus"></i></span><div><b>เพิ่มรถคันแรก</b><small>แล้ว Cendon จะดูแลที่เหลือให้</small></div></div>';
  var ss=(rd("chatSessions",[])||[]).slice().sort(function(a,b){return(b.t||0)-(a.t||0)}).slice(0,3);
  $("recent").innerHTML=ss.length?ss.map(function(x){return '<a class="row" href="chat.html?session='+encodeURIComponent(x.id)+'"><i class="ti ti-message-2"></i><span>'+String(x.title||"แชต").replace(/</g,"&lt;")+'</span><i class="ti ti-chevron-right"></i></a>'}).join(""):'<div class="row"><i class="ti ti-message-2"></i><span style="color:var(--mut)">ยังไม่มีบทสนทนา</span></div>';
  $("dots").innerHTML=cards.map(function(_,i){return '<i'+(i?'':' class="on"')+'></i>'}).join("");
  $("deck").addEventListener("scroll",function(){var i=Math.round(this.scrollLeft/this.clientWidth);[].forEach.call($("dots").children,function(d,j){d.classList.toggle("on",i===j)})},{passive:true});
})();
</script>
</body>
</html>
