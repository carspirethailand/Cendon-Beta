<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EEE8">
<title>Cendon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ════════════════════════════════════════════════════════════════════
   Cendon — หน้าหลักแบบแอป (เฉพาะที่จำเป็น)
   • สามมิติแบบนุ่ม: ทุกชิ้นเหมือนวัสดุจริง — ขอบบนมีแสง ใต้ชิ้นมีเงานุ่ม ปุ่มนูน กดแล้วยุบ
   • ไม่มีโลโก้ใหญ่ ไม่มีฮีโร่แบบเว็บ — เปิดมาเห็นรถ ถาม และทำสิ่งที่ต้องทำได้ทันที
   • หนึ่งคอลัมน์แบบแอป (บนคอมก็เป็นคอลัมน์แอปกลางจอ)
   ════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F2EEE8;--card:#FBF9F6;--ink:#211C17;--mut:#7A7168;--faint:#B0A79D;
  --or:#EE8132;--or2:#F6A04F;
  --hi:rgba(255,255,255,.95);--sh:rgba(120,90,55,.18);--sh2:rgba(120,90,55,.10);
  --kd:'Kanit',system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#17140F;--card:#221E18;--ink:#F1EBE3;--mut:#A39A90;--faint:#6D655C;
  --hi:rgba(255,255,255,.07);--sh:rgba(0,0,0,.55);--sh2:rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--kd);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}

/* วัสดุนุ่ม: ไฮไลต์ขอบบน + เงาสองชั้น (ใกล้คม ไกลฟุ้ง) */
.soft{background:var(--card);border-radius:24px;
  box-shadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh2),0 12px 28px -12px var(--sh)}

/* ── หัว ── */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}
.top small{display:block;font-size:13px;color:var(--mut)}
.top b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;
  background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px var(--or)}

/* ── รถ ── */
.car{padding:18px 18px 16px}
.car-h{display:flex;align-items:center;gap:12px}
.car-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;color:#fff;flex:none;
  background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 16px -8px var(--or)}
.car-h div{flex:1;min-width:0}
.car-h b{display:block;font-size:18px;font-weight:600}
.car-h small{font-size:13px;color:var(--mut)}
.car-h .ok{font-size:12px;color:#2E9E6B;background:rgba(46,158,107,.12);padding:4px 10px;border-radius:99px;flex:none}
.meter{margin-top:16px;display:flex;justify-content:space-between;align-items:flex-end}
.meter b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.meter b em{font-style:normal;font-size:13px;color:var(--mut);font-weight:400;margin-left:4px}
.meter small{font-size:12.5px;color:var(--mut);text-align:right}
.track{height:10px;border-radius:10px;margin-top:10px;background:var(--bg);box-shadow:inset 0 1px 3px var(--sh2)}
.track i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(180deg,var(--or2),var(--or));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);transition:width 1.2s cubic-bezier(.2,.9,.25,1)}

/* ── ถาม ── */
.ask{display:flex;align-items:center;gap:10px;margin-top:14px;padding:6px 6px 6px 16px;border-radius:20px}
.ask i{font-size:19px;color:var(--or)}
.ask input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:10px 0}
.ask input::placeholder{color:var(--faint)}
.go{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,var(--or2),var(--or));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 0 #C4631F,0 8px 14px -6px var(--or);
  transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 0 #C4631F}

/* ── ปุ่มลัด ── */
.h{font-size:13px;color:var(--mut);margin:24px 4px 12px;display:flex;justify-content:space-between}
.h a{color:var(--mut)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.key{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:25px;color:var(--c);
  background:var(--card);box-shadow:inset 0 1px 0 var(--hi),0 1px 2px var(--sh2),0 10px 20px -10px var(--sh);
  transition:transform .12s,box-shadow .12s}
.act:active .key{transform:scale(.94);box-shadow:inset 0 2px 6px var(--sh2)}

/* ── ล่าสุด ── */
.list{padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0}
.row+.row{border-top:1px solid color-mix(in srgb,var(--ink) 7%,transparent)}
.row i{font-size:18px;color:var(--faint)}
.row span{flex:1;min-width:0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── แถบล่าง ── */
.tab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(444px,calc(100% - 28px));
  height:64px;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
.tab a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--faint)}
.tab a i{font-size:22px}
.tab a.on{color:var(--or)}
.in{animation:in .6s cubic-bezier(.2,.9,.25,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.in{animation:none}}
</style>
</head>
<body>
<main class="app">
  <header class="top in">
    <div><small id="greet">สวัสดี</small><b id="name">Cendon</b></div>
    <a class="av" id="av" href="profile.html">C</a>
  </header>

  <a class="soft car in" href="garage.html" style="display:block;animation-delay:.05s">
    <div class="car-h">
      <span class="car-ic"><i class="ti ti-car"></i></span>
      <div><b id="carName">Honda City</b><small id="carSub">2020</small></div>
      <span class="ok">พร้อมใช้งาน</span>
    </div>
    <div class="meter">
      <b><span id="km">0</span><em>กม.</em></b>
      <small>เช็กระยะอีก <span id="left">—</span> กม.</small>
    </div>
    <div class="track"><i id="fill"></i></div>
  </a>

  <form class="soft ask in" id="ask" style="animation-delay:.1s">
    <i class="ti ti-sparkles"></i>
    <input id="q" placeholder="รถเป็นอะไร ถาม Cendon ได้เลย" autocomplete="off" enterkeyhint="send">
    <button class="go" aria-label="ถาม"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>

  <div class="h in" style="animation-delay:.15s"><span>ทำบ่อย</span></div>
  <div class="acts in" style="animation-delay:.18s">
    <a class="act" href="chat.html?attach=image"><span class="key" style="--c:#8B5CF6"><i class="ti ti-camera"></i></span>ถ่ายรูป</a>
    <a class="act" href="chat.html?attach=mic"><span class="key" style="--c:#22A673"><i class="ti ti-ear"></i></span>ฟังเสียง</a>
    <a class="act" href="tech.html"><span class="key" style="--c:#EE8132"><i class="ti ti-tool"></i></span>หาช่าง</a>
    <a class="act" href="index.html#park"><span class="key" style="--c:#E5484D"><i class="ti ti-map-pin"></i></span>ที่จอด</a>
  </div>

  <div class="h in" style="animation-delay:.22s"><span>คุยล่าสุด</span><a href="chat.html">ทั้งหมด</a></div>
  <div class="soft list in" id="recent" style="animation-delay:.25s"></div>
</main>

<nav class="soft tab"><a class="on" href="home-new.html"><i class="ti ti-home"></i>หน้าหลัก</a><a href="garage.html"><i class="ti ti-car"></i>การาจ</a><a href="chat.html"><i class="ti ti-message-2"></i>แชต</a><a href="news.html"><i class="ti ti-book-2"></i>นิตยสาร</a><a href="profile.html"><i class="ti ti-user"></i>บัญชี</a></nav>

<script>
(function(){
  var D=document,$=function(i){return D.getElementById(i)};
  function rd(k,d){try{var v=JSON.parse(localStorage.getItem("spire_"+k));return v==null?d:v}catch(e){return d}}
  if(rd("theme","")==="dark")D.documentElement.dataset.theme="dark";
  var g=rd("garage",[])||[], c=g.find(function(x){return x.id===rd("selCar","")})||g[0]||{name:"Honda City",year:"2020",mileage:"45000"};
  var u=rd("cachedUser",{})||{}, h=new Date().getHours();
  $("greet").textContent=h<11?"สวัสดีตอนเช้า":h<16?"สวัสดีตอนบ่าย":h<19?"สวัสดีตอนเย็น":"สวัสดีตอนค่ำ";
  if(u.name){ $("name").textContent="คุณ "+u.name.split(" ")[0]; $("av").textContent=u.name[0].toUpperCase() }
  $("carName").textContent=c.name||((c.make||"")+" "+(c.model||"")).trim();
  $("carSub").textContent=[c.year,c.make].filter(Boolean).join(" · ");
  var km=+String(c.mileage||"").replace(/\D/g,"")||0, left=km?10000-km%10000:0, pct=km?(km%10000)/100:0;
  $("left").textContent=km?left.toLocaleString("en-US"):"—";
  setTimeout(function(){ $("fill").style.width=pct+"%" },250);
  var t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-p,3);$("km").textContent=Math.round(km*e).toLocaleString("en-US");if(p<1)requestAnimationFrame(f)})(t0);
  var s=(rd("chatSessions",[])||[]).slice().sort(function(a,b){return(b.t||0)-(a.t||0)}).slice(0,3);
  $("recent").innerHTML=s.length?s.map(function(x){return '<a class="row" href="chat.html?session='+encodeURIComponent(x.id)+'"><i class="ti ti-message-2"></i><span>'+String(x.title||"แชต").replace(/</g,"&lt;")+'</span><i class="ti ti-chevron-right"></i></a>'}).join("")
    :'<div class="row"><i class="ti ti-message-2"></i><span style="color:var(--mut)">ยังไม่มีบทสนทนา</span></div>';
  $("ask").onsubmit=function(e){e.preventDefault();var q=$("q").value.trim();
    try{if(q)localStorage.setItem("spire_deckQ",JSON.stringify(q))}catch(err){} location.href="chat.html"+(q?"":"?attach=text")};
})();
</script>
</body>
</html>
