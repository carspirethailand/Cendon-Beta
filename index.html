@media(max-width:760px){.ib-fab{display:none!important}}
/* ══ Cendon Studio ══
   กรอบคงที่ ไม่เล่นแอนิเมชันเข้าใหม่ทุกครั้งที่เปลี่ยนหน้า · เส้นคั่นแทนการ์ดซ้อน · ปุ่มหลักสีหมึก ส้มเป็นแค่ขีด/จุดบอกตำแหน่ง */
body[data-mode="tech"] .navwrap,body[data-mode="tech"] #mnav,body[data-mode="tech"] header.top{display:none!important}
body[data-mode="tech"]{padding-top:0!important;padding-bottom:0!important}
/* ระหว่างเปิด Studio (ก่อนรู้ว่าเป็นใคร): กรอบ Studio เต็มจอตั้งแต่เฟรมแรก ไม่มีแถบเมนูลูกค้า/ปุ่มแชตลอยโผล่ */
html[data-boot="tech"] .navwrap,html[data-boot="tech"] #mnav,html[data-boot="tech"] header.top,html[data-boot="tech"] .ib-fab,html[data-boot="tech"] #vMenu{display:none!important}
html[data-boot="tech"] body{padding-top:0!important;padding-bottom:0!important}
/* โครงกำลังโหลด: รูปทรงเดียวกับรายการจริง เนื้อหาจริงมาแทนที่ตรงตำแหน่งเดิม ไม่กระโดด */
.stu-sk{display:block;border-radius:10px;background:var(--surface-2)}
.stu-row.sk-row{pointer-events:none}.stu-row.sk-row .stu-rb{display:grid;gap:8px;flex:1}
.stu-row.sk-row .l1{width:42%;height:15px}.stu-row.sk-row .l2{width:68%;height:12px}
.stu-hr .stu-sk{height:40px;border-radius:12px}.stu-hr .stu-sk.a{width:108px}.stu-hr .stu-sk.b{width:170px}
.stu{--sw:216px;animation:none;min-height:100vh;min-height:100dvh}
.stu [hidden]{display:none!important}
.stu-side{display:flex;flex-direction:column;background:var(--bg)}
.stu-brand{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font:700 19px/1 var(--kd);letter-spacing:-.01em}
.stu-brand small{display:block;margin-top:3px;font:600 11.5px/1 var(--kb);letter-spacing:.04em;color:var(--muted)}
.stu-brand span{display:block}
.stu-mk{width:22px;height:26px;color:var(--co,#E9682A)}
.stu-nav button{position:relative;display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--muted);font:500 15px var(--kb);cursor:pointer;transition:color .15s,background .15s}
.stu-nav button .ti{font-size:22px}
.stu-nav button:hover{color:var(--ink)}
.stu-nav button.on{color:var(--ink);font-weight:600}
.stu-bd{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font:700 11px/18px var(--kb);font-style:normal;text-align:center;color:#fff;background:var(--co,#E9682A)}
.stu-sfoot button{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--muted);font:500 14px var(--kb);cursor:pointer}
.stu-sfoot button:hover{color:var(--ink);background:var(--surface-2)}.stu-sfoot .ti{font-size:20px}
.stu-main{min-width:0}
.stu-top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line-2)}
.stu-top .stu-brand{flex:1;font-size:18px}
.stu-crumb{display:none;flex:1;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--muted)}.stu-crumb .ti{font-size:14px;opacity:.6}.stu-crumb b{color:var(--ink);font-weight:600}
@media(max-width:899px){body[data-mode="tech"] .toast{bottom:calc(78px + env(safe-area-inset-bottom))}}
.stu-ib{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:12px;background:none;color:var(--ink);font-size:22px;cursor:pointer;text-decoration:none}
.stu-ib:hover{background:var(--surface-2)}
.stu-me{display:grid;place-items:center;width:38px;height:38px;margin-left:2px;border:0;border-radius:50%;font:700 15px var(--kd);color:var(--ink);background:var(--surface-2) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.stu-body{max-width:860px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
/* หัวหน้า: ชื่อหน้า + ปุ่มรอง */
.stu-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;padding:6px 0 18px}
.stu-h h1{flex:1 1 auto;margin:0;font:700 clamp(26px,4.4vw,34px)/1.15 var(--kd);letter-spacing:-.02em}
.stu-h p{flex-basis:100%;order:3;margin:-6px 0 0;font-size:14px;color:var(--muted)}
.stu-hr{display:flex;align-items:center;gap:8px}
.stu-back{display:inline-flex;align-items:center;gap:6px;margin:0 0 6px;padding:0;border:0;background:none;color:var(--muted);font:500 14px var(--kb);cursor:pointer}
.stu-back:hover{color:var(--ink)}
.stu-link{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font:600 13.5px var(--kb);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;text-decoration:none}
.stu-link:hover{background:var(--surface-2)}.stu-link .ti{font-size:17px}
/* ปุ่มสถานะร้าน 3 สถานะ */
.stu-stat{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 14px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font:600 13.5px var(--kb);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.stu-stat .ti{font-size:16px;color:var(--muted)}
.stu-dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.stu-dot.on{background:#22a06b;box-shadow:0 0 0 3px color-mix(in srgb,#22a06b 22%,transparent)}
.stu-dot.quiet{background:transparent;box-shadow:inset 0 0 0 2px #22a06b}
.stu-dot.pause{background:var(--faint)}
.stu-menu{position:fixed;z-index:1300;width:min(320px,calc(100vw - 32px));padding:6px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 24px 48px -20px rgba(0,0,0,.45)}
.stu-menu button{display:flex;align-items:flex-start;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.stu-menu button:hover,.stu-menu button:focus-visible{background:var(--surface-2)}
.stu-menu .stu-dot{margin-top:6px}
.stu-menu b{display:block;font-size:14.5px;font-weight:600}.stu-menu small{display:block;margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.stu-menu .ti-check{margin-left:auto;font-size:18px;color:var(--ink)}
/* สลับ ต้องทำต่อ | หางานใกล้ฉัน */
.stu-seg{display:flex;gap:4px;margin:0 0 6px;padding:4px;border-radius:14px;background:var(--surface-2)}
.stu-seg button{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border:0;border-radius:10px;background:none;color:var(--muted);font:600 14px var(--kb);cursor:pointer;transition:background .15s,color .15s}
.stu-seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stu-seg em{font-style:normal;font-weight:500;color:var(--faint)}
.stu-seg i.new{width:7px;height:7px;border-radius:50%;background:var(--co,#E9682A)}
/* รายการ (งาน / ข้อความ / เมนูร้าน) — แถวคั่นเส้น ไม่ใช่การ์ด */
.stu-sec{margin-top:22px}
.stu-sec>h2{display:flex;align-items:center;gap:8px;margin:0 0 4px;font:700 16px/1.3 var(--kd)}
.stu-sec>h2 small{font:500 13px var(--kb);color:var(--muted)}
.stu-sec>h2 .stu-more{margin-left:auto}
.stu-more{border:0;background:none;color:var(--ink);font:600 13.5px var(--kb);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.stu-row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 0;border:0;border-bottom:1px solid var(--line-2);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.stu-row:last-child{border-bottom:0}
.stu-row:hover .stu-rb b{text-decoration:underline;text-underline-offset:3px}
.stu-ri{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:13px;font-size:21px;color:var(--ink);background:var(--surface-2) center/cover no-repeat}
.stu-ri.me{color:var(--co,#E9682A);background:color-mix(in srgb,var(--co,#E9682A) 10%,var(--surface))}
/* งานด่วน (รถเสียตอนนี้): ทั้งแถวแดง ขึ้นบนสุด */
.stu-row.urg{margin:6px 0;padding:12px 14px;border:1px solid color-mix(in srgb,#dc2626 45%,transparent);border-radius:14px;background:color-mix(in srgb,#dc2626 9%,var(--surface))}
.stu-row.urg .stu-ri{color:#fff;background:#dc2626;animation:urgPulse 1.6s ease-in-out infinite}
.urg-tag{display:inline-flex;align-items:center;gap:4px;margin:0 0 3px;color:#dc2626;font-size:12px;font-weight:700;letter-spacing:.01em}
html[data-theme="dark"] .urg-tag{color:#f87171}
.pc.urg{border-color:color-mix(in srgb,#dc2626 55%,transparent)!important;background:color-mix(in srgb,#dc2626 9%,var(--surface))!important}
@keyframes urgPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 7px rgba(220,38,38,0)}}
@media (prefers-reduced-motion:reduce){.stu-row.urg .stu-ri{animation:none}}
.stu-rb{flex:1;min-width:0}
.stu-rb b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-rb small{display:block;margin-top:2px;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-rs{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.stu-rs.me{color:var(--ink);font-weight:600}
.stu-rs.me::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--co,#E9682A)}
.stu-rr{flex:none;display:flex;align-items:center;gap:8px;color:var(--faint)}
.stu-rr b{font:700 15px var(--kd);color:var(--ink)}
.stu-rr em{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font:700 11.5px/20px var(--kb);font-style:normal;text-align:center;color:#fff;background:var(--co,#E9682A)}
.stu-empty{display:grid;justify-items:center;gap:6px;padding:44px 16px 36px;text-align:center}
.stu-empty>.ti{font-size:40px;color:var(--faint)}
.stu-empty b{font:700 17px var(--kd)}.stu-empty p{margin:0;max-width:340px;font-size:14px;line-height:1.6;color:var(--muted)}
.stu-empty .lx-cta{height:46px;margin-top:12px;padding:0 26px}
.stu-err{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:11px 12px 11px 14px;border-radius:12px;font-size:13.5px;color:var(--ink);background:var(--surface-2)}
.stu-err .ti{font-size:18px;color:var(--muted)}.stu-err span{flex:1}.stu-err .lx-gh{height:34px;padding:0 12px}
.stu-past{margin-top:22px;border-top:1px solid var(--line)}
.stu-past summary{display:flex;align-items:center;gap:8px;padding:14px 0;cursor:pointer;font:600 14px var(--kb);color:var(--muted);list-style:none}
.stu-past summary::-webkit-details-marker{display:none}
.stu-past summary .ti{margin-left:auto;transition:transform .2s}
.stu-past[open] summary .ti{transform:rotate(180deg)}
/* หน้างาน: กลุ่ม (ด่วน · รอคุณ · รอลูกค้า) มีหัวข้อ + จำนวน · ใบงานเป็นการ์ดแยกกันด้วยกรอบและช่องว่าง ไม่เบียดกันบนมือถือ */
.stu-grp{margin-top:24px}
.stu-err+.stu-grp,.stu-grp:first-child{margin-top:10px}
.stu-gh{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:700 15px/1.3 var(--kd);color:var(--ink)}
.stu-gh em{min-width:22px;height:20px;padding:0 7px;border-radius:10px;font:600 12px/20px var(--kb);font-style:normal;text-align:center;color:var(--muted);background:var(--surface-2)}
.stu-grp.hot .stu-gh{color:#dc2626}
html[data-theme="dark"] .stu-grp.hot .stu-gh{color:#f87171}
.stu-grp.hot .stu-gh::before{content:"";width:8px;height:8px;border-radius:50%;background:#dc2626;animation:urgPulse 1.6s ease-in-out infinite}
.stu-cards{display:grid;gap:10px}
.stu-past .stu-cards{padding-bottom:6px}
.stu-cards .stu-row{align-items:flex-start;gap:12px;min-height:0;margin:0;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:border-color .15s}
.stu-cards .stu-row:last-child{border-bottom:1px solid var(--line)}
.stu-cards .stu-row:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.stu-cards .stu-row:hover .stu-rb b{text-decoration:none}
.stu-cards .stu-row.urg,.stu-cards .stu-row.urg:last-child{border-color:color-mix(in srgb,#dc2626 45%,transparent);background:color-mix(in srgb,#dc2626 9%,var(--surface))}
.stu-cards .stu-ri{width:40px;height:40px;border-radius:12px;font-size:20px}
.stu-rt{display:flex;align-items:baseline;gap:8px}
.stu-rt b{flex:1;min-width:0}
.stu-rt time{flex:none;font-size:12.5px;color:var(--faint);white-space:nowrap}
.stu-rt em{flex:none;align-self:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font:700 11.5px/20px var(--kb);font-style:normal;text-align:center;color:#fff;background:var(--co,#E9682A)}
.stu-cards .stu-rb small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:3px;line-height:1.5;white-space:normal}
.stu-rf{display:flex;align-items:center;gap:10px;margin-top:9px}
/* บรรทัดสถานะขึ้นบรรทัดใหม่ได้ — จอแคบไม่ตัด "หมดอายุใน..." ทิ้ง */
.stu-rf .stu-rs{display:block;flex:1;min-width:0;margin:0;line-height:1.5}
.stu-rf .stu-rs i{white-space:nowrap}
.stu-rf .stu-rs.me::before{display:inline-block;margin-right:6px;vertical-align:1px}
.stu-rf .stu-rs i{font-style:normal;font-weight:500;color:var(--muted)}
.stu-rf>b{flex:none;font:700 15px var(--kd)!important;color:var(--ink)}
.stu-cards .urg-tag{margin-bottom:4px}
/* ร้านของฉัน */
.stu-shop{display:flex;align-items:center;gap:16px;padding:4px 0 18px}
.stu-shop .stu-av{flex:none;display:grid;place-items:center;width:72px;height:72px;border-radius:20px;font:700 26px var(--kd);background:var(--surface-2) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--line)}
.stu-shop>div{flex:1;min-width:0}.stu-shop b{display:block;font:700 19px/1.3 var(--kd)}
.stu-shop small{display:block;margin-top:3px;font-size:13.5px;color:var(--muted)}
/* การ์ดร้านแบบพลิก (Studio › ร้านของฉัน) */
.so-flip{display:block;width:100%;margin:0 0 16px;padding:0;border:0;background:none;color:inherit;text-align:left;cursor:pointer;perspective:1100px;font:inherit}
.so-flip .sf-in{display:grid;grid-template-columns:minmax(0,1fr);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.so-flip.back .sf-in{transform:rotateY(180deg)}
.so-flip .sf-face{grid-area:1/1;position:relative;display:flex;align-items:center;gap:18px;min-height:176px;padding:22px;border-radius:26px;box-sizing:border-box;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.so-flip .sf-f{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--sc) 30%,transparent),transparent 60%),var(--surface)}
.so-flip .sf-b{transform:rotateY(180deg);background:#fff;color:#09090B;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.so-flip .stu-av{flex:none;display:grid;place-items:center;width:88px;height:88px;border-radius:24px;font:700 32px var(--kd);background:var(--surface-2) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--line)}
.so-flip .sf-tx{flex:1;min-width:0;padding-right:28px}.so-flip .sf-tx b{display:block;font:700 21px/1.3 var(--kd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so-flip .sf-tx small{display:block;margin-top:4px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.so-flip .sf-b small{color:#52525b}.so-flip .sf-b code{display:block;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:#71717a;font-family:ui-monospace,monospace}
.so-flip .sf-qr{flex:none;width:132px;height:132px;display:grid;place-items:center;border-radius:12px;background:#fff}
.so-flip .sf-qr img,.so-flip .sf-qr canvas{width:132px!important;height:132px!important;image-rendering:pixelated}
.so-flip .sf-hint{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.so-flip .sf-b .sf-hint{background:#f4f4f5;color:#52525b;box-shadow:none}
@media(max-width:420px){.so-flip .sf-face{gap:14px;padding:18px;min-height:160px}.so-flip .stu-av{width:72px;height:72px}.so-flip .sf-qr,.so-flip .sf-qr img,.so-flip .sf-qr canvas{width:112px!important;height:112px!important}}
@media(prefers-reduced-motion:reduce){.so-flip .sf-in{transition:none}}
.stu-acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.stu-vet{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stu-vet b{display:block;font-size:14.5px;font-weight:600}.stu-vet small{display:block;margin-top:3px;font-size:13px;line-height:1.55;color:var(--muted)}
.stu-list .stu-row{min-height:64px}
.stu-list .stu-ri{background:none;box-shadow:inset 0 0 0 1px var(--line)}
/* Studio บนคอม: แถบซ้ายคงที่ นอกพื้นที่เลื่อน */
@media(min-width:900px){
  .stu{display:grid;grid-template-columns:var(--sw) minmax(0,1fr)}
  .stu-side{position:sticky;top:0;height:100vh;height:100dvh;padding:22px 12px 16px;border-right:1px solid var(--line)}
  .stu-side .stu-brand{padding:4px 12px 22px}
  .stu-nav{display:grid;gap:2px}
  .stu-nav button{height:46px;padding:0 14px;border-radius:12px}
  .stu-nav button.on{background:var(--surface)}
  .stu-nav button.on::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--co,#E9682A)}
  .stu-nav .stu-bd{margin-left:auto}
  .stu-sfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
  .stu-m{display:none}
  .stu-crumb{display:flex}
  .stu-top{padding:0 28px}
  .stu-body{padding:26px 32px 64px}
  /* หน้าย่อยของ Studio (ตั้งค่า สถิติ แก้ไขร้าน ดูหน้าร้าน) เปิดในกรอบเดิม แถบซ้ายยังอยู่ */
  body[data-mode="tech"] .bs.full .pn,body[data-mode="tech"] .bs.store .pn{left:var(--stu-w,216px);width:auto}
  body[data-mode="tech"] .bs .bg{left:var(--stu-w,216px)}
}
/* Studio บนมือถือ: แถบล่าง 4 ช่องเท่ากัน เต็มความกว้าง (ไม่ใช่แคปซูลลอย) */
@media(max-width:899px){
  .stu-side{position:fixed;left:0;right:0;bottom:0;z-index:50;padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--line)}
  .stu-side>.stu-brand,.stu-sfoot{display:none}
  .stu-nav{display:grid;grid-template-columns:repeat(4,1fr);height:62px}
  .stu-nav button{flex-direction:column;justify-content:center;gap:3px;padding:0;font:500 11.5px var(--kb)}
  .stu-nav button.on{font-weight:600}
  .stu-nav button.on .ti{color:var(--ink)}
  .stu-nav button.on::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--co,#E9682A)}
  .stu-nav .stu-bd{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;font-size:10px;line-height:16px}
}
@media(prefers-reduced-motion:reduce){.stu *{transition:none!important}}
/* ═══ หน้าร้าน (storefront) ═══ */
.bs.store .hd{position:absolute;top:0;left:0;right:0;z-index:3;background:none;border:0}
.bs.store .hd .ib,.bs.store .hd button{color:var(--ink);background:color-mix(in srgb,var(--bg) 74%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);box-shadow:inset 0 0 0 1px var(--line),0 6px 16px -10px rgba(0,0,0,.35)}
.bs.store .bd{padding-top:0}
.sf{margin:0 -16px}
.sf-cover{position:relative;height:clamp(170px,30vh,260px);background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 55%,#000));background-size:cover;background-position:center;cursor:zoom-in}
.sf-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 35%,transparent 60%,rgba(0,0,0,.35));pointer-events:none}
.sf-mine,.sf-live{position:absolute;z-index:1;left:16px;bottom:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(10px)}
.sf-live{left:auto;right:16px}
.sf-mine{left:auto;right:16px;bottom:56px}.sf-live i{width:7px;height:7px;border-radius:50%;background:#3be27a;box-shadow:0 0 8px #3be27a}
.sf-id{display:flex;align-items:flex-end;gap:12px;padding:0 16px;margin-top:-34px;position:relative;z-index:2}
.sf-av{width:76px;height:76px;flex:none;border-radius:22px;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;background:var(--c1);border:4px solid var(--surface);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.sf-nm{min-width:0;padding-top:40px}
.sf-nm h2{margin:0;font-family:var(--kd);font-size:21px;line-height:1.25;display:flex;align-items:center;gap:6px}
.sf-nm p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.sf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:16px;}
.sf-stats div{padding:12px 8px;border-radius:14px;background:var(--surface-2);text-align:center}
.sf-stats b{display:block;font-size:16px}.sf-stats small{font-size:11.5px;color:var(--muted)}
.sf .tags{padding:0 16px}
.sf-about{margin:14px 16px 0;font-size:14px;line-height:1.75;white-space:pre-wrap}
.sf-empty{color:var(--muted);font-style:italic}
.sf-info{margin:14px 16px 0;border-radius:14px;background:var(--surface-2);overflow:hidden}
.sf-info div{display:flex;gap:10px;align-items:center;padding:11px 14px;font-size:13.5px}
.sf-info div+div{border-top:1px solid var(--line)}
.sf-info .ti{color:var(--accent);font-size:18px}
.sf-h{margin:20px 16px 8px;font-weight:700;font-size:14px}
.sf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 16px 8px}
.sf-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
.sf-ed{height:150px;border-radius:16px;display:grid;place-items:center;margin-bottom:6px;cursor:default}
.sf-ed .btn{position:relative;z-index:1;background:rgba(0,0,0,.5);color:#fff;border:0}
.doc .cv{position:absolute;left:4px;bottom:4px;width:26px;height:26px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-size:14px}
.doc .cv.on{background:#f5a623}
.mine-tag{margin-left:6px;padding:2px 8px;border-radius:999px;font-style:normal;font-size:11px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}

.tip{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:18px;background:var(--surface);margin-bottom:10px;animation:rise .45s var(--ease) both}

.tip div{flex:1}.tip b{display:block;font-weight:600}.tip p{font-size:13px;color:var(--muted);margin-top:2px}

.aisum{position:relative;overflow:hidden;padding:16px;border-radius:20px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#7c3aed,#c026d3)}

.aisum p{font-size:14.5px;line-height:1.6}

@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}70%{box-shadow:0 0 0 14px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}

@media(min-width:1024px){.dash{display:grid;grid-template-columns:420px minmax(0,1fr);gap:0 28px;align-items:start;padding:12px 32px 60px}
  .fmap{height:380px}}
/* ── ฟอร์มคำขอ: รถจากโรงรถ + หมุดล็อก ── */
.carc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line-2)}

/* ═════════ LUX — Cendon gallery neutrals · Cendon Orange เป็นลายเซ็น 10% เท่านั้น ═════════
   ส้มใช้กับ: เส้นสถานะ 2px · ขอบช่องที่โฟกัส · จุดสถานะเล็กๆ · hover บางๆ · โลโก้/แท็บที่เลือก
   ปุ่มหลัก (.lx-cta: จอง ขอราคา ยืนยัน ถาม) เป็นขาวดำ — ตรงกับปุ่มในขั้นตอนใบงาน (.btn.p)
   ส้มสดบนปุ่มที่ต้องจ่ายเงิน/ผูกมัด ให้ความรู้สึกเร่งรีบ/เตือน · ขาวดำนิ่งและน่าเชื่อถือกว่า
   ห้ามใช้เป็นพื้นใหญ่/การ์ดใหญ่/หัวข้อตะโกน */
html[data-theme="dark"]{--bg:#09090B;--surface:#111113;--surface-2:#18181B;--ink:#FAFAFA;--muted:#A1A1AA;--faint:#52525B;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.05);--co:#F07A36;--co-soft:rgba(240,122,54,.12);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 48px -32px rgba(0,0,0,.9);--shadow-sm:0 1px 0 rgba(255,255,255,.03) inset}
html[data-theme="light"]{--bg:#FAFAF9;--surface:#FFFFFF;--surface-2:#F4F4F5;--ink:#09090B;--muted:#71717A;--faint:#A1A1AA;
  --line:rgba(9,9,11,.08);--line-2:rgba(9,9,11,.05);--co:#E9682A;--co-soft:rgba(233,104,42,.10);
  --shadow:0 1px 2px rgba(9,9,11,.04),0 24px 48px -36px rgba(9,9,11,.25);--shadow-sm:0 1px 2px rgba(9,9,11,.05)}
body{background:var(--bg);letter-spacing:-.005em}
.wf,.ring,.deco{display:none!important}
/* ── ธีมมืด: ของที่เบราว์เซอร์วาดเอง (รายการตัวเลือกของ select · ปฏิทินเลือกวัน · แถบเลื่อน · ช่องที่กรอกอัตโนมัติ) ──
   ไม่บอกเบราว์เซอร์ว่าหน้านี้มืด มันจะวาดพื้นขาวทั้งที่ตัวหนังสือเป็นสีขาวตามธีม → อ่านไม่ออก */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
select option,select optgroup{background-color:var(--surface);color:var(--ink)}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,textarea:-webkit-autofill,select:-webkit-autofill{
  -webkit-text-fill-color:var(--ink)!important;caret-color:var(--ink);-webkit-box-shadow:0 0 0 1000px var(--surface) inset!important;transition:background-color 9999s ease 0s}
/* แถบเมนูบน: ตัวเลือกหน้าและรูปโปรไฟล์เป็นส้ม Cendon เรียบ เหมือนทุกหน้า (เดิมหน้าแรกหน้าเดียวเป็นไล่สีทอง) */
.navwrap .nav-ind,.navwrap .avatar .fb{background:var(--co,var(--accent))!important;background-image:none!important}
/* ปุ่ม */
.lx-cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:0;border-radius:12px;cursor:pointer;white-space:nowrap;
  font:600 14.5px/1 var(--kb);color:var(--bg);background:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 10px 22px -14px rgba(0,0,0,.55);transition:background .2s,transform .15s}
.lx-cta:hover{background:color-mix(in srgb,var(--ink) 84%,var(--bg))}.lx-cta:active{transform:scale(.98)}
.lx-cta:disabled{opacity:.45;cursor:not-allowed}
.lx-gh{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;cursor:pointer;text-decoration:none;
  font:600 14px/1 var(--kb);color:var(--ink);background:transparent;border:1px solid var(--line);transition:border-color .2s,color .2s}
.lx-gh:hover{border-color:var(--co);color:var(--co)}.lx-gh.w{width:100%}.lx-gh.lx-ic{width:44px;padding:0}
.btn.p{background:var(--ink)!important;color:var(--bg)!important;box-shadow:none!important}
.inp:focus,input:focus,textarea:focus,select:focus{outline:none;border-color:var(--co)!important;box-shadow:0 0 0 3px var(--co-soft)!important}
/* แถบบน */
.top{background:color-mix(in srgb,var(--bg) 82%,transparent)!important;backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line-2)}
.top .ic{background:transparent!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink)}
.search{background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.search:focus-within{border-color:var(--co)!important}
.search .ai{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.search .clogo{color:var(--co)}
.dot,.bdg{background:var(--co)!important}
/* HERO */
@media(min-width:1024px){.menu>.lx-hero{grid-row:1}.menu>.left{grid-row:2}.menu>.right{grid-row:2/span 9!important;top:78px}}
.lx-hero{grid-column:1/-1;padding:clamp(28px,7vw,72px) 0 clamp(18px,3vw,28px);text-align:center}
.lx-k{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;font:600 12px/1 var(--kd);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lx-dot{width:6px;height:6px;border-radius:50%;background:var(--co);box-shadow:0 0 0 4px var(--co-soft)}
.lx-h{margin:0 0 26px;font:700 clamp(34px,6.4vw,64px)/1.08 var(--kd);letter-spacing:-.035em;color:var(--ink)}

.lx-tags button{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 13px var(--kb);cursor:pointer;transition:color .2s,border-color .2s}

@media(max-width:560px){.lx-s{padding-left:14px}.lx-s .lx-cta{padding:0 14px}.lx-h br{display:none}}
/* หมวดงาน: ไอคอนเส้นบนพื้นกลาง · เลือกแล้ว = เส้นส้ม 2px ใต้ */
.qa .sq{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important;transform:none!important}
.qa .sq::before,.qa .sq::after{display:none!important}
.qa span:last-child{color:var(--muted)}
.qa:hover .sq{border-color:var(--co)!important}.qa:hover .sq .ti{color:var(--co)}
.qa.on .sq{border-color:var(--co)!important}.qa.on .sq .ti{color:var(--co)}
.qa.on span:last-child{color:var(--ink);box-shadow:inset 0 -2px 0 var(--co)}
/* ไอคอน 3D: ไม่มีกรอบ ให้วัตถุลอยแบบเดียวกับแถวหมวด · เลือกแล้วดูที่เส้นส้มใต้ชื่อ */
.qa .sq:has(img){background:none!important;border-color:transparent!important;overflow:visible}
.qa .sq img{position:absolute;inset:-16%;width:132%;height:132%;object-fit:contain;transition:transform .35s var(--spring)}
.qa .sq:has(img) .ti{display:none}
.qa:hover .sq img,.qa.on .sq img{transform:scale(1.08)}
/* การ์ดฟีเจอร์ + แผนที่ + การ์ดช่าง: ผิวกลาง ไม่มีไล่สี */
.feat{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.feat small,.feat p{color:var(--muted)!important}
.feat .fi{background:var(--surface-2)!important;color:var(--ink)!important;box-shadow:none!important}
.feat:hover{border-color:color-mix(in srgb,var(--co) 60%,var(--line))!important}
.feat .pulse{width:7px!important;height:7px!important;background:var(--co)!important;box-shadow:0 0 0 4px var(--co-soft)!important;animation:none!important}
.mapw,.card,.join,.cta,.st{background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink)}

.card:hover{border-color:color-mix(in srgb,var(--co) 55%,var(--line))!important}
.card .price b,.card .st i{color:var(--ink)}
.mine-tag{color:var(--co)!important;background:var(--co-soft)!important}

.lx-sw{position:relative;display:flex;flex-direction:column;justify-content:space-between}
.lx-sw input{position:absolute;opacity:0;width:46px;height:28px;bottom:6px;left:0;margin:0;cursor:pointer;z-index:1}
.lx-sw i{display:block;width:46px;height:28px;margin-top:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .2s}
.lx-sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .25s cubic-bezier(.32,.72,0,1),background .2s}
.lx-sw input:checked+i{background:var(--co);border-color:var(--co)}.lx-sw input:checked+i::after{transform:translateX(18px);background:#fff}

/* ═══ โครงหน้าหลักใหม่ (Navbar · หัวข้อ · ค้นหา · หมวด · ช่างแนะนำ) ═══ */
#vMenu>.left,#vMenu>.right{display:none!important}
#vMenu:not([hidden]){display:block!important;max-width:1180px}
/* Navbar: แคปซูลลอยกลางจอ */
.top{background:transparent!important;border:0!important;backdrop-filter:none!important;padding-top:calc(12px + env(safe-area-inset-top))!important}
.top .bar{max-width:880px;margin:0 auto;padding:6px 6px 6px 8px!important;border-radius:999px;gap:6px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:var(--shadow)}
.top .bar .ic{width:40px;height:40px;border-radius:50%!important;border:0!important}
.top .bar .ic:hover{background:var(--surface-2)!important}
#sbox{display:none!important}
.lx-brand{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);font:600 16px/1 var(--kd);letter-spacing:-.01em}
.lx-brand b{font-weight:700;color:var(--muted)}
#bMe{background:var(--ink)!important;color:var(--bg)!important}
/* แถวหมวด: ไอคอนนูนมีสี + ชื่อ · เส้นส้ม 2px ใต้ตัวที่ชี้อยู่ */
.lx-rail{display:flex;gap:14px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:8px 4px 4px;margin:6px auto 0;max-width:1060px;
  -webkit-mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.lx-rail::-webkit-scrollbar{display:none}
.lx-railw{position:relative}
.lx-rarr{display:none}
@media(min-width:761px){
  .lx-railw{max-width:1060px;margin:0 auto}
  .lx-rarr{display:grid;place-items:center;position:absolute;top:48px;transform:translateY(-50%);z-index:3;width:40px;height:40px;padding:0;border-radius:50%;border:0;cursor:pointer;
    background:var(--surface);color:var(--ink);font-size:19px;box-shadow:0 0 0 1px var(--line),0 10px 24px -12px rgba(0,0,0,.4);transition:background .2s,transform .2s}
  .lx-rarr:hover{background:var(--surface-2);transform:translateY(-50%) scale(1.06)}
  .lx-rarr:focus-visible{outline:2px solid var(--co);outline-offset:3px}
  .lx-rarr[hidden]{display:none}
  .lx-rarr.l{left:-4px}.lx-rarr.r{right:-4px}
  /* ขอบจางฝั่งที่ยังมีหมวดซ่อนอยู่ */
  #vMenu .lx-railw.fr .lx-rail{-webkit-mask:linear-gradient(90deg,#000 calc(100% - 72px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 72px),transparent)}
  #vMenu .lx-railw.fl .lx-rail{-webkit-mask:linear-gradient(90deg,transparent,#000 72px);mask:linear-gradient(90deg,transparent,#000 72px)}
  #vMenu .lx-railw.fl.fr .lx-rail{-webkit-mask:linear-gradient(90deg,transparent,#000 72px,#000 calc(100% - 72px),transparent);mask:linear-gradient(90deg,transparent,#000 72px,#000 calc(100% - 72px),transparent)}
}
.lx-rail{justify-content:flex-start!important}
.lx-rail button{position:relative;flex:none;width:104px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 4px 14px;border:0;background:none;cursor:pointer;color:var(--muted)}
.lx-rail button::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:2px;border-radius:2px;background:var(--co);transform:scaleX(0);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.lx-rail button:hover::after{transform:scaleX(1)}
.lx-rail button:hover{color:var(--ink)}
.lx-rt{font:500 13px/1.3 var(--kb);text-align:center}
/* ไอคอนนูน 3D แบบ CSS (ก่อนมีรูปจริง): ก้อนมนไล่สีของหมวด มีแสงด้านบน เงานุ่มด้านล่าง ลอยขึ้นเมื่อชี้ */
.lx-ri{position:relative;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--b) 88%,#fff) 0%,var(--a) 55%,color-mix(in srgb,var(--a) 70%,#000) 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.18),0 10px 18px -8px color-mix(in srgb,var(--a) 70%,transparent),0 2px 3px rgba(0,0,0,.12);
  transition:transform .4s cubic-bezier(.32,.72,0,1)}
.lx-ri::before{content:"";position:absolute;left:12%;right:12%;top:6%;height:38%;border-radius:12px 12px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.lx-ri .ti{position:relative;font-size:27px;color:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.lx-ri img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:contain;z-index:2}
.lx-ri:has(img){background:none;box-shadow:none}.lx-ri:has(img)::before,.lx-ri:has(img) .ti{display:none}
.lx-rail button:hover .lx-ri{transform:translateY(-4px) rotate(-3deg)}
/* หัวข้อส่วน */
.lx-sec{margin:34px auto 0;max-width:1180px}
.lx-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px}
.lx-sh h2{margin:0;font:700 clamp(20px,2.4vw,26px)/1.2 var(--kd);letter-spacing:-.02em}
.lx-sh h2 span{font:500 14px var(--kb);color:var(--muted);letter-spacing:0}
.lx-link{border:0;background:none;color:var(--muted);font:600 13.5px var(--kb);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.lx-link:hover{color:var(--co)}
/* การ์ดโปรไฟล์ช่าง */
.lx-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.lx-pc{display:block;text-align:left;padding:0;border-radius:18px;overflow:hidden;cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);animation:pcIn .3s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .4s cubic-bezier(.32,.72,0,1),border-color .25s,box-shadow .4s}
.lx-pc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--co) 50%,var(--line));box-shadow:var(--shadow)}
@keyframes pcIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lx-pcv{position:relative;display:block;aspect-ratio:16/9;background:radial-gradient(120% 120% at 85% 0%,var(--co-soft),transparent 60%),var(--surface-2) center/cover}
.lx-live{position:absolute;right:10px;top:10px;display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:999px;font:600 11.5px var(--kb);font-style:normal;color:#fff;background:rgba(9,9,11,.55);backdrop-filter:blur(8px)}
.lx-live i{width:6px;height:6px;border-radius:50%;background:var(--co)}
.lx-pcb{position:relative;z-index:1;display:flex;gap:12px;padding:0 16px 16px}
.lx-pav{flex:none;width:52px;height:52px;margin-top:-20px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--kd);color:var(--ink);background:var(--surface-2) center/cover;border:3px solid var(--surface);box-shadow:0 4px 10px rgba(0,0,0,.12)}
.lx-pct{min-width:0;padding-top:10px;display:flex;flex-direction:column;gap:4px}
.lx-pct b{font:600 15.5px/1.3 var(--kd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lx-pct b .ti{color:var(--muted);font-size:.85em}
.lx-pct small{font-size:12.5px;color:var(--muted)}
.lx-pcc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.lx-pcc span{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
/* หน้าหมวด */
.lx-cat{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.lx-cath{display:flex;align-items:center;gap:16px;margin:8px 0 18px}
.lx-cath h1{margin:0;font:700 clamp(24px,3.4vw,36px)/1.15 var(--kd);letter-spacing:-.025em}
.lx-cath p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.lx-subs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:20px}
.lx-subs button{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 13px var(--kb);cursor:pointer}
.lx-subs button.on{color:var(--ink);border-color:var(--ink)}
/* หน้าหมวด: เรียงลำดับ · สลับแผนที่ · ร้านที่เหมาะที่สุด */
.lx-catbar{display:flex;align-items:center;gap:8px;margin:-8px 0 16px}
.lx-sort{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.lx-sort .ti{color:var(--muted);font-size:17px}.lx-sort select{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:600 13.5px var(--kb);outline:none;appearance:none;-webkit-appearance:none;cursor:pointer}
.lx-mapt{height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;flex:none}
.lx-catmap{height:min(62vh,520px);border-radius:20px;overflow:hidden;background:var(--surface-2);margin-bottom:16px;box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="dark"] .lx-catmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.6)}
.lx-pbest{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--co)!important;font-weight:600}
.lx-maplink{margin-right:10px}
.lx-subs button:hover{border-color:var(--co)}
@media(max-width:560px){.lx-cards{grid-template-columns:1fr;gap:14px}.lx-pcv{aspect-ratio:21/8}.lx-rail button{width:84px}.lx-ri{width:52px;height:52px}}

/* มือถือ: แถวหมวด 2 บรรทัด เลื่อนข้างได้ */
@media(max-width:700px){
  .lx-rail{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:88px;justify-content:start;gap:10px 12px;padding:6px 12px 4px}
  .lx-rail button{width:auto;padding:8px 2px 12px;gap:8px}
  .lx-rt{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}

/* ═══ หน้าแรก v1: ช่องถามรู้เรื่องรถ + รถของฉัน + ปุ่มด่วน + ผลลัพธ์ AI→ช่าง ═══ */
.lx-hero{padding-top:clamp(20px,5vw,56px)!important}
.lx-h{margin-bottom:10px!important}
.lx-sub{margin:0 auto 22px;max-width:560px;font-size:15px;line-height:1.6;color:var(--muted)}
.lx-ask{flex-direction:column;align-items:stretch;gap:6px;padding:14px 14px 10px 18px!important;border-radius:22px!important;text-align:left}
.lx-ask textarea{width:100%;min-height:52px;max-height:140px;resize:none;border:0!important;background:none;outline:none;box-shadow:none!important;
  color:var(--ink);font:500 16.5px/1.55 var(--kb)}
.lx-ask textarea::placeholder{color:var(--faint)}
.lx-tools{display:flex;align-items:center;gap:6px}
.lx-tl{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:20px;text-decoration:none;border:1px solid var(--line);transition:color .2s,border-color .2s}
.lx-tl:hover{color:var(--co);border-color:var(--co)}
.lx-tools .lx-cta{margin-left:auto;height:40px;padding:0 16px}
.lx-tools .lx-cta .ti{font-size:18px}
/* ═══ ช่องค้นหา ⇄ AI: การ์ดสองหน้า พลิก 180° ═══
   หน้าแรก = ค้นหา (แว่นขยาย + ปุ่มค้นหา) · หลัง = Cendon AI (ขอบเรืองแสง ส่งรูป เสียง เลือกรถ ลูกศรส่ง)
   ความสูงกรอบเลื่อนตามหน้าที่หงายอยู่ · ลดการเคลื่อนไหว = สลับทันทีไม่หมุน */
@property --lxang{syntax:"<angle>";inherits:false;initial-value:0deg}
.lx-flip{position:relative;z-index:1;max-width:720px;margin:0 auto;perspective:1600px;touch-action:pan-y;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.lx-flip input{user-select:text;-webkit-user-select:text}
/* สองหน้าขนาดเท่ากันเสมอ — กรอบไม่ยืดหด ตอนพลิกจึงนิ่ง · สองบรรทัด: ช่องพิมพ์เต็มความกว้าง แล้วแถวปุ่ม */
.lx-flipin{position:relative;height:118px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);will-change:transform}
.lx-flipin>.lx-face{position:absolute;inset:0;margin:0;max-width:none;height:100%;box-sizing:border-box;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  flex-direction:column;align-items:stretch;justify-content:space-between;gap:6px;padding:12px 12px 12px 18px!important;border-radius:22px!important}
.lx-fa{transform:rotateY(180deg)}
.lx-r1{display:flex;align-items:center;gap:10px;min-width:0}
.lx-r1 input{flex:1;min-width:0;height:44px;font-size:17px!important}
.lx-r1>.ti-search{font-size:21px;color:var(--muted)}
.lx-fs input::-webkit-search-cancel-button{display:none}
.lx-r2{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.lx-r2 .lx-cta{height:44px;padding:0 20px}.lx-r2 .lx-cta .ti{font-size:17px}
/* หน้า AI: ✦ ช่องพิมพ์ · แถวล่าง รูป เสียง ลูกศร — ขอบไล่สีหมุนช้า ๆ + เงาเรืองนุ่ม */
.lx-fa{border:1.5px solid transparent!important;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--lxang),#E9682A,#f5a524,#ec4899,#7c5cff,#38bdf8,#E9682A) border-box!important;
  box-shadow:0 18px 50px -22px rgba(124,92,255,.55),0 10px 30px -18px rgba(233,104,42,.45)!important;animation:lxSpin 6s linear infinite}
.lx-fa:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,#7c5cff 16%,transparent),0 18px 50px -22px rgba(124,92,255,.6)!important}
@keyframes lxSpin{to{--lxang:360deg}}
.lx-spark{flex:none;font-size:21px;background:linear-gradient(135deg,#E9682A,#ec4899 55%,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lx-fa .lx-r2{justify-content:flex-start}
.lx-fa .lx-tl{flex:none;width:44px;height:44px}
.lx-send{flex:none;margin-left:auto;width:46px;height:46px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:20px;cursor:pointer;transition:transform .2s}
.lx-send:active{transform:scale(.92)}
/* ระหว่างลากด้วยนิ้ว: เงาเอียงตามมุม ดูมีมิติ */
.lx-flip.drag .lx-face{box-shadow:0 22px 50px -24px rgba(0,0,0,.45)!important}
/* ตอนพลิกเข้า AI: แสงวาบพาดผ่านครั้งเดียว */
.lx-flip.burst .lx-fa::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);background-size:250% 100%;animation:lxSheen 1.1s .35s ease-out both}
html[data-theme="dark"] .lx-flip.burst .lx-fa::after{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 48%,transparent 66%)}
@keyframes lxSheen{from{background-position:120% 0}to{background-position:-30% 0}}
/* ฟ้าคลื่นดาว: เต็มความกว้างจอ อยู่หลังเนื้อหาหน้าแรก จางลงด้านล่าง */
#vMenu{isolation:isolate}
.lx-sky{position:absolute;top:calc(-1 * env(safe-area-inset-top));left:0;width:100%;height:0;z-index:-1;pointer-events:none;opacity:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 48%,rgba(0,0,0,.55) 72%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 48%,rgba(0,0,0,.55) 72%,transparent 100%)}
.lx-sky canvas{position:absolute;inset:0}
.lx-sky i,.lx-sky b{position:absolute;left:-10%;display:block;width:240%;will-change:transform;animation-play-state:paused}
.lx-sky i{top:4%;height:58%;opacity:.55;filter:blur(48px);border-radius:50%;
  background:linear-gradient(90deg,#FFB547 0%,#F28C38 11%,#FF4D7A 24%,#8B6BFF 37%,#FF4D7A 50%,#F28C38 63%,#FFB547 76%,#F28C38 88%,#FF4D7A 100%);animation:skyA 9s cubic-bezier(.45,0,.55,1) infinite alternate}
.lx-sky b{top:20%;height:50%;opacity:.38;filter:blur(64px);border-radius:50%;
  background:linear-gradient(90deg,#8B6BFF 0%,#FF4D7A 16%,#F28C38 33%,#FFB547 50%,#FF4D7A 66%,#8B6BFF 83%,#F28C38 100%);animation:skyB 12s cubic-bezier(.45,0,.55,1) infinite alternate}
.lx-sky.on i,.lx-sky.on b{animation-play-state:running}
@keyframes skyA{from{transform:translate3d(0,0,0) scaleY(1)}to{transform:translate3d(-52%,6%,0) scaleY(1.12)}}
@keyframes skyB{from{transform:translate3d(-50%,4%,0) scaleY(.92)}to{transform:translate3d(0,-4%,0) scaleY(1.06)}}
html[data-theme="dark"] .lx-sky i{opacity:.62}html[data-theme="dark"] .lx-sky b{opacity:.45}
html:not([data-theme="dark"]) .lx-sky i{opacity:.32}html:not([data-theme="dark"]) .lx-sky b{opacity:.22}
@media(max-width:699px){.lx-sky i{filter:blur(34px)}.lx-sky b{filter:blur(44px)}}
@media(prefers-reduced-motion:reduce){.lx-sky i,.lx-sky b{animation:none}}
.lx-fliphint{margin:10px 0 0;font-size:12.5px;color:var(--faint);text-align:center}
.lx-fliphint b{color:var(--muted);font-weight:600}.lx-fliphint .ti{font-size:13px}
.lx-srbtn{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.lx-srbtn:focus-visible{position:static;width:auto;height:auto;margin:8px auto 0;padding:6px 12px;clip:auto;border-radius:10px;background:var(--surface-2);color:var(--ink);font:500 13px var(--kb)}
/* เมนูเลือกรถ (การ์ดรถบนหน้าแรก) */
.lx-carmenu{position:absolute;z-index:1300;min-width:240px;max-width:min(340px,calc(100vw - 24px));padding:6px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 24px 48px -20px rgba(0,0,0,.45)}
.lx-carmenu button,.lx-carmenu a{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:none;color:var(--ink);font:500 14px var(--kb);text-align:left;cursor:pointer;text-decoration:none;box-sizing:border-box}
.lx-carmenu button:hover,.lx-carmenu button:focus-visible,.lx-carmenu a:hover{background:var(--surface-2)}
.lx-carmenu .ti{font-size:18px;color:var(--muted);flex:none}.lx-carmenu .ti-check{margin-left:auto;color:var(--ink)}
.lx-carmenu span{min-width:0;flex:1}.lx-carmenu b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lx-carmenu small{display:block;font-size:12px;color:var(--muted)}
.lx-carmenu hr{border:0;height:1px;background:var(--line);margin:4px 6px}
@media(prefers-reduced-motion:reduce){.lx-flipin{transition:none}.lx-fa{animation:none}.lx-flip.burst .lx-fa::after{display:none}}
@media(max-width:560px){.lx-flipin>.lx-face{padding:11px 11px 11px 15px!important}}
/* การ์ด "เรียกช่าง" แบบพลิก: สองหน้าซ้อนในช่องเดียวกัน (grid) ความสูงเท่าการ์ดอื่น · พลิกด้วย rotateY (การ์ดจอทำ ไม่กระตุก)
   ลากตามนิ้วได้ (แนวนอนเป็นของการ์ด แนวตั้งยังเลื่อนหน้าได้) · ปุ่ม ⇄ อยู่ในการ์ดแต่ละหน้า จึงหมุนไปพร้อมการ์ด */
.lx-qflip{position:relative;perspective:900px;min-width:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.lx-qflip .qf-in{display:grid;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.lx-qflip.back .qf-in{transform:rotateY(180deg)}
.lx-qflip .qf-face{position:relative;grid-area:1/1;width:100%;height:100%;min-width:0;box-sizing:border-box;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* ด้านหลังต้องหันกลับเสมอ แม้ตอนเอาเมาส์ชี้ (กฎ "ชี้แล้วไม่ลอย" ใน motion.css ห้ามทับ ไม่งั้นการ์ดหายตอนชี้) */
html #hQuick .lx-qflip .qf-f{transform:none!important}
html #hQuick .lx-qflip .qf-b{transform:rotateY(180deg)!important}
/* ด่วน = แดงสดทั้งใบ ตัวหนังสือขาว — เห็นทันทีว่าอันนี้สำคัญ (ขาวบนแดงอ่านชัด ผ่านเกณฑ์ความต่างสี) */
#hQuick .lx-qflip .qf-f{background:linear-gradient(160deg,#e02424,#c81e1e)!important;border-color:transparent!important;color:#fff;box-shadow:0 12px 26px -14px rgba(200,30,30,.8),inset 0 1px 0 rgba(255,255,255,.2)}
#hQuick .lx-qflip .qf-f .ti,#hQuick .lx-qflip .qf-f b,#hQuick .lx-qflip .qf-f small{color:#fff!important}
#hQuick .lx-qflip .qf-f .qf-dot{background:#fff}
/* ไม่ด่วน = การ์ดธรรมดาเหมือนใบอื่น */
#hQuick .lx-qflip .qf-b>.ti{color:var(--co)!important}
.qf-dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#dc2626;vertical-align:1px}
/* ปุ่ม ⇄: วงกลมมุมขวาบนของแต่ละหน้า (พื้นที่แตะกว้าง 46px) */
#hQuick .lx-qflip .qf-sw{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;box-sizing:border-box;
  border:1px solid var(--line);background:var(--bg);color:var(--muted)}
#hQuick .lx-qflip .qf-sw::after{content:"";position:absolute;inset:-8px;border-radius:50%}
#hQuick .lx-qflip .qf-sw .ti{font-size:16px;margin:0;color:inherit!important}
#hQuick .lx-qflip .qf-f .qf-sw{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.16);color:#fff}
@media(hover:hover){#hQuick .lx-qflip .qf-b .qf-sw:hover{color:var(--ink);border-color:var(--ink)}#hQuick .lx-qflip .qf-f .qf-sw:hover{background:rgba(255,255,255,.28)}}
/* มือถือ: ปุ่ม ⇄ อยู่แถวเดียวกับชื่อ ตรงกันพอดี · คำอธิบายใช้ความกว้างเต็มด้านล่าง */
@media(max-width:760px){
  #vMenu #hQuick .lx-qflip .qf-face{grid-template-columns:20px minmax(0,1fr) 28px;padding-right:6px}
  #vMenu #hQuick .lx-qflip .qf-sw{position:relative;top:auto;right:auto;grid-column:3;grid-row:1;width:28px;height:28px}
  #vMenu #hQuick .lx-qflip .qf-face>small{grid-column:2/4}
}
/* ปุ่มสลับสำหรับคีย์บอร์ด/โปรแกรมอ่านจอ: มองไม่เห็น แต่โฟกัสแล้วการ์ดมีกรอบ */
.lx-qflip .qf-tg{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.lx-qflip:has(.qf-tg:focus-visible){outline:2px solid var(--co);outline-offset:3px;border-radius:16px}
@media(prefers-reduced-motion:reduce){.lx-qflip .qf-in{transition:none}}
/* (เดิม) การ์ด "เรียกช่าง": ด่วน / ไม่ด่วน อยู่ในการ์ดเดียว ขนาดเท่าการ์ดอื่น */
.lx-qcall{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}

#vMenu .lx-quick .lx-q2 button{display:flex;min-height:0;height:32px;padding:0 6px;column-gap:5px}
/* มือถือ: เรียงแบบเดียวกับการ์ดอื่น (ไอคอนซ้าย + ชื่อ) แถวล่างเป็นปุ่ม ด่วน / ไม่ด่วน เต็มความกว้าง */

/* การ์ดบริการ: หัว (ร้าน) · แบนเนอร์ · ท้าย (คะแนน / ราคา) */
.lx-gch{display:flex;align-items:center;gap:8px;min-width:0;padding:10px 12px}
.lx-gch .lx-pav{width:28px;height:28px;margin:0;border-width:0;font-size:12px;flex:none}
.lx-gch b{font:600 13.5px/1.3 var(--kb);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx-gch .mine-tag{flex:none;font-size:11px}
/* สปอนเซอร์: ป้ายบอกลูกค้าเสมอ สีกลาง ๆ ไม่แย่งสายตาจากราคา · ปุ่มของเจ้าของอยู่ใต้การ์ด */
.lx-gch .ad-tag{flex:none;margin-left:auto;padding:2px 8px;border-radius:999px;font:600 10.5px/1.4 var(--kb);font-style:normal;letter-spacing:.02em;color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.lx-gch .mine-tag+.ad-tag{margin-left:4px}
.sp-it{display:flex;flex-direction:column;gap:8px;min-width:0}
.sp-it>.lx-gc{flex:1}
.sp-btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px/1.3 var(--kb);cursor:pointer;text-align:center}
.sp-btn .ti{font-size:17px;color:var(--accent)}
.sp-btn small{font:500 12px var(--kb);color:var(--muted)}
.sp-btn.on{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.gd-sp{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:11px 14px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:none;color:var(--ink);font:600 14px/1.35 var(--kb);text-align:left;cursor:pointer}
.gd-sp .ti:first-child{font-size:19px;color:var(--accent)}.gd-sp .ti:last-child{margin-left:auto;color:var(--faint)}
.gd-sp small{display:block;font:500 12px var(--kb);color:var(--muted)}
.gd-sp.on{border-style:solid;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.sps{display:grid;gap:18px}
.sps-prev{width:min(300px,100%);pointer-events:none}
.sps-now{display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));font-size:14px;line-height:1.45}
.sps-now .ti{font-size:20px;color:var(--accent);flex:none}
.sps h3{margin:0 0 10px;font:700 15px var(--kd)}
.sps-li{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sps-li li{display:flex;gap:10px;font-size:14px;line-height:1.5;color:var(--ink)}
.sps-li .ti{color:var(--accent);font-size:18px;flex:none;margin-top:1px}
.sps-days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sps-days button{min-height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--kd);display:grid;place-content:center;gap:2px;cursor:pointer}
.sps-days button small{font:500 11.5px var(--kb);color:var(--muted)}
.sps-days button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sps-days button:disabled{opacity:.4;cursor:not-allowed}
.sps-price{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:14px;border-top:1px solid var(--line-2);font-size:14px;color:var(--muted)}
.sps-price b{font:700 19px var(--kd);color:var(--ink)}
.sps-fine{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.sps-err{margin:0;color:#d4483a;font-size:13px}
.sps-err:empty{display:none}
.sps-ft{display:flex;gap:8px;width:100%}.sps-ft .lx-cta{flex:1}
/* ตรวจใบเสนอราคา: หน้าเดียว ใส่รูปอย่างเดียว แล้วส่งให้ AI ในห้องแชต */
.qp{display:grid;gap:18px;max-width:560px;margin:0 auto}
.qp [hidden]{display:none!important}
.qp-hd{display:grid;gap:6px}
.qp-hd h2{margin:0;font:700 22px/1.3 var(--kd);color:var(--ink)}
.qp-hd p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
.qp-drop{display:grid;place-items:center;align-content:center;gap:8px;width:100%;min-height:220px;padding:22px;border-radius:20px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface));color:var(--ink);font:inherit;text-align:center;cursor:pointer}
.qp-drop .ti{font-size:44px;color:var(--accent)}
.qp-drop b{font:700 17px/1.4 var(--kd)}.qp-drop small{color:var(--muted);font-size:13px}
.qp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qp-ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.qp-ph img{width:100%;height:100%;object-fit:cover;display:block}
.qp-ph em{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font:600 11px var(--kb);font-style:normal}
.qp-ph button{position:absolute;top:6px;right:6px;width:30px;height:30px;padding:0;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;cursor:pointer}
.qp-add{aspect-ratio:3/4;border-radius:14px;border:2px dashed var(--line);background:none;color:var(--muted);display:grid;place-content:center;justify-items:center;gap:4px;font:600 13px var(--kb);cursor:pointer}
.qp-add .ti{font-size:26px;color:var(--accent)}
.qp-tips{list-style:none;margin:0;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px}
.qp-tips li{display:flex;gap:10px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.qp-tips .ti{color:#2f9e6a;font-size:17px;flex:none;margin-top:1px}
.qp-what{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.qp-what span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font:500 13px/1.35 var(--kb);color:var(--ink)}
.qp-what .ti{font-size:18px;color:var(--accent);flex:none}
.qp-car{display:flex;align-items:center;gap:10px;margin:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);font-size:14px;line-height:1.45;color:var(--ink)}
.qp-car>.ti{font-size:19px;color:var(--muted);flex:none}
.qp-car select{margin-left:auto;max-width:60%;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--kb)}
.qp-err{margin:0;color:#d4483a;font-size:13px}.qp-err:empty{display:none}
/* ฟังเสียงรถ */
.lp-s{display:grid;gap:10px}
.lp-s h3{margin:0;font:700 15.5px/1.4 var(--kd);color:var(--ink)}
.lp-s h3 em{color:#d4483a;font-style:normal}.lp-s h3 small{font:400 12.5px var(--kb);color:var(--muted);margin-left:4px}
.lp-area{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lp-area button{display:flex;align-items:center;gap:9px;min-height:48px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px/1.3 var(--kb);text-align:left;cursor:pointer}
.lp-area button .ti{font-size:19px;color:var(--muted);flex:none}
.lp-area button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.lp-area button.on .ti{color:var(--accent)}
.lp-when{display:flex;flex-wrap:wrap;gap:7px}
.lp-when button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13.5px var(--kb);cursor:pointer}
.lp-when button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lp-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp-big{display:grid;justify-items:center;align-content:center;gap:6px;min-height:150px;padding:16px 12px;border-radius:18px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface));color:var(--ink);text-align:center;cursor:pointer;font:inherit}
.lp-big .ti{font-size:36px;color:var(--accent)}.lp-big b{font:700 15px/1.35 var(--kd)}.lp-big small{font-size:12px;color:var(--muted);line-height:1.4}
.lp-big.alt{border-color:var(--line);background:var(--surface)}.lp-big.alt .ti{color:var(--muted)}
.lp-tips{margin-top:10px}
.lp-tips .ti-alert-triangle{color:#c77c12}
.lp-rec{display:grid;justify-items:center;gap:10px;padding:22px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.lp-rec b{font:700 34px/1 var(--kd);font-variant-numeric:tabular-nums;color:var(--ink)}
.lp-dot{width:12px;height:12px;border-radius:50%;background:#e5484d;animation:lpb 1s infinite}
@keyframes lpb{50%{opacity:.25}}
.lp-meter{width:min(280px,80%);height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.lp-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f9e6a,#e8a33d,#e5484d);transition:width .08s}
.lp-rec small{color:var(--muted);font-size:12.5px}
.lp-recb{display:flex;gap:8px;margin-top:4px}.lp-recb .lx-cta{height:46px;padding:0 22px}
.lp-busy{display:flex;align-items:center;gap:12px;padding:20px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px}
.lp-spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:lps .8s linear infinite;flex:none}
@keyframes lps{to{transform:rotate(360deg)}}
.lp-ok{display:grid;gap:10px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.lp-ok audio{width:100%}
.lp-ok p{display:flex;align-items:center;gap:8px;margin:0;font-size:13.5px;color:var(--muted)}.lp-ok p .ti{font-size:17px;color:var(--accent)}
.lp-ok>.lx-gh{justify-self:start;height:40px;padding:0 14px}
.lp-fr{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.lp-fr img{width:88px;height:66px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.lp-fr small{flex-basis:100%;color:var(--muted);font-size:12px}
.lp-note small{font-weight:400;color:var(--muted)}
#lpGo.dim{opacity:.55}
.lp-s.need{animation:lpneed 1.2s}
@keyframes lpneed{0%,60%{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 16%,transparent)}100%{background:transparent;box-shadow:none}}
.lp-s{border-radius:16px}
@media(max-width:380px){.lp-area{grid-template-columns:1fr}.lp-pick{grid-template-columns:1fr}.lp-big{min-height:110px}}
.lx-gcf{display:flex;flex:1;flex-direction:column;gap:2px;padding:10px 12px 12px}
.lx-gct{margin-bottom:4px;font:600 14px/1.4 var(--kb);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lx-gcr{margin-top:auto}
.lx-gcr{display:flex;align-items:center;gap:4px;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap}
.lx-gcr .ti{font-size:15px;color:#f5b301}.lx-gcr .ti-star{color:var(--faint,var(--muted))}
.lx-gcr b{font-weight:600;color:var(--ink)}.lx-gcr small{font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.lx-gcf .lx-gp{align-self:flex-end;font:700 16px var(--kd)}
/* โพสต์เป็นรูปแนวนอน 16:9 (ขนาดเดียวกับ YouTube) */
.lx-gcv{aspect-ratio:16/9!important}
.lx-gcv.fit{overflow:hidden;background:var(--surface-2)}
.lx-gcv.fit .lx-fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.15);transform:scale(1.25);opacity:.75}
.lx-gcv.fit .lx-fi{position:relative;display:block;width:100%;height:100%;object-fit:contain}
.lx-gcv.fit .lx-gn{z-index:1}
#gPh .doc{aspect-ratio:16/9;height:auto}


/* ═══ หน้าร้าน Cendon: การ์ดใบรับรองช่าง ═══ */
/* ══ หน้าร้าน (ลูกค้า) ══ คอลัมน์เดียว กว้างไม่เกิน 720 · เส้นคั่นแทนการ์ดซ้อนการ์ด · ส้มเป็นแค่ตราประทับ */
.so [hidden]{display:none!important}
.so{position:relative;max-width:720px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 0 28px}
.so.has-cover{padding-top:0}
.so-pv{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.so.has-cover .so-pv{position:absolute;z-index:2;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);margin:0;padding:6px 12px;border-radius:999px;white-space:nowrap;color:#fff;background:rgba(9,9,11,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.so-cover{height:clamp(210px,46vw,340px);margin:0 -16px;background:var(--surface-2) center/cover no-repeat;cursor:zoom-in}
.so-id{display:flex;align-items:flex-end;gap:14px;margin-top:2px}
.so-av{position:relative;flex:none;display:grid;place-items:center;width:84px;height:84px;border-radius:24px;font:700 32px/1 var(--kd);color:var(--ink);background:var(--surface) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--line)}
.so-av.img{cursor:zoom-in;box-shadow:none}
.has-cover .so-id{align-items:flex-start}.has-cover .so-nm{padding-top:12px}.has-cover .so-share{align-self:flex-start;margin-top:10px}
.has-cover .so-av{margin-top:-42px;box-shadow:0 0 0 4px var(--bg),0 12px 26px -16px rgba(0,0,0,.5)}
.has-cover .so-av:not(.img){box-shadow:inset 0 0 0 1px var(--line),0 0 0 4px var(--bg)}
.so-nm{flex:1;min-width:0;padding-bottom:2px}
.so-nm h1{margin:0;font:700 clamp(23px,4vw,30px)/1.22 var(--kd);letter-spacing:-.015em;overflow-wrap:anywhere}
.so-sub{display:flex;flex-wrap:wrap;gap:2px 8px;margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.so-sub>span+span::before{content:"·";margin-right:8px;color:var(--faint)}
.so-cats{margin:3px 0 0;font-size:13px;color:var(--muted)}
.so-rt{display:inline-flex;align-items:center;gap:4px}.so-rt .ti{font-size:15px;color:#f5b301}.so-rt b{color:var(--ink);font-weight:600}
.so-share{flex:none;align-self:center;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-size:20px;color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background .15s}
.so-share:hover{background:var(--surface-2)}
.so-note{display:flex;gap:12px;align-items:flex-start;margin:16px 0 0;padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.55;color:var(--muted);background:var(--surface-2)}
.so-note>.ti{flex:none;font-size:20px;color:var(--ink)}.so-note b{display:block;color:var(--ink);font-weight:600}
.so-note.test{background:color-mix(in srgb,var(--co,#E9682A) 9%,var(--surface))}
.so-facts{display:grid;grid-template-columns:1fr 1fr;margin:18px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.so-facts>div{min-width:0;padding:13px 0}
.so-facts>div+div{padding-left:16px;border-left:1px solid var(--line)}
.so-facts dt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}.so-facts dt .ti{font-size:16px}
.so-facts dd{display:flex;align-items:center;gap:4px;margin:4px 0 0;font-size:14.5px;font-weight:500;color:var(--ink)}
.so-hours[data-hours]{cursor:pointer}
.so-chev{margin-left:auto;font-size:16px;color:var(--faint);transition:transform .2s}
.open>.so-chev,.open dd .so-chev,.so-hours.open .so-chev{transform:rotate(180deg)}
.so-open::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;vertical-align:1px;background:var(--faint)}
.so-open.on::before{background:#22a06b}
.so-week{display:grid;gap:2px;margin:0;padding:10px 0 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.so-week div{display:flex;justify-content:space-between;max-width:280px;color:var(--muted)}.so-week dd{margin:0}
.so-week .now{color:var(--ink);font-weight:600}
/* ทีมงานตรวจแล้ว: ตราประทับดำ + โล่ส้ม (ชุดเดียวกับการ์ดความปลอดภัยในห้องแชต) */
.so-vet{display:flex;align-items:center;gap:14px;width:100%;margin:0;padding:15px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.so-vet.static{cursor:default}
.so-vi{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:21px;color:var(--co,#E9682A);background:linear-gradient(160deg,#1C1C20,#09090B);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
html[data-theme="dark"] .so-vi{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.so-vet>span{flex:1;min-width:0}.so-vet b{display:block;font-size:14.5px;font-weight:600}
.so-vet small{display:block;margin-top:2px;font-size:13px;color:var(--muted);line-height:1.5}
.so-vet small.so-vd{font-size:12px;color:var(--faint)}
.so-vet.open .so-chev{transform:rotate(180deg)}
.so-vetd{padding:4px 0 14px 58px;border-bottom:1px solid var(--line)}
.so-vetd ul{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.so-vetd li{display:flex;gap:10px;font-size:13.5px;line-height:1.55;color:var(--muted)}.so-vetd li .ti{flex:none;font-size:18px;color:var(--ink);margin-top:1px}
.so-vetd li b{display:block;color:var(--ink);font-weight:600}
.so-vetd p{margin:12px 0 0;font-size:12.5px;line-height:1.6;color:var(--faint)}
.so-about{margin:16px 0 0;font-size:15px;line-height:1.75;white-space:pre-wrap;color:var(--ink)}
.so-about2{margin:0 0 12px;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.so-sec{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.so-sec h2{margin:0 0 12px;font:700 18px/1.3 var(--kd)}
.so-fine{margin:10px 0 0;font-size:12.5px;line-height:1.55;color:var(--faint)}
.so-empty{margin:0;padding:6px 0;font-size:14px;line-height:1.6;color:var(--muted)}
.so-err{display:flex;align-items:center;gap:10px;margin:0;font-size:14px;color:var(--muted)}.so-err .lx-gh{height:36px;margin-left:auto}
.so-dl{display:grid;margin:0}
.so-dl div{display:grid;grid-template-columns:minmax(120px,36%) 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14px;line-height:1.55}
.so-dl div:last-child{border-bottom:0}
.so-dl dt{display:flex;align-items:center;gap:8px;color:var(--muted)}.so-dl dt .ti{font-size:17px}.so-dl dd{margin:0}
.so-pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.so-pics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--surface-2);cursor:zoom-in}
.so-care ul{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.so-care li{display:flex;gap:12px;padding:7px 0;font-size:14px;line-height:1.6;color:var(--ink)}.so-care li .ti{flex:none;font-size:19px;color:var(--muted);margin-top:1px}
.so-ser{display:flex;justify-content:space-between;margin:26px 0 0;padding-top:10px;border-top:1px dashed var(--line);font:600 10.5px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--faint)}
/* แถบล่าง: ทักช่าง · โทร · ขอราคา */

async function api(path,o){
  o=o||{};
  const h={};
  if(U){try{h.Authorization="Bearer "+await U.getIdToken()}catch(e){}}
  if(o.body)h["Content-Type"]="application/json";
  let r;
  /* คำขออ่านข้อมูลรอไม่เกิน 20 วิ — เน็ตหรือเซิร์ฟเวอร์ค้าง ต้องขึ้นปุ่มลองใหม่ ไม่ใช่โครงโหลดค้างไปตลอด
     (ส่งรูป/ใบสมัครไม่ตัดเวลา เพราะไฟล์ใหญ่ใช้เวลานานได้จริง) */
  const ac=!o.body&&window.AbortController?new AbortController():null,tm=ac&&setTimeout(()=>ac.abort(),20000);
  try{r=await fetch(API+path,{method:o.method||(o.body?"POST":"GET"),headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:"no-store",signal:ac?ac.signal:undefined})}
  catch(e){throw new Error(ac&&ac.signal.aborted?"เซิร์ฟเวอร์ตอบช้า ลองใหม่อีกครั้ง":"เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง")}
  finally{clearTimeout(tm)}
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error((d&&d.error)||("ระบบยังไม่พร้อม ("+r.status+")")),{status:r.status});
  return d;
}

/* ปุ่มที่รอเซิร์ฟเวอร์ — หมุนระหว่างรอ กดซ้ำไม่ได้ ผิดพลาดแล้วขึ้นข้อความในแผ่นเดิม */
async function busy(btn,fn){
  if(btn&&btn.disabled)return;
  const html=btn&&btn.innerHTML;
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'}
  try{return await fn()}
  catch(e){
    /* ลืมกรอกหรือกรอกผิด (เช็กในเครื่อง หรือเซิร์ฟเวอร์ตอบ 400) → ขึ้นกล่องบอกกลางจอ ไม่ใช่ตัวหนังสือเล็ก ๆ ท้ายฟอร์มที่มองไม่เห็น */
    if(e&&(e.form||e.status===400)&&$("bs").classList.contains("on")){const er=$("err");if(er)er.textContent=e.message;formPop(e.form||[{id:fieldOf(e.message),msg:e.message}]);return}
    const er=$("err");if(er&&$("bs").classList.contains("on")){er.textContent=e.message;er.style.animation="none";er.offsetWidth;er.style.animation=""}else toast(e.message,"ti-alert-triangle")}
  finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=html}}
}

function formPop(list){
  const old=$("fpop");if(old)old.remove();
  const d=document.createElement("div");d.id="fpop";d.className="fpop";
  d.setAttribute("role","alertdialog");d.setAttribute("aria-modal","true");d.setAttribute("aria-labelledby","fpopT");
  d.innerHTML=`<div class="fpop-c"><span class="fpop-i"><i class="ti ti-alert-circle"></i></span>
    <h3 id="fpopT">${T("ยังส่งไม่ได้ — เช็กข้อมูลอีกนิด","Almost there — please check")}</h3>
    <ul>${list.map(x=>`<li>${esc(x.msg)}</li>`).join("")}</ul>
    <button class="btn p w" type="button" id="fpopOk">${T("กลับไปแก้","Fix it")}</button></div>`;
  document.body.appendChild(d);
  list.forEach(x=>{const el=x.id&&$(x.id);if(!el)return;el.classList.add("bad-f");
    const off=()=>el.classList.remove("bad-f");el.addEventListener("input",off,{once:true});el.addEventListener("click",off,{once:true})});
  const onKey=e=>{if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();e.stopPropagation();close()}};
  const close=()=>{d.remove();removeEventListener("keydown",onKey,true);
    const f=list.find(x=>x.id&&$(x.id));if(!f)return;const el=$(f.id);
    el.scrollIntoView({block:"center",behavior:"smooth"});
    if(/^(INPUT|TEXTAREA)$/.test(el.tagName)&&!el.hidden)setTimeout(()=>el.focus({preventScroll:true}),260)};
  addEventListener("keydown",onKey,true);
  d.onclick=e=>{if(e.target===d)close()};
  $("fpopOk").onclick=close;
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  setTimeout(()=>{const b=$("fpopOk");if(b)b.focus()},30);
}

/* ═══ แผ่นเลื่อนขึ้น ═══
   ทุกขั้นตอนเปิดในแผ่นนี้ และทุกขั้นมีที่อยู่ของตัวเองในแถบที่อยู่ (nav.js)
   เช่น /tech/<ร้าน> → /tech/<ร้าน>/quote · ปุ่มย้อนของมือถือ/เบราว์เซอร์ถอยทีละขั้น ไม่ปิดทั้งแผ่น
   o: {title, body, foot, full, mount, push (ซ้อนขั้นใหม่), url (ที่อยู่เต็ม), slug (ต่อท้ายขั้นก่อน)} */
const SH={stack:[],layers:[],onClose:null};
function paintSheet(o){
  const bs=$("bs");
  SH.cur=o;
  $("bsT").textContent=o.title||"";
  $("bsB").innerHTML=(o.body||"")+'<p class="err" id="err" role="alert"></p>';
  $("bsF").innerHTML=o.foot||"";
  $("bsBack").hidden=!SH.stack.length;
  bs.classList.toggle("full",!!o.full);bs.classList.toggle("store",!!o.store);bs.classList.toggle("inbox",!!o.inbox);bs.classList.remove("so-up");
  $("bsB").scrollTop=0;
  if(o.mount)o.mount($("bsB"),$("bsF"),o);
}
function sheet(o){
  /* ถอยกลับมาขั้นที่วาดใหม่ได้ (o.redo เช่น ฟอร์มสมัครช่าง) — วาดทับขั้นเดิม ไม่แตะประวัติ */
  if(SH.restore){const r=SH.restore;SH.restore=null;o.url=r.url;const L=SH.layers[SH.layers.length-1];if(L)L.o=o;paintSheet(o);return}
  const bs=$("bs");
  const was=bs.classList.contains("on");
  if(!was){bs.classList.add("on");bs.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
  /* เปิดหน้าอื่นในแผ่นเดิม (เช่น จากบริการไปหน้าร้าน) = ซ้อนขั้นใหม่ กดย้อนแล้วกลับมาหน้าเดิม */
  const moved=was&&o.push===undefined&&o.url&&SH.cur&&SH.cur.url!==o.url;
  if(!was||!SH.layers.length){
    SH.stack=[];
    const L=Nav.push({url:o.url,slug:o.slug,tag:"sheet",close:()=>closeSheet(true),reopen:()=>sheet({...L.o,push:false})});
    SH.layers=L?[L]:[];if(L){L.o=o;o.url=L.url}
  }else if(o.push||moved){
    SH.stack.push(SH.cur);
    const L=Nav.push({url:o.url,slug:o.slug,tag:"sheet",close:()=>back(true),reopen:()=>sheet({...L.o,push:true})});
    if(L){L.o=o;o.url=L.url;SH.layers.push(L)}
  }else{
    /* เปลี่ยนเนื้อหาในขั้นเดิม (โหลดเสร็จ / อัปเดต) — ถ้าโค้ดตัดขั้นที่ซ้อนไว้ออก (SH.stack สั้นลง) ถอยประวัติตามให้เท่ากัน */
    const want=SH.stack.length+1;
    if(SH.layers.length>want){const x=SH.layers.splice(want);Nav.drop(x[0])}
    const L=SH.layers[SH.layers.length-1];if(L)L.o=o;
    if(o.url===undefined&&SH.cur)o.url=SH.cur.url;
  }
  paintSheet(o);
}
/* เริ่มชุดขั้นตอนใหม่ในแผ่นเดิม (เช่น ส่งขอราคาแล้วไปหน้าใบงาน) — ขั้นก่อนหน้าไม่ต้องย้อนกลับไปอีก */
function sheetFresh(){const l=SH.layers[0];SH.layers=[];SH.stack=[];if(l)Nav.drop(l)}
/* ปุ่มย้อนในแผ่น / ปุ่มย้อนของเครื่อง (fromNav) — ถอยไปขั้นก่อนหน้า ขั้นแรกแล้วปิดแผ่น */
function back(fromNav){
  const prev=SH.stack.pop();
  if(!prev)return closeSheet(fromNav);
  const L=SH.layers.length>1?SH.layers.pop():null;
  if(prev.redo){SH.restore=prev;try{prev.redo()}finally{if(SH.restore){SH.restore=null;paintSheet(prev)}}}else paintSheet(prev);
  if(fromNav!==true&&L)Nav.drop(L);
}
function closeSheet(fromNav){
  const bs=$("bs");if(!bs.classList.contains("on"))return;
  bs.classList.remove("on","store");bs.setAttribute("aria-hidden","true");document.body.style.overflow="";
  SH.stack=[];stopJob();
  const l=SH.layers[0];SH.layers=[];SH.cur=null;
  const cb=SH.onClose;SH.onClose=null;if(cb)cb();
  if(fromNav!==true&&l)Nav.drop(l);
}

function oneWorld(m){

function setView(v,noHist){
  VIEW=v;
  $("vMenu").hidden=v!=="menu";$("vMap").hidden=v!=="map";
  /* หน้าแผนที่ใช้แถบบนแบบลอยแถวเดียว (ย้อน · สลับ · งาน · บัญชี)
     ต้องเลื่อนหน้ากลับบนสุดก่อน ไม่งั้นแถบบนที่ติดหนึบจะค้างตำแหน่งเดิมของเมนูแล้วซ้อนกัน */
  document.body.classList.toggle("onmap",v==="map");
  window.scrollTo(0,0);
  if(v==="map"){
    document.documentElement.style.setProperty("--mtop",$("top").offsetHeight+"px");
    if(!MAP)initMap();else{MAP.invalidateSize();drawPins(true)}
    renderCarousel();

function km(a,b){
  if(!a||!b||b.lat==null)return null;
  const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return Math.round(R*2*Math.asin(Math.sqrt(h))*10)/10;
}
function catsOf(text){const q=String(text||"").toLowerCase();return WORDS.filter(([re])=>re.test(q)).map(([,c])=>c)}
function shown(opt){

  if(o.cat==="mobile")l=l.filter(t=>t.mobile);
  else if(o.cat==="urgent")l=l.filter(t=>t.urgent);
  else if(o.cat&&o.cat!=="all")l=l.filter(t=>(t.cats||[]).includes(o.cat));
  const q=String(o.q||"").trim().toLowerCase();
  if(q){
    const hit=catsOf(q);
    l=l.filter(t=>[t.name,t.shop,t.area,t.about,...(t.skills||[])].join(" ").toLowerCase().includes(q)||(t.cats||[]).some(c=>hit.includes(c)));
  }
  /* ช่างทดสอบขึ้นก่อนสำหรับทีมงาน จะได้เจอทันทีตอนทดสอบ แล้วเรียงตามระยะ แล้วคะแนน */

const URGENT_RE=/ด่วน|กลางทาง|สตาร์ทไม่ติด|ยางแบน|แบตหมด|ควัน|ไฟไหม้|เบรกไม่อยู่|ข้างทาง/;

    const why=[];let sc=0;

    if(t.reviewCount){sc+=t.rating*7+Math.min(10,Math.log2(1+t.reviewCount)*2);if(t.rating>=4.5)why.push(T(`รีวิว ★${Number(t.rating).toFixed(1)} จาก ${t.reviewCount} คน`,`★${Number(t.rating).toFixed(1)} from ${t.reviewCount} reviews`))}
    if(t.dist!=null){sc-=Math.min(30,t.dist*1.2);if(t.dist<=5)why.push(`ใกล้คุณ ${distTxt(t.dist)}`)}
    if(t.verified){sc+=5;why.push("ยืนยันตัวตนแล้ว")}
    if(urgent&&t.mobile){sc+=18;why.push("ออกไปซ่อมถึงที่ได้")}
