@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ═════════ LUX — Cendon gallery neutrals · Cendon Orange เป็นลายเซ็น 10% เท่านั้น ═════════
   ส้มใช้กับ: ปุ่มหลักปุ่มเดียว (.lx-cta) · เส้นสถานะ 2px · ขอบช่องที่โฟกัส · จุดสถานะเล็กๆ · hover บางๆ
   ห้ามใช้เป็นพื้นใหญ่/การ์ดใหญ่/หัวข้อตะโกน */
html[data-theme="dark"]{--bg:#09090B;--surface:#111113;--surface-2:#18181B;--ink:#FAFAFA;--muted:#A1A1AA;--faint:#52525B;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.05);--co:#F07A36;--co-soft:rgba(240,122,54,.12);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 48px -32px rgba(0,0,0,.9);--shadow-sm:0 1px 0 rgba(255,255,255,.03) inset}
html[data-theme="light"]{--bg:#FAFAF9;--surface:#FFFFFF;--surface-2:#F4F4F5;--ink:#09090B;--muted:#71717A;--faint:#A1A1AA;
  --line:rgba(9,9,11,.08);--line-2:rgba(9,9,11,.05);--co:#E9682A;--co-soft:rgba(233,104,42,.10);
  --shadow:0 1px 2px rgba(9,9,11,.04),0 24px 48px -36px rgba(9,9,11,.25);--shadow-sm:0 1px 2px rgba(9,9,11,.05)}
body{background:var(--bg);letter-spacing:-.005em}
.wf,.ring,.deco{display:none!important}
/* ปุ่ม */
.lx-cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:0;border-radius:12px;cursor:pointer;white-space:nowrap;
  font:600 14.5px/1 var(--kb);color:#fff;background:var(--co);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 20px -10px var(--co);transition:filter .2s,transform .15s}
.lx-cta:hover{filter:brightness(1.08)}.lx-cta:active{transform:scale(.98)}
.lx-gh{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;cursor:pointer;text-decoration:none;
  font:600 14px/1 var(--kb);color:var(--ink);background:transparent;border:1px solid var(--line);transition:border-color .2s,color .2s}
.lx-gh:hover{border-color:var(--co);color:var(--co)}.lx-gh.w{width:100%}.lx-gh.lx-ic{width:44px;padding:0}
.btn.p{background:var(--ink)!important;color:var(--bg)!important;box-shadow:none!important}
.inp:focus,input:focus,textarea:focus,select:focus{outline:none;border-color:var(--co)!important;box-shadow:0 0 0 3px var(--co-soft)!important}
/* แถบบน */
.top{background:color-mix(in srgb,var(--bg) 82%,transparent)!important;backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line-2)}
.top .ic{background:transparent!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink)}
.search{background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.search:focus-within{border-color:var(--co)!important}
.search .ai{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.search .clogo{color:var(--co)}
.dot,.bdg{background:var(--co)!important}
/* HERO */
@media(min-width:1024px){.menu>.lx-hero{grid-row:1}.menu>.left{grid-row:2}.menu>.right{grid-row:2/span 9!important;top:78px}}
.lx-hero{grid-column:1/-1;padding:clamp(28px,7vw,72px) 0 clamp(18px,3vw,28px);text-align:center}
.lx-k{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;font:600 12px/1 var(--kd);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lx-dot{width:6px;height:6px;border-radius:50%;background:var(--co);box-shadow:0 0 0 4px var(--co-soft)}
.lx-h{margin:0 0 26px;font:700 clamp(34px,6.4vw,64px)/1.08 var(--kd);letter-spacing:-.035em;color:var(--ink)}
.lx-h span{color:var(--muted)}
.lx-s{position:relative;display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding:7px 7px 7px 18px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .25s,box-shadow .25s}
.lx-s:focus-within{border-color:var(--co);box-shadow:0 0 0 4px var(--co-soft),var(--shadow)}
.lx-s>.ti{font-size:20px;color:var(--muted)}
.lx-s input{flex:1;min-width:0;height:44px;border:0!important;background:none;color:var(--ink);font:500 15.5px var(--kb);box-shadow:none!important}
.lx-s input::placeholder{color:var(--faint)}
.lx-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.lx-tags button{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 13px var(--kb);cursor:pointer;transition:color .2s,border-color .2s}
.lx-tags button:hover{color:var(--ink);border-color:var(--co)}
@media(max-width:560px){.lx-s{padding-left:14px}.lx-s .lx-cta{padding:0 14px}.lx-h br{display:none}}
/* หมวดงาน: ไอคอนเส้นบนพื้นกลาง · เลือกแล้ว = เส้นส้ม 2px ใต้ */
.qa .sq{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important;transform:none!important}
.qa .sq::before,.qa .sq::after{display:none!important}
.qa span:last-child{color:var(--muted)}
.qa:hover .sq{border-color:var(--co)!important}.qa:hover .sq .ti{color:var(--co)}
.qa.on .sq{border-color:var(--co)!important}.qa.on .sq .ti{color:var(--co)}
.qa.on span:last-child{color:var(--ink);box-shadow:inset 0 -2px 0 var(--co)}
/* การ์ดฟีเจอร์ + แผนที่ + การ์ดช่าง: ผิวกลาง ไม่มีไล่สี */
.feat{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.feat small,.feat p{color:var(--muted)!important}
.feat .fi{background:var(--surface-2)!important;color:var(--ink)!important;box-shadow:none!important}
.feat:hover{border-color:color-mix(in srgb,var(--co) 60%,var(--line))!important}
.feat .pulse{width:7px!important;height:7px!important;background:var(--co)!important;box-shadow:0 0 0 4px var(--co-soft)!important;animation:none!important}
.mapw,.card,.join,.cta,.dhead,.st,.spark{background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink)}
.mapw .sq,.join .sq,.dhead .sq{background:var(--surface-2)!important;color:var(--ink)!important;box-shadow:none!important}
.card:hover{border-color:color-mix(in srgb,var(--co) 55%,var(--line))!important}
.card .price b,.card .st i{color:var(--ink)}
.mine-tag{color:var(--co)!important;background:var(--co-soft)!important}
.modes,.e3::after{display:none}
/* ═══ หน้าช่องช่าง (แบบ YouTube channel) ═══ */
@media(min-width:640px){.bs.store .pn{left:0;width:auto;border-radius:0;transform:translateY(24px);opacity:0;transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .35s}.bs.store.on .pn{transform:none;opacity:1}}
.bs.store .pn{background:var(--bg)}
.bs.store .bd{max-width:1120px;margin:0 auto;width:100%}
.ch{margin:0 -16px}
.ch-cover{position:relative;height:clamp(150px,24vw,260px);margin:0 16px;border-radius:0 0 18px 18px;background:var(--surface-2) center/cover;cursor:zoom-in}
@media(min-width:640px){.ch-cover{border-radius:18px;margin:8px 16px 0}}
.ch-cover.none{cursor:default;background:radial-gradient(120% 140% at 85% 0%,var(--co-soft),transparent 60%),linear-gradient(180deg,var(--surface-2),var(--surface))}
.ch-cover.none::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--co),transparent);opacity:.5}
.ch-pv{position:absolute;left:14px;top:14px;display:inline-flex;gap:6px;align-items:center;padding:6px 11px;border-radius:999px;font:600 12px var(--kb);color:#fff;background:rgba(9,9,11,.55);backdrop-filter:blur(10px)}
.ch-id{display:flex;gap:22px;align-items:flex-start;padding:22px 16px 6px}
.ch-av{position:relative;flex:none;width:clamp(84px,13vw,128px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 clamp(30px,5vw,46px)/1 var(--kd);
  color:var(--ink);background:var(--surface-2) center/cover;border:1px solid var(--line)}
.ch-on{position:absolute;right:6%;bottom:6%;width:14px;height:14px;border-radius:50%;background:var(--co);border:3px solid var(--bg)}
.ch-nm{min-width:0;flex:1}
.ch-nm h2{margin:0;font:700 clamp(22px,3.2vw,34px)/1.15 var(--kd);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-v{font-size:.7em;color:var(--muted)}
.ch-meta{margin:6px 0 0;font-size:13.5px;color:var(--muted)}.ch-meta b{color:var(--ink);font-weight:600}
.ch-ab{margin:10px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:640px}
.ch-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
@media(max-width:560px){.ch-id{flex-direction:column;align-items:center;text-align:center;gap:14px}.ch-nm h2{justify-content:center}.ch-act{justify-content:center}.ch-act .lx-cta{flex:1 1 100%}}
.ch-tabs{display:flex;gap:28px;padding:0 16px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ch-tabs button{position:relative;padding:14px 0;border:0;background:none;cursor:pointer;font:600 14px var(--kb);color:var(--muted);white-space:nowrap}
.ch-tabs button em{font-style:normal;margin-left:6px;color:var(--faint);font-weight:500}
.ch-tabs button.on{color:var(--ink)}
.ch-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--co)}
.ch-pane{display:none;padding:20px 16px 40px;animation:chIn .45s cubic-bezier(.32,.72,0,1)}.ch-pane.on{display:block}
@keyframes chIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ch-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.ch-chips span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink)}
.ch-chips .ti{color:var(--muted)}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ch-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;cursor:zoom-in;background:var(--surface-2);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.ch-grid img:hover{transform:scale(1.02)}
.ch-empty{padding:36px 0;text-align:center;color:var(--muted);font-size:14px}
.ch-about{margin:0 0 18px;font-size:15px;line-height:1.8;white-space:pre-wrap;max-width:720px}
.ch-info{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:720px}
.ch-info div{display:flex;gap:12px;align-items:center;padding:13px 16px;font-size:14px}
.ch-info div+div{border-top:1px solid var(--line)}
.ch-info .ti{font-size:18px;color:var(--muted)}
.ch-fine{margin:14px 0 0;font-size:12.5px;color:var(--faint)}
.ch-prev{padding:0 16px 8px;border:1px solid var(--line);border-radius:20px;background:var(--bg)!important;overflow:hidden}
.ch-prev .ch-cover{margin:0 -0px;border-radius:0}
/* ฟอร์มแก้ไข: รูปโปรไฟล์ + สวิตช์โทร */
.ed-av{display:flex;gap:16px;align-items:center;margin-bottom:8px}.ed-av .ch-av{width:76px;font-size:28px}
.ed-av small{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.lx-sw{position:relative;display:flex;flex-direction:column;justify-content:space-between}
.lx-sw input{position:absolute;opacity:0;width:46px;height:28px;bottom:6px;left:0;margin:0;cursor:pointer;z-index:1}
.lx-sw i{display:block;width:46px;height:28px;margin-top:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .2s}
.lx-sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .25s cubic-bezier(.32,.72,0,1),background .2s}
.lx-sw input:checked+i{background:var(--co);border-color:var(--co)}.lx-sw input:checked+i::after{transform:translateX(18px);background:#fff}

/* ═══ โครงหน้าหลักใหม่ (Navbar · หัวข้อ · ค้นหา · หมวด · ช่างแนะนำ) ═══ */
#vMenu>.left,#vMenu>.right{display:none!important}
#vMenu:not([hidden]){display:block!important;max-width:1180px}
/* Navbar: แคปซูลลอยกลางจอ */
.top{background:transparent!important;border:0!important;backdrop-filter:none!important;padding-top:calc(12px + env(safe-area-inset-top))!important}
.top .bar{max-width:880px;margin:0 auto;padding:6px 6px 6px 8px!important;border-radius:999px;gap:6px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:var(--shadow)}
.top .bar .ic{width:40px;height:40px;border-radius:50%!important;border:0!important}
.top .bar .ic:hover{background:var(--surface-2)!important}
#sbox{display:none!important}
.lx-brand{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);font:600 16px/1 var(--kd);letter-spacing:-.01em}
.lx-brand b{font-weight:700;color:var(--muted)}
#bMe{background:var(--ink)!important;color:var(--bg)!important}
/* แถวหมวด: ไอคอนนูนมีสี + ชื่อ · เส้นส้ม 2px ใต้ตัวที่ชี้อยู่ */
.lx-rail{display:flex;gap:6px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:8px 4px 4px;margin:6px auto 0;max-width:1060px;
  -webkit-mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.lx-rail::-webkit-scrollbar{display:none}
.lx-rail{justify-content:flex-start!important}
.lx-rail button{position:relative;flex:none;width:104px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 4px 14px;border:0;background:none;cursor:pointer;color:var(--muted)}
.lx-rail button::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:2px;border-radius:2px;background:var(--co);transform:scaleX(0);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.lx-rail button:hover::after{transform:scaleX(1)}
.lx-rail button:hover{color:var(--ink)}
.lx-rt{font:500 13px/1.3 var(--kb);text-align:center}
/* ไอคอนนูน 3D แบบ CSS (ก่อนมีรูปจริง): ก้อนมนไล่สีของหมวด มีแสงด้านบน เงานุ่มด้านล่าง ลอยขึ้นเมื่อชี้ */
.lx-ri{position:relative;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--b) 88%,#fff) 0%,var(--a) 55%,color-mix(in srgb,var(--a) 70%,#000) 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.18),0 10px 18px -8px color-mix(in srgb,var(--a) 70%,transparent),0 2px 3px rgba(0,0,0,.12);
  transition:transform .4s cubic-bezier(.32,.72,0,1)}
.lx-ri::before{content:"";position:absolute;left:12%;right:12%;top:6%;height:38%;border-radius:12px 12px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.lx-ri .ti{position:relative;font-size:27px;color:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.lx-ri img{position:absolute;inset:-14%;width:128%;height:128%;object-fit:contain;z-index:2}
.lx-ri:has(img){background:none;box-shadow:none}.lx-ri:has(img)::before,.lx-ri:has(img) .ti{display:none}
.lx-rail button:hover .lx-ri{transform:translateY(-4px) rotate(-3deg)}

.lx-link{border:0;background:none;color:var(--muted);font:600 13.5px var(--kb);cursor:pointer;display:inline-flex;gap:6px;align-items:center}

.lx-pcv{position:relative;display:block;aspect-ratio:16/9;background:radial-gradient(120% 120% at 85% 0%,var(--co-soft),transparent 60%),var(--surface-2) center/cover}

}

.lx-hero{padding-top:clamp(20px,5vw,56px)!important}
.lx-h{margin-bottom:10px!important}
.lx-sub{margin:0 auto 22px;max-width:560px;font-size:15px;line-height:1.6;color:var(--muted)}

const NT=".msg,.about,.nm,.nt";
function trNode(root){
  if(TH||!root)return;
  if(root.nodeType===3){if(root.parentElement&&root.parentElement.closest(NT))return;const v=tr(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.parentElement&&n.parentElement.closest(NT))continue;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
  [root,...root.querySelectorAll("[placeholder],[title],[aria-label],[alt]")].forEach(e=>["placeholder","title","aria-label","alt"].forEach(a=>{const v=e.getAttribute&&e.getAttribute(a);if(v&&/[\u0E00-\u0E7F]/.test(v))e.setAttribute(a,tr(v))}));
}

async function busy(btn,fn){
  if(btn&&btn.disabled)return;
  const html=btn&&btn.innerHTML;
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'}
  try{return await fn()}
  catch(e){const er=$("err");if(er&&$("bs").classList.contains("on")){er.textContent=e.message;er.style.animation="none";er.offsetWidth;er.style.animation=""}else toast(e.message,"ti-alert-triangle")}
  finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=html}}
}

/* history.back() ที่เราเรียกเองจะยิง popstate กลับมา — ต้องข้ามครั้งนั้น ไม่งั้นปิดแชตแล้วแผ่นใบงานข้างใต้ปิดตามไปด้วย */
let skipPop=0;
function goBack(){skipPop++;history.back()}
function sheet(o){
  /* o: {title, body, foot, full, back, mount} */
  const bs=$("bs");
  const was=bs.classList.contains("on");
  if(o.push&&was)SH.stack.push(SH.cur);
  SH.cur=o;
  $("bsT").textContent=o.title||"";
  $("bsB").innerHTML=(o.body||"")+'<p class="err" id="err" role="alert"></p>';
  $("bsF").innerHTML=o.foot||"";
  $("bsBack").hidden=!SH.stack.length;
  bs.classList.toggle("full",!!o.full);bs.classList.toggle("store",!!o.store);
  $("bsB").scrollTop=0;
  if(!was){bs.classList.add("on");bs.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";try{history.pushState({sheet:1},"")}catch(e){}}
  if(o.mount)o.mount($("bsB"),$("bsF"));
}
function back(){const prev=SH.stack.pop();if(prev){prev.push=false;sheet(prev)}else closeSheet()}
function closeSheet(fromPop){
  const bs=$("bs");if(!bs.classList.contains("on"))return;
  bs.classList.remove("on","store");bs.setAttribute("aria-hidden","true");document.body.style.overflow="";
  SH.stack=[];stopJob();
  const cb=SH.onClose;SH.onClose=null;if(cb)cb();
  if(!fromPop&&history.state&&history.state.sheet)goBack();
}
$("bsX").onclick=()=>closeSheet();$("bsBg").onclick=()=>closeSheet();$("bsBack").onclick=back;
addEventListener("popstate",()=>{if(skipPop){skipPop--;return}if($("chat").classList.contains("on")){closeChat(true);return}closeSheet(true)});
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("chat").classList.contains("on"))closeChat();else closeSheet()}});
function zoom(src){const z=document.createElement("div");z.className="zoom";z.innerHTML=`<img src="${esc(src)}" alt=""/>`;z.onclick=()=>z.remove();document.body.appendChild(z)}

/* ═══ สลับ เมนู / แผนที่ ═══
   แผนที่สร้างตอนเปิดครั้งแรกเท่านั้น — สร้างตอนซ่อนอยู่ Leaflet วัดขนาดเป็นศูนย์
   แล้วซูมออกไปทั้งทวีป (อาการที่เห็นในภาพหน้าจอ) */
let VIEW="menu";
/* แผนที่ทุกอันในหน้านี้: เหลือโลกเดียว (ของเดิมซูมออกแล้วเห็นโลกซ้ำหลายอัน) */
function oneWorld(m){
  try{const B=window.L.latLngBounds([[-85,-180],[85,180]]);
    m.setMaxBounds(B);m.options.maxBoundsViscosity=1;
    const fit=()=>{const z=m.getBoundsZoom(B,true);m.setMinZoom(Math.max(2,Math.ceil(z)))};
    fit();m.on("resize",fit);}catch(e){}
  return m;
}
function setView(v,noHist){
  VIEW=v;
  $("vMenu").hidden=v!=="menu";$("vMap").hidden=v!=="map";
  /* หน้าแผนที่ใช้แถบบนแบบลอยแถวเดียว (ย้อน · สลับ · งาน · บัญชี)
     ต้องเลื่อนหน้ากลับบนสุดก่อน ไม่งั้นแถบบนที่ติดหนึบจะค้างตำแหน่งเดิมของเมนูแล้วซ้อนกัน */
  document.body.classList.toggle("onmap",v==="map");
  window.scrollTo(0,0);
  if(v==="map"){
    document.documentElement.style.setProperty("--mtop",$("top").offsetHeight+"px");
    if(!MAP)initMap();else{MAP.invalidateSize();drawPins(true)}
    renderCarousel();
  }
  if(!noHist)try{const u=new URL(location.href);if(v==="map")u.searchParams.set("view","map");else u.searchParams.delete("view");history.replaceState(history.state,"",u)}catch(e){}
}

/* แผนที่ย่อในเมนู — ดูอย่างเดียว แตะแล้วเปิดแผนที่เต็มจอ (Leaflet ไม่รับการลากในกล่องนี้) */
let MINI=null,MINIL=null;

  if(!window.L)return;
  if(!MINI){$("miniMap").innerHTML="";MINI=oneWorld(L.map("miniMap",{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false,tap:false}));
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,noWrap:true,bounds:[[-85,-180],[85,180]]}).addTo(MINI);MINIL=L.layerGroup().addTo(MINI)}
  MINIL.clearLayers();const pts=[];
  shown().slice(0,40).forEach(t=>{if(t.lat==null)return;pts.push([t.lat,t.lng]);L.circleMarker([t.lat,t.lng],{radius:6,color:"#fff",weight:2,fillColor:colorOf(t),fillOpacity:1}).addTo(MINIL)});

let MAP=null,LAYER=null,MELAYER=null,PINS={};
function initMap(){
  if(MAP)return;
  if(!window.L){$("map").innerHTML='<div class="map-off"><i class="ti ti-map-off"></i></div>';return}
  $("map").innerHTML="";

  setTimeout(()=>{MAP.invalidateSize();drawPins(true)},60);drawMe();

function drawMe(){
  if(!MAP||!HERE)return;

function drawPins(fit){
  if(!MAP||!LAYER)return;
  LAYER.clearLayers();PINS={};
  const pts=[];
  shown().forEach((t,i)=>{
    if(t.lat==null||t.lng==null)return;
    const m=L.marker([t.lat,t.lng],{icon:L.divIcon({className:"",iconSize:[38,38],iconAnchor:[19,38],
      html:`<div class="pin ${t.test?"test":""}" data-pin="${esc(t.id)}" style="background:${colorOf(t)};animation-delay:${Math.min(i*40,400)}ms"><b>${initial(t.shop||t.name)}</b></div>`})});
    /* แตะหมุด = เลื่อนการ์ดของร้านนั้นขึ้นมา (แบบ Grab) แตะการ์ดอีกทีถึงเปิดโปรไฟล์ */
    m.on("click",()=>focusCard(t.id));m.addTo(LAYER);pts.push([t.lat,t.lng]);PINS[t.id]=m;
  });
  if(HERE)pts.push([HERE.lat,HERE.lng]);
  /* ซูมให้พอดีกับร้านที่ใกล้ที่สุดไม่กี่ร้าน ไม่ใช่ทุกร้านทั้งประเทศ — ร้านเดียวที่อยู่ต่างจังหวัดจะดึงแผนที่ออกจนมองไม่เห็นอะไร */
  if(fit){let fp=pts;
    if(!HERE&&pts.length>2){const md=i=>pts.map(p=>p[i]).sort((a,b)=>a-b)[pts.length>>1],c={lat:md(0),lng:md(1)};fp=pts.filter(p=>km(c,{lat:p[0],lng:p[1]})<=80)}
    if(HERE){const me=[HERE.lat,HERE.lng];fp=pts.slice(0,-1).sort((a,b)=>km(HERE,{lat:a[0],lng:a[1]})-km(HERE,{lat:b[0],lng:b[1]})).slice(0,8).concat([me])}

/* ═══ รายชื่อช่าง ═══ */
function km(a,b){
  if(!a||!b||b.lat==null)return null;
  const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return Math.round(R*2*Math.asin(Math.sqrt(h))*10)/10;
}
function catsOf(text){const q=String(text||"").toLowerCase();return WORDS.filter(([re])=>re.test(q)).map(([,c])=>c)}
function shown(opt){
  const o=opt||F;
  let l=TECHS.map(t=>({...t,dist:km(HERE,t)}));
  if(o.cat==="mobile")l=l.filter(t=>t.mobile);
  else if(o.cat==="urgent")l=l.filter(t=>t.urgent);
  else if(o.cat&&o.cat!=="all")l=l.filter(t=>(t.cats||[]).includes(o.cat));
  const q=String(o.q||"").trim().toLowerCase();
  if(q){
    const hit=catsOf(q);
    l=l.filter(t=>[t.name,t.shop,t.area,t.about,...(t.skills||[])].join(" ").toLowerCase().includes(q)||(t.cats||[]).some(c=>hit.includes(c)));
  }
  /* ช่างทดสอบขึ้นก่อนสำหรับทีมงาน จะได้เจอทันทีตอนทดสอบ แล้วเรียงตามระยะ แล้วคะแนน */
  return l.sort((a,b)=>(b.test-a.test)||((a.dist??1e9)-(b.dist??1e9))||(b.rating-a.rating));
}

/* ═══ Cendon เลือกช่างให้ ═══
   ให้คะแนนทุกร้านจาก: ตรงหมวดงาน · เปิดรับงานอยู่ · คะแนนรีวิว+จำนวนรีวิว · ระยะทาง · ยืนยันตัวตน · มาถึงที่ (ถ้าอาการดูด่วน)
   แล้วยกร้านที่ดีที่สุดขึ้นจอพร้อมเหตุผลที่เลือก ไม่ต้องไล่ดูเอง */
const URGENT_RE=/ด่วน|กลางทาง|สตาร์ทไม่ติด|ยางแบน|แบตหมด|ควัน|ไฟไหม้|เบรกไม่อยู่|ข้างทาง/;
function pickTechs(cat,q){
  const urgent=URGENT_RE.test(q||"");
  return TECHS.map(t=>({...t,dist:km(HERE,t)})).map(t=>{
    const why=[];let sc=0;
    if(cat&&(t.cats||[]).includes(cat)){sc+=40;why.push(`ถนัดงาน${CAT[cat].th}`)}else if(cat)sc-=30;
    if(t.online){sc+=14;why.push("เปิดรับงานอยู่ตอนนี้")}
    if(t.reviewCount){sc+=t.rating*7+Math.min(10,Math.log2(1+t.reviewCount)*2);if(t.rating>=4.5)why.push(`รีวิว ★${Number(t.rating).toFixed(1)} จาก ${t.reviewCount} คน`)}
    if(t.dist!=null){sc-=Math.min(30,t.dist*1.2);if(t.dist<=5)why.push(`ใกล้คุณ ${distTxt(t.dist)}`)}
    if(t.verified){sc+=5;why.push("ยืนยันตัวตนแล้ว")}
    if(urgent&&t.mobile){sc+=18;why.push("ออกไปซ่อมถึงที่ได้")}
    if(urgent&&t.urgent){sc+=10;why.push("รับงานด่วน")}
    if(t.jobs>=20){sc+=4;why.push(`ซ่อมสำเร็จแล้ว ${t.jobs} งาน`)}
    return {t,sc,why};
  }).filter(x=>!cat||(x.t.cats||[]).includes(cat)||x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3);
}

(function(){

  const tx=document.getElementById("ccTx"),mt=document.getElementById("ccMt"),svg=document.getElementById("ccW");if(!tx)return;
  let i=0,an=null;
  const set=([w,f])=>{[tx,mt].forEach(e=>{e.textContent=w;e.style.fontFamily=`"${f}","Mali","Kanit",sans-serif`});
    let bb;try{bb=tx.getBBox()}catch(e){bb={x:0,width:120}}

        $("bPh").querySelectorAll(".rm").forEach(b=>b.onclick=()=>{L.photos.splice(+b.dataset.i,1);drawPh()});if($("bAddPh"))$("bAddPh").onclick=()=>{$("bFile").value="";$("bFile").click()}};
      drawPh();
      $("bFile").onchange=async()=>{const f=$("bFile").files[0];if(!f)return;try{L.photos.push(await shrink(f,1100));drawPh()}catch(e){$("err").textContent=e.message}};
      /* ── หมุด: GPS → ล็อกทันที ── ล็อกแล้วแผนที่ลากไม่ได้ กันหมุดเลื่อนเพราะนิ้วโดนตอนเลื่อนหน้า */
      const show=async()=>{
        const p=L.pos;if(!p)return;
        $("bLockI").innerHTML=`<i class="ti ${L.locked?"ti-lock":"ti-lock-open"}"></i>`;$("bLockI").style.setProperty("--c1",L.locked?"#16a34a":"#f59e0b");
        $("bMap").classList.toggle("locked",L.locked);
        $("bLockB").hidden=false;$("bLockB").textContent=L.locked?T("ย้ายหมุด","Move pin"):T("ล็อกตรงนี้","Lock here");
        $("bLocS").textContent=(L.locked?T("ล็อกตำแหน่งจริงแล้ว · ","Exact location locked · "):T("เลื่อนแผนที่ให้หมุดตรงรถ · ","Drag the map under the pin · "))+p.lat.toFixed(5)+", "+p.lng.toFixed(5);
        if(!L.line){$("bLocL").textContent=T("ตำแหน่งที่ปักไว้","Pinned location")}
        const g=await revgeo(p);if(L.pos!==p)return;L.line=g.line;L.area=g.area;
        $("bLocL").textContent=g.line||g.area||T("ตำแหน่งที่ปักไว้","Pinned location");
      };
      const lock=on=>{L.locked=on;const m=L.map;if(m){["dragging","touchZoom","doubleClickZoom","scrollWheelZoom"].forEach(h=>m[h]&&(on?m[h].disable():m[h].enable()))}show()};
      const setPos=(p,lk)=>{L.pos={lat:+p.lat.toFixed(6),lng:+p.lng.toFixed(6)};L.line="";if(L.map)L.map.setView([p.lat,p.lng],17);lock(!!lk)};
      if(window.L){
        const c=HERE||{lat:13.7563,lng:100.5018};
        L.map=oneWorld(window.L.map($("bMap").querySelector(".lm"),{zoomControl:false,attributionControl:false})).setView([c.lat,c.lng],HERE?16:11);
        window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,noWrap:true,bounds:[[-85,-180],[85,180]]}).addTo(L.map);
        L.map.on("moveend",()=>{if(L.locked)return;const q=L.map.getCenter();L.pos={lat:+q.lat.toFixed(6),lng:+q.lng.toFixed(6)};L.line="";show()});
        setTimeout(()=>L.map.invalidateSize(),420);
      }else $("bMap").querySelector(".lm").innerHTML=`<div class="noleaf">${T("กดใช้ตำแหน่งปัจจุบัน","Tap “Use my location”")}</div>`;
      $("bLockB").onclick=()=>lock(!L.locked);
      const gps=async()=>{const p=await locate();if(p)setPos(p,true);else if(!L.pos){$("bLocL").textContent=T("ไม่ได้ตำแหน่ง — เลื่อนแผนที่แล้วกดล็อก","No GPS — drag the map and lock");if(L.map){const q=L.map.getCenter();L.pos={lat:q.lat,lng:q.lng};lock(false)}}};
      $("bGps").onclick=e=>busy(e.currentTarget,gps);
      gps();
    },
    read(){
      const car=G.length&&!$("bCarPick").hidden&&segVal("bCar")==="__"||(!G.length)?$("bCarX").value.trim():(c=>lab(c)+(c.mileage?" · "+money(c.mileage)+" กม.":""))(G[ci]);
      if(!L.pos)throw new Error(T("ปักหมุดตำแหน่งรถก่อน","Pin your car's location first"));
      if(!L.locked)throw new Error(T("กด “ล็อกตรงนี้” เพื่อยืนยันตำแหน่ง","Tap “Lock here” to confirm the location"));
      const when=o.urgent?"ด่วน — ตอนนี้ ("+new Date().toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"})+(TH?" น.)":")"):segVal("bWhen")==="__"?$("bWhenX").value.trim():segVal("bWhen");
      const p=L.pos,coord=p.lat.toFixed(5)+", "+p.lng.toFixed(5);
      const area=(L.area||(T("พิกัด ","Coords ")+coord)).slice(0,160);
      const address=[L.line,"แผนที่ https://maps.google.com/?q="+p.lat+","+p.lng].filter(Boolean).join(" · ");
      const v={car,symptom:$("bSym")?$("bSym").value.trim():"",mode:o.urgent?"mobile":segVal("bMode"),requestedTime:when,
        area,address,lat:p.lat,lng:p.lng,note:$("bNote").value.trim(),photos:L.photos.slice(),phone:$("bPhone").value.replace(/[\s-]/g,"")};
      ls.set("spire_tech_contact",{phone:v.phone});
      return v;
    }};
  return api2;
}

async function sendGroup(list,v){
  const G=crypto.randomUUID();let ok=0,err="";
  for(const t of list){
    try{await api("/api/tech/jobs",{body:{...v,id:crypto.randomUUID(),techId:t.id,group:G,mode:v.mode==="mobile"&&t.mobile?"mobile":"shop"}});ok++}
    catch(e){err=e.message;if(!ok&&/อาการ|รถ|พื้นที่|ที่อยู่|เบอร์|เวลา/.test(err))throw e}

/* งานที่ซ่อมเสร็จ บันทึกลงประวัติรถคันนั้นในโรงรถด้วย — ดูย้อนหลังได้ว่าซ่อมอะไร ที่ไหน เท่าไร */
function syncGarage(){
  let g;try{g=JSON.parse(localStorage.getItem("spire_garage")||"[]")}catch(e){return}
  if(!Array.isArray(g)||!g.length)return;
  let changed=false;
  JOBS.filter(j=>j.status==="completed"&&j.side!=="technician").forEach(j=>{
    const car=g.find(c=>{const lab=[c.name,c.year].filter(Boolean).join(" ");return lab===j.car||(c.name&&j.car.startsWith(c.name))});
    if(!car)return;car.history=car.history||[];
    if(car.history.some(h=>h.job===j.id))return;
    car.history.unshift({t:j.updatedAt||Date.now(),q:"ซ่อม: "+j.symptom,a:j.techName+(j.total?" · ฿"+money(j.total):""),kind:"repair",job:j.id});
    changed=true;
  });
  if(changed)try{localStorage.setItem("spire_garage",JSON.stringify(g))}catch(e){}
}
async function refreshJobs(){

}

const FLOW=[["requested","ขอราคา","ti-send"],["quoted","ได้ราคา","ti-receipt"],["accepted","นัดแล้ว","ti-calendar-check"],["working","ซ่อม","ti-tool"],["completed","เสร็จ","ti-circle-check"]];
const RANK={requested:0,quoted:1,accepted:2,enroute:2,working:3,done:3,completed:4,disputed:3,cancelled:-1};
let JOB=null,jobTimer=0;

async function openJob(id,push){

function drawJob(j,push){

  const other=cust&&!tech?j.techName:tech&&!cust?"ลูกค้า":j.techName;
  const unread=(j.messages||[]).length;
  /* ปุ่มหลักตามสถานะ — ในแต่ละขั้นมีสิ่งที่ต้องทำอย่างเดียว คนจะได้ไม่ต้องคิด */

  if(tech&&["requested","quoted"].includes(s))A.push(["quote",s==="quoted"?"แก้ราคา":"เสนอราคา","p"]);
  if(cust&&s==="quoted")A.push(["accept","ยืนยันราคา ฿"+money(q.total),"p"]);

  if(tech&&["accepted","enroute"].includes(s))A.push(["start","เริ่มซ่อม",j.mode==="mobile"&&s==="accepted"?"s":"p"]);
  if(tech&&s==="working")A.push(["done","ซ่อมเสร็จแล้ว","p"]);
  if(cust&&s==="done")A.push(["complete","ตรวจแล้ว งานเรียบร้อย","p"]);
  if(cust&&s==="completed"&&!j.review)A.push(["review","ให้คะแนน","p"]);
  if(ME&&ME.staff&&s==="disputed")A.push(["resolve","ปิดเรื่อง","p"]);
  const more=[];
  if((cust||tech)&&["requested","quoted","accepted","enroute"].includes(s))more.push(["cancel","ยกเลิกงาน"]);
  if((cust||tech)&&["accepted","enroute","working","done","completed"].includes(s))more.push(["dispute","แจ้งปัญหา"]);

      ${phone&&/^0\d{8,9}$/.test(phone)?`<a class="ic" href="tel:${esc(phone)}" aria-label="โทร"><i class="ti ti-phone"></i></a>`:""}
      <button class="ic" id="jChat" aria-label="แชต"><i class="ti ti-message-circle"></i>${unread?`<span class="dot">${unread}</span>`:""}</button></div>
    ${q?`<div class="quote"><span class="pill act">ราคา</span><div class="tot">฿${money(q.total)}</div><div class="ln"><span>ค่าแรง ${money(q.labor)}</span><span>อะไหล่ ${money(q.parts)}</span><span>เดินทาง ${money(q.travel)}</span></div><p>${esc(q.scope)}</p><p class="note" style="margin:8px 0 0"><i class="ti ti-calendar"></i>${esc(q.appointment)} · รับประกัน ${q.warranty} วัน</p></div>`:""}
    <div class="kv"><p><span>อาการ</span><b>${esc(j.symptom)}</b></p><p><span>ซ่อมที่</span><b>${j.mode==="mobile"?"ช่างมาหา":"ที่อู่"}</b></p><p><span>เวลา</span><b>${esc(j.requestedTime)}</b></p><p><span>พื้นที่</span><b>${esc(j.area)}</b></p>${j.address?`<p><span>ที่อยู่</span><b>${esc(j.address)}</b></p>`:""}</div>
    ${j.note?`<div class="kv"><p><span>${T("ลูกค้าบอกเพิ่ม","Customer's note")}</span><b class="nt">${esc(j.note)}</b></p></div>`:""}
    ${(j.photos||[]).length?`<div class="gal">${j.photos.map(u=>`<img src="${u}" data-z="${u}" alt=""/>`).join("")}</div>`:""}
    ${j.completion?`<div class="kv"><p><span>สรุปงาน</span><b>${esc(j.completion)}</b></p></div>`:""}
    ${j.dispute?`<div class="kv"><p><span>ปัญหา</span><b style="color:var(--danger)">${esc(j.dispute)}</b></p>${j.resolution?`<p><span>ผล</span><b>${esc(j.resolution)}</b></p>`:""}</div>`:""}
    ${j.review?`<div class="kv"><p><span>คะแนน</span><b>${"★".repeat(j.review.rating)}${"☆".repeat(5-j.review.rating)}</b></p><p><span>รีวิว</span><b>${esc(j.review.text)}</b></p></div>`:""}
    ${!j.acceptedAt&&tech&&!cust?'<p class="note"><i class="ti ti-lock"></i>เบอร์และที่อยู่ลูกค้าจะเปิดเมื่อลูกค้ายืนยันราคา</p>':""}
    ${more.length?`<div class="seg" style="margin-top:6px">${more.map(([k,l])=>`<button data-a="${k}" style="color:var(--muted)">${l}</button>`).join("")}</div>`:""}`,
    foot:A.map(([k,l,c])=>`<button class="btn ${c}" data-a="${k}">${esc(l)}</button>`).join(""),
    mount(b,f){
      $("jChat").onclick=()=>openChat(j);

      [...b.querySelectorAll("[data-a]"),...f.querySelectorAll("[data-a]")].forEach(x=>x.onclick=()=>act(j,x.dataset.a,x));
    }});
  JOB={id:j.id,rev:j.revision,msgs:(j.messages||[]).length};

  clearTimeout(jobTimer);
  const watch=()=>{jobTimer=setTimeout(async()=>{
    if(!JOB||JOB.id!==j.id||$("chat").classList.contains("on")||!(SH.cur&&SH.cur.job)){if(JOB&&JOB.id===j.id)watch();return}
    try{const d=await api(`/api/tech/jobs/${j.id}/messages?after=${1e12}`);
      if(d.revision!==JOB.rev){const nj=(await api("/api/tech/jobs/"+j.id)).job;if(JOB&&JOB.id===j.id){const st=SH.stack;drawJob(nj,false);SH.stack=st;$("bsBack").hidden=!st.length;toast("ใบงานอัปเดตแล้ว","ti-bell")}return}}catch(e){}
    watch()},document.hidden?15000:4000)};
  watch();
}

/* ═══ แชต — เต็มจอ ข้อความใหม่ขึ้นเองทุก 3 วินาที ═══ */
const CH={job:null,after:0,as:"customer",timer:0,last:""};
function mine(m){const r=CH.job.role;return r==="both"?m.role===CH.as:m.role===(r==="customer"?"customer":"technician")}
function fmtT(at){return new Date(at).toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"})}
function fmtD(at){return new Date(at).toLocaleDateString(LOC,{day:"numeric",month:"short"})}
function addMsgs(list){
  const box=$("msgs");const fresh=list.filter(m=>m.id>CH.after);if(!fresh.length)return;
  const atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<90;
  box.querySelector(".first")?.remove();
  fresh.forEach(m=>{
    const d=fmtD(m.at);if(d!==CH.last){CH.last=d;box.insertAdjacentHTML("beforeend",`<div class="day">${d}</div>`)}
    box.insertAdjacentHTML("beforeend",`<div class="msg ${mine(m)?"me":""}" data-id="${m.id}">${esc(m.text)}<small>${CH.job.role==="both"||CH.job.role==="admin"?(m.role==="customer"?"ลูกค้า · ":"ช่าง · "):""}${fmtT(m.at)}</small></div>`);
  });
  CH.after=fresh[fresh.length-1].id;CH.all.push(...fresh);
  if(atEnd||fresh.some(mine))box.scrollTop=box.scrollHeight;
}
function openChat(j){
  CH.job=j;CH.after=0;CH.last="";CH.all=[];CH.as="customer";
  const cust=j.role==="customer";

/* ═══ ย่อรูปก่อนส่ง — รูปจากมือถือ 4–8MB ย่อเหลือราว 150KB อ่านบัตรยังชัด ═══ */
function shrink(file,max){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type))return rej(new Error("ต้องเป็นไฟล์รูปภาพ"));
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,(max||1280)/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.72,d=c.toDataURL("image/jpeg",q);while(d.length>900000&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}res(d)};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("เปิดรูปนี้ไม่ได้"))};img.src=u;
  });
}

/* สถานะใบสมัคร — มีเลขที่ใบสมัครอ้างอิง และเห็นว่าอยู่ขั้นไหนของการพิจารณา */
function statusPage(a,fresh,pv){
  const st=a.status,d=a.submittedAt||a.createdAt;

  sheet({push:pv&&pv.push,full:true,title:"ใบสมัครพาร์ทเนอร์",body:(pv?`<div class="seg pvs" id="pvS">${[["pending","รอตรวจ"],["rejected","ต้องแก้ไข"],["approved","อนุมัติ"]].map(([k,l])=>`<button type="button" data-v="${k}" class="${k===pv.st?"on":""}">${l}</button>`).join("")}</div>`:"")+`
    ${fresh?'<div class="state"><div class="big" style="background:rgba(62,158,110,.14);color:var(--ok)"><i class="ti ti-send"></i></div><h2>ยื่นใบสมัครเรียบร้อย</h2><p>ทีมงานจะติดต่อกลับภายใน 3 วันทำการ</p></div>':""}
    <div class="appno"><div><small>เลขที่ใบสมัคร</small><b>${esc(a.appNo||"—")}</b></div><div style="text-align:right"><small>วันที่ยื่น</small><b style="font-size:14px">${d?new Date(d).toLocaleDateString(LOC,{day:"numeric",month:"short",year:"numeric"}):"—"}</b></div></div>
    <p class="h4">สถานะการพิจารณา</p>
    <div class="tl">${[["ยื่นใบสมัครออนไลน์",esc(a.name)],["ตรวจสอบเอกสาร",st==="rejected"?"ต้องแก้ไขเพิ่มเติม":"1–3 วันทำการ"],["โทรยืนยันตัวตนและทักษะ","ทีมงานโทรหา "+esc(a.phone||"")],["อนุมัติ เริ่มรับงาน",st==="approved"?"ร้านของคุณแสดงในแอปแล้ว":""]].map(([b,s],i)=>`<div data-n="${i+1}" class="${i+1<n?"ok":i+1===n&&st!=="approved"?"on":""}"><b>${b}</b><small>${s}</small></div>`).join("")}</div>
    ${st==="rejected"?`<div class="err" style="animation:none"><b>หมายเหตุจากทีมงาน:</b> ${esc(a.review&&a.review.note||"")}</div>`:""}`,
    foot:st==="rejected"?'<button class="btn p w" id="sFix">แก้ไขและยื่นใหม่</button>':st==="approved"?'<button class="btn p w" id="sJobs">เปิดงานของฉัน</button>':'<button class="btn s w" id="sOk">ปิด</button>',
    mount(){if(pv){$("pvS").querySelectorAll("button").forEach(b=>b.onclick=()=>previewStatus(b.dataset.v,false));if($("sFix"))$("sFix").onclick=()=>landing(true);if($("sJobs"))$("sJobs").onclick=()=>{closeSheet();setMode("tech")};if($("sOk"))$("sOk").onclick=()=>closeSheet();return}

/* ผู้ดูแลและทีมงาน Cendon เข้าดูได้ทุกหน้า — ข้ามการกรอก/ตรวจ เพื่อตรวจความเรียบร้อยของระบบ */
function PREV(){return !!(ME&&ME.staff)}
function skipped(n){toast("ทีมงาน: ข้ามช่องที่ยังไม่กรอก "+n+" รายการ","ti-player-skip-forward")}
/* เปิดร้านทีมงานทันทีโดยไม่ถามอะไร — ใช้ GPS ถ้าได้ ไม่ได้ก็ให้ backend ใช้ตำแหน่งกลาง แล้วแก้ทีหลังในแท็บร้าน */
async function quickTech(){
  if(!(ME.technician&&ME.technician.test)){
    const p=await Promise.race([locate().catch(()=>null),new Promise(r=>setTimeout(()=>r(null),4000))]);
    await api("/api/tech/apply",{body:{test:true,...(p?{lat:p.lat,lng:p.lng}:{})}});
    await refreshMe();load();
  }
  closeSheet();setMode("tech");toast("เข้าแดชบอร์ดช่างแล้ว (ร้านทีมงาน)");
}
/* หน้าสถานะใบสมัครแบบตัวอย่าง — ไม่ยื่นจริง ไม่สร้างข้อมูล สลับดูได้ทุกสถานะ */
function previewStatus(st,push){
  const nm=(APP&&APP.name)||"ตัวอย่าง ผู้สมัคร";
  statusPage({appNo:"CP-PREVIEW",status:st,name:nm,submittedAt:Date.now(),review:st==="rejected"?{note:"ตัวอย่างหมายเหตุจากทีมงาน: รูปบัตรไม่ชัด กรุณาถ่ายใหม่"}:null},false,{st,push});
}

function staffBar(){
  const s=$("staff");
  if(!ME||!ME.staff){s.hidden=true;s.innerHTML="";return}
  s.hidden=MODE!=="staff";
  s.innerHTML=`<button id="sTest"><i class="ti ti-shield-check"></i>${ME.technician&&ME.technician.test?"ช่างทีมงานของฉัน":"เป็นช่างทีมงาน"}</button><button id="sApps"><i class="ti ti-id-badge-2"></i>ตรวจใบสมัคร<span class="n" id="sN" hidden></span></button><button id="sAll"><i class="ti ti-list-details"></i>งานทั้งหมด</button>`;
  $("sTest").onclick=testTech;$("sApps").onclick=reviewList;$("sAll").onclick=()=>jobs(true);
  api("/api/tech/applications").then(d=>{const n=(d.applications||[]).length;if(n&&$("sN")){$("sN").hidden=false;$("sN").textContent=n}}).catch(()=>{});

/* ช่างทีมงาน — ใช้แค่ตำแหน่งอู่ ไม่ต้องมีเอกสาร เห็นเฉพาะทีมงาน Cendon ลูกค้าทั่วไปไม่เห็น */
function testTech(){
  const t=ME.technician&&ME.technician.test?ME.technician:null;let pos=t&&t.lat?{lat:t.lat,lng:t.lng}:null;let gps=false;
  sheet({push:$("bs").classList.contains("on"),title:t?"ช่างทีมงานของฉัน":"เป็นช่างทีมงาน",body:`
    <div class="picker" id="tMap"></div><p class="coord" id="tXY"></p>
    <button class="btn s w" id="tGps" style="margin-bottom:14px"><i class="ti ti-current-location"></i> ใช้ตำแหน่งปัจจุบัน</button>
    <label class="fld"><span>ชื่ออู่ (ไม่ใส่ก็ได้)</span><input class="inp" id="tS" value="${esc(t?t.shop:"")}" placeholder="อู่ทดสอบ"/></label>
    <p class="note"><i class="ti ti-eye-off"></i>ร้านนี้เห็นเฉพาะทีมงาน Cendon ลูกค้าทั่วไปไม่เห็น ใช้รับงานและทดลองระบบได้ครบทุกขั้น</p>`,
    foot:`${t?'<button class="btn s" id="tOpen">ดูร้านของฉัน</button>':""}<button class="btn p" id="tGo">${t?"บันทึกตำแหน่ง":"เป็นช่างเลย"}</button>`,
    mount(){
      const pk=picker($("tMap"),pos,p=>{pos=p;$("tXY").textContent=p.lat.toFixed(5)+", "+p.lng.toFixed(5)});
      $("tGps").onclick=e=>busy(e.currentTarget,async()=>{const p=await locate();if(p){pk.set(p);gps=true}});
      if($("tOpen"))$("tOpen").onclick=()=>openTech(t.id);
      $("tGo").onclick=e=>busy(e.currentTarget,async()=>{
        if(!window.L&&!gps&&!t)throw new Error("กดใช้ตำแหน่งปัจจุบันก่อน");
        await api("/api/tech/apply",{body:{test:true,lat:pos.lat,lng:pos.lng,shop:$("tS").value.trim()}});
        await refreshMe();await load();closeSheet();toast(t?"บันทึกแล้ว":"คุณเป็นช่างทีมงานแล้ว");
        const me=ME.technician;if(MODE==="tech")dash();else if(me)setTimeout(()=>openTech(me.id),450);
      });
    }});
}

const AIV={pass:["ผ่าน","#1a7f4b","ti-circle-check"],review:["ต้องดู","#b7791f","ti-alert-triangle"],fail:["ไม่ผ่าน","#c0392b","ti-circle-x"]};
function aiBadge(ai){if(!ai)return"";const v=AIV[ai.verdict]||AIV.review;return`<span class="aib" style="--c:${v[1]}"><i class="ti ${v[2]}"></i>${v[0]}</span>`}
function aiCard(ai){
  if(!ai)return`<div class="aic"><div class="aih"><b><i class="ti ti-robot"></i> AI คัดกรอง</b><button class="btn s" id="aiRe">ตรวจด้วย AI</button></div><small>ยังไม่มีผล — ใบนี้ส่งก่อนเปิดระบบ หรือ AI ล้มตอนส่ง</small></div>`;
  const v=AIV[ai.verdict]||AIV.review, L={high:["#c0392b","ti-alert-octagon"],medium:["#b7791f","ti-alert-triangle"],low:["#6b7280","ti-info-circle"]};
  return`<div class="aic" style="--c:${v[1]}"><div class="aih"><b><i class="ti ${v[2]}"></i> AI: ${v[0]} · ${ai.score}/100</b><button class="btn s" id="aiRe">ตรวจอีกครั้ง</button></div>
    ${ai.flags&&ai.flags.length?`<ul class="nt">${ai.flags.map(f=>`<li style="--c:${(L[f.level]||L.low)[0]}"><i class="ti ${(L[f.level]||L.low)[1]}"></i>${esc(f.msg)}</li>`).join("")}</ul>`:'<small>ไม่พบจุดน่าสงสัย</small>'}
    ${ai.summary?`<p class="nt">${esc(ai.summary)}</p>`:""}
    <small>${esc(ai.vision||"")}${ai.error?" · "+esc(ai.error):""} · ${new Date(ai.at).toLocaleString("th-TH")}</small>
    <small>AI ช่วยชี้จุดสงสัยเท่านั้น ผู้ตรวจยังต้องดูเอกสารและติ๊กเองทุกข้อ</small></div>`}
const CHECKS=[["identity","บัตรตรงกับหน้าในรูปคู่บัตร ชื่อตรง อายุ 18+"],["phone","โทรติดต่อได้ ยืนยันตัวตนแล้ว"],["work","รูปผลงานเป็นงานจริงของผู้สมัคร"],["skills","มีใบรับรอง หรือสัมภาษณ์ทักษะผ่าน"],["shop","อู่/เครื่องมือมีจริง ตำแหน่งตรง"],["terms","ตกลงราคา ขอบเขตงาน และรับประกันแล้ว"]];
async function reviewOne(a){
  sheet({push:true,title:a.name,body:'<div class="skel"></div>'});
  let docs=[];try{docs=(await api("/api/tech/docs?uid="+encodeURIComponent(a.uid))).docs||[]}catch(e){}
  const lab=Object.fromEntries(DK.map(d=>[d[0],d[1]]));
  sheet({title:a.name,body:`
    <div class="gal">${docs.map(d=>`<img src="${d.url}" data-z="${d.url}" alt="${esc(lab[d.kind])}" title="${esc(lab[d.kind])}"/>`).join("")||'<div class="ph" style="background:var(--surface-2);color:var(--muted);font-size:14px">ไม่มีเอกสาร</div>'}</div>
    <div class="kv"><p><span>เบอร์</span><b><a href="tel:${esc(a.phone)}" style="color:var(--accent)">${esc(a.phone)}</a></b></p><p><span>อู่</span><b>${esc(a.shop||"–")}</b></p><p><span>อายุ / ประสบการณ์</span><b>${a.age} ปี / ${a.years} ปี</b></p><p><span>พื้นที่</span><b>${esc(a.area)}${a.lat?` · <a href="https://maps.google.com/?q=${a.lat},${a.lng}" target="_blank" rel="noopener" style="color:var(--accent)">แผนที่</a>`:""}</b></p><p><span>งาน</span><b>${(a.cats||[]).map(c=>CAT[c]?CAT[c].th:c).join(", ")}</b></p><p><span>ราคา / รับประกัน</span><b>฿${money(a.from)} / ${a.warranty} วัน</b></p><p><span>ใบรับรอง</span><b>${a.hasCert?"มี":"ไม่มี — ต้องสัมภาษณ์"}</b></p>${a.about?`<p><span>ถนัด</span><b>${esc(a.about)}</b></p>`:""}</div>
    <div id="aiBox">${aiCard(a.ai)}</div>
    ${CHECKS.map(([k,l])=>`<label class="chk"><input type="checkbox" data-k="${k}"/> ${l}</label>`).join("")}
    <label class="fld"><span>บันทึก</span><textarea class="inp" id="rvN" placeholder="ตรวจอะไรไปบ้าง / ต้องแก้อะไร"></textarea></label>`,
    foot:'<button class="btn s" id="rvNo">ให้แก้ไข</button><button class="btn p" id="rvOk" disabled>อนุมัติ</button>',
    mount(b){
      b.querySelectorAll("[data-z]").forEach(i=>i.onclick=()=>zoom(i.dataset.z));
      const boxes=[...b.querySelectorAll("[data-k]")];boxes.forEach(x=>x.onchange=()=>$("rvOk").disabled=!boxes.every(y=>y.checked));
      const go=(decision,btn)=>busy(btn,async()=>{
        await api("/api/tech/review",{body:{uid:a.uid,revision:a.revision,decision,note:$("rvN").value.trim(),checks:Object.fromEntries(boxes.map(x=>[x.dataset.k,x.checked]))}});
        toast(decision==="approve"?"อนุมัติแล้ว":"ส่งกลับให้แก้ไขแล้ว");await load();staffBar();reviewList();
      });
      $("rvOk").onclick=e=>go("approve",e.currentTarget);$("rvNo").onclick=e=>go("reject",e.currentTarget);
    }});
}

/* ═══ มุมมอง ลูกค้า / ช่าง / ทีมงาน ═══
   ทีมงาน Cendon Experience สลับดูได้ทุกมุมโดยไม่ต้องสมัครอะไร — ใช้ทดสอบระบบทั้งสองฝั่งด้วยบัญชีเดียว
   ช่างที่ผ่านการอนุมัติสลับได้ระหว่างลูกค้ากับช่าง คนทั่วไปเห็นมุมลูกค้าอย่างเดียว (ไม่มีปุ่มสลับ) */
let MODE="customer";
function modesAvail(){
  const m=["customer"];
  if(ME&&(ME.staff||(ME.technician&&!ME.technician.test)))m.push("tech");
  if(ME&&ME.staff)m.push("staff");
  return m;
}
function drawModes(){
  const av=modesAvail();
  /* ค่าที่ผู้ใช้เลือกเองมาก่อนเสมอ ถ้ายังไม่เคยเลือก ทีมงานเริ่มที่มุมทีมงาน คนอื่นเริ่มที่มุมลูกค้า
     ต้องคิดใหม่ทุกครั้งที่รู้ข้อมูลผู้ใช้เพิ่ม — ตอนเปิดหน้ายังไม่รู้ว่าใครล็อกอิน */
  if(!av.includes(MODE))MODE="customer";
  const el=$("modes");el.hidden=av.length<2;
  const L={customer:["ti-user",T("ลูกค้า","Customer")],tech:["ti-tool",T("ช่าง","Mechanic")],staff:["ti-shield-check",T("ทีมงาน","Staff")]};
  el.innerHTML=av.map(m=>`<button data-m="${m}" class="${m===MODE?"on":""}"><i class="ti ${L[m][0]}"></i>${L[m][1]}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  applyMode();
}
function setMode(m){MODE=m;drawModes();window.scrollTo(0,0);if(m==="tech")dash()}
function applyMode(){
  const tech=MODE==="tech";
  if(tech&&VIEW==="map"){VIEW="menu";document.body.classList.remove("onmap");$("vMap").hidden=true}
  $("vMenu").hidden=tech||VIEW==="map";$("vTech").hidden=!tech;
  const sb=$("staff");if(sb&&ME&&ME.staff)sb.hidden=MODE!=="staff";
  document.body.dataset.mode=MODE;
  if(!tech)stopAlerts();
}

let DT="find",DSTATS=null,NEAR=null,FMAP=null,FL=null,alertT=0,firstNear=true;
const SEEN=new Set(ls.get("spire_seen_posts",[]));

async function dash(){
  if(MODE!=="tech")return;

    $("dHead").innerHTML="";$("dStats").innerHTML="";$("dTabs").hidden=true;
    $("dBody").innerHTML=`<div class="cta e3"><span class="sq" style="--c1:var(--accent)"><i class="ti ti-tool"></i></span><b>${T("ยังไม่มีร้าน","No shop yet")}</b><p>${ME&&ME.staff?T("ทีมงานเปิดร้านทีมงานได้ทันที ใช้แค่ตำแหน่งอู่ ลูกค้าจริงไม่เห็น","Staff can open a staff shop instantly — location only, hidden from customers"):T("สมัครเป็นพาร์ทเนอร์เพื่อเริ่มรับงาน","Apply as a partner to start taking jobs")}</p><button class="btn p" id="dGo">${ME&&ME.staff?T("เปิดร้านทีมงาน","Open staff shop"):T("สมัครเป็นช่าง","Apply")}</button></div>`;

function drawHead(t){
  const on=DSTATS?DSTATS.online:!!t.online,ph=t.avatar;
  $("dHead").innerHTML=`${WF}<span class="sq" style="--c1:${colorOf(t)};${ph?`background-image:url('${API}/api/tech/img/${ph}')`:""}">${ph?"":initial(t.shop||t.name)}</span>

    <button class="sw ${on?"on":""}" id="dOn" aria-pressed="${on}">${on?T("รับงาน","Online"):T("ปิดรับ","Offline")}<i class="k"></i></button>`;
  $("dStore").onclick=()=>openTech(t.id);
  $("dOn").onclick=e=>busy(e.currentTarget,async()=>{
    const want=!(DSTATS&&DSTATS.online);unlockAudio();
    await api("/api/tech/online",{body:{online:want}});
    if(DSTATS)DSTATS.online=want;drawHead(t);
    toast(want?T("เปิดรับงานแล้ว — งานใหม่จะแจ้งเตือนทันที","You're online — new jobs will alert you"):T("ปิดรับงานแล้ว","You're offline"),want?"ti-bell-ringing":"ti-bell-off");
    want?startAlerts():stopAlerts();

function drawStats(){
  const s=DSTATS;if(!s){$("dStats").innerHTML="";return}
  const mx=Math.max(1,...s.daily.map(x=>x.v));
  $("dStats").innerHTML=`<div class="st e3"><b>฿${kfmt(s.earnToday)}</b><small>${T("วันนี้","Today")}</small></div><div class="st e3"><b>฿${kfmt(s.earnMonth)}</b><small>${T("เดือนนี้","This month")}</small></div>

    <div class="spark e3" title="${T("รายได้ 14 วัน","14-day earnings")}">${s.daily.map((x,i)=>`<i class="${x.v?"":"z"}" style="height:${Math.max(6,x.v/mx*100)}%;animation-delay:${i*30}ms" title="฿${money(x.v)}"></i>`).join("")}</div>`;
}
$("dTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{DT=b.dataset.t2;$("dTabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));drawTab()});

/* ── แจ้งเตือนงานใหม่ ──
   เปิดรับงานอยู่ = ถามทุก 20 วินาที ประกาศที่ยังไม่เคยเห็น → เสียง + สั่น + ป้ายแดงที่แท็บหางาน
   เสียงต้องปลดล็อกจากการแตะของผู้ใช้ก่อน (กฎของเบราว์เซอร์) — ปุ่มเปิดรับงานทำหน้าที่นี้ */
let ACTX=null;
function unlockAudio(){try{ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();ACTX.resume()}catch(e){}}
function ding(){try{if(!ACTX)return;const o=ACTX.createOscillator(),g=ACTX.createGain();o.type="sine";o.frequency.setValueAtTime(880,ACTX.currentTime);o.frequency.setValueAtTime(1320,ACTX.currentTime+.12);
  g.gain.setValueAtTime(.001,ACTX.currentTime);g.gain.exponentialRampToValueAtTime(.3,ACTX.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ACTX.currentTime+.4);o.connect(g).connect(ACTX.destination);o.start();o.stop(ACTX.currentTime+.42)}catch(e){}}
function startAlerts(){
  clearTimeout(alertT);
  const tick=async()=>{
    if(MODE!=="tech")return;
    try{const d=await api("/api/tech/posts/near");const fresh=d.posts.filter(p=>!SEEN.has(p.id));
      if(fresh.length){fresh.forEach(p=>SEEN.add(p.id));ls.set("spire_seen_posts",[...SEEN].slice(-300));
        if(!firstNear){ding();try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}
          toast(fresh.some(p=>p.urgent)?T("มีงานด่วนใกล้คุณ!","Urgent job nearby!"):T(`งานใหม่ใกล้คุณ ${fresh.length} งาน`,`${fresh.length} new job${fresh.length>1?"s":""} nearby`),"ti-bell-ringing");
          if(DT==="find")tabFind();else $("findDot").hidden=false}}
      firstNear=false}catch(e){}
    alertT=setTimeout(tick,document.hidden?60000:20000)};
  tick();
}

      <span class="sq" style="--c1:${PALETTE[i%PALETTE.length]}">${initial(j.techName)}</span><span><b style="display:block;font-weight:600" class="nt">${esc(j.techName)}</b><small style="color:var(--muted);font-size:12px">${j.reviewCount?"★ "+j.rating.toFixed(1)+" · ":""}${j.quote?esc(j.quote.appointment):""}</small></span>

/* ═══ คำทักทาย — แบบเดียวกับหน้าหลัก ═══ */
function greet(){
  if(!$("greet"))return;
  const h=new Date().getHours();
  const part=h<5?T("ดึกแล้ว","Late night"):h<12?T("สวัสดีตอนเช้า","Good morning"):h<17?T("สวัสดีตอนบ่าย","Good afternoon"):T("สวัสดีตอนเย็น","Good evening");
  let nm="";try{const c=JSON.parse(localStorage.getItem("spire_cachedUser")||localStorage.getItem("cachedUser")||"null");nm=(c&&(c.name||c.displayName)||"").split(" ")[0]}catch(e){}
  if(!nm&&U&&U.displayName)nm=U.displayName.split(" ")[0];
  $("greet").innerHTML=`${esc(part)}${nm?" "+esc(nm):""} <span class="w">👋</span>`;
  const live=JOBS.filter(j=>!["completed","cancelled"].includes(j.status)).length;
  $("greetSub").textContent=live?T(`มี ${live} งานกำลังดำเนินการ`,`${live} job${live>1?"s":""} in progress`):T("รถเป็นอะไร บอก Cendon ได้เลย","Tell Cendon what's wrong with your car");
}

/* ═══ เริ่มทำงาน ═══ */
/* เครื่องใหม่ที่ยังไม่มีรถในเครื่อง — ดึงรถของบัญชีจากเซิร์ฟเวอร์มาให้ ฟอร์มจะได้ใส่รถให้เองโดยไม่ต้องพิมพ์
   รูปแบบเดียวกับที่หน้าแชตเก็บ (spire_garage) ถ้ามีรถในเครื่องอยู่แล้วไม่แตะเลย */
async function pullCars(){
  try{
    if((ls.get("spire_garage",[])||[]).length)return;
    const r=await fetch(API+"/api/cars",{headers:{Authorization:"Bearer "+await U.getIdToken()}});
    if(!r.ok)return;const arr=await r.json();if(!Array.isArray(arr)||!arr.length)return;
    if((ls.get("spire_garage",[])||[]).length)return;
    ls.set("spire_garage",arr.map(c=>({id:c.id,make:c.make||"",model:c.model||"",name:`${c.make||""} ${c.model||""}`.trim(),
      year:c.year!=null?String(c.year):"",mileage:c.mileage!=null?String(c.mileage):"",type:"sedan",history:[]})));
    if(!ls.get("spire_selCar",null))ls.set("spire_selCar",arr[0].id);
  }catch(e){}
}

  paintStatic();greet();drawModes();drawGrid();render();
  if(p.get("view")==="map"){let mt=0;(function w(){if(window.L||++mt>40)return setView("map",true);setTimeout(w,100)})()}
  /* รายชื่อโหลดทันทีโดยไม่รอล็อกอิน — คนรถเสียไม่ควรต้องรอ
     พอรู้ว่าใครเข้ามา ค่อยโหลดซ้ำ (ทีมงานจะเห็นช่างทีมงานเพิ่ม) */
  load();
  let bt=0;
  (function boot(){
    if(typeof firebase==="undefined"||!firebase.initializeApp){if(++bt<150)setTimeout(boot,120);return}
    try{
      if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(fbConfig);
      auth=firebase.auth();
      auth.onAuthStateChanged(async u=>{U=u||null;try{navPaint(U)}catch(e){}greet();if(U)pullCars();await refreshMe();if(U)await load();else diag()});
    }catch(e){}
  })();
})();

<script id="mjs">
/* ══════════════════════════════════════════════════════════════════
   Cendon — ตัวประกอบหน้าจอมือถือ (เขียนใหม่ทั้งหมด)

   ไฟล์นี้ทำสามอย่าง แล้วหยุด:
     1. สร้างแถบล่าง 5 แท็บ (ไอคอน + ชื่อ) แทนแถบบนของเดสก์ท็อป
     2. จัดหน้าหลักเป็นสามจอที่เลื่อนแล้วล็อก
        จอ 1 ห้องนักบิน · จอ 2 สิ่งที่แชตบอตทำไม่ได้ · จอ 3 เครื่องมือ+วิดเจ็ต
     3. สร้างตารางเครื่องมือ 4 ช่องแบบ Grab พร้อมแผ่นเลื่อน "ทั้งหมด"

   กติกาเหล็กสองข้อ:
     • จอคอมต้องไม่ขยับ — ทุกอย่างทำงานเมื่อ matchMedia ตรงเท่านั้น
       และถอนคืนให้ครบเมื่อหน้าจอกว้างขึ้น (หมุนเครื่อง / เปิดบนแท็บเล็ต)
     • ไม่เขียนตัวนำทางเอง — เรียก window.switchView ที่มีอยู่แล้ว
       เพราะมันรู้เรื่องการข้ามไฟล์ (index/garage/news/…) ซึ่งถ้าเขียนใหม่
       จะพลาดเรื่องที่มองไม่เห็น เช่นการรอ auth ก่อนเปลี่ยนหน้า
   ══════════════════════════════════════════════════════════════════ */
(function(){
"use strict";
const D=document,$=id=>D.getElementById(id);
const T=(th,en)=>(window.spireT?window.spireT(th,en):"th"===(window.spireLang?window.spireLang():"th")?th:en);
const MQ=matchMedia("(max-width:760px)");

/* ─────────── 1. แถบล่าง 5 แท็บ ─────────── */
/* ร้านค้าไม่ได้เป็นแท็บแล้ว — มันย้ายไปเป็นไอคอนในตารางเครื่องมือ
   ห้าแท็บคือเพดานที่นิ้วยังกดแม่นบนจอ 360px ถ้ามีหกจะเริ่มกดพลาด */
const TABS=[
  {k:"home",     ic:"ti-home",      th:"หน้าหลัก", en:"Home"},
  {k:"garage",   ic:"ti-car",       th:"การาจ",    en:"Garage"},
  {k:"chat",     ic:"ti-message-2", th:"แชต",      en:"Chat"},
  {k:"magazine", ic:"ti-book-2",    th:"นิตยสาร",  en:"Magazine"},
  {k:"account",  ic:"ti-user",      th:"บัญชี",    en:"Account"}
];

function page(){
  try{ if(window.__SPIRE_PAGE__)return window.__SPIRE_PAGE__ }catch(e){}
  const f=(location.pathname.split("/").pop()||"index.html").toLowerCase();
  return ({"garage.html":"garage","news.html":"magazine","spares.html":"shop",
           "profile.html":"profile","chat.html":"chat"})[f]||"home";
}

/* เข้าสู่ระบบแล้วหรือยัง — อ่านจากปุ่มของเดิมที่ renderAuthUI คุมอยู่
   ไม่ไปแตะ currentUser เพราะมันเป็นตัวแปรระดับบนสุดใน <script> ธรรมดา
   ซึ่ง "ไม่" ผูกกับ window (ต่างจาก function declaration) จึงอ่านไม่ได้ */
function signedIn(){
  const a=$("avatarBtn");
  return !!(a&&getComputedStyle(a).display!=="none");
}

function navHTML(){
  const cur=page();
  return TABS.map(t=>{
    /* หน้าอะไหล่ไม่มีแท็บของตัวเองแล้ว (ย้ายไปอยู่ในตารางเครื่องมือ)
       แต่ต้องมีแท็บสว่างอยู่หนึ่งอันเสมอ ไม่งั้นผู้ใช้จะไม่รู้ว่าตัวเองอยู่ตรงไหน
       — ชี้กลับไปที่หน้าหลัก ซึ่งเป็นทางที่เขาเดินเข้ามาจริง */
    const on=(t.k===cur)||(t.k==="account"&&cur==="profile")
             ||(t.k==="home"&&cur==="shop");
    return `<button class="mtab${on?" on":""}" data-mnav="${t.k}"
      aria-label="${T(t.th,t.en)}"${on?' aria-current="page"':""}>
      <span class="mt-i" data-mslot="${t.k}"><i class="ti ${t.ic}"></i></span>
      <b>${T(t.th,t.en)}</b></button>`;
  }).join("");
}

function mountNav(){
  /* หน้าแชตมีแถบเครื่องมือและช่องพิมพ์ของตัวเองที่ขอบล่างอยู่แล้ว
     ใส่แถบซ้อนลงไปจะทับกันพอดี — ดูจากว่าหน้านั้นมีแถบเดสก์ท็อปไหม */
  if(!D.querySelector(".navwrap"))return;
  let n=$("mnav");
  if(!n){
    n=D.createElement("nav"); n.className="mnav"; n.id="mnav";
    n.setAttribute("role","navigation");
    D.body.appendChild(n);
    n.addEventListener("click",e=>{
      const b=e.target.closest("[data-mnav]"); if(!b)return;
      go(b.dataset.mnav);
    });
  }
  n.innerHTML=navHTML();
  paintAvatar();
}

function go(k){
  if(k==="chat"){ location.href="chat.html"; return }
  if(k==="account"){
    /* ยังไม่ได้เข้าระบบ → กดปุ่มเดิมของหน้า ซึ่งผูกกับ Firebase ไว้แล้ว */
    if(!signedIn()){ const b=$("signinBtn"); if(b){b.click();return} }
    k="profile";
  }
  try{ if(typeof window.switchView==="function"){window.switchView(k);return} }catch(e){}
  const f=({home:"index.html",garage:"garage.html",magazine:"news.html",
            shop:"spares.html",profile:"profile.html"})[k];
  if(f)location.href=f;
}

/* แท็บบัญชีโชว์รูปโปรไฟล์จริงเมื่อเข้าระบบแล้ว เหมือน Grab กับ Uber
   คนจำหน้าตัวเองได้เร็วกว่าจำไอคอนคนทั่วไป */
function paintAvatar(){
  const slot=D.querySelector('[data-mslot="account"]'); if(!slot)return;
  const a=$("avatarBtn");
  if(signedIn()&&a&&a.innerHTML.trim()){
    if(slot.dataset.av!==a.innerHTML){slot.dataset.av=a.innerHTML;slot.innerHTML=a.innerHTML}
  }else if(slot.dataset.av!==undefined||!slot.querySelector("i")){
    delete slot.dataset.av;
    slot.innerHTML='<i class="ti ti-user"></i>';
  }
}

/* ─────────── 2. สามจอที่เลื่อนแล้วล็อก ─────────── */
/* โครงเดิมของหน้าหลักคือ  .scroll > [#hstack, #hfree]  โดย #hhero อยู่ใน #hfree
   สิ่งที่ต้องทำมีอย่างเดียว: ยก #hhero ออกมาเป็นพี่น้อง แล้วติดคลาสให้ทั้งสาม
   ไม่ต้องย้ายอย่างอื่นเลย — ยิ่งย้ายน้อย ยิ่งพังยาก */
function arrange(){
  const view=$("v-home"); if(!view)return;
  const sc=view.querySelector(".scroll"); if(!sc)return;
  const stack=$("hstack"),hero=$("hhero"),free=$("hfree");
  if(!free)return;

  if(hero&&hero.parentElement!==sc)sc.insertBefore(hero,free);

  if(stack){stack.classList.add("msnap","msnap-1")}
  if(hero){hero.classList.add("msnap","msnap-2")}
  free.classList.add("msnap","msnap-3");

  /* ระดับพื้นฐานไม่มีห้องนักบิน (#hstack) จอแรกจึงเป็นจอฮีโร่แทน
     ไม่งั้นจะเหลือสองจอโดยจอแรกว่างเปล่า */
  if(!stack&&hero){hero.classList.remove("msnap-2");hero.classList.add("msnap-1")}

  hint(stack||hero);
  hint(stack?hero:null);
  tools();

  /* ครั้งแรกที่จัดเสร็จ ต้องอยู่ที่จอแรกพอดี
     การย้าย #hhero ทำให้ความสูงเหนือจุดเลื่อนเปลี่ยน เบราว์เซอร์บางตัว
     จึงชดเชยจนค้างกลางจอ — เห็นเป็นหน้าที่ "เปิดมาแล้วเลื่อนไปเองแล้ว" */
  /* เปิดหน้ามาต้องอยู่จอแรกเสมอ
     ระหว่างบูตมีทั้งการย้าย #hhero และ scroll-snap ที่เข้าที่เอง
     ทำให้บางจังหวะหน้าเด้งไปค้างที่จอ 2 ตั้งแต่ยังไม่มีใครแตะ */
  if(!arrange.done){
    arrange.done=true; at=0;
    if(sc.scrollTop)sc.scrollTop=0;
  }
  wireSnap(sc);
}

/* ─────────── ตัวบังคับล็อกจอ ───────────
   scroll-snap ของ CSS อาศัย "การปัดจบ" ของเบราว์เซอร์ ซึ่งแต่ละตัวตัดสินใจ
   ไม่เหมือนกัน — บางเครื่องปัดสั้น ๆ แล้วค้างกลางจอ เห็นสองจอครึ่ง ๆ พร้อมกัน
   ซึ่งเป็นภาพที่แย่กว่าไม่ล็อกเลย จึงมีตัวเก็บกวาดหลังเลื่อนหยุดอีกชั้น
   ทำงานเฉพาะสองจอแรกเท่านั้น จอ 3 สูงกว่าจอ ต้องเลื่อนอ่านได้อิสระ */
let settling=false,at=0;
/* เกณฑ์ 20% ของความสูงจอ — เท่ากับที่แอปอ่านนิยาย/สไลด์ใช้กัน
   ต่ำกว่านี้ปัดโดนโดยไม่ตั้งใจก็เปลี่ยนจอ สูงกว่านี้ต้องออกแรงปัดยาวจนเมื่อย */
const STEP=.20;
function settle(sc){
  if(settling)return;
  const h=sc.clientHeight; if(h<200)return;
  const t=sc.scrollTop;
  if(t>=h*2-6){at=2;return}                 /* เข้าจอ 3 แล้ว ปล่อยเลื่อนอิสระ */
  const d=t-at*h;
  let to=at;
  if(d>h*STEP)to=Math.min(at+1,2);
  else if(d<-h*STEP)to=Math.max(at-1,0);
  at=to;
  const target=to*h;
  if(Math.abs(t-target)<3)return;
  settling=true;
  sc.scrollTo({top:target,behavior:"smooth"});
  setTimeout(()=>{settling=false},520);
}
/* ยังไม่มีใครแตะจอ = ต้องอยู่จอแรก
   ระหว่างบูต เลเยอร์อื่นวาดของเพิ่มเรื่อย ๆ (ห้องนักบิน ข่าว วิดเจ็ต)
   ความสูงเปลี่ยนทีไรตำแหน่งเลื่อนขยับตาม จนหน้าเปิดมาค้างที่จอ 2 เอง
   ล็อกไว้จนกว่าจะมีการปัด/แตะ/กดปุ่มจริง แล้วค่อยปล่อยให้ผู้ใช้คุม */
let touched=false;
function wireSnap(sc){
  if(sc.__msnap)return; sc.__msnap=true;
  let e=null;
  /* ต้องรอให้ผู้ใช้แตะก่อนถึงจะเริ่มล็อกจอ
     ระหว่างบูตความสูงยังโตอยู่ (ห้องนักบิน · ข่าว · วิดเจ็ตทยอยมา)
     ทุกครั้งที่โตจะมี scroll event หลุดออกมาหนึ่งครั้ง ถ้าล็อกทันที
     ระบบจะคิดว่า "ผู้ใช้ปัดลงมาแล้ว" แล้วพาไปจอ 2 ตั้งแต่ยังไม่มีใครแตะ */
  const end=()=>{ if(MQ.matches&&touched)settle(sc) };
  if("onscrollend" in sc)sc.addEventListener("scrollend",end);
  else sc.addEventListener("scroll",()=>{clearTimeout(e);e=setTimeout(end,140)},{passive:true});

  const mark=()=>{touched=true};
  ["wheel","touchstart","keydown","pointerdown"].forEach(t=>
    addEventListener(t,mark,{passive:true,once:true}));
  sc.addEventListener("scroll",()=>{
    if(touched||settling||!MQ.matches)return;
    if(sc.scrollTop)sc.scrollTop=0;
  },{passive:true});
}

/* ลูกศรกระพริบใต้จอ บอกว่ายังมีจอถัดไป */
function hint(el){
  if(!el||el.querySelector(".mhint"))return;
  const h=D.createElement("div"); h.className="mhint"; h.setAttribute("aria-hidden","true");
  h.innerHTML='<i class="ti ti-chevron-down"></i>';
  el.appendChild(h);
}

/* ─────────── 3. ตารางเครื่องมือแบบ Grab ─────────── */
/* เจ็ดตัวที่ใช้บ่อยขึ้นหน้าแรก ที่เหลืออยู่ในแผ่น "ทั้งหมด"
   สองแถวคือเพดานก่อนที่ตารางจะเริ่มดูเป็นกำแพงไอคอน */
const FEATS=[
  {k:"text",  ic:"ti-message-2",    c:"#4F8FF7", th:"พิมพ์ถาม",       en:"Ask"},
  {k:"image", ic:"ti-camera",       c:"#A46BF5", th:"ถ่ายรูป",        en:"Photo"},
  {k:"video", ic:"ti-video",        c:"#E85DA6", th:"วิดีโอ",         en:"Video"},
  {k:"listen",ic:"ti-ear",          c:"#37C08A", th:"ฟังเสียง",       en:"Listen"},
  {k:"quote", ic:"ti-receipt-2",    c:"#E8A33D", th:"เช็กราคา",       en:"Quote"},
  {k:"shake", ic:"ti-activity",     c:"#3FC3D6", th:"วัดการสั่น",     en:"Shake"},
  {k:"park",  ic:"ti-map-pin",      c:"#F0655C", th:"จำที่จอด",       en:"Parking"},
  {k:"own",   ic:"ti-report-money", c:"#7B8CF0", th:"ต้นทุน",         en:"Costs"},
  {k:"spares",ic:"ti-package",      c:"#F08A3D", th:"อะไหล่",         en:"Spares"}
];
const HOME7=["text","image","listen","quote","shake","park","spares"];

const tile=f=>`<button class="mtool" data-mfeat="${f.k}">
  <span class="mt-ic" style="--c:${f.c}"><i class="ti ${f.ic}"></i></span>
  <b>${T(f.th,f.en)}</b></button>`;

function tools(){
  const free=$("hfree"); if(!free)return;
  let g=$("mtools");
  if(!g){
    g=D.createElement("section"); g.id="mtools";
    free.insertBefore(g,free.firstChild);
    g.addEventListener("click",e=>{
      const all=e.target.closest("[data-mall]"); if(all){sheet();return}
      const b=e.target.closest("[data-mfeat]"); if(b)run(b.dataset.mfeat);
    });
  }
  g.innerHTML=`<h2 class="mgrid-t">${T("เครื่องมือ","Tools")}</h2>
    <div class="mgrid">
      ${HOME7.map(k=>tile(FEATS.find(f=>f.k===k))).join("")}
      <button class="mtool" data-mall="1">
        <span class="mt-ic" style="--c:#6B7A90"><i class="ti ti-layout-grid"></i></span>
        <b>${T("ทั้งหมด","All")}</b></button>
    </div>`;
}

function run(k){
  close();
  const f=FEATS.find(x=>x.k===k); if(!f)return;
  if(k==="spares"){ try{window.switchView("shop")}catch(e){location.href="spares.html"} return }
  if(k==="text"||k==="image"||k==="video"){
    try{ if(typeof window.openChat==="function"){window.openChat({attach:k});return} }catch(e){}
    location.href="chat.html?attach="+encodeURIComponent(k); return;
  }
  try{ if(typeof window.openTool==="function"){window.openTool(k);return} }catch(e){}
  location.href="chat.html?attach="+encodeURIComponent(k);
}

/* แผ่นเลื่อนขึ้น "เครื่องมือทั้งหมด" */
let bg=null,sh=null;
function sheet(){
  if(sh)return;
  bg=D.createElement("div"); bg.className="msheet-bg";
  sh=D.createElement("div"); sh.className="msheet";
  sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true");
  sh.innerHTML=`<div class="msheet-h"></div>
    <h2 class="mgrid-t">${T("เครื่องมือทั้งหมด","All tools")}</h2>
    <div class="mgrid">${FEATS.map(tile).join("")}</div>`;
  D.body.appendChild(bg); D.body.appendChild(sh);
  requestAnimationFrame(()=>{bg.classList.add("on");sh.classList.add("on")});
  bg.addEventListener("click",close);
  sh.addEventListener("click",e=>{
    const b=e.target.closest("[data-mfeat]"); if(b)run(b.dataset.mfeat);
  });
  addEventListener("keydown",esc);
}
function esc(e){ if(e.key==="Escape")close() }
function close(){
  if(!sh)return;
  removeEventListener("keydown",esc);
  const a=bg,b=sh; bg=sh=null;
  a.classList.remove("on"); b.classList.remove("on");
  setTimeout(()=>{a.remove();b.remove()},320);
}

/* ─────────── ถอนคืนเมื่อกลับไปจอกว้าง ─────────── */
/* หมุนเครื่องเป็นแนวนอนหรือเปิดบนแท็บเล็ตแล้วต้องได้หน้าเดิมของเดสก์ท็อปกลับมา
   ครบทุกชิ้น ไม่ใช่ครึ่ง ๆ กลาง ๆ — จึงต้องเก็บทุกอย่างที่เราสร้าง */
function teardown(){
  close();
  const n=$("mnav"); if(n)n.remove();
  const g=$("mtools"); if(g)g.remove();
  D.querySelectorAll(".mhint").forEach(h=>h.remove());
  D.querySelectorAll(".msnap").forEach(el=>
    el.classList.remove("msnap","msnap-1","msnap-2","msnap-3"));
  /* #hhero ต้องกลับเข้า #hfree ตำแหน่งเดิม ไม่งั้นเดสก์ท็อปจะเห็นมันลอยผิดที่ */
  const hero=$("hhero"),free=$("hfree");
  if(hero&&free&&hero.parentElement!==free)free.insertBefore(hero,free.firstChild);
}

/* ─────────── วงจรชีวิต ─────────── */
/* แอปวาดใหม่ตลอด (เปลี่ยนรถ · เข้าระบบเสร็จ · โหลดข่าวเสร็จ · เปลี่ยนภาษา)
   ทุกครั้งที่วาดใหม่ #hhero จะถูกยัดกลับเข้า #hfree และแท็บจะหายรูปโปรไฟล์
   จึงต้องเฝ้า ไม่ใช่ทำครั้งเดียว — หน่วงไว้ไม่ให้วิ่งทุก mutation */
let t=null;
const kick=()=>{clearTimeout(t);t=setTimeout(apply,140)};

function apply(){
  if(!MQ.matches){teardown();return}
  mountNav(); arrange();
}

function boot(){
  apply();
  new MutationObserver(m=>{
    for(const r of m){
      /* ของที่เราสร้างเองก็เป็น mutation ถ้าไม่กรองจะวนไม่จบ */
      const t=r.target;
      if(t&&t.closest&&t.closest("#mnav,#mtools,.msheet,.mhint"))continue;
      kick(); return;
    }
  }).observe(D.body,{childList:true,subtree:true,attributes:true,
    attributeFilter:["style","class"]});
  MQ.addEventListener?MQ.addEventListener("change",apply):MQ.addListener(apply);
  addEventListener("spire:lang",kick);
  try{ window.spireOnLang&&window.spireOnLang(kick) }catch(e){}
  /* เข้าระบบเสร็จรูปโปรไฟล์เพิ่งมา — เก็บตกอีกสองจังหวะ */
  setTimeout(apply,1200); setTimeout(apply,3000);
}
if(D.readyState==="loading")D.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
