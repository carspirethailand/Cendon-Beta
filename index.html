/* ═══ มุมมอง ลูกค้า / ช่าง / ทีมงาน ═══
   ทีมงาน Cendon Experience สลับดูได้ทุกมุมโดยไม่ต้องสมัครอะไร — ใช้ทดสอบระบบทั้งสองฝั่งด้วยบัญชีเดียว
   ช่างที่ผ่านการอนุมัติสลับได้ระหว่างลูกค้ากับช่าง คนทั่วไปเห็นมุมลูกค้าอย่างเดียว (ไม่มีปุ่มสลับ) */
let MODE="customer";
/* เปิดตรงที่ /work หรือ /studio (เช่น กดรีเฟรชใน Studio): ขึ้นกรอบ Studio + โครงกำลังโหลดทันที
   ไม่โชว์หน้าแรกของลูกค้าระหว่างรอรู้ว่าเป็นใคร (เดิมเห็นหน้าแรกหลายวินาทีจนนึกว่าเด้งกลับหน้าหลัก) */
let BOOT_TECH=/^\/(work|studio)(\/|$)/.test(location.pathname);
function modesAvail(){
  const m=["customer"];
  /* ร้านทดสอบที่เจ้าของระบบอนุมัติทดสอบให้ผู้สมัคร (ไม่ใช่ทีมงาน) ก็เข้า Studio ได้ — ลองระบบได้ทุกขั้น ลูกค้าทั่วไปไม่เห็น */
  if(ME&&(ME.staff||ME.technician))m.push("tech");
  if(ME&&ME.staff)m.push("staff");
  return m;
}
function drawModes(){
  const av=modesAvail();
  /* ค่าที่ผู้ใช้เลือกเองมาก่อนเสมอ ถ้ายังไม่เคยเลือก ทีมงานเริ่มที่มุมทีมงาน คนอื่นเริ่มที่มุมลูกค้า
     ต้องคิดใหม่ทุกครั้งที่รู้ข้อมูลผู้ใช้เพิ่ม — ตอนเปิดหน้ายังไม่รู้ว่าใครล็อกอิน */
  if(!av.includes(MODE))MODE="customer";
  const el=$("modes");el.hidden=av.length<2;
  const L={customer:["ti-user",T("ลูกค้า","Customer")],tech:["ti-tool",T("ช่าง","Mechanic")],staff:["ti-shield-check",T("ทีมงาน","Staff")]};
  el.innerHTML=av.map(m=>`<button data-m="${m}" class="${m===MODE?"on":""}"><i class="ti ${L[m][0]}"></i>${L[m][1]}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  applyMode();
}
/* มุมลูกค้า = หน้าแรก · มุมช่าง (/work) และมุมทีมงาน (/staff) เป็นชั้นที่ซ้อนขึ้นไป — ปุ่มย้อนกลับมุมเดิม */
let MODEL=null;
function setMode(m,fromNav){
  const prev=MODE;MODE=m;drawModes();window.scrollTo(0,0);if(m==="tech")dash();
  if(fromNav||prev===m)return;
  if(m==="customer"){if(MODEL)Nav.back(MODEL);return}
  if(MAPL){const l=MAPL;MAPL=null;Nav.drop(l)}
  const under=MODEL;
  MODEL=Nav.push({url:m==="tech"?"/work":"/staff",tag:"mode",close:()=>{MODEL=under;setMode(prev,true)}});
}
/* แท็บแดชบอร์ดช่าง (/work/find · queue · shop · ai · posts) — เปลี่ยนแท็บ = หนึ่งขั้นในประวัติ */
function setTab2(t,fromNav){
  const was=DT;if(was===t)return;DT=t;drawTab();
  if(!fromNav)Nav.push({url:"/work/"+t,tag:"wtab",close:()=>setTab2(was,true)});
}
function applyMode(){
  const tech=MODE==="tech"||BOOT_TECH;
  if(BOOT_TECH&&MODE!=="tech"&&!$("dBody").dataset.boot){$("dBody").dataset.boot=1;if(!paintSnap())stuSkel()}
  if(tech&&VIEW==="map"){VIEW="menu";document.body.classList.remove("onmap");$("vMap").hidden=true}
  $("vMenu").hidden=tech||VIEW==="map";$("vTech").hidden=!tech;
  const sb=$("staff");if(sb&&ME&&ME.staff)sb.hidden=MODE!=="staff";
  document.body.dataset.mode=tech?"tech":MODE;
  if(!tech)stopAlerts();
}

/* ═══ ภาพล่าสุดของ Studio ═══
   เก็บเฉพาะที่หน้าแรกของ Studio ต้องใช้ (ชื่อ/รูปร้าน สถานะ รายการงาน: รถ อาการ สถานะ) ไม่มีชื่อ เบอร์ หรือที่อยู่ลูกค้า
   ผูกกับบัญชี เปลี่ยนบัญชี/ออกจากระบบ = ลบ · ใช้ได้ 7 วัน */
const SNAP="spire_studio_snap",URGENT_MS=3*3600e3;   /* งานด่วนแดงอยู่ 3 ชม. — เท่ากับหลังบ้าน */
function saveSnap(){try{
  if(!U||!ME||!ME.technician||ME.__snap)return;const t=ME.technician;
  ls.set(SNAP,{uid:U.uid,at:Date.now(),staff:!!ME.staff,admin:!!ME.admin,online:DSTATS?!!DSTATS.online:!!t.online,
    tech:{id:t.id,shop:t.shop,name:t.name,avatar:t.avatar,online:t.online,vacation:t.vacation||null,test:!!t.test,identityHold:!!t.identityHold,radius:t.radius,cats:t.cats,mobile:t.mobile},
    jobs:JOBS_OK?techJobs().slice(0,40).map(j=>({id:j.id,status:j.status,car:j.car,symptom:j.symptom,total:j.total,unread:j.unread,needsMe:j.needsMe,urgent:j.urgent,side:j.side,techId:j.techId,techName:j.techName,createdAt:j.createdAt,updatedAt:j.updatedAt,group:j.group||null,expiresAt:j.expiresAt||null,expired:!!j.expired})):[],
    near:NEAR?{radius:NEAR.radius,center:NEAR.center,posts:(NEAR.posts||[]).filter(p=>p.urgent).slice(0,10).map(p=>({id:p.id,urgent:1,mine:p.mine,car:p.car,symptom:p.symptom,dist:p.dist,createdAt:p.createdAt,cat:p.cat}))}:null})}catch(e){}}
function dropSnap(){try{localStorage.removeItem(SNAP)}catch(e){}}
/* วาด Studio จากภาพล่าสุดทันที (ยังไม่ต่อเน็ต) — คืน true ถ้าวาดได้ */
function paintSnap(){
  const sn=ls.get(SNAP,null),pt=ls.get("spire_partner",null);
  if(!sn||!pt||pt.uid!==sn.uid||pt.s!=="shop"||Date.now()-sn.at>7*864e5)return false;
  if(!ME)ME={uid:sn.uid,staff:sn.staff,admin:sn.admin,technician:sn.tech,__snap:true};
  if(!JOBS_OK){JOBS=sn.jobs||[];JOBS_OK=true}
  if(!NEAR&&sn.near)NEAR=sn.near;
  if(!DSTATS)DSTATS={online:!!sn.online,__snap:true};
  const m=MODE;MODE="tech";try{drawTab()}catch(e){}MODE=m;return true;
}
/* ยังไม่เคยมีภาพล่าสุด: โครงรูปทรงเดียวกับหน้างานจริง (หัว แถบสลับ แถวงาน) ของจริงมาแทนตรงตำแหน่งเดิม */
function stuSkel(){
  $("dHead").innerHTML=`<div class="stu-h"><h1>${T("งานของฉัน","My jobs")}</h1><div class="stu-hr"><span class="stu-sk a"></span><span class="stu-sk b"></span></div></div>
    <div class="stu-seg" role="tablist"><button type="button" class="on" tabindex="-1">${T("ต้องทำต่อ","To do")}</button><button type="button" tabindex="-1">${T("หางานใกล้ฉัน","Find work nearby")}</button></div>`;
  $("dBody").innerHTML=`<section class="stu-sec" style="margin-top:8px">${`<div class="stu-row sk-row" aria-hidden="true"><span class="stu-ri stu-sk"></span><span class="stu-rb"><i class="stu-sk l1"></i><i class="stu-sk l2"></i></span></div>`.repeat(3)}</section>`;
}

/* ═══ dashboard ช่าง ═══ */
let DT="queue",FIND_NEW=false,DSTATS=null,NEAR=null,FMAP=null,FL=null,alertT=0,firstNear=true,URG_KEY="";
const SEEN=new Set(ls.get("spire_seen_posts",[])),SEEN_URG=new Set(ls.get("spire_seen_urgent",[]));let firstUrg=true;
const ago=at=>{const m=Math.round((Date.now()-at)/60000);return m<1?T("เมื่อกี้","just now"):m<60?T(`${m} นาทีที่แล้ว`,`${m} min ago`):m<1440?T(`${Math.round(m/60)} ชม.ที่แล้ว`,`${Math.round(m/60)} h ago`):T(`${Math.round(m/1440)} วันที่แล้ว`,`${Math.round(m/1440)} d ago`)};
const kfmt=n=>n>=10000?(Math.round(n/100)/10)+"k":money(n);
/* ═══ Studio: กรอบ + หัวหน้า + ป้ายนับ ═══
   หน้า (DT) → เมนู: queue/find = งาน · messages = ข้อความ · posts = บริการ · shop/ai = ร้านของฉัน
   ที่อยู่: /work · /work/find · /work/messages · /work/posts · /work/shop · /work/ai (ลิงก์ /studio/* เดิมยังเปิดได้) */
const SPAGE={queue:"jobs",find:"jobs",messages:"msgs",posts:"svc",shop:"shop",ai:"shop"};
const SFIRST={jobs:"queue",msgs:"messages",svc:"posts",shop:"shop"};
const myShop=()=>ME&&ME.technician;
const techJobs=()=>JOBS.filter(j=>j.side==="technician"||j.side==="both");
/* คำขอ/ข้อเสนอที่ยังไม่ตกลงกันมีอายุ (ตรงกับหลังบ้าน): งานด่วน 3 ชม. · ร้านยังไม่เสนอราคา และข้อเสนอในประกาศ 48 ชม. · ใบเสนอราคา 7 วัน
   หลังบ้านส่ง expiresAt/expired มาเอง — ค่าประมาณข้างล่างใช้ตอนวาดจากภาพล่าสุด หรือหลังบ้านรุ่นก่อน
   หมดอายุ = ไม่อยู่ในรายการเลย (ไม่ขึ้นทั้ง "ต้องทำต่อ" และ "งานที่ผ่านมา") */
const JOB_TTL=48*3600e3,QUOTE_TTL=7*864e5;
const expAt=j=>j.status!=="requested"&&j.status!=="quoted"?0:j.expiresAt||(j.urgent?(j.createdAt||0)+URGENT_MS
  :j.status==="requested"||j.group?(j.createdAt||0)+JOB_TTL:(j.updatedAt||j.createdAt||0)+QUOTE_TTL);
const goneJob=j=>!!j.expired||(expAt(j)>0&&expAt(j)<=Date.now());
const liveJob=j=>!["completed","cancelled"].includes(j.status)&&!goneJob(j);
const urgJob=j=>!!(j.urgent&&liveJob(j)&&Date.now()-(j.createdAt||0)<URGENT_MS);
async function dash(){
  if(MODE!=="tech")return;
  const t=myShop();
  stuChrome();
  if(!t){
    $("dHead").innerHTML=`<div class="stu-h"><h1>Studio</h1></div>`;
    $("dBody").innerHTML=`<div class="stu-empty"><i class="ti ti-building-store"></i><b>${T("ยังไม่มีร้าน","No shop yet")}</b><p>${ME&&ME.staff?T("ทีมงานเปิดร้านทีมงานได้ทันที ใช้แค่ตำแหน่ง ไม่ต้องรอตรวจ","Staff can open a staff shop instantly — only a location needed"):T("สมัครเป็นพาร์ทเนอร์ช่างของ Cendon เพื่อรับงานจากลูกค้าแถวบ้าน","Apply as a Cendon partner mechanic to get local jobs")}</p><button class="lx-cta" id="dGo" type="button">${ME&&ME.staff?T("เปิดร้านทีมงาน","Open a staff shop"):T("สมัครเป็นช่าง","Apply")}</button></div>`;
    $("dGo").onclick=e=>PREV()?busy(e.currentTarget,quickTech):openJoin();return;
  }
  drawTab();
  /* ตัวเลขสถิติใช้แค่สถานะเปิดรับงานบนหัว — ไม่ขวางการวาดหน้า */
  api("/api/tech/stats").then(d=>{DSTATS=d;if(MODE==="tech"&&SPAGE[DT]==="jobs")stuHead()}).catch(()=>{});
  /* ดึงงานใหม่ตลอดเวลาที่อยู่ใน Studio ไม่ว่าสถานะไหน — สถานะมีผลแค่เสียงเตือน (เดิมไม่เปิดรับงาน = ไม่ดึงเลย งานด่วนไม่ขึ้นจนกดรีเฟรชเอง) */
  startAlerts();
  refreshJobs();
}
/* ส่วนที่เหมือนกันทุกหน้า: เมนูที่เลือก · ชื่อหน้าบนหัว (คอม) · รูปร้านมุมขวา · ป้ายนับ */
function stuChrome(){

  const [lab,ic]=NEXT[j.status]||[STATUS[j.status]||j.status,"ti-car"],live=liveJob(j),me=j.needsMe&&live,u=urgJob(j),left=live?leftS(j):"";
  return `<button class="stu-row${u?" urg":""}" type="button" data-j="${j.id}"><span class="stu-ri${me?" me":""}"><i class="ti ${u?"ti-urgent":ic}"></i></span>
    <span class="stu-rb"><span class="stu-rt"><b class="nt">${esc(j.car||T("รถของลูกค้า","Customer's car"))}</b><time>${agoS(j.updatedAt||j.createdAt)}</time>${j.unread?`<em>${j.unread}</em>`:""}</span>
      ${j.symptom?`<small class="nt">${esc(j.symptom)}</small>`:""}
      <span class="stu-rf"><span class="stu-rs${me?" me":""}">${me?T("รอคุณ · ","Your turn · "):""}${lab}${left?` · <i>${left}</i>`:""}</span>${j.total?`<b>฿${money(j.total)}</b>`:""}</span></span></button>`;
}
const errBar=(msg,id)=>`<p class="stu-err"><i class="ti ti-cloud-off"></i><span>${T("โหลดข้อมูลล่าสุดไม่สำเร็จ","Couldn't load the latest data")}${msg?` — ${esc(msg)}`:""}</span><button class="lx-gh" type="button" id="${id}">${T("ลองใหม่","Retry")}</button></p>`;
/* ── งาน → ต้องทำต่อ ──
   แบ่ง 3 กลุ่มชัด ๆ: งานด่วน (แดง) · รอคุณ · รอลูกค้า — ในแต่ละกลุ่มใหม่สุดอยู่บน · ที่หมดอายุไม่แสดงเลย
   โหลดไม่สำเร็จ ≠ ไม่มีงาน — บอกตามจริงและให้ลองใหม่ โดยยังแสดงรายการเดิมไว้ */
let EXP_T=0;
function tabQueue(){
  const B=$("dBody"),all=techJobs(),t0=Date.now();
  const err=JOBS_ERR?errBar(JOBS_ERR,"stuRetry"):"";
  clearTimeout(EXP_T);
  if(!JOBS_OK&&!JOBS_ERR){B.innerHTML='<div class="skel"></div><div class="skel" style="margin-top:10px"></div>';return}
  const at=j=>j.updatedAt||j.createdAt||0,newest=(a,b)=>at(b)-at(a);
  const live=all.filter(liveJob);
  /* งานด่วนรอบตัวที่ยังไม่มีใครรับ (ไม่เกิน 3 ชม.) รวมกับใบงานด่วนของร้าน เรียงใหม่สุดบน */
  const urgNear=((NEAR&&NEAR.posts)||[]).filter(p=>p.urgent&&!p.mine&&t0-(p.createdAt||0)<URGENT_MS);
  const urg=[...urgNear.map(p=>({p,at:p.createdAt||0})),...live.filter(urgJob).map(j=>({j,at:at(j)}))].sort((a,b)=>b.at-a.at);
  const mine=live.filter(j=>!urgJob(j)&&(j.needsMe||j.status==="disputed")).sort(newest);
  const wait=live.filter(j=>!urgJob(j)&&!(j.needsMe||j.status==="disputed")).sort(newest);
  const past=all.filter(j=>!liveJob(j)&&!goneJob(j)).sort(newest).slice(0,20);
  const grp=(cls,title,list)=>`<section class="stu-grp${cls}"><h2 class="stu-gh">${title}<em>${list.length}</em></h2><div class="stu-cards">${list.join("")}</div></section>`;
  const urgRow=p=>`<button class="stu-row urg" type="button" data-up="${esc(p.id)}"><span class="stu-ri"><i class="ti ti-urgent"></i></span>
    <span class="stu-rb"><span class="urg-tag"><i class="ti ti-map-pin"></i>${T("ใกล้คุณ · ยังไม่มีใครรับ","Near you · nobody has taken it")}</span>
      <span class="stu-rt"><b class="nt">${esc(p.car||"")}</b><time>${agoS(p.createdAt)}</time></span>${p.symptom?`<small class="nt">${esc(p.symptom)}</small>`:""}
      <span class="stu-rf"><span class="stu-rs me">${T("เสนอราคาเลย","Send a quote")} · ${p.dist} ${T("กม.","km")}</span></span></span></button>`;
  const any=urg.length||mine.length||wait.length;
  B.innerHTML=err+(urg.length?grp(" hot",T("งานด่วน · รถเสียตอนนี้","Urgent · broken down now"),urg.map(x=>x.p?urgRow(x.p):jobRow(x.j))):"")
    +(mine.length?grp("",T("รอคุณ","Your turn"),mine.map(jobRow)):"")
    +(wait.length?grp("",T("รอลูกค้า","Waiting for the customer"),wait.map(jobRow)):"")
    +(any||JOBS_ERR&&!JOBS_OK?"":`<div class="stu-empty"><i class="ti ti-clipboard-check"></i><b>${T("ยังไม่มีงานที่ต้องดำเนินการ","Nothing to do right now")}</b><p>${T("เมื่อมีคำขอใหม่ รายการจะแสดงที่นี่","New requests will show up here")}</p><button class="lx-cta" type="button" id="stuFind">${T("หางานใกล้ฉัน","Find work nearby")}</button></div>`)
    +(past.length?`<details class="stu-past"><summary>${T(`งานที่ผ่านมา (${past.length})`,`Past jobs (${past.length})`)}<i class="ti ti-chevron-down"></i></summary><div class="stu-cards">${past.map(jobRow).join("")}</div></details>`:"");
  B.querySelectorAll("[data-j]").forEach(x=>x.onclick=()=>openJob(x.dataset.j,true));
  B.querySelectorAll("[data-up]").forEach(x=>x.onclick=()=>openPost(urgNear.find(p=>p.id===x.dataset.up)));
  if($("stuFind"))$("stuFind").onclick=()=>setTab2("find");
  if($("stuRetry"))$("stuRetry").onclick=e=>busy(e.currentTarget,refreshJobs);
  /* ใบที่ใกล้หมดอายุ/งานด่วนที่ใกล้ครบ 3 ชม.: วาดใหม่ตอนถึงเวลา ไม่ต้องรอข้อมูลรอบถัดไป */
  const nx=Math.min(...live.map(expAt).filter(e=>e>t0),...live.filter(urgJob).map(j=>(j.createdAt||0)+URGENT_MS),...urgNear.map(p=>(p.createdAt||0)+URGENT_MS));
  if(nx<Infinity)EXP_T=setTimeout(()=>{if(MODE==="tech"&&DT==="queue"&&!$("bs").classList.contains("on"))drawTab()},Math.min(nx-t0+500,2e9));
}
/* ── ข้อความ: ลูกค้าทักถาม (ยังไม่ใช่ใบงาน) + แชตในใบงาน ── */
function stuThRow(h){
  const l=h.last;
  return `<button class="stu-row" type="button" data-th="${h.id}"><span class="stu-ri"><i class="ti ti-message-circle"></i></span>
    <span class="stu-rb"><b class="nt">${esc(h.customerName||T("ลูกค้า","Customer"))}</b><small class="nt">${l?esc((l.role===h.role?T("คุณ: ","You: "):"")+l.text):""}</small>${h.gig&&h.gig.title?`<span class="stu-rs nt">${esc(h.gig.title)}</span>`:""}</span>
    <span class="stu-rr">${l?`<small>${ago(l.at)}</small>`:""}${h.unread?`<em>${h.unread}</em>`:""}<i class="ti ti-chevron-right"></i></span></button>`;
}
function tabMsgs(){
  const B=$("dBody");
  const ths=THREADS.filter(h=>h.role==="technician").sort((a,b)=>(b.unread>0)-(a.unread>0)||((b.last&&b.last.at)||0)-((a.last&&a.last.at)||0));
  const jc=techJobs().filter(liveJob).sort((a,b)=>(b.unread||0)-(a.unread||0)||((b.updatedAt||0)-(a.updatedAt||0)));
  const err=JOBS_ERR?errBar(JOBS_ERR,"stuRetry"):"";
  B.innerHTML=err+(!ths.length&&!jc.length?(JOBS_OK||!JOBS_ERR?`<div class="stu-empty"><i class="ti ti-messages"></i><b>${T("ยังไม่มีข้อความ","No messages yet")}</b><p>${T("เมื่อลูกค้าทักถามหรือคุยในใบงาน ข้อความจะอยู่ที่นี่","Customer questions and job chats will appear here")}</p></div>`:"")
    :(ths.length?`<section class="stu-sec" style="margin-top:4px"><h2>${T("ลูกค้าทักถาม","Customer questions")}<small>${T("ยังไม่ใช่ใบงาน","not a job yet")}</small></h2>${ths.map(stuThRow).join("")}</section>`:"")
    +(jc.length?`<section class="stu-sec"><h2>${T("แชตในใบงาน","Job chats")}</h2>${jc.map(j=>`<button class="stu-row" type="button" data-jc="${j.id}"><span class="stu-ri"><i class="ti ti-car"></i></span>
        <span class="stu-rb"><b class="nt">${esc(j.car||"")}</b><small class="nt">${esc(j.symptom||"")}</small><span class="stu-rs">${(NEXT[j.status]||[STATUS[j.status]||j.status])[0]}</span></span>
        <span class="stu-rr">${j.unread?`<em>${j.unread}</em>`:""}<i class="ti ti-chevron-right"></i></span></button>`).join("")}</section>`:""));
  B.querySelectorAll("[data-th]").forEach(x=>x.onclick=()=>openThread(x.dataset.th));
  B.querySelectorAll("[data-jc]").forEach(x=>x.onclick=()=>busy(x,async()=>{const j=(await api("/api/tech/jobs/"+x.dataset.jc)).job;openChat(j,{list:true})}));
  if($("stuRetry"))$("stuRetry").onclick=e=>busy(e.currentTarget,refreshJobs);
}

/* ── ร้านของฉัน ── */
let SHOPED=null;
/* แท็บร้านของฉัน: ตัวอย่างหน้าร้านแบบที่ลูกค้าเห็น + ปุ่มแก้ไข (ฟอร์มย้ายไปอยู่ในแผ่นแยก ไม่ปนกับหน้าร้าน) */

    :[`<i class="ti ti-shield so-vi"></i>`,T("ผ่านการตรวจโดยทีมงาน","Approved by the team"),facts.length?facts.map(f=>f[1]).join(" · ")+(t.vetting&&t.vetting.at?T(" · ตรวจเมื่อ "," · checked ")+fmtDay(t.vetting.at):""):T("ลูกค้าเห็นป้ายผ่านการตรวจบนหน้าร้าน","Customers see the approval on your storefront")];

        <span class="sf-tx"><b class="nt">${esc(t.shop||t.name)}</b><small>${meta}</small></span><span class="sf-hint"><i class="ti ti-qrcode"></i>${T("QR","QR")}</span></span>

    <div class="stu-vet" style="margin-top:14px">${vet[0]}<span><b>${vet[1]}</b><small>${vet[2]}</small></span></div>
    <section class="stu-sec stu-list" style="margin-top:6px">

      ${row("sStats","ti-chart-bar",T("สถิติร้าน","Shop stats"),T("รายได้ คนเข้าดู และเส้นทางงาน","Earnings, views and job funnel"))}
      ${row("sAi","ti-bulb",T("คำแนะนำปรับร้าน","Shop tips"),T("สิ่งที่ช่วยให้ลูกค้าเลือกร้านคุณมากขึ้น","What helps customers pick your shop"))}

/* ลิงก์และ QR ของร้าน (QR สร้างในเครื่อง โหลดไลบรารีตอนเปิดครั้งแรก) */

      const draw=()=>{try{$("qrB").innerHTML="";new QRCode($("qrB"),{text:link,width:180,height:180,colorDark:"#09090B",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){}};

    }});
}

/* ── แจ้งเตือนงานใหม่ ──
   เปิดรับงานอยู่ = ถามทุก 20 วินาที ประกาศที่ยังไม่เคยเห็น → เสียง + สั่น + ป้ายแดงที่แท็บหางาน
   เสียงต้องปลดล็อกจากการแตะของผู้ใช้ก่อน (กฎของเบราว์เซอร์) — ปุ่มเปิดรับงานทำหน้าที่นี้ */
let ACTX=null;
function unlockAudio(){try{ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();ACTX.resume()}catch(e){}}
function ding(){try{if(!ACTX||ls.get("spire_tech_sound",true)===false)return;const o=ACTX.createOscillator(),g=ACTX.createGain();o.type="sine";o.frequency.setValueAtTime(880,ACTX.currentTime);o.frequency.setValueAtTime(1320,ACTX.currentTime+.12);
  g.gain.setValueAtTime(.001,ACTX.currentTime);g.gain.exponentialRampToValueAtTime(.3,ACTX.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ACTX.currentTime+.4);o.connect(g).connect(ACTX.destination);o.start();o.stop(ACTX.currentTime+.42)}catch(e){}}
let PULSE="",PULSE_OK=null,FULL_AT=0,ALERT_GEN=0;
function startAlerts(){
  clearTimeout(alertT);const gen=++ALERT_GEN;   /* เริ่มรอบใหม่ = รอบเก่าที่ค้างอยู่หยุดเอง ไม่วิ่งซ้อนกันสองชุด */
  const loud=()=>!!(DSTATS?DSTATS.online:(myShop()||{}).online);
  const buzz=pat=>{if(!loud())return;ding();try{navigator.vibrate&&navigator.vibrate(pat)}catch(e){}};
  /* ดึงรายการเต็ม (ประกาศรอบตัว + ใบงาน) — ทำเฉพาะตอนชีพจรบอกว่ามีอะไรเปลี่ยน หรือครบ 60 วิ */
  const full=async()=>{FULL_AT=Date.now();
    try{const d=await api("/api/tech/posts/near");NEAR=d;const fresh=d.posts.filter(p=>!SEEN.has(p.id));
      if(fresh.length){fresh.forEach(p=>SEEN.add(p.id));ls.set("spire_seen_posts",[...SEEN].slice(-300));
        if(!firstNear){const u=fresh.some(p=>p.urgent);buzz(u?[250,90,250,90,250]:[180,80,180]);
          toast(u?T("งานด่วน! รถเสียใกล้คุณ — ดูในงานของฉัน","Urgent! A breakdown near you — see My jobs"):T(`งานใหม่ใกล้คุณ ${fresh.length} งาน`,`${fresh.length} new job${fresh.length>1?"s":""} nearby`),u?"ti-urgent":"ti-bell-ringing");
          if(MODE==="tech"&&(DT==="find"||DT==="queue"))drawTab();else{FIND_NEW=true;stuBadges()}}
      }
      /* รายการงานด่วนรอบตัวเปลี่ยน (มีใหม่/มีคนรับไปแล้ว/หมดอายุ) = วาดหน้า "ต้องทำต่อ" ใหม่ · ไม่เปลี่ยนก็ไม่วาดซ้ำ ไม่กวนคนที่กำลังกดอยู่ */
      const uk=d.posts.filter(p=>p.urgent&&!p.mine).map(p=>p.id).join();
      if(uk!==URG_KEY){URG_KEY=uk;if(MODE==="tech"&&DT==="queue"&&!$("bs").classList.contains("on"))drawTab()}
      firstNear=false}catch(e){}
    /* งานด่วนที่ลูกค้าส่งตรงถึงร้าน (เรียกช่างด่วน): ดึงใบงานใหม่ทุกรอบ เจอใบด่วนที่ยังไม่เคยเห็น = ขึ้นแดงบนสุด (+ เสียงเมื่อเปิดรับงาน) */
    try{await refreshJobs();const hot=techJobs().filter(j=>j.status==="requested"&&urgJob(j)&&!SEEN_URG.has(j.id));
      if(hot.length){hot.forEach(j=>SEEN_URG.add(j.id));ls.set("spire_seen_urgent",[...SEEN_URG].slice(-200));
        if(!firstUrg){buzz([250,90,250,90,250]);
          toast(T("งานด่วน! ลูกค้ารถเสียตอนนี้ — เปิดดูในงานของฉัน","Urgent! A customer is broken down now — see My jobs"),"ti-urgent")}
        if(MODE==="tech"&&DT==="queue")drawTab()}
      firstUrg=false}catch(e){}
    saveSnap()};
  /* ชีพจร: ถามหลังบ้านสั้น ๆ ทุก 3 วิว่ามีอะไรใหม่ไหม (งานด่วน ข้อความ ประกาศ) — มีเมื่อไรดึงทันที = เห็นงานแทบจะทันที
     หลังบ้านรุ่นเก่ายังไม่มีชีพจร → ดึงรายการเต็มทุก 15 วิแทน · ซ่อนแท็บ = ทุก 30 วิ */
  const tick=async()=>{
    if(MODE!=="tech"||gen!==ALERT_GEN)return;
    let changed=true;
    if(PULSE_OK!==false){try{const r=await api("/api/tech/pulse");PULSE_OK=true;changed=r.v!==PULSE;PULSE=r.v}

let meTimer=0;
async function refreshMe(){
  if(!U){ME=null;return}
  try{ME=await api("/api/tech/me")}catch(e){ME=null}
  const n=ME&&ME.attention||0;$("jobDot").hidden=!n;$("jobDot").textContent=n;
  const t=ME&&ME.technician,a=ME&&ME.application;
  /* เปิดลิงก์หน้าร้าน/บริการของตัวเองตรง ๆ: หน้านั้นวาดก่อนรู้ว่าเป็นเจ้าของ — วาดใหม่ให้มีปุ่มของเจ้าของ (แก้ไข · สปอนเซอร์) */
  {const oc=$("bs").classList.contains("on")&&SH.cur;
   const og=oc&&oc.gig?(GIGS||[]).find(x=>x.id==oc.gig):null,mineOpen=!!(t&&oc&&(oc.shop===t.id||(og&&og.tech&&og.tech.id===t.id)));
   if(oc&&!oc.owner&&mineOpen){if(oc.shop)openTech(oc.shop);else openGig(oc.gig)}
   /* เจ้าของระบบเปิดลิงก์ร้าน/บริการของคนอื่นตรง ๆ: วาดใหม่ให้มีเครื่องมือเจ้าของระบบ */
   else if(oc&&!oc.owner&&!oc.boss&&ME&&ME.owner){if(oc.shop)openTech(oc.shop);else if(oc.gig)openGig(oc.gig)}}
  /* หน้าบัญชี (มือถือ) อ่านค่านี้เพื่อเขียนปุ่มว่า "สมัครเป็นช่าง" หรือ "Studio" — เก็บแค่สถานะ ไม่มีข้อมูลส่วนตัว */
  if(ME)try{localStorage.setItem("spire_partner",JSON.stringify({uid:U.uid,s:t&&(!t.test||ME.staff)?"shop":a&&!a.test?a.status:"none"}))}catch(e){}
  $("joinT").textContent=t&&!t.test?"พื้นที่พาร์ทเนอร์":a&&!a.test&&a.status==="pending"?"ใบสมัครกำลังพิจารณา":"ร่วมเป็นพาร์ทเนอร์ช่าง";
  $("joinS").textContent=t&&!t.test?"ดูงานที่ลูกค้าส่งมา":a&&!a.test?"เลขที่ "+(a.appNo||"")+(a.status==="rejected"?" · ต้องแก้ไข":""):ME&&ME.staff?"ทีมงานเป็นช่างได้ทันที":"รับงานจากลูกค้าในพื้นที่";
  staffBar();drawModes();refreshJobs().then(()=>{greet();if(MODE==="tech")dash()});
  clearTimeout(meTimer);meTimer=setTimeout(()=>{if(!document.hidden)refreshMe()},60000);
}

/* ═══ คำทักทาย — แบบเดียวกับหน้าหลัก ═══ */
function greet(){
  if(!$("greet"))return;
  const h=new Date().getHours();
  const part=h<5?T("ดึกแล้ว","Late night"):h<12?T("สวัสดีตอนเช้า","Good morning"):h<17?T("สวัสดีตอนบ่าย","Good afternoon"):T("สวัสดีตอนเย็น","Good evening");
  let nm="";try{const c=JSON.parse(localStorage.getItem("spire_cachedUser")||localStorage.getItem("cachedUser")||"null");nm=(c&&(c.name||c.displayName)||"").split(" ")[0]}catch(e){}
  if(!nm&&U&&U.displayName)nm=U.displayName.split(" ")[0];
  $("greet").innerHTML=`${esc(part)}${nm?" "+esc(nm):""} <span class="w">👋</span>`;
  const live=JOBS.filter(j=>!["completed","cancelled"].includes(j.status)).length;
  $("greetSub").textContent=live?T(`มี ${live} งานกำลังดำเนินการ`,`${live} job${live>1?"s":""} in progress`):T("รถเป็นอะไร บอก Cendon ได้เลย","Tell Cendon what's wrong with your car");
}

/* ═══ เริ่มทำงาน ═══ */
/* เครื่องใหม่ที่ยังไม่มีรถในเครื่อง — ดึงรถของบัญชีจากเซิร์ฟเวอร์มาให้ ฟอร์มจะได้ใส่รถให้เองโดยไม่ต้องพิมพ์
   รูปแบบเดียวกับที่หน้าแชตเก็บ (spire_garage) ถ้ามีรถในเครื่องอยู่แล้วไม่แตะเลย */
async function pullCars(){
  try{
    if((ls.get("spire_garage",[])||[]).length)return;
    const r=await fetch(API+"/api/cars",{headers:{Authorization:"Bearer "+await U.getIdToken()}});
    if(!r.ok)return;const arr=await r.json();if(!Array.isArray(arr)||!arr.length)return;
    if((ls.get("spire_garage",[])||[]).length)return;
    ls.set("spire_garage",arr.map(c=>({id:c.id,make:c.make||"",model:c.model||"",name:`${c.make||""} ${c.model||""}`.trim(),
      year:c.year!=null?String(c.year):"",mileage:c.mileage!=null?String(c.mileage):"",type:"sedan",history:[]})));
    if(!ls.get("spire_selCar",null))ls.set("spire_selCar",arr[0].id);
  }catch(e){}
}
(function init(){

  if(p.get("q")){$("q").value=p.get("q");F.q=p.get("q");$("sbox").classList.add("has")}

  /* รายชื่อโหลดทันทีโดยไม่รอล็อกอิน — คนรถเสียไม่ควรต้องรอ
     พอรู้ว่าใครเข้ามา ค่อยโหลดซ้ำ (ทีมงานจะเห็นช่างทีมงานเพิ่ม) */
  load();
  /* เปิดตามที่อยู่ในแถบ (เช่น /tech/<ร้าน>/reviews) แล้วตั้งปุ่มย้อนให้ถอยทีละขั้น */
  Nav.start({base:"/",legacy:legacyLink});
  let bt=0;
  (function boot(){
    if(typeof firebase==="undefined"||!firebase.initializeApp){if(++bt<150)setTimeout(boot,120);return}
    try{
      if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(fbConfig);
      auth=firebase.auth();
      auth.onAuthStateChanged(async u=>{if(homeVoice&&U?.uid!==u?.uid){homeVoice.dispose();homeVoice=null;}U=u||null;if(!U)purgeChatCache();{const sn=ls.get(SNAP,null);if(sn&&(!U||sn.uid!==U.uid)){dropSnap();if(ME&&ME.__snap)ME=null}}READY.user.done();try{navPaint(U)}catch(e){}greet();if(U)pullCars();await refreshMe();READY.me.done();if(U)await load();else diag();READY.auth.done()});
    }catch(e){}
  })();
  /* ลงทะเบียน service worker หลังหน้าขึ้นแล้ว — แอปที่ติดตั้งบนมือถือจะเปิดจากหน้าที่เก็บไว้ได้ทันทีตอนเน็ตช้า
     (เดิมลงทะเบียนเฉพาะหน้าที่มีแจ้งเตือน คนที่ใช้แค่หน้าแรกจึงไม่มีหน้าสำรองเลย) · ทำทีหลังเพื่อไม่แย่งเน็ตตอนเปิด */
  if("serviceWorker" in navigator){let sw=0;const reg=()=>{if(sw++)return;navigator.serviceWorker.getRegistration().then(r=>r||navigator.serviceWorker.register("./sw.js",{scope:"./"})).catch(()=>{})};
    addEventListener("load",()=>setTimeout(reg,2500));setTimeout(reg,8000)}
})();
