/* พลิกการ์ดเรียกช่าง — แบบเดียวกับช่องค้นหา: ลากไปซ้าย/ขวา การ์ดหมุนตามนิ้ว (เลื่อนไปกี่ % ก็หมุนกี่ %)
   ปล่อยเกินราวหนึ่งในสามของการ์ด หรือปัดเร็ว = พลิกไปอีกหน้า · ไม่ถึง = กลับที่เดิม · ลากแล้วไม่นับเป็นการแตะ
   ด้านที่ไม่ได้หันมาแตะไม่ได้ (โปรแกรมอ่านจอก็ไม่อ่าน) */
function qFlipWire(){
  const box=$("qFlip");if(!box)return;
  const IN=box.querySelector(".qf-in"),f=box.querySelector(".qf-f"),bk=box.querySelector(".qf-b"),tg=box.querySelector(".qf-tg");
  let back=false,rot=0;
  const turn=(deg,anim)=>{IN.style.transition=anim?"":"none";IN.style.transform=`rotateY(${deg}deg)`};
  const set=(to,dir)=>{
    if(to!==back){back=to;rot+=(dir||1)*180;box.classList.toggle("back",back);
      f.tabIndex=back?-1:0;bk.tabIndex=back?0:-1;f.setAttribute("aria-hidden",back);bk.setAttribute("aria-hidden",!back);
      tg.textContent=back?T("สลับเป็น เรียกช่างด่วน","Switch to urgent"):T("สลับเป็น เรียกช่างไม่ด่วน","Switch to not urgent")}
    turn(rot,true)};
  tg.onclick=()=>set(!back,1);
  /* แตะ ⇄ บนการ์ด = พลิก ไม่ใช่เปิดงาน */
  box.addEventListener("click",e=>{if(!e.target.closest(".qf-sw"))return;e.preventDefault();e.stopPropagation();if(!box.dataset.swiped)set(!back,1)},true);
  let pid=null,sx=0,sy=0,dx=0,w=1,t0=0,lock=null;
  box.addEventListener("pointerdown",e=>{if(pid!==null||e.button>0)return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;dx=0;lock=null;w=Math.max(120,box.offsetWidth);t0=performance.now();delete box.dataset.swiped});
  box.addEventListener("pointermove",e=>{if(e.pointerId!==pid)return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(lock===null){if(Math.abs(mx)<7&&Math.abs(my)<7)return;lock=Math.abs(mx)>Math.abs(my)*1.1?"x":"y";
      if(lock==="x"){box.dataset.swiped="1";try{box.setPointerCapture(pid)}catch(x){}}}
    if(lock!=="x")return;
    dx=mx;turn(rot+Math.max(-1,Math.min(1,dx/w))*180,false)});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;const was=lock;lock=null;if(was!=="x")return;
    const v=dx/Math.max(1,performance.now()-t0),go=Math.abs(dx)>w*.3||Math.abs(v)>.5&&Math.abs(dx)>20;
    if(go)set(!back,dx>0?1:-1);else turn(rot,true);
    setTimeout(()=>delete box.dataset.swiped,350)};
  box.addEventListener("pointerup",end);box.addEventListener("pointercancel",end);
}
/* ═══ ฟ้าคลื่นดาวตอนโหมด AI (HSKY) ═══
   ชั้นแสงไล่สี อำพัน→ส้ม→ชมพู→ม่วง ไหลเป็นคลื่น = ชุดเดียวกับตอน AI กำลังประมวลผลในห้องแชต
   บนนั้นเป็นดาวที่ไหลไปตามเส้นคลื่น กะพริบ และมีดาวตกเป็นครั้งคราว
   ความเข้ม = มุมที่ช่องค้นหาหมุนไป (ปัดครึ่งทางก็เห็นครึ่งหนึ่ง) · วาดเฉพาะตอนมองเห็น · ลดการเคลื่อนไหว = ภาพนิ่ง */
const HSKY=(function(){
  const box=$("hSky");if(!box)return null;
  const cv=box.querySelector("canvas"),cx=cv.getContext("2d"),hero=box.parentElement;
  const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0,dpr=1,lv=0,raf=0,vis=true,P=[],shoot=null,nextShoot=0,t0=performance.now();
  const COL=[[242,140,56],[255,77,122],[255,181,71],[139,107,255]];
  const dark=()=>document.documentElement.dataset.theme==="dark";
  /* เส้นคลื่น 3 เส้น: ความสูง ความถี่ ความเร็วต่างกัน — ดาวไหลไปตามเส้นเหล่านี้ */
  const WV=[{y:.30,a:.07,f:1.6,s:.18,p:0},{y:.46,a:.09,f:1.1,s:-.12,p:2.1},{y:.62,a:.06,f:2.2,s:.22,p:4.2}];
  const wy=(k,x,t)=>{const w=WV[k];return H*(w.y+w.a*Math.sin(x/W*Math.PI*2*w.f+t*w.s+w.p)+w.a*.45*Math.sin(x/W*Math.PI*2*w.f*2.3-t*w.s*1.7+w.p*1.3))};
  function size(){
    const r=hero.getBoundingClientRect(),vw=document.documentElement.clientWidth;
    /* เริ่มจากขอบบนสุดของหน้า กว้างเต็มจอ (ไม่ใช่แค่กรอบเนื้อหา) */
    W=vw;H=Math.round(Math.min(Math.max(innerHeight*.58,360),640));
    box.style.left=(-r.left)+"px";box.style.top=(-(r.top+scrollY))+"px";box.style.width=W+"px";box.style.height=H+"px";
    dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+"px";cv.style.height=H+"px";
    const n=W<700?80:150;
    P=Array.from({length:n},()=>({k:Math.random()*3|0,u:Math.random(),j:(Math.random()+Math.random()+Math.random()-1.5)*26,v:(.006+Math.random()*.018)*(Math.random()<.5?-1:1),
      r:Math.random()<.12?1.6+Math.random()*1.2:.5+Math.random()*1.1,tw:1+Math.random()*2.6,ph:Math.random()*6.28,c:COL[Math.random()*4|0]}));
  }
  function draw(now){
    const t=(now-t0)/1000,dk=dark();
    cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
    /* เส้นคลื่นเรืองบาง ๆ */
    WV.forEach((w,k)=>{const g=cx.createLinearGradient(0,0,W,0);g.addColorStop(0,"rgba(255,181,71,0)");g.addColorStop(.2,"rgba(242,140,56,.9)");g.addColorStop(.5,"rgba(255,77,122,.9)");g.addColorStop(.8,"rgba(139,107,255,.9)");g.addColorStop(1,"rgba(139,107,255,0)");
      cx.strokeStyle=g;cx.lineCap="round";
      for(const [lw,al] of [[7,dk?.07:.06],[1.2,dk?.42:.32]]){cx.lineWidth=lw;cx.globalAlpha=al;cx.beginPath();for(let x=0;x<=W;x+=8){const y=wy(k,x,t);x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}});
    /* ดาวไหลตามคลื่น */
    for(const s of P){
      s.u+=s.v*.016;if(s.u>1)s.u-=1;if(s.u<0)s.u+=1;
      const x=s.u*W,y=wy(s.k,x,t)+s.j*(.8+.2*Math.sin(t*.7+s.ph)),a=.35+.65*(.5+.5*Math.sin(t*s.tw+s.ph));
      const [r,g,b]=dk?(s.r>1.5?s.c:[255,255,255]):s.c;
      if(s.r>1.4){cx.globalAlpha=a*(dk?.22:.16);cx.fillStyle=`rgb(${r},${g},${b})`;cx.beginPath();cx.arc(x,y,s.r*4,0,6.283);cx.fill()}
      cx.globalAlpha=a*(dk?.95:.75);cx.fillStyle=`rgb(${r},${g},${b})`;cx.beginPath();cx.arc(x,y,s.r,0,6.283);cx.fill();
    }
    /* ดาวตกเป็นครั้งคราว วิ่งเลียบคลื่น */
    if(!calm){
      if(!shoot&&now>nextShoot){shoot={k:Math.random()*3|0,u:-.05,v:.55+Math.random()*.35,d:Math.random()<.5?1:-1};if(shoot.d<0)shoot.u=1.05}
      if(shoot){shoot.u+=shoot.v*.016*shoot.d;const x=shoot.u*W,y=wy(shoot.k,x,t);
        const tx=x-shoot.d*90,ty=wy(shoot.k,tx,t),g=cx.createLinearGradient(tx,ty,x,y);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(1,dk?"rgba(255,255,255,.95)":"rgba(255,77,122,.85)");
        cx.globalAlpha=1;cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(tx,ty);cx.lineTo(x,y);cx.stroke();
        if(shoot.u>1.1||shoot.u<-.1){shoot=null;nextShoot=now+3500+Math.random()*4500}}
    }
    cx.globalAlpha=1;
  }
  const loop=now=>{raf=0;if(lv<=0.01||!vis||document.hidden)return;draw(now);if(!calm)raf=requestAnimationFrame(loop)};
  const kick=()=>{if(!raf&&lv>0.01&&vis&&!document.hidden)raf=requestAnimationFrame(loop)};
  function level(k,anim){
    lv=k;box.style.transition=anim?"opacity .7s ease":"none";box.style.opacity=k.toFixed(3);
    box.classList.toggle("on",k>0.01);
    if(k>0.01){if(!W)size();kick()}
  }
  addEventListener("resize",()=>{if(W){size();if(calm)requestAnimationFrame(draw)}});
  document.addEventListener("visibilitychange",kick);
  if("IntersectionObserver" in window)new IntersectionObserver(es=>{vis=es[0].isIntersecting;kick()}).observe(box);
  return {level};
})();
/* ═══ ช่องค้นหา ⇄ คุยกับ AI ═══
   หน้าแรกเป็นค้นหาธรรมดา (แว่นขยาย + ปุ่มค้นหา) · สองหน้าขนาดเท่ากันเสมอ
   มือถือ: ปัดช่องไปซ้าย/ขวา ช่องหมุนตามนิ้ว (เลื่อนไปกี่ % ก็หมุนกี่ %) ปล่อยเกินราวหนึ่งในสี่หรือปัดเร็ว = พลิกไปอีกหน้า
   คอม: ดับเบิลคลิกที่พื้นที่ว่าง (ไม่ใช่ปุ่ม)
   โหมด AI: ส่งรูป · อัดเสียง · ลูกศรส่ง → เข้าห้องแชตแล้วส่งให้ AI ทันที (รถใช้คันที่เลือกบนหน้าแรก)
   ฟ้าด้านบนเป็นคลื่นดาว (HSKY) ค่อย ๆ ปรากฏตามมุมที่หมุน · ข้อความที่พิมพ์ค้างตามไปอีกหน้า · จำโหมดไว้ในแท็บนี้ */
const HERO=(function(){
  const F=$("hFlip"),IN=$("hFlipIn"),S=$("hSearch"),A=$("hForm"),si=$("hs"),ta=$("hq");
  const coarse=matchMedia("(pointer:coarse)").matches;
  let ai=false,rot=0;
  /* มุมหมุนจริง → ฟ้าดาวจางเข้าตามมุม (0 = ค้นหา · 1 = AI) */
  function turn(deg,anim){
    IN.style.transition=anim?"":"none";IN.style.transform=`rotateY(${deg}deg)`;
    const d=((deg%360)+360)%360,k=(d>180?360-d:d)/180;
    if(typeof HSKY!=="undefined"&&HSKY)HSKY.level(k,anim);
  }
  const seen=()=>{try{return +localStorage.getItem("spire_flipSeen")||0}catch(e){return 0}};
  /* คำแนะนำใต้ช่อง: หายไปเลยหลังพลิกครั้งแรก */
  function hint(){const h=$("hHint");

function matchOf(t,car){
  let sc=0;const why=[],d=t.dist;
  if(t.online){sc+=25;why.push(T("เปิดรับงานตอนนี้","Open now"))}
  if(d!=null){sc+=Math.max(0,30-d*2);if(d<=10)why.push(T("ห่าง ","")+distTxt(d))}
  if(t.reviewCount){const r=+t.rating||0;sc+=(r-3)*10*Math.min(1,t.reviewCount/5)}   /* คะแนนรีวิวขึ้นในการ์ดอยู่แล้ว ไม่ต้องซ้ำในเหตุผล */
  if(t.jobs){sc+=Math.min(15,t.jobs);if(t.jobs>=10)why.push(T(t.jobs+" งานสำเร็จ",t.jobs+" jobs done"))}
  if(t.verified)sc+=10;
  const br=[...(t.brands||[]),...(t.brands2||[])].map(x=>String(x).toLowerCase()).filter(Boolean);
  if(car&&br.some(b=>car.includes(b))){sc+=20;why.unshift(T("ถนัดรถของคุณ","Knows your car"))}
  return {sc,why:why.slice(0,2)};
}

  if(CATSORT==="rating")return l.slice().sort((a,b)=>((b.reviewCount?+b.rating:0)-(a.reviewCount?+a.rating:0))||((b.reviewCount||0)-(a.reviewCount||0)));
  if(CATSORT==="price")return l.slice().sort((a,b)=>(+a.from||1e9)-(+b.from||1e9));
  if(CATSORT==="jobs")return l.slice().sort((a,b)=>(b.jobs||0)-(a.jobs||0));
  const car=myCarText();return l.map(t=>({...t,_m:matchOf(t,car)})).sort((a,b)=>b._m.sc-a._m.sc);

/* ปิดหน้าโหลด: รอให้แอนิเมชันชื่อเล่นจบ (~2.9 วิ) และรายชื่อช่างพร้อม แล้วเติมแถบเต็ม → จางหายแบบเบลอ */
const CC_T0=performance.now();let ccGone=false;
/* Cendon + "ซ่อม" ในหลายภาษา สลับทุก ~1.8 วิ — เขียนด้วยลายมือ ทุกขีดงอกพร้อมกัน แล้วหดหายก่อนคำถัดไป */
(function(){
  const W=[["Fix","Spire09"],["ซ่อม","Kanit"],["修理","Yomogi"],["수리","Gaegu"],["Repara","Spire09"],["Répare","Spire09"],["Repariert","Spire09"],["Perbaiki","Spire09"],["Sửa","Spire09"]];
  const tx=document.getElementById("ccTx"),mt=document.getElementById("ccMt"),svg=document.getElementById("ccW");if(!tx)return;
  let i=0,an=null;
  const set=([w,f])=>{[tx,mt].forEach(e=>{e.textContent=w;e.style.fontFamily=`"${f}","Mali","Kanit",sans-serif`});
    let bb;try{bb=tx.getBBox()}catch(e){bb={x:0,width:120}}
    const vw=Math.max(40,bb.x+bb.width+10);svg.setAttribute("viewBox",`0 0 ${vw} 80`);svg.style.setProperty("--r",(vw/80).toFixed(3))};
  const draw=()=>{an&&an.cancel();an=mt.animate([{strokeDashoffset:360},{strokeDashoffset:0}],{duration:1100,easing:"cubic-bezier(.4,.1,.35,1)",fill:"forwards"});return an.finished};
  const erase=()=>{an&&an.cancel();an=mt.animate([{strokeDashoffset:0},{strokeDashoffset:-360}],{duration:520,easing:"cubic-bezier(.55,0,.8,.4)",fill:"forwards"});return an.finished};
  const go=async()=>{
    set(W[0]);
    while(document.getElementById("ccSplash")){
      try{await draw()}catch(e){return}
      await new Promise(r=>setTimeout(r,520));
      if(!document.getElementById("ccSplash"))return;
      try{await erase()}catch(e){return}
      i=(i+1)%W.length;set(W[i]);
    }
  };
  (document.fonts&&document.fonts.load?Promise.race([Promise.all(["Kanit","Spire09","Mali","Gaegu","Yomogi"].map(f=>document.fonts.load(`600 56px "${f}"`).catch(()=>0))),new Promise(r=>setTimeout(r,600))]):Promise.resolve()).then(go);
})();
function ccDone(){
  const el=$("ccSplash");if(!el||ccGone)return;ccGone=true;
  const wait=Math.max(0,3500-(performance.now()-CC_T0));
  setTimeout(()=>{el.classList.add("done");setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),650)},260)},wait);
}

   → บริการและราคาเริ่มต้น → รีวิวจากงานจริง → ข้อมูลร้าน → สิ่งที่ระบบดูแลให้ (เฉพาะที่ทำจริง) · ปุ่ม ทักช่าง/ขอราคา อยู่ขอบล่าง
   เจ้าของร้านเปิดจาก Studio = โหมดตัวอย่าง (ไม่มีปุ่มแก้ไขปน หน้าเหมือนที่ลูกค้าเห็นทุกอย่าง) */
const DN_TH=["จ.","อ.","พ.","พฤ.","ศ.","ส.","อา."],DN_EN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const dnOf=i=>(TH?DN_TH:DN_EN)[i];
const hm=x=>{const [h,m]=String(x||"0:0").split(":").map(Number);return (h||0)*60+(m||0)};
/* เปิดอยู่ไหมตอนนี้ — คิดจากตารางเวลาที่ร้านตั้งเอง (week[0]=จันทร์) ไม่มีตารางก็ไม่เดา */
function openNow(t){
  const W=t.week;if(!(W&&W.some(w=>w&&w.on)))return null;
  const d=new Date(),i=(d.getDay()+6)%7,w=W[i],n=d.getHours()*60+d.getMinutes();
  if(w&&w.on&&n>=hm(w.open)&&n<hm(w.close))return {on:true,txt:T(`เปิดอยู่ · ถึง ${w.close}`,`Open · until ${w.close}`)};
  if(w&&w.on&&n<hm(w.open))return {on:false,txt:T(`ปิด · เปิด ${w.open}`,`Closed · opens ${w.open}`)};
  for(let k=1;k<=7;k++){const j=(i+k)%7,x=W[j];if(x&&x.on)return {on:false,txt:k===1?T(`ปิด · พรุ่งนี้ ${x.open}`,`Closed · tomorrow ${x.open}`):T(`ปิด · เปิด${dnOf(j)} ${x.open}`,`Closed · ${dnOf(j)} ${x.open}`)}}
  return null;
}

function openTech(id,opt){
  let t=TECHS.find(x=>x.id===id);

  /* ลิงก์ร้านที่แชร์มา แต่ร้านยังไม่เปิดให้ลูกค้าเห็น (รอตรวจสอบ/ปิดร้าน) หรือไม่มีแล้ว — บอกตรง ๆ แทนที่จะเงียบแล้วค้างหน้าแรก */
  if(!t){const url=(opt&&opt.url)||"/tech/"+encodeURIComponent(id);
    sheet({title:T("ร้านนี้","This shop"),url,body:`<div class="empty"><i class="ti ti-building-store"></i><b>${T("ร้านนี้ยังไม่เปิดให้ลูกค้าเห็น","This shop isn’t open to customers yet")}</b><p>${T("ร้านอาจกำลังรอทีมงานตรวจสอบ ปิดร้านชั่วคราว หรือลิงก์ไม่ถูกต้อง — ลองดูร้านอื่นที่ผ่านการตรวจสอบแล้วได้เลย","It may be waiting for our checks, paused, or the link may be wrong — you can browse checked shops instead.")}</p><button class="lx-cta" type="button" id="shopMissAll"><i class="ti ti-search"></i> ${T("ดูร้านที่ผ่านการตรวจสอบ","Browse checked shops")}</button></div>`,
      mount(b){const x=b.querySelector("#shopMissAll");if(x)x.onclick=()=>{closeSheet();openCat("all")}}});
    return}
  if(!mine)track(id,"shop");
  const url=(opt&&opt.url)||"/tech/"+encodeURIComponent(id);
  sheet({title:t.shop||t.name||"",full:true,store:true,shop:id,owner:!!mine,boss:!!(ME&&ME.owner),url,body:storeHTML(t,mine),foot:storeFoot(t,mine),
    mount(b,f,o){
      /* /tech/<ร้าน>/reviews ฯลฯ — เลื่อนไปส่วนนั้น */
      o.setTab=k=>{o.tab=k;const s=b.querySelector("#"+SO_SEC[k]);if(s)setTimeout(()=>s.scrollIntoView({behavior:"smooth",block:"start"}),60)};
      if(o.tab)o.setTab(o.tab);
      /* เลื่อนพ้นหัวร้าน → หัวแผ่นทึบขึ้นและบอกชื่อร้าน (ปุ่มย้อน/ปิดไม่ลอยทับข้อความ) */
      if(!b.__soScroll){b.__soScroll=1;b.addEventListener("scroll",()=>{const bs=$("bs");bs.classList.toggle("so-up",!!b.querySelector(".so")&&b.scrollTop>(b.querySelector(".so.has-cover")?220:60))},{passive:true})}
      b.querySelectorAll(".so-gigs .lx-gc").forEach(x=>x.onclick=()=>openGig(x.dataset.g));wireSp(b);
      b.querySelectorAll("[data-z]").forEach(i=>i.onclick=()=>zoom(i.dataset.z));
      const hours=b.querySelector("[data-hours]"),wk=b.querySelector(".so-week");
      if(hours&&wk){const tg=()=>{wk.hidden=!wk.hidden;hours.classList.toggle("open",!wk.hidden)};hours.onclick=tg;hours.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tg()}}}
      const vb=b.querySelector("[data-vet]"),vd=b.querySelector(".so-vetd");
      if(vb&&vd)vb.onclick=()=>{vd.hidden=!vd.hidden;vb.setAttribute("aria-expanded",String(!vd.hidden));vb.classList.toggle("open",!vd.hidden)};
      const sh=b.querySelector("[data-share]");
      if(sh)sh.onclick=()=>{const u=location.origin+"/tech/"+encodeURIComponent(t.id);try{navigator.share?navigator.share({title:t.shop||t.name,url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>toast(T("คัดลอกลิงก์ร้านแล้ว","Shop link copied")))}catch(e){}};
      loadReviews(b,t);
      if(mine)return;
      if($("bTel"))$("bTel").addEventListener("click",()=>track(id,"call"));
      $("bBook").onclick=()=>book(t);
      $("bMsg").onclick=()=>messageTech(t);
      if($("bBoss"))$("bBoss").onclick=()=>bossMenu(t);
      if($("bSus"))$("bSus").onclick=e=>busy(e.currentTarget,async()=>{if(!confirm("ซ่อนช่างคนนี้จากรายชื่อ?"))return;await api("/api/tech/moderate",{body:{id:t.id,suspend:true}});closeSheet();toast("ซ่อนแล้ว");load()});
    }});
}

/* แถวสวิตช์ในหน้าตั้งค่า */

const pct=(a,b)=>b?Math.round((a-b)/b*100):null;
const delta=(a,b)=>{const p=pct(a,b);return p==null?`<small class="sa-d">ไม่มีข้อมูลเดือนก่อน</small>`:`<small class="sa-d ${p>=0?"up":"dn"}"><i class="ti ti-arrow-${p>=0?"up":"down"}-right"></i>${T(Math.abs(p)+"% จากเดือนก่อน",Math.abs(p)+"% vs last month")}</small>`};
/* กราฟแท่งชุดเดียว: แท่งบาง ปลายมน มีเส้นฐาน ชี้แท่งแล้วเห็นค่า */
function bars(list,fmt,label){
  const mx=Math.max(1,...list.map(x=>x.v)),W=100/list.length;
  return `<div class="sa-ch" role="img" aria-label="${label}"><div class="sa-y"><span>${fmt(mx)}</span><span>${fmt(0)}</span></div><div class="sa-bars">${list.map((x,i)=>`<span class="sa-b" style="--h:${x.v/mx*100}%" data-tip="${new Date(x.d).toLocaleDateString(LOC,{day:"numeric",month:"short"})} · ${fmt(x.v)}"><i></i></span>`).join("")}</div>
    <div class="sa-x"><span>${new Date(list[0].d).toLocaleDateString(LOC,{day:"numeric",month:"short"})}</span><span>วันนี้</span></div></div>`;
}

/* tooltip ของแท่งกราฟ (ชี้/แตะ) */
function wireTips(){
  let tip=document.getElementById("saTip");if(!tip){tip=document.createElement("div");tip.id="saTip";tip.className="sa-tip";document.body.appendChild(tip)}
  document.querySelectorAll(".sa-b").forEach(b=>{const on=()=>{const r=b.getBoundingClientRect();tip.textContent=b.dataset.tip;tip.style.left=r.left+r.width/2+"px";tip.style.top=r.top-8+"px";tip.classList.add("on")};
    b.onmouseenter=on;b.onclick=on;b.onmouseleave=()=>tip.classList.remove("on")});
}

function segs(id,opts,val){return `<div class="seg" id="${id}">${opts.map(([v,l,ic])=>`<button type="button" data-v="${v}" class="${v===val?"on":""}">${ic?`<i class="ti ${ic}"></i>`:""}${l}</button>`).join("")}</div>`}
function segVal(id){const b=$(id)&&$(id).querySelector(".on");return b?b.dataset.v:""}

/* ฟอร์มติดต่อชุดเดียว ใช้ทั้งขอราคาร้านเดียว หลายร้าน และเรียกด่วน — ช่องเดียวกัน จำค่าเดิมไว้ให้ */
/* ═══ ฟอร์มคำขอชุดเดียว (ร้านเดียว / หลายร้าน / ด่วน / ประกาศ) ═══
   ทำให้สบายที่สุด: รถมาจากโรงรถเอง ตำแหน่งปักหมุดเองจาก GPS แล้วล็อกไว้ ไม่ต้องพิมพ์ที่อยู่
   อยากบอกเพิ่ม ("จอดใต้ต้นไม้") หรือแนบรูป ค่อยกดเปิดเพิ่มเอง */
const RG={};
async function revgeo(p){
  const k=p.lat.toFixed(4)+","+p.lng.toFixed(4);if(RG[k])return RG[k];
  try{const ac=new AbortController();setTimeout(()=>ac.abort(),4500);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&lat=${p.lat}&lon=${p.lng}&accept-language=${TH?"th":"en"}`,{signal:ac.signal});
    const d=await r.json(),a=d.address||{};
    const line=[a.house_number,a.road||a.pedestrian||a.footway,a.neighbourhood||a.quarter||a.village].filter(Boolean).join(" ");
    const area=[a.suburb||a.city_district||a.district||a.town||a.municipality,a.city||a.province||a.state].filter(Boolean).join(" ");
    return RG[k]={line:line||String(d.display_name||"").split(",").slice(0,2).join(",").trim(),area};
  }catch(e){return {line:"",area:""}}
}

/* ประทับเวลา + พิกัดลงบนรูป (แถบล่าง) — รูปใหม่ไม่มี EXIF เดิมติดไป */
function stampPhoto(file,pos){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type))return rej(new Error(T("ต้องเป็นไฟล์รูปภาพ","Please choose a photo")));
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,1600/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s),band=Math.max(44,Math.round(h*.065));
      const c=document.createElement("canvas");c.width=w;c.height=h+band;const g=c.getContext("2d");
      g.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
      g.fillStyle="#111";g.fillRect(0,h,w,band);g.fillStyle="#fff";g.font=`500 ${Math.round(band*.36)}px Kanit,system-ui,sans-serif`;g.textBaseline="middle";
      const at=new Date().toLocaleString(TH?"th-TH":"en-GB",{dateStyle:"medium",timeStyle:"medium"});
      g.fillText(at+(pos?`  ·  ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`:""),Math.round(band*.3),h+band/2);
      g.textAlign="right";g.fillStyle="#ff8a3d";g.fillText("Cendon",w-Math.round(band*.3),h+band/2);
      let q=.8,d=c.toDataURL("image/jpeg",q);while(d.length>1100000&&q>.4){q-=.1;d=c.toDataURL("image/jpeg",q)}
      res({data:d,at:Date.now(),lat:pos?pos.lat:null,lng:pos?pos.lng:null});
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error(T("เปิดรูปนี้ไม่ได้","Couldn't open this photo")))};img.src=u;
  });
}

/* ═══ AI ดูอาการ ═══ ใช้ /api/diagnose ของระบบหลัก แล้วต่อเข้ากับช่างจริงในระบบ */
function aiDiag(text){
  const cars=ls.get("spire_garage",[]);
  sheet({title:"AI ดูอาการ",url:"/diagnose",body:`
    <label class="fld"><span>อาการ</span><textarea class="inp" id="aiT" placeholder="เช่น เบรกแล้วมีเสียงเอี๊ยด พวงมาลัยสั่น">${esc(text||"")}</textarea></label>
    ${cars.length?`<div class="fld"><span>รถ</span>${segs("aiCar",cars.map((c,i)=>[String(i),[c.name,c.year].filter(Boolean).join(" "),"ti-car"]).concat([["-","ไม่ระบุ"]]),"0")}</div>`:""}
    <div id="aiOut"></div>`,
    foot:'<button class="btn w" id="aiGo" style="background:linear-gradient(135deg,#8b5cf6,#c026d3);color:#fff"><i class="ti ti-sparkles"></i> วิเคราะห์</button>',
    mount(){
      if(cars.length)wireSeg("aiCar");
      /* แก้อาการหลังได้ผลแล้ว → ปุ่มวิเคราะห์กลับมา */
      $("aiT").addEventListener("input",()=>{if(!$("aiGo")){$("bsF").innerHTML='<button class="btn w" id="aiGo" style="background:linear-gradient(135deg,#8b5cf6,#c026d3);color:#fff"><i class="ti ti-sparkles"></i> วิเคราะห์ใหม่</button>';$("aiGo").onclick=run}});
      if(text&&text.length>=4)setTimeout(()=>$("aiGo")&&$("aiGo").click(),250);
      const run=e=>busy(e.currentTarget,async()=>{
        const sym=$("aiT").value.trim();if(sym.length<4)throw new Error("เล่าอาการอีกนิด");
        const ci=segVal("aiCar"),car=ci&&ci!=="-"?cars[+ci]:null;
        $("aiOut").innerHTML='<div class="thinking"><div class="orb"></div>กำลังวิเคราะห์อาการ…</div>';
        let d;
        try{d=await api("/api/diagnose",{body:{mode:"diagnose",symptoms:sym,make:car?car.make||car.name:"",model:car?car.model||"":"",year:car?car.year:"",mileage:car?car.mileage:""}})}
        catch(err){$("aiOut").innerHTML="";throw new Error(/quota|429/.test(err.message)?"ใช้ AI ครบโควตาวันนี้แล้ว ลองใหม่พรุ่งนี้":err.message)}
        const g=d.diagnosis||{};
        const all=sym+" "+(g.summary||"")+" "+(g.possibleCauses||[]).map(c=>c.cause+" "+c.explanation).join(" ");
        const cat=catsOf(sym)[0]||catsOf(all)[0]||"";
        const inCat=cat?TECHS.filter(t=>(t.cats||[]).includes(cat)&&t.from):[];
        const lo=inCat.length?Math.min(...inCat.map(t=>t.from)):0,hi=inCat.length?Math.max(...inCat.map(t=>t.from)):0;
        const sev={"ต่ำ":["#22a06b","ti-circle-check"],"ปานกลาง":["#d6a13a","ti-alert-circle"],"สูง":["#e0673a","ti-alert-triangle"],"ฉุกเฉิน":["#dc2626","ti-urgent"]}[g.severity]||["#6b6f7a","ti-info-circle"];
        const lk={"สูง":90,"กลาง":55,"ต่ำ":25};
        $("aiOut").innerHTML=`
          <div class="quote"><span class="sev" style="background:${sev[0]}22;color:${sev[0]}"><i class="ti ${sev[1]}"></i>ความรุนแรง: ${esc(g.severity||"-")}</span><p style="margin-top:10px">${esc(g.summary||"")}</p></div>
          ${(g.possibleCauses||[]).length?`<div class="quote"><b style="font-weight:600">สาเหตุที่เป็นไปได้</b>${g.possibleCauses.slice(0,4).map((c,i)=>`<div class="cause"><b>${esc(c.cause)}<small>${esc(c.likelihood||"")}</small></b><div class="meter"><i style="width:${lk[c.likelihood]||40}%;animation-delay:${i*120}ms"></i></div><small>${esc(c.explanation||"")}</small></div>`).join("")}</div>`:""}
          ${g.recommendedAction?`<div class="kv"><p><span>ควรทำ</span><b>${esc(g.recommendedAction)}</b></p>${cat?`<p><span>ช่างที่เกี่ยว</span><b>${CAT[cat].th}</b></p>`:""}${lo?`<p><span>ราคาเริ่มต้นในระบบ</span><b>฿${money(lo)}${hi>lo?" – ฿"+money(hi):""}</b></p>`:""}</div>`:""}
          <p class="note"><i class="ti ti-info-circle"></i>${esc(g.disclaimer||"เป็นการประเมินเบื้องต้นจาก AI ควรให้ช่างตรวจจริง")}</p>`;
        $("bsF").innerHTML=`<button class="btn s" id="aiSee">ดูช่าง${cat?CAT[cat].th:""}</button><button class="btn p" id="aiMulti">ขอราคา 3 ร้าน</button>`;
        $("aiSee").onclick=()=>{closeSheet();F.cat=cat||"all";F.q=cat?"":sym;$("q").value=F.q;drawGrid();render();setView("menu");$("secT").scrollIntoView({behavior:"smooth"})};
        $("aiMulti").onclick=()=>openMulti(sym,cat);
      });
      $("aiGo").onclick=run;
    }});
}

const FLOW=[["requested","ขอราคา","ti-send"],["quoted","ได้ราคา","ti-receipt"],["accepted","นัดแล้ว","ti-calendar-check"],["working","ซ่อม","ti-tool"],["completed","เสร็จ","ti-circle-check"]];
const RANK={requested:0,quoted:1,accepted:2,enroute:2,working:3,done:3,completed:4,disputed:3,cancelled:-1};
/* ═══ ช่างกำลังมา (แผนที่แบบ Grab) ═══
   ฝั่งช่าง: กด "กำลังไป" → แชร์ตำแหน่งทุก ~7 วินาที เฉพาะใบงานที่อยู่ในสถานะนี้ · หยุดเองเมื่อเริ่มซ่อม/ยกเลิก · กดหยุดเองได้

const LiveShare={id:null,watch:null,last:0,lock:null,fix:null,err:"",
  sync(){
    const off=ls.get("spire_live_off","");
    const j=(JOBS||[]).find(x=>x.side==="technician"&&x.status==="enroute"&&x.id!==off);
    if(j)this.start(j.id);else if(this.id&&!(JOBS||[]).some(x=>x.id===this.id&&x.status==="enroute"))this.stop();
  },
  start(id){
    if(this.id===id&&this.watch!=null)return;
    this.stop(true);this.id=id;this.err="";
    if(!navigator.geolocation){this.err=T("เครื่องนี้หาตำแหน่งไม่ได้","Location isn't available on this device");this.paint();return}
    this.watch=navigator.geolocation.watchPosition(p=>this.push(p),e=>{this.err=e.code===1?T("ยังไม่ได้อนุญาตตำแหน่ง — ลูกค้าจะไม่เห็นว่าคุณอยู่ไหน","Location permission is off — the customer can't see you"):T("ยังหาตำแหน่งไม่ได้","Still finding your location");this.paint()},{enableHighAccuracy:true,maximumAge:5000,timeout:25000});
    /* จอเปิดค้างระหว่างเดินทาง — เบราว์เซอร์ส่งตำแหน่งได้เฉพาะตอนหน้าแอปเปิดอยู่ */
    try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>{this.lock=l}).catch(()=>{})}catch(e){}
    this.paint();
  },
  async push(p,force){
    const c=p.coords;this.fix={lat:c.latitude,lng:c.longitude,acc:c.accuracy,heading:c.heading,speed:c.speed,at:Date.now()};this.err="";
    if(!force&&Date.now()-this.last<7000){this.paint();return}
    this.last=Date.now();const id=this.id;if(!id)return;
    try{await api(`/api/tech/jobs/${id}/live`,{body:{lat:c.latitude,lng:c.longitude,acc:c.accuracy,heading:c.heading,speed:c.speed}});this.sent=Date.now()}
    catch(e){if(e.status===409||e.status===404||e.status===403){this.stop();return}}
    this.paint();
  },
  stop(keep){
    if(this.watch!=null)try{navigator.geolocation.clearWatch(this.watch)}catch(e){}
    this.watch=null;try{this.lock&&this.lock.release()}catch(e){}this.lock=null;
    if(!keep){this.id=null;this.fix=null}
    this.paint();
  },
  /* แถบเล็กบนจอช่างระหว่างแชร์ — รู้ตลอดว่ากำลังส่งตำแหน่ง และหยุดเองได้ */
  paint(){
    let b=$("liveBar");
    if(!this.id||this.watch==null){if(b)b.remove();return}
    if(!b){b=document.createElement("button");b.id="liveBar";b.type="button";b.className="live-bar";document.body.appendChild(b);
      b.onclick=()=>{if(confirm(T("หยุดแชร์ตำแหน่งให้ลูกค้า?","Stop sharing your location with the customer?"))){ls.set("spire_live_off",this.id);this.stop()}}}
    const ago=this.sent?Math.max(0,Math.round((Date.now()-this.sent)/1000)):null;
    b.innerHTML=`<i class="dot${this.err?" bad":""}"></i><span>${this.err?esc(this.err):T("ลูกค้าเห็นคุณบนแผนที่","The customer can see you on the map")+(ago!=null?` · ${ago<5?T("เพิ่งส่ง","just now"):ago+T(" วิที่แล้ว","s ago")}`:"")}</span><b>${T("หยุด","Stop")}</b>`;
  }};
addEventListener("visibilitychange",()=>{if(!document.hidden&&LiveShare.watch!=null&&LiveShare.fix)navigator.geolocation.getCurrentPosition(p=>LiveShare.push(p,true),()=>{},{enableHighAccuracy:true,maximumAge:3000,timeout:8000})});
setInterval(()=>{if(LiveShare.watch!=null)LiveShare.paint()},5000);

/* เวลาถึงโดยประมาณ — สูตรเดียวกับเซิร์ฟเวอร์ (ระยะเส้นตรง ×1.35 · ในเมืองช้า ทางไกลเร็ว) */
const etaOf=(a,b)=>{if(!a||!b)return {};const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;
  const km=2*R*Math.asin(Math.sqrt(h))*1.35,kmh=km>20?55:km>5?35:25;return {km:Math.round(km*10)/10,etaMin:km<.15?0:Math.max(1,Math.round(km/kmh*60+1))}};
const destOf=a=>{const m=String(a||"").match(/[?&]q=(-?\d{1,3}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/);return m?{lat:+m[1],lng:+m[2]}:null};
const carPin=h=>window.L.divIcon({className:"lv-car",iconSize:[46,46],iconAnchor:[23,23],html:`<span class="lv-ring"></span><span class="lv-dot" style="--r:${Number.isFinite(h)?h:0}deg"><i class="ti ti-car"></i></span>`});
const homePin=()=>window.L.divIcon({className:"lv-home",iconSize:[34,42],iconAnchor:[17,40],html:'<i class="ti ti-map-pin-filled"></i>'});
/* วาดแผนที่ในใบงาน/ลิงก์แชร์ · poll = ฟังก์ชันขอตำแหน่งล่าสุด · คืนตัวหยุด */
function liveMap(box,{dest,poll,every,mine}){
  const st={m:null,car:null,anim:0,first:true,t:0,alive:true};
  const make=()=>{
    if(!window.L||!box.isConnected)return false;
    const at=dest||{lat:13.7563,lng:100.5018};
    st.m=oneWorld(window.L.map(box.querySelector(".lv-map"),{zoomControl:false,attributionControl:false})).setView([at.lat,at.lng],14);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,noWrap:true}).addTo(st.m);
    if(dest)window.L.marker([dest.lat,dest.lng],{icon:homePin(),interactive:false}).addTo(st.m);
    setTimeout(()=>st.m&&st.m.invalidateSize(),300);return true;
  };
  /* เลื่อนหมุดช่างแบบนุ่ม ๆ ไปจุดใหม่ ไม่กระโดด */
  const move=(to,h)=>{
    if(!st.m)return;
    if(!st.car){st.car=window.L.marker([to.lat,to.lng],{icon:carPin(h),interactive:false,zIndexOffset:500}).addTo(st.m);return}
    const from=st.car.getLatLng(),t0=performance.now(),D=900;cancelAnimationFrame(st.anim);
    const el=st.car.getElement&&st.car.getElement();if(el&&Number.isFinite(h))el.querySelector(".lv-dot").style.setProperty("--r",h+"deg");
    const step=n=>{const k=Math.min(1,(n-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;st.car.setLatLng([from.lat+(to.lat-from.lat)*e,from.lng+(to.lng-from.lng)*e]);if(k<1)st.anim=requestAnimationFrame(step)};
    st.anim=requestAnimationFrame(step);
  };
  const paint=(d)=>{
    const eta=box.querySelector(".lv-eta"),sub=box.querySelector(".lv-sub");
    if(d&&d.live){
      move(d.live,d.live.heading);
      if(st.first&&st.m){st.first=false;const pts=[[d.live.lat,d.live.lng]];if(dest)pts.push([dest.lat,dest.lng]);if(pts.length>1)st.m.fitBounds(pts,{padding:[46,46],maxZoom:16});else st.m.setView(pts[0],15)}
      const ago=Math.max(0,Math.round((Date.now()-d.live.at)/1000));
      eta.innerHTML=d.etaMin!=null?(d.etaMin<=1?`<b>${T("ใกล้ถึงแล้ว","Almost there")}</b>`:`<b>~${d.etaMin}</b> ${T("นาที","min")}`):`<b>${T("กำลังมา","On the way")}</b>`;
      sub.textContent=[d.km!=null?`${T("ระยะทางประมาณ","About")} ${d.km} ${T("กม.","km")}`:"",ago<6?T("อัปเดตเมื่อสักครู่","updated just now"):`${T("อัปเดต","updated")} ${ago} ${T("วิที่แล้ว","s ago")}`].filter(Boolean).join(" · ");
      box.classList.remove("wait","stale");
    }else{
      box.classList.add(d&&d.stale?"stale":"wait");
      eta.innerHTML=`<b>${d&&d.stale?T("สัญญาณช่างขาดหาย","Lost the mechanic's signal"):mine?T("กำลังหาตำแหน่งของคุณ","Finding your location"):T("รอตำแหน่งช่าง","Waiting for location")}</b>`;
      sub.textContent=d&&d.stale?T("ช่างอาจอยู่ในจุดอับสัญญาณ — ลองโทรหาช่างได้","They may be out of signal — try calling them"):mine?T("เปิดตำแหน่งในเครื่องเพื่อให้ลูกค้าเห็นคุณ","Turn on location so the customer can see you"):T("ช่างกดออกเดินทางแล้ว ตำแหน่งจะขึ้นในไม่กี่วินาที","The mechanic is on the way — location appears in a few seconds");
    }
  };
  const tick=async()=>{
    if(!st.alive||!box.isConnected){st.alive=false;return}
    /* แผนที่โหลดไม่ได้ (เน็ตช้า/ถูกบล็อก) ก็ยังบอกเวลาถึงได้ — แผนที่เป็นของแถม */
    if(!st.m){try{make()}catch(e){}}
    try{const d=await poll();if(!st.alive)return;paint(d);if(d&&d.status&&d.status!=="enroute"){st.alive=false;return}}catch(e){}
    st.t=setTimeout(tick,document.hidden?15000:every||4000);
  };
  tick();
  return ()=>{st.alive=false;clearTimeout(st.t)};
}

  const more=[];
  if((cust||tech)&&["requested","quoted","accepted","enroute"].includes(s))more.push(["cancel","ยกเลิกงาน"]);
  if(tech&&["accepted","enroute","working"].includes(s)&&!(j.extras||[]).some(x=>x.status==="pending"))more.push(["extra","เสนองานเพิ่ม"]);
  /* ลูกค้าระหว่างงาน: ปุ่มแจ้งปัญหาอยู่ในกล่องความปลอดภัยแทน */

  if(a==="review"){let r=5;const RP=[];return sheet({push:true,slug:a,title:"ให้คะแนน",body:`<div class="stars" id="rS">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="on"><i class="ti ti-star-filled"></i></button>`).join("")}</div><label class="fld"><span>เล่าสั้น ๆ</span><textarea class="inp" id="rT" placeholder="เช่น มาตรงเวลา งานเรียบร้อย"></textarea></label>
      <p class="h4">รูปงานที่ได้ <small style="font-weight:400;color:var(--muted)">· ไม่บังคับ สูงสุด 4 รูป · ขึ้นในหน้าร้านพร้อมรีวิว</small></p><div class="phg" id="rPh"></div><input type="file" id="rFile" accept="image/*" multiple hidden/><p class="err" id="rErr"></p>`,
    foot:'<button class="btn p w" id="rGo">ส่งคะแนน</button>',mount(){$("rS").querySelectorAll("button").forEach(b=>b.onclick=()=>{r=+b.dataset.n;$("rS").querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=r))});
      const draw=()=>{$("rPh").innerHTML=RP.map((d,i)=>`<div class="doc"><img src="${d}" alt=""/><button class="rm" data-i="${i}" type="button"><i class="ti ti-x"></i></button></div>`).join("")+(RP.length<4?`<button class="doc" id="rAdd" type="button"><i class="ti ti-camera-plus"></i>เพิ่มรูป</button>`:"");
        $("rPh").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{RP.splice(+b.dataset.i,1);draw()});
        if($("rAdd"))$("rAdd").onclick=()=>{$("rFile").value="";$("rFile").dataset.cropMax=4-RP.length;$("rFile").click()}};draw();
      $("rFile").onchange=async()=>{for(const f of [...$("rFile").files].slice(0,4-RP.length)){try{RP.push(await shrink(f,1600))}catch(e){$("rErr").textContent=e.message}}draw()};
      $("rGo").onclick=e=>change(j,"review",{rating:r,note:$("rT").value.trim(),photos:RP.map(d=>({data:d}))},e.currentTarget)}});}
  const T={done:["สรุปงานที่ทำ","เช่น เปลี่ยนโอริง เติมน้ำยา 600 กรัม"],cancel:["เหตุผลที่ยกเลิก","เช่น ติดธุระ ขอเลื่อน"],dispute:["เกิดปัญหาอะไร","เล่าสิ่งที่เกิดขึ้น ทีมงานจะติดต่อกลับ"],resolve:["ผลการช่วยเหลือ","สรุปว่าแก้อย่างไร"]}[a];
  if(!T)return;
  sheet({push:true,slug:a,title:T[0],body:`<label class="fld"><textarea class="inp" id="nT" placeholder="${T[1]}"></textarea></label>${a==="resolve"?segs("nO",[["completed","ปิดงานสำเร็จ"],["cancelled","ยกเลิกงาน"]],"completed"):""}`,
    foot:`<button class="btn ${a==="cancel"||a==="dispute"?"s":"p"} w" id="nGo">${a==="cancel"?"ยกเลิกงาน":a==="dispute"?"ส่งเรื่อง":"บันทึก"}</button>`,
    mount(){if(a==="resolve")wireSeg("nO");$("nT").focus();$("nGo").onclick=e=>change(j,a,{note:$("nT").value.trim(),outcome:a==="resolve"?segVal("nO"):undefined},e.currentTarget)}});
}

/* ═══ แชต — เต็มจอ ข้อความใหม่ขึ้นเองทุก 3 วินาที ═══ */
const CH={job:null,th:null,after:0,since:0,as:"customer",timer:0,last:"",seq:0,edit:null};
function mine(m){const r=CH.job.role;return r==="both"?m.role===CH.as:m.role===(r==="customer"?"customer":"technician")}
function fmtT(at){return new Date(at).toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"})}
function fmtD(at){return new Date(at).toLocaleDateString(LOC,{day:"numeric",month:"short"})}
/* ไฟล์ในข้อความ — media-store.js เติม src จากเครื่อง (หรือดึงจากเซิร์ฟเวอร์) ให้เอง */
function mediaHTML(l){
  if(!l||!l.length)return "";
  const pics=l.filter(a=>a.kind!=="audio").length;
  return `<span class="mm${pics>1?" n2":""}">${l.map(a=>{const id=esc(a.id);
    return a.kind==="image"?`<img data-mid="${id}" alt="" data-view>`
      :a.kind==="video"?`<video data-mid="${id}" controls playsinline preload="metadata"></video>`
      :`<audio data-mid="${id}" controls preload="metadata"></audio>`}).join("")}</span>`;
}
function addMsgs(list){
  const box=$("msgs");
  /* อีกฝ่ายแก้/ยกเลิกข้อความเก่า (id ที่เห็นไปแล้ว) — เปลี่ยนในที่เดิม */
  list.filter(m=>m.id<=CH.after).forEach(applyMsg);
  list.forEach(m=>{const t=Math.max(m.at||0,m.editedAt||0);if(t>=CH.since)CH.since=t+1});
  const fresh=list.filter(m=>m.id>CH.after);if(!fresh.length)return;
  box.querySelector(".ld")?.remove();
  const atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<90;
  box.querySelector(".first")?.remove();
  /* ป้าย "สอบถามเรื่อง…" อยู่ล่างสุดจนกว่าจะส่งข้อความแรก */
  const ask=box.querySelector(".sys.ask"),put=h=>ask?ask.insertAdjacentHTML("beforebegin",h):box.insertAdjacentHTML("beforeend",h);
  fresh.forEach(m=>{
    const d=fmtD(m.at);if(d!==CH.last){CH.last=d;put(`<div class="day">${d}</div>`)}
    put(chMsgHTML(m));
  });
  CH.after=fresh[fresh.length-1].id;CH.all.push(...fresh);chCacheSave();
  if(CH.all.length)$("chSug").hidden=true;
  if(atEnd||fresh.some(mine))box.scrollTop=box.scrollHeight;
}
/* ── ข้อความหนึ่งก้อน — ใช้ทั้งตอนเพิ่มใหม่ และตอนแก้/ยกเลิก (ของเราเองหรืออีกฝ่าย) ── */
function chMsgHTML(m){
  const tag=CH.job.role==="both"||CH.job.role==="admin"?(m.role==="customer"?"ลูกค้า · ":"ช่าง · "):"";
  if(m.deleted)return `<div class="msg gone${mine(m)?" me":""}" data-id="${m.id}"><i class="ti ti-message-off"></i>${mine(m)?T("คุณยกเลิกข้อความแล้ว","You unsent a message"):T("ยกเลิกข้อความแล้ว","Message unsent")}<small>${tag}${fmtT(m.at)}</small></div>`;
  return `<div class="msg ${mine(m)?"me":""}${m.media&&m.media.length?" has-m":""}" data-id="${m.id}">${mediaHTML(m.media)}${esc(m.text||"")}<small>${tag}${fmtT(m.at)}${m.editedAt?` · ${T("แก้ไขแล้ว","edited")}`:""}</small></div>`;
}
/* ข้อความที่ถูกแก้/ยกเลิก (id เดิม) — เปลี่ยนก้อนเดิมในที่เดิม ไม่ต่อท้าย */
function applyMsg(m){
  const i=CH.all.findIndex(x=>x.id===m.id);if(i<0)return;CH.all[i]=m;
  const el=$("msgs").querySelector(`.msg[data-id="${m.id}"]`);if(el)el.outerHTML=chMsgHTML(m);
  const t=Math.max(m.at||0,m.editedAt||0);if(t>=CH.since)CH.since=t+1;
  chCacheSave();
}

/* ── แตะข้อความ = เมนู คัดลอก / แก้ไข / ยกเลิกข้อความ ──
   ของตัวเอง: แก้ได้ 15 นาที ยกเลิกได้ 24 ชม. (กติกาเดียวกับหลังบ้าน) · ของอีกฝ่าย: คัดลอกได้อย่างเดียว */
const EDIT_MS=15*6e4,UNSEND_MS=864e5;
function closeChMenu(){const mn=$("chMenu");if(mn.hidden)return;mn.hidden=true;$("msgs").querySelectorAll(".msg.sel").forEach(x=>x.classList.remove("sel"))}
function chMenu(el){
  const m=CH.all.find(x=>String(x.id)===el.dataset.id);if(!m||m.deleted)return;
  const open=!$("chF").hidden,own=open&&mine(m)&&CH.job.role!=="admin",age=Date.now()-m.at;
  const items=[m.text&&["copy","ti-copy",T("คัดลอก","Copy")],
    own&&age<EDIT_MS&&["edit","ti-pencil",T("แก้ไข","Edit")],
    own&&age<UNSEND_MS&&["unsend","ti-arrow-back-up",T("ยกเลิกข้อความ","Unsend")]].filter(Boolean);
  if(!items.length)return;
  closeChMenu();
  const mn=$("chMenu");mn.innerHTML=items.map(([k,i,l])=>`<button type="button" role="menuitem" data-k="${k}"${k==="unsend"?' class="bad"':""}><i class="ti ${i}"></i>${l}</button>`).join("");
  mn.hidden=false;el.classList.add("sel");
  const r=el.getBoundingClientRect(),h=mn.offsetHeight,w=mn.offsetWidth;
  mn.style.top=Math.max(8,r.bottom+h+8>innerHeight-90?r.top-h-6:r.bottom+6)+"px";
  mn.style.left=Math.min(innerWidth-w-8,Math.max(8,el.classList.contains("me")?r.right-w:r.left))+"px";
  mn.querySelector("button").focus({preventScroll:true});
  mn.querySelectorAll("button").forEach(b=>b.onclick=async()=>{closeChMenu();const k=b.dataset.k;
    if(k==="copy"){try{await navigator.clipboard.writeText(m.text);toast(T("คัดลอกแล้ว","Copied"),"ti-copy")}catch(e){toast(T("คัดลอกไม่ได้บนเครื่องนี้","Couldn't copy on this device"),"ti-alert-triangle")}}
    else if(k==="edit")startEdit(m);
    else if(k==="unsend"){
      if(!confirm(T("ยกเลิกข้อความนี้? อีกฝ่ายจะเห็นว่าคุณยกเลิกข้อความ","Unsend this message? The other side will see that a message was unsent.")))return;
      try{applyMsg((await api(`/api/tech/messages/${m.id}/delete`,{body:{}})).message);toast(T("ยกเลิกข้อความแล้ว","Message unsent"))}catch(e){toast(e.message,"ti-alert-triangle")}}
  });
}
$("msgs").addEventListener("click",e=>{if(e.target.closest("img,video,audio,a,button"))return;const el=e.target.closest(".msg[data-id]");if(el&&!el.classList.contains("pending")){e.stopPropagation();chMenu(el)}});
$("msgs").addEventListener("contextmenu",e=>{const el=e.target.closest(".msg[data-id]");if(el&&!e.target.closest("img,video,audio")){e.preventDefault();chMenu(el)}});
document.addEventListener("click",e=>{if(!e.target.closest("#chMenu"))closeChMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeChMenu()});
$("msgs").addEventListener("scroll",closeChMenu,{passive:true});
/* แก้ข้อความใช้ช่องพิมพ์เดิม (แบบแอปแชตทั่วไป) — มีแถบบอกว่ากำลังแก้ กด × เพื่อยกเลิก */
function startEdit(m){
  CH.edit=m;$("chEdit").hidden=false;$("chEditT").textContent=(m.text||"").replace(/\s+/g," ").slice(0,90);
  chIn.value=m.text||"";chIn.dispatchEvent(new Event("input"));chIn.focus();$("chClip").disabled=true;
}
function endEdit(){if(!CH.edit)return;CH.edit=null;$("chEdit").hidden=true;$("chClip").disabled=false}
$("chEditX").onclick=()=>{endEdit();chIn.value="";chIn.dispatchEvent(new Event("input"))};

/* ── ห้องที่เคยเปิด: เก็บหัวห้อง + ข้อความล่าสุดไว้ในเครื่อง (ของบัญชีนี้เท่านั้น ออกจากระบบแล้วลบทิ้ง)
   เปิดจากกล่องข้อความครั้งต่อไปขึ้นทันที แล้วค่อยเติมของใหม่จากเซิร์ฟเวอร์ ── */
const CHC=uid=>"spire_chatc_"+(uid||"x");
function chCacheAll(){try{return JSON.parse(localStorage.getItem(CHC(U?U.uid:lastUid()))||"{}")||{}}catch(e){return {}}}
function chCacheGet(k,id){return chCacheAll()[k+":"+id]||null}
let chCacheT=0;
function chCacheSave(){
  clearTimeout(chCacheT);chCacheT=setTimeout(()=>{
    if(!U||!CH.job||!CH.job.id)return;
    const all=chCacheAll(),key=(CH.th?"th":"job")+":"+CH.job.id;
    all[key]={...(CH.th?{h:{...CH.th,ask:null}}:{j:{...CH.job,messages:[]}}),msgs:CH.all.filter(m=>!m.pending).slice(-40),t:Date.now()};
    const keys=Object.keys(all).sort((a,b)=>(all[b].t||0)-(all[a].t||0));keys.slice(20).forEach(x=>delete all[x]);
    try{localStorage.setItem(CHC(U.uid),JSON.stringify(all))}catch(e){}
  },300);
}
/* ออกจากระบบ: ลบแชตและกล่องข้อความที่เก็บไว้ในเครื่องทั้งหมด */
function purgeChatCache(){try{Object.keys(localStorage).filter(k=>k.startsWith("spire_chatc_")||k.startsWith("spire_inbox_")||k==="spire_callnotes").forEach(k=>localStorage.removeItem(k))}catch(e){}}
/* เปิดห้องจากกล่องข้อความ: ขึ้นทันทีจากข้อมูลในเครื่อง (เดิมรอเซิร์ฟเวอร์ตอบก่อน ช้าหลายวินาทีบนเน็ตมือถือ) */
async function openConvo(k,id){
  const c=chCacheGet(k,id);
  if(k==="th"){
    const h=(c&&c.h)||THREADS.find(x=>x.id===id)||((()=>{try{return JSON.parse(localStorage.getItem(IBK(U?U.uid:lastUid()))||"{}").threads||[]}catch(e){return []}})()).find(x=>x.id===id);
    if(h){showThread(h,(c&&c.msgs)||[]);if(!(c&&c.msgs&&c.msgs.length))$("msgs").insertAdjacentHTML("beforeend",`<p class="sys first ld">${T("กำลังโหลดข้อความ…","Loading messages…")}</p>`)}
    await READY.user;if(!U)return needLogin();
    return openThread(id,null,!!h);
  }
  const row=JOBS.find(x=>x.id===id);
  if(c&&c.j)openChat({...c.j,messages:c.msgs||[]},{list:true});
  else chatLoading(row?row.techName||row.car||"":"","/jobs/"+encodeURIComponent(id)+"/chat");
  await READY.user;if(!U){closeChat();return needLogin()}
  try{const j=(await api("/api/tech/jobs/"+id)).job;
    if(!$("chat").classList.contains("on")||(CH.job&&CH.job.id&&CH.job.id!==id))return;
    openChat(j,{list:true})}
  catch(e){toast(e.message,"ti-alert-triangle");if(!(c&&c.j))closeChat()}
}
/* ห้องที่ยังไม่เคยเปิดบนเครื่องนี้: ขึ้นหัวห้องกับคำว่ากำลังโหลดทันที ไม่ปล่อยจอนิ่ง */
function chatLoading(name,url){
  recStop(true);clearAtt();endEdit();CH.seq++;
  CH.job={id:null,role:"customer"};CH.th=null;CH.after=0;CH.since=0;CH.last="";CH.all=[];
  chHead(name||T("ข้อความ","Messages"),null);
  ["chCall","chBook","chSug","chAs"].forEach(x=>$(x).hidden=true);$("chF").hidden=true;
  $("msgs").innerHTML=`<p class="sys first ld">${T("กำลังโหลดข้อความ…","Loading messages…")}</p>`;
  chatOn(url,false);
}
/* หัวห้องแชตแบบเดียวกันทั้งใบงานและห้องทักช่าง */
function chatOn(url,focus){
  $("chat").classList.add("on");$("chat").setAttribute("aria-hidden","false");
  if(!CHL)CHL=Nav.push(url?{url,tag:"chat",close:()=>closeChat(true)}:{slug:"message",tag:"chat",close:()=>closeChat(true)});
  setTimeout(()=>{$("msgs").scrollTop=$("msgs").scrollHeight;if(focus&&matchMedia("(pointer:fine)").matches)$("chIn").focus()},380);
}
/* ข้อความใหม่ขึ้นเองทุก 3 วินาที (พับจอ 12 วินาที) — seq กันรอบเก่าที่ยังรอคำตอบอยู่ไปเติมข้อความลงห้องใหม่ */
function poll(fetchNew){
  const seq=++CH.seq;
  const tick=()=>{CH.timer=setTimeout(async()=>{
    if(seq!==CH.seq||!$("chat").classList.contains("on"))return;
    try{const l=await fetchNew();if(seq===CH.seq)addMsgs(l||[])}catch(e){}
    if(seq===CH.seq)tick()},document.hidden?12000:3000)};
  tick();
}
/* หัวห้อง: รูปโปรไฟล์ร้าน (ไม่มีใช้อักษรแรก) + ป้ายผ่านการตรวจ */
function chHead(name,t){
  $("chT").textContent=name;
  const av=$("chAv"),ph=t&&t.avatar;
  av.textContent=ph?"":initial(name);av.classList.toggle("img",!!ph);av.style.backgroundImage=ph?`url('${img(ph)}')`:"";
  $("chV").hidden=!(t&&t.verified);
}
/* การ์ดบนสุดของห้อง: บอกเฉพาะสิ่งที่ระบบปกป้องให้จริง */
const safeNote=(title,body)=>`<p class="sys safe"><i class="ti ti-shield-lock"></i><span><b>${title}</b><span>${body}</span></span></p>`;
function openChat(j,opt){
  recStop(true);clearAtt();
  CH.list=!!(opt&&opt.list);
  endEdit();CH.job=j;CH.th=null;CH.after=0;CH.since=0;CH.last="";CH.all=[];CH.as="customer";
  const cust=j.role==="customer";
  chHead(cust?j.techName:j.role==="technician"?T("ลูกค้า","Customer")+" · "+j.car:j.techName,j.role==="technician"?null:TECHS.find(x=>x.id===j.techId));
  const phone=cust?j.technicianPhone:j.customerPhone;
  $("chCall").hidden=!(phone&&/^0\d{8,9}$/.test(phone));if(phone)$("chCall").href="tel:"+phone;
  $("chBook").hidden=true;$("chSug").hidden=true;
  $("chAs").hidden=j.role!=="both";
  $("chAs").querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b.dataset.as==="customer");b.onclick=()=>{CH.as=b.dataset.as;$("chAs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    /* สลับบทบาท = วาดรายการใหม่ (ข้อความไหนเป็นของเรา) — การ์ดบนสุดและป้าย "ส่งข้อความแรก" ต้องอยู่ครบ ไม่งั้นห้องว่างเปล่าเหมือนค้าง */
    const all=CH.all;$("msgs").innerHTML=CH.note||"";CH.after=0;CH.last="";CH.all=[];addMsgs(all);if(!all.length&&!CH.closed)$("msgs").insertAdjacentHTML("beforeend",'<p class="sys first">'+T("ส่งข้อความแรกได้เลย","Send the first message")+'</p>');if(CH.closed)$("msgs").insertAdjacentHTML("beforeend",CH.closed)}});
  const closed=["completed","cancelled"].includes(j.status)||j.role==="admin";
  $("chF").hidden=closed;
  /* งานปิดแล้ว: ไม่มีช่องพิมพ์ — บอกให้ชัดว่าทำไม และซ่อนปุ่มสลับบทบาท (ไม่งั้นดูเหมือนห้องค้าง) */
  if(closed&&j.role!=="admin")$("chAs").hidden=true;
  CH.closed=closed&&j.role!=="admin"?`<p class="sys closed"><i class="ti ti-lock"></i> ${j.status==="completed"?T("งานนี้เสร็จแล้ว — ห้องคุยเก็บไว้ดูย้อนหลัง ส่งข้อความเพิ่มไม่ได้","This job is finished — the chat is kept for reference and can’t take new messages")
    :j.expired?T("คำขอนี้หมดอายุแล้ว — ส่งข้อความเพิ่มไม่ได้ ถ้ายังต้องการช่าง ขอราคาใหม่ได้เลย","This request expired — no new messages. Ask for a new quote if you still need help")
    :T("งานนี้ถูกยกเลิกแล้ว — ส่งข้อความเพิ่มไม่ได้","This job was cancelled — no new messages")}</p>`:"";
  CH.note=CH.closed?"":j.acceptedAt?safeNote(T("นัดหมายแล้ว คุยรายละเอียดได้เลย","Booked — talk through the details"),T("ทุกข้อความเก็บไว้กับใบงานนี้ ใช้อ้างอิงได้ถ้ามีปัญหา","Every message stays with this job for reference"))

function lastAi(){
  let best=null;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!/^spire_sess_/.test(k))continue;
    const l=JSON.parse(localStorage.getItem(k)||"[]");if(Array.isArray(l))l.forEach(x=>{if(x&&x.msgs&&x.msgs.length&&(!best||x.t>best.t))best=x})}}catch(e){}
  if(!best)return null;
  const m=[...best.msgs].reverse().find(x=>x&&x.text);
  return {at:best.t,text:m?(m.role==="user"?T("คุณ: ","You: "):"")+m.text:best.title||""};
}
/* เวลาแบบแอปแชต: วันนี้ = เวลา · เมื่อวาน · ในสัปดาห์ = ชื่อวัน · นานกว่านั้น = วันที่ */
function ibTime(at){
  if(!at)return "";const d=new Date(at),n=new Date(),day=86400000,s0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  if(at>=s0)return d.toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"});
  if(at>=s0-day)return T("เมื่อวาน","Yesterday");
  if(at>=s0-6*day)return d.toLocaleDateString(LOC,{weekday:"short"});
  return d.toLocaleDateString(LOC,{day:"numeric",month:"short"});
}
/* ห้องคุยของฉันในฐานะลูกค้า: ห้องทักช่าง + แชตในใบงาน (ฝั่งร้านของตัวเองอยู่ใน Studio) */
function convos(threads,jobs){
  const th=(threads||[]).filter(h=>h.role==="customer").map(h=>({k:"th",id:h.id,techId:h.techId,name:h.techName,
    text:h.last?(h.last.role===h.role?T("คุณ: ","You: "):"")+h.last.text:"",at:(h.last&&h.last.at)||h.updatedAt||h.createdAt,unread:h.unread||0,sub:h.gig&&h.gig.title||""}));
  const jb=(jobs||[]).filter(j=>j.side!=="technician"&&j.status!=="cancelled").map(j=>({k:"job",id:j.id,techId:j.techId,name:j.techName,
    text:j.symptom||"",at:j.updatedAt||j.createdAt,unread:j.unread||0,sub:T("ใบงาน · ","Job · ")+tr(STATUS[j.status]||j.status)}));
  return [...th,...jb].sort((a,b)=>(b.at||0)-(a.at||0));
}

async function sendThread(text,media){
  const h=CH.th;
  if(!h.id||h.ask){
    const r=await api("/api/tech/threads",{body:{techId:h.techId,gigId:h.ask?h.ask.id:undefined,text,media}});
    h.ask=null;$("msgs").querySelector(".sys.ask")?.remove();
    if(!h.id){h.id=CH.job.id=r.thread.id;Nav.replace("/messages/"+encodeURIComponent(h.id));pollThread()}
    return r.message;
  }
  return (await api("/api/tech/threads/"+encodeURIComponent(h.id),{body:{text,media}})).message;
}
$("chF").addEventListener("submit",async e=>{
  e.preventDefault();
  if(CH.edit){const m=CH.edit,text=chIn.value.trim();if(!text&&!(m.media&&m.media.length))return;
    if(text===(m.text||"")){endEdit();chIn.value="";chIn.dispatchEvent(new Event("input"));return}
    endEdit();chIn.value="";chIn.style.height="auto";chIn.dispatchEvent(new Event("input"));
    try{applyMsg((await api(`/api/tech/messages/${m.id}/edit`,{body:{text}})).message)}catch(err){toast(err.message,"ti-alert-triangle");startEdit({...m,text})}
    return}
  const text=chIn.value.trim(),att=CH.att.slice();if(!(text||att.length)||!CH.job||REC)return;
  chIn.value="";chIn.style.height="auto";CH.att=[];drawAtt();
  /* ข้อความขึ้นทันทีแบบจาง ๆ ระหว่างส่ง แล้วค่อยแทนด้วยของจริงจากเซิร์ฟเวอร์ */
  const tmp=document.createElement("div");tmp.className="msg me pending"+(att.length?" has-m":"");
  tmp.innerHTML=(att.length?`<span class="mm${att.filter(a=>a.kind!=="audio").length>1?" n2":""}">${att.map(a=>a.kind==="image"?`<img src="${a.url}" alt="">`:a.kind==="video"?`<video src="${a.url}" muted playsinline></video>`:`<audio src="${a.url}" controls></audio>`).join("")}</span>`:"")
    +esc(text)+(att.length?`<small>${T("กำลังส่งไฟล์…","Sending…")}</small>`:"");
  $("msgs").appendChild(tmp);$("msgs").scrollTop=$("msgs").scrollHeight;
  try{
    /* ไฟล์ขึ้นเซิร์ฟเวอร์ก่อน (เป็นร่าง) แล้วค่อยส่งข้อความที่อ้างถึงไฟล์ — อีกฝ่ายเปิดไฟล์ได้ทันทีที่เห็นข้อความ */
    for(const a of att)if(!(await CendonMedia.upload(a.id,"draft")))throw new Error(T("ส่งไฟล์ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่","Couldn't upload the file — check your connection and try again"));
    const media=att.length?att.map(a=>a.id):undefined;
    const m=CH.th?await sendThread(text,media):(await api("/api/tech/jobs/"+CH.job.id,{body:{action:"message",message:text,as:CH.as,media}})).message;
    tmp.remove();addMsgs([m]);att.forEach(a=>URL.revokeObjectURL(a.url));
  }catch(err){tmp.remove();chIn.value=text;CH.att=att.concat(CH.att).slice(0,4);drawAtt();toast(err.message,"ti-alert-triangle")}
});

/* ── แนบรูป/วิดีโอ/เสียง ──
   รูปย่อก่อนส่ง (ภาพจากมือถือหลาย MB เหลือไม่กี่ร้อย KB ยังชัด) · วิดีโอไม่เกิน 20MB · เสียงอัดในแอปไม่เกิน 3 นาที
   ไฟล์เก็บในเครื่องทันที (media-store.js) แล้วขึ้นเซิร์ฟเวอร์ตอนกดส่ง */
CH.att=[];
const fmtDur=sec=>{sec=Math.max(0,Math.round(sec||0));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")};
function drawAtt(){
  const box=$("chAtt");box.hidden=!CH.att.length;
  box.innerHTML=CH.att.map((a,i)=>`<span class="ch-ai ${a.kind}">${a.kind==="image"?`<img src="${a.url}" alt="">`
    :a.kind==="video"?`<video src="${a.url}" muted playsinline preload="metadata"></video><i class="ti ti-player-play-filled"></i>`
    :`<i class="ti ti-microphone"></i>${fmtDur(a.dur)}`}<button type="button" data-rm="${i}" aria-label="${T("เอาออก","Remove")}"><i class="ti ti-x"></i></button></span>`).join("");
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const [a]=CH.att.splice(+b.dataset.rm,1);if(a){URL.revokeObjectURL(a.url);CendonMedia.del(a.id,true)}drawAtt()});
}
function clearAtt(){CH.att.forEach(a=>{URL.revokeObjectURL(a.url);CendonMedia.del(a.id,true)});CH.att=[];drawAtt()}
function pendFile(blob,o){
  const id=CendonMedia.newId();
  CendonMedia.put(blob,{id,kind:o.kind,mime:o.mime,name:o.name||"",scope:"draft",upload:false}).catch(()=>{});
  CH.att.push({id,kind:o.kind,mime:o.mime,url:URL.createObjectURL(blob),dur:o.dur});drawAtt();
}
const attFull=()=>{if(CH.att.length<4)return false;toast(T("แนบได้ครั้งละไม่เกิน 4 ไฟล์","Up to 4 files per message"),"ti-alert-triangle");return true};
$("chClip").onclick=()=>{if(!attFull()){$("chFile").value="";$("chFile").click()}};
$("chFile").onchange=async e=>{
  for(const f of [...e.target.files]){
    if(attFull())break;
    const kind=CendonMedia.kindOf(f.type||"");
    if(kind==="image"){
      let blob=f,mime=f.type;
      try{const d=await shrink(f,1600);blob=CendonMedia.fromB64(d.split(",")[1],"image/jpeg");mime="image/jpeg"}
      catch(x){if(f.size>10e6){toast(T("รูปใหญ่เกินไป (ไม่เกิน 10MB)","Photo too large (max 10MB)"),"ti-alert-triangle");continue}}
      pendFile(blob,{kind,mime,name:f.name});
    }else if(kind==="video"){
      if(f.size>20*1024*1024){toast(T("วิดีโอใหญ่เกินไป (ไม่เกิน 20MB) ลองตัดให้สั้นลง","Video too large (max 20MB) — try a shorter clip"),"ti-alert-triangle");continue}
      pendFile(f,{kind,mime:f.type,name:f.name});
    }else toast(T("แนบได้เฉพาะรูปและวิดีโอ","Photos and videos only"),"ti-alert-triangle");
  }
  e.target.value="";
};
/* อัดเสียง: แตะไมค์เริ่ม · "เสร็จ" ได้ไฟล์เสียงในถาด (ฟังก่อนส่งได้) · "ยกเลิก" ทิ้ง */
let REC=null;
function recStop(cancel){if(!REC)return;REC.cancel=!!cancel;try{REC.mr.stop()}catch(e){}}
$("chMic").onclick=async()=>{
  if(REC||attFull())return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder))return toast(T("เครื่องนี้อัดเสียงในแอปไม่ได้","Voice recording isn't supported here"),"ti-microphone-off");
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){return toast(T("ใช้ไมโครโฟนไม่ได้ — อนุญาตไมโครโฟนให้เบราว์เซอร์ก่อน","Microphone blocked — allow it in your browser"),"ti-microphone-off")}
  const mr=new MediaRecorder(st),chunks=[],t0=Date.now();
  REC={mr,cancel:false,timer:setInterval(()=>{const sec=(Date.now()-t0)/1000;$("chRecT").textContent=fmtDur(sec);if(sec>=180)recStop(false)},250)};
  mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data)};
  mr.onstop=()=>{
    const r=REC,dur=(Date.now()-t0)/1000;REC=null;clearInterval(r.timer);st.getTracks().forEach(t=>t.stop());
    $("chRec").hidden=true;$("chF").classList.remove("rec");
    if(r.cancel||!chunks.length||dur<0.8)return;
    const mime=String(mr.mimeType||chunks[0].type||"audio/webm").split(";")[0];
    pendFile(new Blob(chunks,{type:mime}),{kind:"audio",mime,name:"voice",dur});
  };
  mr.start(250);$("chRecT").textContent="0:00";$("chRec").hidden=false;$("chF").classList.add("rec");
};

function picker(host,start,onMove){
  const c=start||HERE||{lat:13.7563,lng:100.5018};
  host.innerHTML='<div class="lm"></div><i class="ti ti-map-pin-filled cross"></i>';

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,noWrap:true,bounds:[[-85,-180],[85,180]]}).addTo(m);
  m.on("moveend",()=>{const p=m.getCenter();val={lat:+p.lat.toFixed(5),lng:+p.lng.toFixed(5)};onMove(val)});

/* ═══ ย่อรูปก่อนส่ง — รูปจากมือถือ 4–8MB ย่อเหลือราว 150KB อ่านบัตรยังชัด ═══ */
function shrink(file,max){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type))return rej(new Error("ต้องเป็นไฟล์รูปภาพ"));
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,(max||1280)/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.72,d=c.toDataURL("image/jpeg",q);while(d.length>900000&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}res(d)};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("เปิดรูปนี้ไม่ได้"))};img.src=u;
  });
}

/* วิธียืนยันตัวตนและรุ่นข้อความยินยอม มาจาก backend (/api/tech/ping)

function thaiId(v){const s=String(v||"").replace(/\D/g,"");if(!/^\d{13}$/.test(s))return false;let t=0;for(let i=0;i<12;i++)t+=+s[i]*(13-i);return (11-t%11)%10===+s[12]}

function terms(){
  sheet({push:true,slug:"terms",title:"ข้อตกลงพาร์ทเนอร์ช่าง",body:`<div class="terms">
    <h5>1. คุณสมบัติและการยืนยันตัวตน</h5>ผู้สมัครต้องมีอายุ 18 ปีบริบูรณ์ ให้ข้อมูลตามบัตรประจำตัวประชาชนที่เป็นจริง และยินยอมให้ Cendon ตรวจสอบตัวตน เบอร์โทรศัพท์ ผลงาน และสถานประกอบการ ข้อมูลอันเป็นเท็จเป็นเหตุให้ยกเลิกการเป็นพาร์ทเนอร์ได้ทันที
    <h5>2. การเสนอราคาและรับงาน</h5>พาร์ทเนอร์ต้องแจกแจงค่าแรง ค่าอะไหล่ และค่าเดินทางในใบเสนอราคาก่อนเริ่มงาน หากต้องเปลี่ยนแปลงราคา ต้องได้รับความยินยอมจากลูกค้าและบันทึกไว้ในใบงานก่อนลงมือ
    <h5>3. มาตรฐานงานและการรับประกัน</h5>พาร์ทเนอร์รับประกันงานตามจำนวนวันที่ระบุในใบเสนอราคา และต้องให้บริการด้วยความสุภาพ ตรงเวลา และปลอดภัย
    <h5>4. ข้อมูลส่วนบุคคล</h5>Cendon เก็บข้อมูลเท่าที่จำเป็นเพื่อพิจารณาใบสมัครและให้บริการ การยืนยันตัวตนทำผ่าน Didit (ผู้ให้บริการยืนยันตัวตน) หรือให้ทีมงานตรวจรูปบัตร — รูปบัตรและรูปถ่ายคู่บัตรที่ส่งให้ทีมงานจะถูกลบทันทีเมื่อพิจารณาเสร็จ เลขประจำตัวประชาชนเก็บไว้เพียงบางหลักและค่าที่ย้อนกลับไม่ได้ เพื่อกันการสมัครซ้ำ AI ช่วยดูรูปอู่และรูปผลงานเฉพาะผู้ที่ยินยอม และไม่ได้ตัดสินแทนทีมงาน เบอร์โทรของพาร์ทเนอร์จะเปิดให้ลูกค้าเฉพาะงานที่ลูกค้ายืนยันราคาแล้ว รายละเอียดอยู่ใน<a class="lnk" href="/privacy" target="_blank" rel="noopener">นโยบายความเป็นส่วนตัว</a>
    <h5>5. การระงับบัญชี</h5>Cendon อาจระงับการแสดงผลของพาร์ทเนอร์ที่ได้รับการร้องเรียนซ้ำ ให้ข้อมูลเท็จ หรือกระทำการที่เป็นอันตรายต่อลูกค้า
    <h5>6. ค่าธรรมเนียม</h5>ปัจจุบัน Cendon ไม่เรียกเก็บค่าสมัครและค่าธรรมเนียมใด ๆ ลูกค้าชำระเงินกับพาร์ทเนอร์โดยตรง หากมีการเปลี่ยนแปลงจะแจ้งล่วงหน้าและต้องได้รับความยินยอมใหม่</div>`});
}
function stepHd(n){return `<div class="stp">${STEPS.map((l,i)=>`<div class="${i+1<n?"ok":i+1===n?"on":""}"><i></i>${i+1}. ${l}</div>`).join("")}</div>`}

/* ขั้นถัดไป = ซ้อนขั้นใหม่ · กลับไปขั้นที่อยู่ข้างใต้ = ถอยหนึ่งขั้น · กระโดดไปขั้นอื่น (แก้ไขจากหน้าสรุป) = ซ้อนเหมือนกัน */

    <div class="two"><label class="fld"><span>ราคาเริ่มต้น (บาท) <em>*</em></span><input class="inp" id="aF" type="number" inputmode="numeric" value="${esc(APP.from||"")}"/></label>
    <label class="fld"><span>รับประกันงาน (วัน) <em>*</em></span><input class="inp" id="aW" type="number" inputmode="numeric" value="${esc(APP.warranty||30)}"/></label></div>
    <label class="fld"><span>ความชำนาญ / เครื่องมือ <em>*</em> <small style="font-weight:400;color:var(--muted)">อย่างน้อย 30 ตัวอักษร</small></span><textarea class="inp" id="aB" placeholder="เช่น ระบบแอร์ญี่ปุ่นทุกรุ่น มีเครื่องแวคคั่มและเครื่องเติมน้ำยา">${esc(APP.about||"")}</textarea></label>`,
    foot:'<button class="btn s" id="aBk">ย้อนกลับ</button><button class="btn p" id="aNx">ถัดไป</button>',
    mount(){
      wireSeg("aT",v=>APP.title=v);
      /* ตรวจเลขบัตรระหว่างพิมพ์: ครบ 13 หลักแล้วบอกทันทีว่าถูกตามสูตรหลักสุดท้ายไหม */

    +'<input type="file" id="aFile" accept="image/*" hidden/>',

  statusPage({appNo:"CP-PREVIEW",status:st,name:nm,submittedAt:Date.now(),review:st==="rejected"||st==="declined"?{note:"ตัวอย่างหมายเหตุจากทีมงาน: รูปบัตรไม่ชัด กรุณาถ่ายใหม่"}:null},false,{st,push});
}

function staffBar(){
  const s=$("staff");
  if(!ME||!ME.staff){s.hidden=true;s.innerHTML="";return}
  s.hidden=MODE!=="staff";
  s.innerHTML=`${ME.admin?`<button id="sTest"><i class="ti ti-shield-check"></i>${ME.technician&&ME.technician.test?"ช่างทีมงานของฉัน":"เป็นช่างทีมงาน"}</button>`:""}<button id="sApps"><i class="ti ti-id-badge-2"></i>ตรวจใบสมัคร<span class="n" id="sAppN" hidden></span></button><button id="sAll"><i class="ti ti-list-details"></i>งานทั้งหมด</button>`;
  if($("sTest"))$("sTest").onclick=testTech;$("sApps").onclick=reviewList;$("sAll").onclick=()=>jobs(true);
  api("/api/tech/applications").then(d=>{const n=(d.applications||[]).length;if(n&&$("sAppN")){$("sAppN").hidden=false;$("sAppN").textContent=n}}).catch(()=>{});
}
/* ช่างทีมงาน — ใช้แค่ตำแหน่งอู่ ไม่ต้องมีเอกสาร เห็นเฉพาะทีมงาน Cendon ลูกค้าทั่วไปไม่เห็น */
function testTech(){
  const t=ME.technician&&ME.technician.test?ME.technician:null;let pos=t&&t.lat?{lat:t.lat,lng:t.lng}:null;let gps=false;
  sheet({push:$("bs").classList.contains("on"),title:t?"ช่างทีมงานของฉัน":"เป็นช่างทีมงาน",body:`
    <div class="picker" id="tMap"></div><p class="coord" id="tXY"></p>
    <button class="btn s w" id="tGps" style="margin-bottom:14px"><i class="ti ti-current-location"></i> ใช้ตำแหน่งปัจจุบัน</button>
    <label class="fld"><span>ชื่ออู่ (ไม่ใส่ก็ได้)</span><input class="inp" id="tS" value="${esc(t?t.shop:"")}" placeholder="อู่ทดสอบ"/></label>
    <p class="note"><i class="ti ti-eye-off"></i>ร้านนี้เห็นเฉพาะทีมงาน Cendon ลูกค้าทั่วไปไม่เห็น ใช้รับงานและทดลองระบบได้ครบทุกขั้น</p>`,
    foot:`${t?'<button class="btn s" id="tOpen">ดูร้านของฉัน</button>':""}<button class="btn p" id="tGo">${t?"บันทึกตำแหน่ง":"เป็นช่างเลย"}</button>`,
    mount(){
      const pk=picker($("tMap"),pos,p=>{pos=p;$("tXY").textContent=p.lat.toFixed(5)+", "+p.lng.toFixed(5)});
      $("tGps").onclick=e=>busy(e.currentTarget,async()=>{const p=await locate();if(p){pk.set(p);gps=true}});
      if($("tOpen"))$("tOpen").onclick=()=>openTech(t.id);
      $("tGo").onclick=e=>busy(e.currentTarget,async()=>{
        if(!window.L&&!gps&&!t)throw new Error("กดใช้ตำแหน่งปัจจุบันก่อน");
        await api("/api/tech/apply",{body:{test:true,lat:pos.lat,lng:pos.lng,shop:$("tS").value.trim()}});
        await refreshMe();await load();closeSheet();toast(t?"บันทึกแล้ว":"คุณเป็นช่างทีมงานแล้ว");
        const me=ME.technician;if(MODE==="tech")dash();else if(me)setTimeout(()=>openTech(me.id),450);
      });
    }});
}
async function reviewList(open){
  sheet({title:"ตรวจใบสมัคร",body:'<div class="skel"></div>'});
  try{
    const L=(await api("/api/tech/applications")).applications||[];
    /* เปิดตรงจากลิงก์ (/staff/review/<uid>) — ไม่มีใบนั้นแล้ว (ตรวจไปแล้ว/ถอนใบ) ก็เหลือรายการให้เห็น */
    const want=typeof open==="string"&&L.find(x=>x.uid===open);
    sheet({title:"ตรวจใบสมัคร",body:(L.length?L.map((a,i)=>`<button class="jl" data-i="${i}" style="animation-delay:${i*35}ms"><span class="av sq" style="--c1:${PALETTE[i%PALETTE.length]}">${initial(a.name)}</span><span class="jb"><b>${esc(a.name)}</b><small>${esc(a.shop||"")} · ${esc(a.area)} · ${a.years} ปี</small></span>${aiBadge(a.ai)}<i class="ti ti-chevron-right"></i></button>`).join("")
      :'<div class="empty"><i class="ti ti-inbox"></i><b>ไม่มีใบสมัครรอตรวจ</b></div>'),
      mount(b){b.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>reviewOne(L[+x.dataset.i]))}});
    if(want)reviewOne(want);else if(typeof open==="string")toast("ใบสมัครนี้ไม่ได้รอตรวจแล้ว");
  }catch(e){$("bsB").innerHTML=`<div class="empty"><i class="ti ti-cloud-off"></i><b>${esc(e.message)}</b></div>`}
}
/* ── ผล AI คัดกรองใบสมัคร (ทีมงานเห็นเท่านั้น) — AI ไม่ได้อนุมัติแทนคน แค่ชี้ว่าควรดูตรงไหน ── */
const VETTING_VERSION=4;
const AIV={pass:["AI ตรวจเบื้องต้นแล้ว · รอทีมงาน","#1a7f4b","ti-circle-check"],review:["ต้องตรวจเพิ่ม","#b7791f","ti-alert-triangle"],fail:["ไม่ผ่าน · ต้องให้ผู้สมัครแก้","#c0392b","ti-circle-x"]};
function aiBadge(ai){if(!ai)return"";const v=AIV[ai.verdict]||AIV.review;return`<span class="aib" style="--c:${v[1]}"><i class="ti ${v[2]}"></i>${v[0]}</span>`}
function aiCard(ai){
  if(!ai)return`<div class="aic"><div class="aih"><b><i class="ti ti-robot"></i> AI คัดกรอง</b><button class="btn s" id="aiRe">ตรวจด้วย AI</button></div><small>ยังไม่มีผล — ใบนี้ส่งก่อนเปิดระบบ หรือ AI ล้มตอนส่ง</small></div>`;
  const v=AIV[ai.verdict]||AIV.review, L={high:["#c0392b","ti-alert-octagon"],medium:["#b7791f","ti-alert-triangle"],low:["#6b7280","ti-info-circle"]};
  return`<div class="aic" style="--c:${v[1]}"><div class="aih"><b><i class="ti ${v[2]}"></i> ${ai.status==='complete'?v[0]:ai.status==='skipped'?'AI ไม่ได้ดูรูป — ทีมงานตรวจเอง':'AI ยังตรวจไม่สำเร็จ'}</b><button class="btn s" id="aiRe">ตรวจอีกครั้ง</button></div>
    ${ai.flags&&ai.flags.length?`<ul class="nt">${ai.flags.map(f=>`<li style="--c:${(L[f.level]||L.low)[0]}"><i class="ti ${f.block?"ti-ban":(L[f.level]||L.low)[1]}"></i>${f.block?"<b>ไม่ผ่าน:</b> ":""}${esc(f.msg)}</li>`).join("")}</ul>`:'<small>ไม่พบจุดน่าสงสัย</small>'}
    ${ai.summary?`<p class="nt">${esc(ai.summary)}</p>`:""}
    <small>${esc(ai.vision||"")}${ai.error?" · "+esc(ai.error):""} · ${new Date(ai.at).toLocaleString("th-TH")}</small>
    <small>AI ไม่พิสูจน์ตัวตนหรือเจ้าของรูป ต้องมีหลักฐานตรวจโดยคนครบทุกข้อ</small></div>`}
/* ตัวตน: โหมดทีมงาน = เลขที่กรอก (ตัวใหญ่ แยกกลุ่ม) ให้เทียบกับรูปบัตรเอง · โหมด Didit = ผลจาก Didit + ชื่อ/วันเกิดตามบัตร + ข้อสงสัย */
const IDS={approved:["ok","ti-circle-check","Didit: ยืนยันตัวตนผ่าน"],review:["warn","ti-hourglass","Didit: กำลังตรวจ — รอผลก่อนอนุมัติ"],declined:["bad","ti-circle-x","Didit: ไม่ผ่าน — ผู้สมัครต้องลองใหม่"],expired:["warn","ti-clock-x","Didit: ลิงก์หมดอายุ ผู้สมัครยังไม่ได้ยืนยัน"],pending:["warn","ti-clock","Didit: ผู้สมัครยังทำไม่เสร็จ"],not_started:["warn","ti-clock","ผู้สมัครยังไม่ได้เริ่มยืนยันตัวตนกับ Didit"],none:["warn","ti-clock","ผู้สมัครยังไม่ได้เริ่มยืนยันตัวตนกับ Didit"]};
const isDidit=a=>!!(a&&a.identity&&a.identity.mode==="didit");
function idPanel(a){
  if(!isDidit(a)){
    /* ระบบไม่เก็บเลขบัตรเต็ม (เข้ารหัส + เหลือ 3 หลักท้าย) — ทีมงานพิมพ์เลขที่เห็นบนรูปบัตร แล้วระบบเทียบแฮชกับที่ผู้สมัครกรอกให้ */
    const l=String(a.idLast3||String(a.idNo||"").replace(/\D/g,"").slice(-3)||"").padStart(3,"x");
    return`<div class="idp"><small>เลขประจำตัวประชาชนที่ผู้สมัครกรอก (ระบบเก็บแค่ 3 หลักท้าย)</small><b class="nt">x-xxxx-xxxxx-${esc(l[0]+l[1])}-${esc(l[2])}</b>
      <p class="idp-r warn"><i class="ti ti-eye"></i>พิมพ์เลขที่เห็นบนรูปบัตรด้านบน ให้ระบบเทียบกับที่ผู้สมัครกรอก · ดูวันหมดอายุ และเทียบหน้าในรูปคู่บัตรด้วย</p>
      <div class="idc"><input class="inp" id="idcIn" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="เลขบนรูปบัตร 13 หลัก" aria-label="เลขบนรูปบัตร 13 หลัก"/><button class="btn s" id="idcGo" type="button"><i class="ti ti-scan"></i> เทียบ</button></div>
      <p class="idp-r ${a.__idok?"ok":""}" id="idcRes" role="status">${a.__idok?'<i class="ti ti-circle-check"></i>ตรงกับที่ผู้สมัครกรอก':""}</p></div>`;
  }
  const i=a.identity,r=IDS[i.status]||IDS.none;
  return`<div class="idp"><small>ยืนยันตัวตนผ่าน Didit</small><p class="idp-r ${r[0]}"><i class="ti ${r[1]}"></i>${r[2]}</p>
    ${i.name?`<p class="idp-f"><i class="ti ti-id"></i>ชื่อตามบัตร: <b>${esc(i.name)}</b></p>`:""}${i.birth?`<p class="idp-f"><i class="ti ti-cake"></i>วันเกิดตามบัตร ${esc(i.birth)} · อายุ ${ageOf(i.birth)} ปี</p>`:""}${i.last3?`<p class="idp-f"><i class="ti ti-hash"></i>เลขบัตรลงท้าย …${esc(i.last3)}</p>`:""}
    ${(i.flags||[]).map(f=>`<p class="idp-r ${f.block?"bad":f.level==="low"?"":"warn"}"><i class="ti ${f.block?"ti-ban":f.level==="low"?"ti-info-circle":"ti-alert-triangle"}"></i>${esc(f.msg)}</p>`).join("")}</div>`;
}
const CHECKS=[["identity","บัตรตรงกับหน้าในรูปคู่บัตร เลขบัตรตรงกับที่กรอก ชื่อตรง อายุ 18+"],["phone","โทรติดต่อได้ ยืนยันตัวตนแล้ว"],["work","รูปผลงานเป็นงานจริงของผู้สมัคร"],["skills","มีใบรับรอง หรือสัมภาษณ์ทักษะผ่าน"],["shop","อู่/เครื่องมือมีจริง ตำแหน่งตรง"],["terms","ตกลงราคา ขอบเขตงาน และรับประกันแล้ว"]];
/* วิธีตรวจที่ยอมรับต่อข้อ (ต้องตรงกับ EVIDENCE_METHODS ใน backend) */
const REVIEW_METHODS={identity:[["document_review","ตรวจเอกสารโดยทีมงาน"]],phone:[["live_call","โทรยืนยันจริง"]],work:[["portfolio_review","ตรวจผลงานและรายละเอียดงาน"]],skills:[["interview","สัมภาษณ์ทักษะ"],["certificate_review","ตรวจใบรับรอง"]],shop:[["site_visit","ตรวจสถานที่"],["video_call","วิดีโอคอลดูอู่/เครื่องมือ"],["document_review","ตรวจหลักฐานสถานที่"]],terms:[["written_agreement","ตรวจข้อตกลงที่ยืนยันแล้ว"]]};
/* จุดสงสัยของ AI (รูปผลงาน + บัตร) ที่ทีมงานต้องตรวจและบันทึกหลักฐาน — ข้อที่ไม่ผ่านแน่นอนไม่มีช่องให้ลบล้าง */
function reviewFindings(ai,a){return [...(ai&&ai.flags||[]),...(isDidit(a)?a.identity.flags||[]:[])].filter(f=>f.source!=='rules'&&f.level!=='low'&&!f.block).map(f=>`<label class="fld"><span>${esc(f.msg)}</span><textarea class="inp" data-resolution="${esc(f.code)}" minlength="30" maxlength="1000" placeholder="ตรวจแล้วพบว่าไม่มีปัญหา ให้บันทึกหลักฐานอย่างน้อย 30 ตัวอักษร หากปัญหาจริงให้ส่งกลับแก้ไข"></textarea></label>`).join('')}
const aiReady=(ai,a)=>!!(ai&&(ai.status==='complete'||ai.status==='skipped')&&ai.policyVersion===VETTING_VERSION&&ai.revision===a.revision&&Array.isArray(ai.flags)&&!ai.flags.some(f=>f.block||(f.source==='rules'&&f.level==='high')));
async function reviewOne(a){
  /* เทียบเลขบัตรของฉบับนี้ผ่านไปแล้ว (ระบบจำไว้ต่อฉบับแก้ไข) ไม่ต้องพิมพ์ซ้ำ */
  if(a.idChecked)a.__idok=true;
  sheet({push:true,title:a.name,body:'<div class="skel"></div>'});
  let docs=[];try{docs=(await api("/api/tech/docs?uid="+encodeURIComponent(a.uid))).docs||[]}catch(e){}
  const lab=Object.fromEntries(DK.map(d=>[d[0],d[1]]));
  sheet({title:a.name,body:`
    <div class="gal">${docs.map(d=>`<img src="${d.url}" data-z="${d.url}" alt="${esc(lab[d.kind])}" title="${esc(lab[d.kind])}"/>`).join("")||'<div class="ph" style="background:var(--surface-2);color:var(--muted);font-size:14px">ไม่มีเอกสาร</div>'}</div>
    <div id="idBox">${idPanel(a)}</div>
    <div class="kv"><p><span>เบอร์</span><b><a href="tel:${esc(a.phone)}" style="color:var(--accent)">${esc(a.phone)}</a></b></p><p><span>อู่</span><b>${esc(a.shop||"–")}</b></p><p><span>อายุ / ประสบการณ์</span><b>${a.age} ปี / ${a.years} ปี</b></p><p><span>พื้นที่</span><b>${esc(a.area)}${a.lat?` · <a href="https://maps.google.com/?q=${a.lat},${a.lng}" target="_blank" rel="noopener" style="color:var(--accent)">แผนที่</a>`:""}</b></p><p><span>งาน</span><b>${(a.cats||[]).map(c=>CAT[c]?CAT[c].th:c).join(", ")}</b></p><p><span>ราคา / รับประกัน</span><b>฿${money(a.from)} / ${a.warranty} วัน</b></p><p><span>ใบรับรอง</span><b>${a.hasCert?"มี":"ไม่มี — ต้องสัมภาษณ์"}</b></p>${a.about?`<p><span>ถนัด</span><b>${esc(a.about)}</b></p>`:""}</div>
    <div id="aiBox">${aiCard(a.ai)}</div>
    <div id="aiFindings">${reviewFindings(a.ai,a)}</div>
    ${CHECKS.map(([k,l])=>`<section class="sect"><label class="chk"><input type="checkbox" data-k="${k}"/> ${k==="identity"&&isDidit(a)?"Didit ผ่าน · ชื่อและวันเกิดตามบัตรตรงกับใบสมัคร · อายุ 18+":l}</label><select class="inp" data-method="${k}"><option value="">เลือกวิธีที่ตรวจจริง</option>${(k==="identity"&&isDidit(a)?[["didit","ยืนยันผ่าน Didit + ทีมงานตรวจผล"],...REVIEW_METHODS[k]]:REVIEW_METHODS[k]).map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select><textarea class="inp" data-evidence="${k}" minlength="20" maxlength="1000" placeholder="บันทึกหลักฐานที่ตรวจจริง อย่างน้อย 20 ตัวอักษร ไม่ใส่เลขบัตรเต็ม"></textarea></section>`).join("")}
    <label class="fld"><span>บันทึก</span><textarea class="inp" id="rvN" placeholder="ตรวจอะไรไปบ้าง / ต้องแก้อะไร (อย่างน้อย 10 ตัวอักษร)"></textarea></label>
    <p class="note" id="rvWhy"></p>
    ${ME&&ME.owner?`<div class="rv-test"><button class="btn s w" id="rvTest" type="button"><i class="ti ti-flask"></i> อนุมัติทดสอบ — ข้ามการตรวจทั้งหมด</button><small>เฉพาะเจ้าของระบบ · ได้ "ร้านทดสอบ" ที่ทีมงานเห็นเท่านั้น ลูกค้าทั่วไปไม่เห็น ไม่มีป้ายยืนยัน · จะเปิดให้ลูกค้าเห็นต้องผ่านการตรวจจริง</small></div>`:""}`,
    /* คำตัดสิน 3 แบบ: ไม่ผ่าน (ปิดใบสมัคร ส่งใหม่ไม่ได้) · ให้แก้ (ผู้สมัครแก้แล้วส่งใหม่ได้) · อนุมัติ */
    foot:'<button class="btn s rv-ban" id="rvBan">ไม่ผ่าน</button><button class="btn s" id="rvNo">ให้แก้</button><button class="btn p" id="rvOk" disabled>อนุมัติ</button>',
    mount(b){
      b.querySelectorAll("[data-z]").forEach(i=>i.onclick=()=>zoom(i.dataset.z));
      const boxes=[...b.querySelectorAll("[data-k]")];
      /* ปุ่มอนุมัติเปิดได้เมื่อครบทุกอย่างแบบเดียวกับที่ backend ตรวจ — บอกด้วยว่ายังขาดอะไร */
      const ready=()=>{
        const why=!(ME&&ME.admin)?"เฉพาะ admin ที่อนุมัติได้":ME.uid===a.uid?"อนุมัติใบสมัครของตัวเองไม่ได้":!aiReady(a.ai,a)?(a.ai&&(a.ai.flags||[]).some(f=>f.block)?"มีข้อที่ไม่ผ่านแน่นอน — กด \"ให้แก้ไข\" ส่งกลับผู้สมัคร":"AI ต้องตรวจสำเร็จด้วยข้อมูลชุดล่าสุดก่อน (กดตรวจอีกครั้ง)")
          :!isDidit(a)&&!a.__idok?"พิมพ์เลขบนรูปบัตรให้ระบบเทียบกับที่ผู้สมัครกรอกก่อน (ด่านตัวตน)":isDidit(a)&&a.identity.status!=="approved"?"รอผู้สมัครยืนยันตัวตนกับ Didit ให้ผ่านก่อน":isDidit(a)&&(a.identity.flags||[]).some(f=>f.block)?"ตัวตนไม่ผ่าน (ดูกล่อง Didit) — กด \"ให้แก้ไข\" ส่งกลับผู้สมัคร"
          :!(boxes.length===CHECKS.length&&boxes.every(x=>x.checked))?"ติ๊กให้ครบทุกข้อ":!CHECKS.every(([k])=>b.querySelector(`[data-method="${k}"]`).value&&b.querySelector(`[data-evidence="${k}"]`).value.trim().length>=20)?"เลือกวิธีตรวจและบันทึกหลักฐานทุกข้อ (อย่างน้อย 20 ตัวอักษร)"
          :![...b.querySelectorAll('[data-resolution]')].every(x=>x.value.trim().length>=30)?"บันทึกผลตรวจจุดสงสัยทุกข้อ (อย่างน้อย 30 ตัวอักษร)":$("rvN").value.trim().length<10?"เขียนบันทึกการตรวจ":"";
        $("rvOk").disabled=!!why;$("rvWhy").textContent=why?"ยังอนุมัติไม่ได้: "+why:"";
      };
      /* เทียบเลขบัตร: ส่งเลขไปให้ระบบเทียบแฮช แล้วล้างช่องทิ้งทันที ไม่ค้างเลขบัตรไว้บนจอ */
      const bindId=()=>{const go=$("idcGo"),inp=$("idcIn");if(!go||!inp)return;
        inp.addEventListener("input",()=>{inp.value=fmtId(inp.value)});
        inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go.click()}});
        go.onclick=()=>busy(go,async()=>{const res=$("idcRes");
          const typed=inp.value.replace(/\D/g,"");
          /* ช่วงรอหลังบ้านรุ่นใหม่ deploy: หลังบ้านเก่ายังไม่มีช่องเทียบ (404) แต่ยังส่งเลขเต็มมา — เทียบบนจอทีมงานไปก่อน
             หลังบ้านรุ่นใหม่ไม่ส่งเลขเต็มออกมาอีก ทางนี้จึงไม่ถูกใช้ */
          const idcheck=()=>api("/api/tech/review/idcheck",{body:{uid:a.uid,idNo:typed}}).catch(e=>{if(e.status===404&&a.idNo)return {match:typed===String(a.idNo).replace(/\D/g,"")};throw e});
          try{const r=await idcheck();
            a.__idok=!!r.match;res.className="idp-r "+(r.match?"ok":"bad");
            res.innerHTML=r.match?'<i class="ti ti-circle-check"></i>ตรงกับที่ผู้สมัครกรอก':'<i class="ti ti-circle-x"></i>ไม่ตรงกับที่ผู้สมัครกรอก — ดูรูปบัตรอีกครั้ง หรือส่งกลับให้ผู้สมัครแก้';
          }catch(e){res.className="idp-r bad";res.innerHTML='<i class="ti ti-alert-triangle"></i>'+esc(e.message)}
          finally{inp.value="";ready()}});
      };
      bindId();
      b.addEventListener('input',ready);b.addEventListener('change',ready);ready();
      $("rvNo").disabled=$("rvBan").disabled=!(ME&&ME.admin)||ME.uid===a.uid;
      const bindAI=()=>{const btn=$("aiRe");if(!btn)return;btn.onclick=()=>busy(btn,async()=>{const r=await api('/api/tech/rescreen',{body:{uid:a.uid}});a.ai=r.ai;if(r.identity)a.identity=r.identity;
        $("aiBox").innerHTML=aiCard(r.ai);$("aiFindings").innerHTML=reviewFindings(r.ai,a);$("idBox").innerHTML=idPanel(a);bindAI();bindId();ready();
        toast(r.ai&&r.ai.status==='complete'?'AI ตรวจครบแล้ว กรุณาตรวจหลักฐานต่อ':r.ai&&r.ai.status==='skipped'?'ผลล่าสุดแล้ว — AI ไม่ได้ดูรูป ทีมงานตรวจเอง':'AI ยังไม่สำเร็จ ยังอนุมัติไม่ได้')})};bindAI();
      const go=(decision,btn)=>busy(btn,async()=>{
        const evidence=Object.fromEntries(CHECKS.map(([k])=>[k,{method:b.querySelector(`[data-method="${k}"]`).value,note:b.querySelector(`[data-evidence="${k}"]`).value.trim()}]));
        const resolutions=Object.fromEntries([...b.querySelectorAll('[data-resolution]')].map(x=>[x.dataset.resolution,{outcome:'false_positive',note:x.value.trim()}]));
        await api("/api/tech/review",{body:{uid:a.uid,revision:a.revision,decision,note:$("rvN").value.trim(),checks:Object.fromEntries(boxes.map(x=>[x.dataset.k,x.checked])),evidence,resolutions}});
        toast(decision==="approve"?"อนุมัติแล้ว":decision==="decline"?"บันทึกว่าไม่ผ่านแล้ว":"ส่งกลับให้แก้ไขแล้ว");await load();staffBar();reviewList();
      });
      /* ส่งกลับ/ไม่ผ่าน ต้องมีเหตุผลให้ผู้สมัครอ่าน (หลังบ้านบังคับ 10 ตัวอักษรเหมือนกัน) — บอกก่อนยิง ไม่ปล่อยให้ error */
      const why=()=>{if($("rvN").value.trim().length>=10)return true;$("rvWhy").textContent="เขียนเหตุผลในช่องบันทึก (อย่างน้อย 10 ตัวอักษร) — ผู้สมัครจะเห็นข้อความนี้";$("rvN").focus();return false};
      $("rvOk").onclick=e=>go("approve",e.currentTarget);$("rvNo").onclick=e=>{if(why())go("reject",e.currentTarget)};
      $("rvBan").onclick=e=>{if(why()&&confirm("ใบสมัครนี้ไม่ผ่าน — ผู้สมัครจะส่งใหม่ไม่ได้อีก ยืนยัน?"))go("decline",e.currentTarget)};
      /* อนุมัติทดสอบ (เจ้าของระบบ) — ไม่ต้องติ๊ก ไม่ต้องเทียบบัตร ได้ร้านทดสอบที่ลูกค้าไม่เห็น */
      if($("rvTest"))$("rvTest").onclick=e=>busy(e.currentTarget,async()=>{
        await api("/api/tech/review",{body:{uid:a.uid,revision:a.revision,decision:"approve_test",note:$("rvN").value.trim()}});
        toast("อนุมัติทดสอบแล้ว — เปิดเป็นร้านทดสอบ ลูกค้าทั่วไปไม่เห็น");await load();staffBar();reviewList();
      });
    }});
}
