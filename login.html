<script>
/* ธีมเดียวกับหน้าหลัก: อ่านค่าที่ผู้ใช้ตั้ง (สว่าง/มืด) ธีมรุ่นเก่าตกไปที่โทนใกล้สุด — ต้องรันก่อนวาดหน้า */
(function(){var v=null,OLD={warm:"light",pearl:"light",emerald:"light",plant:"light",moss:"light",grid:"light",
  carbon:"dark",night:"dark",midnight:"dark",cyber:"dark",aurora:"dark",ocean:"dark",sunset:"dark",magma:"dark",wire:"dark"};
  try{v=JSON.parse(localStorage.getItem("spire_theme"))}catch(e){}
  document.documentElement.setAttribute("data-theme",v==="light"||v==="dark"?v:(OLD[v]||"light"))})();
</script>
<style>
/* ══════════════════════════════════════════════════════════════════
   หน้าเข้าสู่ระบบ Cendon — สี ฟอนต์ ปุ่ม ชุดเดียวกับหน้าหลัก
   ══════════════════════════════════════════════════════════════════
   โครงสองฝั่ง: ซ้ายคือปุ่มล็อกอิน ขวาคือฉากแบรนด์ (โลโก้ Cendon บนแสงอุ่นจาง ๆ)
   บนมือถือฝั่งขวายุบเป็นแถบเตี้ย ๆ ด้านบน เพราะปุ่มต้องอยู่ในระยะนิ้วโป้ง
   ══════════════════════════════════════════════════════════════════ */
:root,html[data-theme="light"]{
  --bg:#FAFAF9;--surface:#FFFFFF;--surface-2:#F4F4F5;--ink:#09090B;--muted:#71717A;--faint:#A1A1AA;
  --line:rgba(9,9,11,.08);--co:#E9682A;--co-soft:rgba(233,104,42,.10);
  --aura1:rgba(232,148,60,.10);--aura2:rgba(120,150,200,.07);--aura3:rgba(200,150,90,.06);--r:14px}
html[data-theme="dark"]{
  --bg:#09090B;--surface:#111113;--surface-2:#18181B;--ink:#FAFAFA;--muted:#A1A1AA;--faint:#52525B;
  --line:rgba(255,255,255,.08);--co:#F07A36;--co-soft:rgba(240,122,54,.12);
  --aura1:rgba(232,132,60,.12);--aura2:rgba(120,130,170,.08);--aura3:rgba(200,120,70,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Spire09','Kanit',system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:400;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(50% 45% at 10% 4%,var(--aura1),transparent 60%),radial-gradient(45% 40% at 95% 10%,var(--aura2),transparent 60%),
    radial-gradient(60% 50% at 80% 100%,var(--aura3),transparent 60%)}

/* ── ฝั่งซ้าย: ฟอร์ม ───────────────────────────────────────────── */
.side{
  display:flex;flex-direction:column;min-height:100dvh;
  padding:34px clamp(24px,5vw,64px) 30px;position:relative;
}
.brandbar{display:flex;align-items:center;gap:9px;color:var(--ink)}
.brandbar .cmk{height:26px;width:auto;color:var(--co)}
.brandbar b{font-weight:700;font-size:19px;letter-spacing:-.02em}

.mid{flex:1;display:flex;flex-direction:column;justify-content:center;
     max-width:392px;width:100%;margin:0 auto;padding:38px 0}
h1{margin:0 0 9px;font-size:clamp(28px,4vw,36px);font-weight:600;letter-spacing:-.01em}
.sub{margin:0 0 30px;color:var(--muted);font-size:15px;line-height:1.65}

.btn{
  display:flex;align-items:center;justify-content:center;gap:11px;
  width:100%;padding:14px 18px;margin-bottom:11px;
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);color:var(--ink);
  font:inherit;font-size:15px;font-weight:500;cursor:pointer;
  transition:border-color .16s,background .16s,transform .1s,filter .16s;
}
.btn:hover{border-color:var(--co)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--co);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn .ti{font-size:19px}
/* ปุ่มหลักส้มเรียบแบบปุ่ม "ถาม" ของหน้าหลัก */
.btn.g-primary{background:var(--co);border-color:transparent;color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 20px -10px var(--co)}
.btn.g-primary:hover{filter:brightness(1.06);border-color:transparent}
.btn.ghost{background:transparent}
.note a{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:2px}

.or{display:flex;align-items:center;gap:14px;margin:18px 0;color:var(--faint);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.foot{color:var(--faint);font-size:12.5px;line-height:1.7}
.foot a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.note{
  display:flex;gap:9px;margin-top:16px;padding:12px 13px;border-radius:12px;
  background:var(--co-soft);border:1px solid color-mix(in srgb,var(--co) 28%,transparent);
  color:var(--muted);font-size:12.5px;line-height:1.6;
}
.note i{color:var(--co);font-size:16px;flex:none;margin-top:1px}
.note[hidden]{display:none}

/* ── ฝั่งขวา: ฉากแบรนด์ — โลโก้ Cendon ตัวใหญ่บนพื้นเทาอ่อน มีแสงส้มจาง ๆ ── */
.stage{position:relative;overflow:hidden;background:var(--surface-2);border-left:1px solid var(--line)}
.stage::before{content:"";position:absolute;inset:0;
  background:radial-gradient(55% 45% at 50% 42%,var(--co-soft),transparent 70%),radial-gradient(120% 60% at 50% 110%,var(--aura2),transparent 62%)}
.art{position:absolute;inset:0;display:grid;place-items:center;padding:6% 8%}
.art .cmk{height:min(38%,260px);width:auto;color:var(--co);filter:drop-shadow(0 30px 50px color-mix(in srgb,var(--co) 30%,transparent))}
.tag{position:absolute;left:clamp(22px,4vw,44px);bottom:clamp(22px,4vw,40px);color:var(--muted);font-size:13px;letter-spacing:.02em}
.tag b{display:block;font-size:19px;font-weight:600;color:var(--ink);margin-top:5px}

/* ── มือถือ ────────────────────────────────────────────────────── */
@media(max-width:860px){
  /* ฉากแบรนด์ต้องขึ้นก่อนบนมือถือ ทั้งที่อยู่หลังในโครงสร้าง HTML
     — วางลำดับด้วย grid-row ไม่ใช่สลับ HTML เพราะลำดับการอ่านของ
     screen reader และลำดับ Tab ต้องเริ่มที่ฟอร์มเสมอ */
  body{grid-template-columns:1fr;grid-template-rows:30vh auto}
  .stage{grid-row:1;border-left:0;border-bottom:1px solid var(--line)}
  .side{grid-row:2}
  .side{min-height:auto;padding:26px 22px calc(26px + env(safe-area-inset-bottom))}
  .mid{padding:20px 0 12px;max-width:none}
  .tag{font-size:11.5px}.tag b{font-size:16px}
  .art .cmk{height:46%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   ตรรกะหน้าเข้าสู่ระบบ
   ══════════════════════════════════════════════════════════════════ */
(function(){
  var $ = function(id){ return document.getElementById(id) };

  /* ── ภาษา — อ่านค่าที่ผู้ใช้เลือกไว้จากหน้าหลัก ── */
  var lang = "th";
  try{ lang = JSON.parse(localStorage.getItem("lang")) || "th" }catch(e){}
  if(lang === "en"){
    $("h1").textContent  = "Log into your account";
    $("sub").textContent = "Look after your car, get warned before it's due, and check any garage quote.";
    $("bGoogle").querySelector("span").textContent = "Login with Google";
    $("bGuest").querySelector("span").textContent  = "Continue without an account";
    document.querySelector(".or").textContent = "or";
  }
  var T = function(th, en){ return lang === "en" ? en : th };

  function warn(msg){ $("warnTx").textContent = msg; $("warn").hidden = false }

  /* ── ปลายทางหลังล็อกอินสำเร็จ ──
     รับ ?next= มาได้ แต่ยอมเฉพาะเส้นทางภายในเว็บนี้เท่านั้น
     ถ้าปล่อยให้ใส่ URL เต็มได้ จะกลายเป็นช่องทางพาผู้ใช้ไปเว็บอื่น
     หลังล็อกอิน (open redirect)                                     */
  function nextUrl(){
    var raw = new URLSearchParams(location.search).get("next") || "";
    /* เส้นทางในเว็บนี้ (หลายชั้นได้ เช่น /jobs/<id> /tech/<ร้าน>/reviews แต่ห้ามมี // ติดกัน) + ?ค่าต่อท้ายได้
       เดิมไม่รับ ?… เลย ล็อกอินเสร็จแล้วใบงานที่กดมาจาก LINE หายไป กลายเป็นหน้าแรกเปล่า ๆ */
    var m = /^\/?((?:[A-Za-z0-9._~%-]+\/)*[A-Za-z0-9._~%-]*?)(\.html)?(\?[A-Za-z0-9._~%=&+-]*)?$/.exec(raw);
    if(!m) return "/";
    return "/" + m[1].replace(/^index$/,"") + (m[3] || "");
  }

  var fbConfig = {apiKey:"AIzaSyDDtvz4d4FRG_KOq5EQHmlDijU-x1FDZlQ",authDomain:"sp1p-82396.firebaseapp.com",databaseURL:"https://sp1p-82396-default-rtdb.firebaseio.com",projectId:"sp1p-82396",storageBucket:"sp1p-82396.appspot.com",messagingSenderId:"924479207020",appId:"1:924479207020:web:ec64428a61403e1ad48a49"};
  var auth = null;
  try{
    firebase.initializeApp(fbConfig);
    auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});
  }catch(e){ console.warn("firebase", e) }

  /* เปิดไฟล์แบบ double-click จะล็อกอินไม่ได้ Google บล็อก file://
     บอกไว้ตรงนี้เลย ดีกว่าปล่อยให้กดแล้วเงียบ */
  if(location.protocol === "file:"){
    warn(T("เปิดไฟล์ตรง ๆ จะล็อกอิน Google ไม่ได้ (Google บล็อก file://) — เปิดผ่าน localhost หรือเว็บจริง",
           "Google sign-in is blocked on file:// — open this over localhost or the live site."));
    $("bGoogle").disabled = true;
  }else if(!auth){
    warn(T("ระบบล็อกอินยังไม่พร้อม ลองใหม่อีกครั้ง","Sign-in is unavailable right now."));
    $("bGoogle").disabled = true;
  }

  /* ── เปิดอยู่ในแอป LINE ──
     Google ไม่ยอมให้ล็อกอินในเบราว์เซอร์ของแอป (ขึ้น 403 disallowed_useragent)
     กด Google แล้วพาไปเปิดหน้านี้ในเบราว์เซอร์ของเครื่องแทน — LINE รู้จัก openExternalBrowser=1 */
  var inLine = /\bLine\//i.test(navigator.userAgent);
  var extUrl = location.href + (location.search ? "&" : "?") + "openExternalBrowser=1";
  if(inLine && location.protocol !== "file:"){
    $("warnTx").textContent = T("กำลังเปิดในแอป LINE — ล็อกอินด้วย Google ต้องเปิดในเบราว์เซอร์ของเครื่อง ",
                                "You're inside LINE — Google sign-in needs your phone's browser. ");
    var a = document.createElement("a"); a.href = extUrl; a.textContent = T("เปิดในเบราว์เซอร์","Open in browser");
    $("warnTx").appendChild(a); $("warn").hidden = false;
  }

  /* ล็อกอินอยู่แล้วก็ไม่ต้องให้กดซ้ำ พาเข้าแอปเลย */
  if(auth) auth.onAuthStateChanged(function(u){ if(u) location.replace(nextUrl()) });

  $("bGoogle").onclick = async function(){
    if(!auth) return;
    if(inLine){ location.href = extUrl; return }
    var b = this, tx = b.querySelector("span"), old = tx.textContent;
    b.disabled = true; tx.textContent = T("กำลังเปิดหน้าต่าง…","Opening…");
    try{
      var p = new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt:"select_account" });
      await auth.signInWithPopup(p);
      location.replace(nextUrl());          /* onAuthStateChanged อาจมาช้ากว่า */
    }catch(e){
      b.disabled = false; tx.textContent = old;
      if(e && e.code === "auth/popup-closed-by-user") return;
      /* บางเบราว์เซอร์บล็อก popup — ถอยไปใช้ redirect ซึ่งไม่โดนบล็อก */
      if(e && (e.code === "auth/popup-blocked" || e.code === "auth/cancelled-popup-request")){
        try{ return await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()) }catch(e2){}
      }
      warn(T("ล็อกอินไม่สำเร็จ: ","Sign-in failed: ") + ((e && e.code) || e));
    }
  };

  $("bGuest").onclick = function(){ location.href = nextUrl() };
})();
</script>
