<style>
html,body{margin:0;min-height:100%;background:#0b0b0c;color:#f5f3ef;font-family:Kanit,system-ui,sans-serif}html{--kb:Kanit,system-ui,sans-serif}body{min-height:100dvh}

/* ── คลิปเปิด: รถ → กล้องพุ่งเข้าจอ → เส้นแสงวาร์ป → หน้าเข้าสู่ระบบโผล่ขึ้นมาจากกลางจอ ── */
.ci{position:fixed;inset:0;z-index:30000;background:#000;overflow:hidden;transition:background-color .7s ease}
.ci video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:54% 50%;transform:scale(1);transform-origin:52% 50%;
  transition:transform 1.15s cubic-bezier(.55,0,.2,1),opacity .85s ease .2s,filter .85s ease .2s}
.ci-skip{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px));z-index:2;min-height:40px;padding:0 18px;border-radius:999px;
  border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font:500 14px/1 Kanit,system-ui,sans-serif;cursor:pointer;
  opacity:0;animation:ciIn .5s ease .8s forwards}
.ci-skip:focus-visible{outline:2px solid #F28C38;outline-offset:3px}
html.ci-on #accountFlow{opacity:0}
html.ci-reveal .ci{background-color:transparent;pointer-events:none}
html.ci-reveal .ci video{transform:scale(1.6);opacity:0;filter:blur(6px)}
html.ci-reveal .ci-skip{opacity:0!important;animation:none;transition:opacity .25s}
html.ci-reveal #accountFlow{opacity:1;animation:ciArrive 1.05s cubic-bezier(.16,.84,.24,1) .12s both}
html.ci-fast .ci,html.ci-fast .ci video{transition-duration:.35s;transition-delay:0s}
html.ci-fast #accountFlow{animation-duration:.5s;animation-delay:0s}
@keyframes ciArrive{from{opacity:0;transform:scale(1.07);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
@keyframes ciIn{to{opacity:1}}
</style>
