<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Car Passport · Cendon</title>
<meta name="description" content="ประวัติรถคันนี้บน Cendon — งานซ่อมที่ร้านยืนยัน บันทึกของเจ้าของ และเลขไมล์ตามเวลา">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cendon">
<meta property="og:title" content="Car Passport · Cendon">
<meta property="og:description" content="ประวัติรถคันนี้ — งานซ่อมที่ร้านยืนยัน บันทึกของเจ้าของ และเลขไมล์">
<meta property="og:image" content="https://cendon-beta.pages.dev/og.jpg">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<script>
/* ธีมตามที่ผู้ใช้ Cendon ตั้งไว้ (ถ้ามี) ไม่งั้นตามเครื่อง */
(function(){try{var t=JSON.parse(localStorage.getItem("spire_theme")||"null");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<style>
:root{--bg:#f7f5f1;--surface:#fff;--surface-2:#f1eee8;--line:rgba(20,16,12,.09);--text:#151312;--muted:#6e6a64;--accent:#ff7a2f;--accent-d:#c2410c;--ok:#16a34a;--ink:#111;--shadow:0 12px 40px -18px rgba(30,20,10,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0e;--surface:#151517;--surface-2:#1d1d20;--line:rgba(255,255,255,.08);--text:#f5f2ee;--muted:#a19c95;--ink:#f5f2ee;--shadow:0 12px 40px -18px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0c0c0e;--surface:#151517;--surface-2:#1d1d20;--line:rgba(255,255,255,.08);--text:#f5f2ee;--muted:#a19c95;--ink:#f5f2ee;--shadow:0 12px 40px -18px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Kanit,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:19px;text-decoration:none}
.brand i{color:var(--accent);font-size:22px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:12.5px;font-weight:500}
.tag i{color:var(--accent)}
.hero{position:relative;overflow:hidden;padding:26px 22px 22px;border-radius:26px;color:#fff;background:radial-gradient(90% 80% at 100% 0,rgba(255,138,61,.42),transparent 60%),linear-gradient(150deg,#121214,#22180f);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 11px);pointer-events:none}
.hero small{display:block;font-size:12px;font-weight:600;color:#ffb35c;letter-spacing:.14em}
.hero h1{margin:8px 0 4px;font-size:clamp(30px,8vw,46px);font-weight:600;line-height:1.08}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hero .sub span{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12.5px}
.hero .km{margin-top:18px;display:flex;align-items:baseline;gap:8px}
.hero .km b{font-size:36px;font-weight:600;font-variant-numeric:tabular-nums}
.hero .km em{font-style:normal;color:rgba(255,244,232,.7);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{padding:14px;border-radius:18px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.stat b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.stat .ti{font-size:18px;margin-bottom:4px;display:block}
.stat.v .ti{color:var(--ok)}.stat.o .ti{color:var(--muted)}.stat.y .ti{color:var(--accent)}
.card{margin:12px 0;padding:18px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.card h2{margin:0 0 12px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 i{color:var(--accent)}
.chart{width:100%;height:170px;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#g)}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .vp{fill:var(--ok);stroke:var(--surface);stroke-width:2}
.chart text{fill:var(--muted);font-size:10px;font-family:Kanit,system-ui,sans-serif}
.legend{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:8px 0}
.tl .dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:17px;position:relative;z-index:1}
.tl li.v .dot{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.tl b{display:block;font-size:15px;font-weight:500;line-height:1.35}
.tl .meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.badge.v{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.badge.o{background:var(--surface-2);color:var(--muted)}
.tl .work{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.5}
.note{display:flex;gap:9px;padding:14px 16px;border-radius:18px;background:var(--surface-2);font-size:13px;line-height:1.6;color:var(--muted)}
.note i{color:var(--accent);font-size:18px;flex:none;margin-top:1px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:16px 18px;border-radius:20px;background:var(--ink);color:var(--bg);text-decoration:none}
.cta b{font-size:15px;font-weight:600}.cta small{display:block;font-size:12.5px;opacity:.75}
.cta i{font-size:22px}
.empty{padding:60px 20px;text-align:center}
.empty i{font-size:44px;color:var(--muted)}
.empty b{display:block;margin:12px 0 6px;font-size:19px;font-weight:600}
.empty p{margin:0;color:var(--muted);font-size:14px}
.sk{border-radius:18px;background:var(--surface-2);animation:sk 1.2s ease-in-out infinite}
@keyframes sk{50%{opacity:.55}}
.fade>*{animation:up .5s cubic-bezier(.2,.9,.25,1) both}
.fade>*:nth-child(2){animation-delay:.06s}.fade>*:nth-child(3){animation-delay:.12s}.fade>*:nth-child(4){animation-delay:.18s}.fade>*:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){.fade>*,.sk{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="/"><i class="ti ti-steering-wheel"></i>Cendon</a><span class="tag"><i class="ti ti-id-badge-2"></i>Car Passport</span></header>
  <main id="out"><div class="sk" style="height:220px"></div><div class="sk" style="height:90px;margin-top:12px"></div><div class="sk" style="height:260px;margin-top:12px"></div></main>
</div>
<script>
/* หน้าประวัติรถที่เจ้าของเปิดให้ดู — อ่านอย่างเดียว ไม่ต้องล็อกอิน · ไม่มีชื่อ ทะเบียน เบอร์ หรือที่อยู่ของเจ้าของ */
(function(){
"use strict";
var API=window.TECH_API_URL||"https://spireonebackend.carspirethailand.workers.dev";
var L=(function(){try{var v=JSON.parse(localStorage.getItem("spire_lang"));if(v)return v}catch(e){}return /^th/i.test(navigator.language||"th")?"th":"en"})();
var EN=L!=="th";document.documentElement.lang=EN?"en":"th";
function T(th,en){return EN?en:th}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(n){return Math.round(Number(n)||0).toLocaleString(EN?"en-US":"th-TH")}
function day(d){var x=typeof d==="number"?new Date(d):new Date(String(d)+"T00:00:00");return isNaN(x)?"":x.toLocaleDateString(EN?"en-GB":"th-TH",{day:"numeric",month:"short",year:"numeric"})}
var out=document.getElementById("out");
var token=decodeURIComponent((location.pathname.split("/passport/")[1]||"").split("/")[0]||"");
function fail(msg){out.innerHTML='<div class="empty"><i class="ti ti-id-badge-off"></i><b>'+esc(msg)+'</b><p>'+T("ลองขอลิงก์ใหม่จากเจ้าของรถ","Ask the owner for a new link")+'</p></div>'}
if(!/^[A-Za-z0-9_-]{20,64}$/.test(token))return fail(T("ลิงก์ไม่ถูกต้อง","This link isn't valid"));
fetch(API+"/api/tech/passport/"+encodeURIComponent(token),{cache:"no-store"}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d&&d.error||"");return d})})
.then(function(d){render(d.passport)}).catch(function(e){fail(e.message||T("เปิดหน้านี้ไม่ได้ตอนนี้","Can't open this page right now"))});

function chart(p){
  var pts=(p.odo||[]).map(function(o){return {t:new Date(o.date+"T00:00:00").getTime(),km:o.km}}).filter(function(o){return o.t>0&&o.km>0});
  if(pts.length<2)return "";
  var vt=(p.verified||[]).filter(function(v){return v.km>0}).map(function(v){return {t:v.at,km:v.km}});
  var all=pts.concat(vt),t0=Math.min.apply(null,all.map(function(o){return o.t})),t1=Math.max.apply(null,all.map(function(o){return o.t})),k0=Math.min.apply(null,all.map(function(o){return o.km})),k1=Math.max.apply(null,all.map(function(o){return o.km}));
  var W=600,H=170,pl=8,pr=8,pt=12,pb=22,x=function(t){return pl+(t1>t0?(t-t0)/(t1-t0):.5)*(W-pl-pr)},y=function(k){return pt+(k1>k0?1-(k-k0)/(k1-k0):.5)*(H-pt-pb)};
  var d=pts.map(function(o,i){return (i?"L":"M")+x(o.t).toFixed(1)+" "+y(o.km).toFixed(1)}).join(" ");
  var area=d+" L"+x(pts[pts.length-1].t).toFixed(1)+" "+(H-pb)+" L"+x(pts[0].t).toFixed(1)+" "+(H-pb)+" Z";
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+T("กราฟเลขไมล์","Mileage chart")+'"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a2f" stop-opacity=".28"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/></linearGradient></defs>'
    +'<line class="ax" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/><path class="ar" d="'+area+'"/><path class="ln" d="'+d+'"/>'
    +pts.map(function(o){return '<circle class="pt" r="3.5" cx="'+x(o.t).toFixed(1)+'" cy="'+y(o.km).toFixed(1)+'"/>'}).join("")
    +vt.map(function(o){return '<circle class="vp" r="5.5" cx="'+x(o.t).toFixed(1)+'" cy="'+y(o.km).toFixed(1)+'"/>'}).join("")
    +'<text x="'+pl+'" y="'+(H-6)+'">'+esc(day(t0))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(day(t1))+'</text></svg>'
    +'<div class="legend"><span><i style="background:#ff7a2f"></i>'+T("เลขไมล์ที่เจ้าของบันทึก","Owner-logged mileage")+'</span>'+(vt.length?'<span><i style="background:#16a34a"></i>'+T("งานที่ร้านยืนยัน","Shop-verified job")+'</span>':"")+'</div>';
}
function render(p){
  var c=p.car||{},name=[c.make,c.model].filter(Boolean).join(" ")||T("รถคันนี้","This car");
  document.title=name+(c.year?" "+c.year:"")+" · Car Passport · Cendon";
  var odo=(p.odo||[]).slice().sort(function(a,b){return a.date<b.date?-1:1}),last=odo[odo.length-1];
  var first=[].concat(odo.map(function(o){return new Date(o.date).getTime()}),(p.services||[]).map(function(s){return new Date(s.date).getTime()}),(p.verified||[]).map(function(v){return v.at})).filter(function(x){return x>0});
  var years=first.length?Math.max(0,(Date.now()-Math.min.apply(null,first))/(365.25*864e5)):0;
  var items=(p.verified||[]).map(function(v){return {v:true,t:v.at,d:v}}).concat((p.services||[]).map(function(s){return {v:false,t:new Date(s.date+"T00:00:00").getTime(),d:s}})).sort(function(a,b){return b.t-a.t});
  out.className="fade";
  out.innerHTML='<section class="hero"><small>CENDON CAR PASSPORT</small><h1>'+esc(name)+'</h1><div class="sub">'+[c.year,c.fuel,c.body].filter(Boolean).map(function(x){return "<span>"+esc(x)+"</span>"}).join("")+'</div>'
      +((p.km||last)?'<div class="km"><b>'+num(p.km||last.km)+'</b><em>'+T("กม. · เลขไมล์ล่าสุด","km · latest mileage")+(last?" · "+esc(day(last.date)):"")+'</em></div>':"")+'</section>'
    +'<section class="stats"><div class="stat v"><i class="ti ti-rosette-discount-check"></i><b>'+(p.verified||[]).length+'</b><small>'+T("งานที่ร้านยืนยัน","shop-verified jobs")+'</small></div>'
      +'<div class="stat o"><i class="ti ti-notebook"></i><b>'+(p.services||[]).length+'</b><small>'+T("บันทึกโดยเจ้าของ","owner records")+'</small></div>'
      +'<div class="stat y"><i class="ti ti-history"></i><b>'+(years>=1?Math.floor(years)+"+":"<1")+'</b><small>'+T("ปีของประวัติ","years of history")+'</small></div></section>'
    +(chart(p)?'<section class="card"><h2><i class="ti ti-chart-line"></i>'+T("เลขไมล์ตามเวลา","Mileage over time")+'</h2>'+chart(p)+'</section>':"")
    +'<section class="card"><h2><i class="ti ti-list-check"></i>'+T("ประวัติการดูแล","Service history")+'</h2>'
      +(items.length?'<ul class="tl">'+items.map(function(x){var d=x.d;
        return x.v?'<li class="v"><span class="dot"><i class="ti ti-rosette-discount-check"></i></span><div><b>'+esc(d.work||T("งานซ่อมผ่าน Cendon","Repair via Cendon"))+'</b><div class="meta"><span class="badge v"><i class="ti ti-check"></i>'+T("ยืนยันโดยร้าน","Shop-verified")+'</span><span>'+esc(day(d.at))+'</span><span>'+esc(d.shop)+(d.shopVerified?' · '+T("ร้านผ่านการตรวจ","vetted shop"):"")+'</span>'+(d.km?'<span>'+num(d.km)+' '+T("กม.","km")+'</span>':"")+(d.warranty?'<span>'+T("รับประกัน ","Warranty ")+d.warranty+T(" วัน"," days")+'</span>':"")+(d.amount?'<span>฿'+num(d.amount)+'</span>':"")+(d.rating?'<span>'+"★".repeat(d.rating)+'</span>':"")+'</div></div></li>'
          :'<li><span class="dot"><i class="ti ti-tool"></i></span><div><b>'+esc(d.item)+'</b><div class="meta"><span class="badge o">'+T("บันทึกโดยเจ้าของ","Owner-recorded")+'</span><span>'+esc(day(d.date))+'</span>'+(d.km?'<span>'+num(d.km)+' '+T("กม.","km")+'</span>':"")+(d.amount?'<span>฿'+num(d.amount)+'</span>':"")+'</div></div></li>'}).join("")+'</ul>'
        :'<p style="margin:0;color:var(--muted);font-size:14px">'+T("ยังไม่มีประวัติการดูแลที่เปิดให้ดู","No service history shared yet")+'</p>')+'</section>'
    +'<p class="note"><i class="ti ti-info-circle"></i><span>'+T("“ยืนยันโดยร้าน” = งานที่ซ่อมผ่าน Cendon ดึงจากระบบโดยตรง เจ้าของแก้ไขไม่ได้ · “บันทึกโดยเจ้าของ” = เจ้าของรถจดเอง · Cendon ไม่ได้ตรวจสภาพรถคันนี้ ควรให้ช่างตรวจก่อนซื้อขายทุกครั้ง · อัปเดตล่าสุด ","“Shop-verified” = repairs done through Cendon, taken straight from the system — the owner can't edit them · “Owner-recorded” = logged by the owner · Cendon hasn't inspected this car; always get an inspection before buying · last updated ")+esc(day(p.updatedAt))+'</span></p>'
    +'<a class="cta" href="/"><div><b>'+T("ดูแลรถของคุณด้วย Cendon","Look after your car with Cendon")+'</b><small>'+T("สมุดรถ · ช่างที่ยืนยันตัวตน · AI ผู้ช่วย","Logbook · vetted mechanics · AI assistant")+'</small></div><i class="ti ti-arrow-right"></i></a>';
}
})();
</script>
</body>
</html>
