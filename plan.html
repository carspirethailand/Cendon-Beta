<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แพ็กเกจ · Cendon</title>
<meta name="description" content="แพ็กเกจการใช้งาน Cendon — ผู้ช่วยดูแลรถยนต์ด้วย AI">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Kanit ใช้ทั้งตัวไทยและตัวเลข หน้าอื่นในแอปโหลดตัวนี้อยู่แล้ว
     หน้านี้ไม่ได้โหลด ตัวเลขจึงตกไปใช้ฟอนต์ระบบซึ่งหน้าตาคนละเรื่องกับทั้งแอป -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">

<!-- ตั้งธีมก่อนวาดหน้า ไม่งั้นจะเห็นจอขาวแวบหนึ่งก่อนเปลี่ยนเป็นธีมมืด -->
<script>(function(){try{
  var r=localStorage.getItem("spire_theme"),t=r?JSON.parse(r):"warm";
  document.documentElement.setAttribute("data-theme",t);
}catch(e){}})();</script>

<style>
/* Spire09 มีเฉพาะอักษรละติน ไม่มีตัวไทย
   ถ้าไม่จำกัด unicode-range เบราว์เซอร์จะพยายามใช้มันวาดตัวไทยด้วย
   แล้วได้อักขระเพี้ยนทั้งหน้า — ทั้งแอปจึงจำกัดช่วงไว้แบบนี้เหมือนกันหมด
   ตัวไทยตกไปที่ Kanit หรือฟอนต์ระบบ ซึ่งวาดได้ถูกต้อง */
@font-face{font-family:"Spire09";src:url("./fonts/Spire09-Medium.woff2") format("woff2");
  font-weight:400 600;font-style:normal;font-display:swap;unicode-range:U+0000-002F,U+003A-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AB-20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Spire09";src:url("./fonts/Spire09-Bold.woff2") format("woff2");
  font-weight:700 900;font-style:normal;font-display:swap;unicode-range:U+0000-002F,U+003A-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AB-20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* ── โทนสี ──
   ใช้ชื่อตัวแปรชุดเดียวกับทั้งแอป หน้านี้จึงเปลี่ยนธีมตามที่ผู้ใช้ตั้งไว้
   และรับสีหลักที่เขาเลือกเองได้ทันทีโดยไม่ต้องแก้อะไรตรงนี้ */
:root{
  --c-bg0:#08090C;--c-bg1:#0E1014;--c-bg2:#14171D;
  --c-ink:#F2F0EC;--c-mut:#A8A79F;--c-faint:#6E6D67;
  --c-line:rgba(255,255,255,.11);--c-line2:rgba(255,255,255,.06);
  --c-card:rgba(255,255,255,.035);--c-card2:rgba(255,255,255,.055);
  --c-acc:#E8943C;--c-acc-2:#D95E3C;
  --c-grad:linear-gradient(135deg,#E8943C,#D95E3C);
  --on-acc:#fff;
  --kd:'Spire09','Kanit',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* ตัวเลขใช้ Kanit ล้วน ไม่ผ่าน Spire09
     ตัวเลขของ Spire09 เป็นทรงเรขาคณิตจัด อ่านราคาเทียบกันหลายใบแล้วสับสน */
  --num:'Kanit',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[data-theme="light"],html[data-theme="plant"]{
  --c-bg0:#F4F1EB;--c-bg1:#FBF9F4;--c-bg2:#FFFFFF;
  --c-ink:#221F1A;--c-mut:#6C665A;--c-faint:#A6A093;
  --c-line:rgba(40,34,18,.13);--c-line2:rgba(40,34,18,.07);
  --c-card:rgba(40,34,18,.028);--c-card2:rgba(40,34,18,.05);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{
  background:var(--c-bg0);color:var(--c-ink);
  font-family:var(--kd);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ── สองช่วงที่ล็อกทีละหน้า ──
   ช่วงบนคือแพ็กเกจ กินเต็มจอพอดี ไม่ต้องเลื่อนก็เห็นครบ
   เลื่อนลงหนึ่งทีจะสแนปไปช่วงล่างซึ่งเป็นข้อมูลประกอบ
   ใช้ scroll-snap ของเบราว์เซอร์ ไม่ได้ดักล้อเมาส์เอง
   เพราะการดัก wheel จะไปพังการเลื่อนด้วยคีย์บอร์ดและ trackpad ของบางเครื่อง */
.deck{scroll-snap-type:y mandatory;height:100dvh;overflow-y:auto;overflow-x:hidden;
  position:relative;z-index:1}
.pane{scroll-snap-align:start;scroll-snap-stop:always;min-height:100dvh;
  padding:0 20px clamp(20px,3vh,40px);display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden}
.pane-in{width:100%;max-width:1180px;margin:0 auto}
/* จอเตี้ยมาก การบังคับสูงเต็มจอจะทำให้เนื้อหาล้นออกไปแล้วกดไม่ถึง
   ปล่อยให้ช่วงนั้นสูงตามเนื้อหาแทน */
/* จอเตี้ยหรือจอแคบ การบังคับสูงเต็มจอจะทำให้เนื้อหาล้นออกไปแล้วกดไม่ถึง
   บนมือถือการ์ดเรียงลงเป็นคอลัมน์เดียว ช่วงบนจึงสูงเกินจอเสมอ
   ปล่อยให้เลื่อนตามปกติดีกว่าบังคับสแนปแล้วผู้ใช้เลื่อนไม่ถึงปุ่ม */
@media(max-height:900px),(max-width:760px){
  .deck{scroll-snap-type:none;height:auto;overflow:visible}
  .pane{min-height:auto;padding-top:28px;overflow:visible}
  .more{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .deck{scroll-snap-type:none}
}

/* ปุ่มบอกให้เลื่อนลง — ไม่งั้นผู้ใช้ไม่รู้ว่ายังมีของข้างล่าง
   เพราะช่วงบนกินเต็มจอพอดีจนไม่มีอะไรโผล่มาให้เห็น */
.more{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 18px 7px;border-radius:16px;
  color:var(--c-mut);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--c-card2);border:1px solid var(--c-line2);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  cursor:pointer;font-family:inherit;
  animation:bob 2.4s ease-in-out infinite}
.more i{font-size:19px}
.more:hover{color:var(--c-acc)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}
@media(prefers-reduced-motion:reduce){.more{animation:none}}

/* ── แสงพื้นหลัง ──
   ซ้อนหลายวงที่ขนาดและความเข้มต่างกัน แสงจริงมี falloff ไม่เป็นเส้นตรง
   ถ้าใช้วงเดียวจะได้ภาพแบนเหมือนแผ่นสีทาบ ไม่มีความลึก */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 620px at 50% -6%,var(--c-acc) 0%,transparent 72%),
    radial-gradient(560px 300px at 50% 2%,var(--c-acc) 0%,transparent 62%),
    radial-gradient(900px 500px at 12% 26%,var(--c-acc-2,var(--c-acc)) 0%,transparent 70%);
  opacity:.11}
html[data-theme="light"] .glow,html[data-theme="plant"] .glow{opacity:.14}

/* เม็ดฟิล์มบาง ๆ ทับพื้นหลัง แก้อาการไล่สีเป็นวงแหวน (banding)
   และทำให้แสงดูเหมือนภาพถ่ายมากกว่าไล่สีที่คำนวณมา */
.grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/></filter>\
<rect width='180' height='180' filter='url(%23n)'/></svg>")}
html[data-theme="light"] .grain{opacity:.05}

/* ── ผิวน้ำใต้การ์ด ──
   ระลอกมาจากตัวกรอง SVG จริง (feTurbulence ป้อนให้ feDisplacementMap)
   ไม่ใช่ลายคลื่นซ้ำ ๆ ที่วาดไว้ตายตัว ซึ่งตาจับรูปแบบซ้ำได้ในไม่กี่วินาที
   ค่า baseFrequency ค่อย ๆ เปลี่ยนใน 19 วินาที น้ำจึงไหลจริง ไม่ใช่ภาพนิ่ง */
/* บ่อสูงเท่าเงา และหดตามจอเตี้ย ไม่งั้นช่วงบนล้นออกนอกจอจนกดปุ่มไม่ถึง */
.pool{position:relative;height:clamp(74px,13vh,168px);margin-top:-4px}

/* ผิวน้ำเริ่มที่หัวบ่อ (= ขอบล่างการ์ด) แล้วทอดลงไปจนพ้นจอ
   กว้างเต็มจอเพราะน้ำไม่ได้มีขอบเท่าเนื้อหา */
.water{position:absolute;top:0;left:calc(50% - 50vw);width:100vw;
  height:calc(100% + 40vh);pointer-events:none;z-index:0;overflow:hidden}
/* ตัวน้ำ: มืดลงตามความลึก ไม่ได้มืดเท่ากันทั้งผืน */
.water::before{content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,transparent,rgba(0,0,0,.14) 40%,rgba(0,0,0,.34) 74%,rgba(0,0,0,.48));
  backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px)}
html[data-theme="light"] .water::before,html[data-theme="plant"] .water::before{
  background:linear-gradient(180deg,transparent,rgba(40,34,18,.08) 30%,rgba(40,34,18,.15) 72%,rgba(40,34,18,.19))}

/* เส้นแสงบาง ๆ ตรงรอยต่อระหว่างการ์ดกับพื้น
   เป็นตัวเดียวที่บอกว่าตรงนี้คือ "ผิว" ของบางอย่าง ไม่ใช่แค่พื้นหลังที่มืดลง
   โดนบิดด้วยตัวกรองระลอกเหมือนกัน เส้นจึงไม่ตรงเป๊ะแบบเส้นที่ลากด้วยไม้บรรทัด */
.water .spec{position:absolute;left:50%;top:0;width:min(880px,94%);height:30px;
  transform:translateX(-50%);filter:url(#rip);
  background:radial-gradient(58% 100% at 50% 0%,var(--c-acc) 0%,transparent 74%);
  opacity:.30;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}

/* ── เงาสะท้อนของการ์ด ──
   ไม่ใช่แค่พลิกกลับแล้วหรี่ความทึบ ซึ่งเป็นสิ่งที่ทำให้ดูปลอมทันที
   1) พลิกแนวตั้ง  2) จางลงแบบโค้ง ไม่ใช่เส้นตรง  3) เบลอเพิ่มตามความลึก
   4) บิดด้วยตัวกรองระลอกตัวเดียวกับผิวน้ำ  5) สีหม่นและอิ่มน้อยลง */
/* กล่องเงาต้องกว้างเท่าน้ำ ไม่ใช่เท่าเนื้อหา
   ของเดิมกว้าง 1180px ขอบซ้าย-ขวาจึงเป็นเส้นตัดคมกลางผืนน้ำ
   ซึ่งเป็นสิ่งที่ทำให้ดูเหมือนรูปที่เอามาแปะ ไม่ใช่เงาที่เกิดบนผิวจริง */
.mirror{position:absolute;top:0;left:calc(50% - 50vw);width:100vw;height:100%;
  z-index:1;overflow:hidden;pointer-events:none;mix-blend-mode:screen;
  /* จางลงทั้งแนวตั้งและแนวนอน สองชั้นซ้อนกันด้วย mask-composite
     ขอบทุกด้านจึงหายไปในน้ำ ไม่มีด้านไหนจบด้วยเส้นตรง */
  -webkit-mask-image:
    linear-gradient(180deg,#000,rgba(0,0,0,.62) 16%,rgba(0,0,0,.34) 34%,rgba(0,0,0,.16) 52%,rgba(0,0,0,.05) 68%,transparent 80%),
    linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
  mask-image:
    linear-gradient(180deg,#000,rgba(0,0,0,.62) 16%,rgba(0,0,0,.34) 34%,rgba(0,0,0,.16) 52%,rgba(0,0,0,.05) 68%,transparent 80%),
    linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* เนื้อในยังต้องอยู่ตรงกับการ์ดจริง กล่องที่กว้างขึ้นไม่ควรทำให้เงาเลื่อนที่ */
.mirror .tiers{max-width:1180px;margin:0 auto;padding:0 20px}
/* ตัวกรอง SVG ต้องมาก่อนตัวกรอง CSS ในสายเดียวกัน ไม่งั้นจะบิดภาพที่เบลอไปแล้ว
   ซึ่งได้ผลคนละอย่าง — ของจริงคือภาพบิดก่อน แล้วน้ำถึงทำให้มัว */
.mirror .tiers{transform:scaleY(-1);
  filter:url(#ripSoft) blur(1.3px) saturate(.66) brightness(.62) contrast(.95);
  opacity:.95}
.mirror .tier{animation:none;box-shadow:none;transition:none;backdrop-filter:none;
  background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.20)}
html[data-theme="light"] .mirror .tier,html[data-theme="plant"] .mirror .tier{
  background:rgba(40,34,18,.12);border-color:rgba(40,34,18,.20)}
.mirror .tier.hero{background:rgba(255,255,255,.17)}
.mirror .tier::after{opacity:.5}
.mirror .tier:hover{transform:none;box-shadow:none}

/* ── เบลอไล่ระดับตามความลึก ──
   ชั้นเดียวให้ความมัวเท่ากันทั้งผืน ซึ่งผิดกับน้ำจริงที่ยิ่งลึกยิ่งมัว
   ซ้อนสี่ชั้น แต่ละชั้นเบลอแรงขึ้นและเริ่มลึกลงไปกว่าชั้นก่อน
   ผลรวมคือความมัวที่เพิ่มต่อเนื่อง ไม่ใช่ขั้นบันได */
/* ชั้นเบลอต้องกว้างเท่าน้ำและยืดพ้นก้นบ่อลงไป
   ถ้าหยุดตรงก้นบ่อพอดี ความมัวจะจบด้วยเส้นตรงซึ่งตาจับได้ทันที */
.mdepth{position:absolute;top:0;left:calc(50% - 50vw);width:100vw;
  height:calc(100% + 26vh);z-index:2;pointer-events:none}
.mdepth i{position:absolute;left:0;right:0;bottom:0;display:block}
.mdepth i:nth-child(1){top:12%;backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 24%);mask-image:linear-gradient(180deg,transparent,#000 24%)}
.mdepth i:nth-child(2){top:32%;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 26%);mask-image:linear-gradient(180deg,transparent,#000 26%)}
.mdepth i:nth-child(3){top:54%;backdrop-filter:blur(3.5px);-webkit-backdrop-filter:blur(3.5px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 28%);mask-image:linear-gradient(180deg,transparent,#000 28%)}
.mdepth i:nth-child(4){top:74%;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%);mask-image:linear-gradient(180deg,transparent,#000 30%)}

html[data-theme="light"] .mirror,html[data-theme="plant"] .mirror{mix-blend-mode:multiply}
html[data-theme="light"] .mirror .tiers,html[data-theme="plant"] .mirror .tiers{
  filter:url(#ripSoft) blur(1.3px) saturate(.5) brightness(1.3) contrast(.75);opacity:.72}
@media(max-width:700px){.pool{display:none}}
/* คนที่ตั้งค่าว่าไม่อยากเห็นการเคลื่อนไหว ต้องได้ภาพนิ่ง
   ตัว SMIL ปิดด้วย CSS ไม่ได้ ต้องสั่งหยุดจากสคริปต์ (ดูท้ายไฟล์) */
/* การหยุดเคลื่อนไหวทำที่สคริปต์ (pauseAnimations) ไม่ใช่ที่นี่
   กฎนี้เคยตั้งค่าความสว่างของตัวเองไว้ต่างหาก คนที่ตั้งค่าลดการเคลื่อนไหว
   เลยได้เงาจางกว่าคนอื่นโดยไม่มีเหตุผล — เขาขอให้ภาพนิ่ง ไม่ได้ขอให้ภาพแย่ลง */

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto}

/* ── แถบบน ── */
.top{display:flex;align-items:center;gap:12px;padding:clamp(10px,2vh,20px) 0 0}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
  border:1px solid var(--c-line);background:var(--c-card);color:var(--c-ink);
  font:inherit;font-size:13.5px;cursor:pointer;text-decoration:none;
  transition:border-color .2s,background .2s,transform .2s}
.back:hover{border-color:var(--c-acc);transform:translateX(-2px)}
.back i{font-size:16px}

/* ── หัวเรื่อง ── */
.head{text-align:center;padding:clamp(16px,3.5vh,44px) 0 clamp(14px,2.7vh,34px)}
.mark{width:clamp(38px,4.7vh,56px);height:clamp(38px,4.7vh,56px);
  margin:0 auto clamp(8px,1.8vh,18px);color:var(--c-acc)}
.mark svg{width:100%;height:100%;display:block}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sub{margin-top:clamp(6px,1.2vh,12px);color:var(--c-mut);font-size:clamp(14px,2vw,16.5px);
  max-width:520px;margin-left:auto;margin-right:auto}

/* ── การ์ด ──

   ของจริงมีทั้งเงาสั้นเข้มตรงที่ของวางอยู่ และเงายาวจางที่ทอดออกไป จึงใส่สองชั้น
   fill-mode เดิมเป็น both ซึ่งค้างค่า transform:none ของเฟรมสุดท้ายไว้ตลอด
   ทับ :hover ที่เขียนไว้จนการ์ดไม่ขยับเลยสักใบ — วัดด้วยเบราว์เซอร์แล้วถึงเห็น */
.tier{position:relative;display:flex;flex-direction:column;

  animation:up .55s cubic-bezier(.2,.9,.3,1.05) backwards;
  animation-delay:calc(.18s + var(--i,0) * .09s);
  transform:translateY(var(--lift,0));
  transition:transform .3s cubic-bezier(.2,.9,.3,1.15),border-color .3s,box-shadow .3s,background .3s}
html[data-theme="light"] .tier,html[data-theme="plant"] .tier{
  box-shadow:0 1px 2px rgba(40,34,18,.07),0 26px 54px -34px rgba(40,34,18,.30)}
.tier:hover{--lift:-6px;border-color:var(--c-acc);

  box-shadow:0 2px 4px rgba(0,0,0,.34),0 34px 68px -30px var(--c-acc)}

/* ── ขอบไล่สี ──
   ขอบสีเดียวรอบใบทำให้การ์ดดูเป็นกรอบรูป ไม่ใช่วัตถุที่มีแสงตกกระทบ
   ของจริงขอบบนรับแสงจึงสว่าง ขอบล่างอยู่ในเงาจึงมืด
   วาดด้วยไล่สีบนวงแหวน 1px ที่ตัดไส้กลางออกด้วย mask */
.tier::after{content:"";position:absolute;inset:-1px;border-radius:21px;padding:1px;
  pointer-events:none;
  background:linear-gradient(180deg,
    rgba(255,255,255,.26),rgba(255,255,255,.07) 26%,
    rgba(255,255,255,0) 58%,rgba(0,0,0,.26));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}
html[data-theme="light"] .tier::after,html[data-theme="plant"] .tier::after{
  background:linear-gradient(180deg,
    rgba(255,255,255,.9),rgba(255,255,255,.35) 26%,
    rgba(40,34,18,0) 58%,rgba(40,34,18,.14))}

/* แผนเด่นได้ขอบสีและแสงในตัว เหมือนที่เว็บขายของทำกัน

<!-- ── ตัวกรองระลอกน้ำ ──
     feTurbulence สร้างสัญญาณรบกวนแบบ fractal แล้วส่งให้ feDisplacementMap
     ใช้ค่าสีของสัญญาณนั้นดันพิกเซลของภาพจริงไปทีละนิด
     ผลคือความบิดที่ไม่มีคาบซ้ำ ต่างจากลายคลื่นวาดมือที่ตาจับรูปแบบได้ในไม่กี่วินาที
     baseFrequency แนวตั้งสูงกว่าแนวนอน เพราะระลอกน้ำยืดออกตามแนวราบ
     ค่ามันค่อย ๆ เปลี่ยนไปกลับใน 19 วินาที ผิวน้ำจึงไหลช้า ๆ ไม่ใช่ภาพนิ่ง -->
<svg width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute;pointer-events:none" id="fx">
  <defs>
    <filter id="rip" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.028" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="19s" repeatCount="indefinite"
          values="0.011 0.028;0.015 0.036;0.010 0.024;0.011 0.028"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- ตัวเดียวกันแต่เบากว่า สำหรับเงาสะท้อน
         ถ้าใช้ scale เท่าผิวน้ำ ตัวหนังสือในเงาจะแหลกจนดูเป็นรอยเปื้อน -->
    <filter id="ripSoft" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.022" numOctaves="2" seed="7" result="n2">
        <animate attributeName="baseFrequency" dur="19s" repeatCount="indefinite"
          values="0.010 0.022;0.013 0.029;0.009 0.019;0.010 0.022"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="7"
        xChannelSelector="R" yChannelSelector="G"/>

  </defs>

<script>
const D=document, $=id=>D.getElementById(id);
const BACKEND_URL="https://spireonebackend.carspirethailand.workers.dev";
const lang=(()=>{ try{ return JSON.parse(localStorage.getItem("lang")||'"th"') }catch(e){ return "th" } })();
const en=lang==="en";
const L=(th,e)=>en?e:th;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=x=>Number(x||0).toLocaleString(en?"en-US":"th-TH");

/* ── สีหลักที่ผู้ใช้เลือกไว้ ──
   ทั้งแอปให้เลือกสีได้ไม่จำกัด หน้านี้ต้องตามไปด้วย ไม่งั้นจะดูเหมือนคนละแอป
   สีอ่อนเกินไปทำให้ตัวหนังสือบนปุ่มอ่านไม่ออก จึงหนีบความสว่างไว้เหมือนที่แอปทำ */
(function(){
  const hex2rgb=h=>{h=String(h||"").trim().replace(/^#/,"");
    if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return /^[0-9a-f]{6}$/i.test(h)?[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]:null};
  const rgb2hex=(r,g,b)=>"#"+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join("");
  function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
    if(d){h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}
    const l=(mx+mn)/2;return [h,d?d/(1-Math.abs(2*l-1)):0,l]}
  function hsl2rgb(h,s,l){h=((h%360)+360)%360;
    const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let t=[0,0,0];
    if(h<60)t=[c,x,0];else if(h<120)t=[x,c,0];else if(h<180)t=[0,c,x];
    else if(h<240)t=[0,x,c];else if(h<300)t=[x,0,c];else t=[c,0,x];
    return [(t[0]+m)*255,(t[1]+m)*255,(t[2]+m)*255]}
  let raw=null;
  try{ raw=JSON.parse(localStorage.getItem("spire_primary")||"null") }catch(e){}
  /* ถ้าผู้ใช้ไม่ได้ตั้งสีเอง ก็ยังต้องคำนวณสีตัวหนังสือบนปุ่มอยู่ดี
     ของเดิม return ทิ้งตรงนี้ สีส้มค่าเริ่มต้นจึงไม่เคยผ่านการตรวจ
     แล้วได้ตัวขาวบนส้มที่ contrast แค่ 2.4:1 ซึ่งอ่านยากจริงบนจอกลางแดด */
  const c=hex2rgb(raw)||hex2rgb("#E8943C");
  let [h,s,l]=rgb2hsl(c[0],c[1],c[2]);
  l=Math.min(.62,Math.max(.18,l)); s=Math.min(.95,s);
  const acc=rgb2hex(...hsl2rgb(h,s,l));
  const acc2=rgb2hex(...hsl2rgb(h-14,s,Math.max(.16,l-.08)));
  const rs=D.documentElement.style;
  rs.setProperty("--c-acc",acc);
  rs.setProperty("--c-acc-2",acc2);
  rs.setProperty("--c-grad","linear-gradient(135deg,"+acc+","+acc2+")");
  rs.setProperty("--c-acc-soft",`rgba(${hex2rgb(acc).join(",")},.12)`);
  /* ตัวหนังสือบนปุ่มสีต้องอ่านออกทั้งสีอ่อนและสีเข้ม */
  const [r2,g2,b2]=hex2rgb(acc);
  rs.setProperty("--on-acc",(0.299*r2+0.587*g2+0.114*b2)/255>0.62?"#1A1712":"#fff");
})();

/* ── แผนสำรอง ใช้เมื่อเรียกหลังบ้านไม่ได้ ──
   ต้องมีชื่อและราคาตรงกับที่แสดงในแอป ไม่งั้นผู้ใช้จะงงว่าคนละอย่างกัน */
const FALLBACK=[
  {key:"light",th:"Light",en:"Light",price:99,cur:"THB",tokens:60000,
   th_desc:"โควตามากขึ้น ใช้ต่อได้สบาย ๆ ทุกวัน",
   en_desc:"More headroom for everyday questions."},
  {key:"gourmet",th:"Gourmet",en:"Gourmet",price:299,cur:"THB",tokens:250000,
   th_desc:"โควตาก้อนใหญ่ วิเคราะห์รูป วิดีโอ และคุยยาวได้เต็มที่",
   en_desc:"A large pool for media analysis and long conversations."}
];

/* คุณสมบัติของแต่ละระดับ — อธิบายจากสิ่งที่ระบบทำได้จริงเท่านั้น
   ไม่ใส่ของที่ยังไม่มี เพราะหน้านี้คือสิ่งที่ผู้ใช้จะใช้ตัดสินใจจ่ายเงิน */
function feats(pl,isFree){
  if(isFree)return [
    ["ti-message-circle",L("ถาม-ตอบเรื่องรถได้ทุกวัน","Ask about your car every day"),
      L("โควตาเติมใหม่ให้ฟรีทุก 5 ชั่วโมง","Free quota, refilled every 5 hours")],
    ["ti-car",L("เก็บรถได้ไม่จำกัดคัน","Unlimited cars in your garage"),""],
    ["ti-bell",L("เตือนเช็กระยะตามเลขไมล์จริง","Service reminders from your real mileage"),""],
    ["ti-cloud",L("ข้อมูลซิงก์ทุกอุปกรณ์","Synced across your devices"),""],
  ];
  const base=[
    ["ti-bolt",L(nf(pl.tokens)+" โทเคนต่อรอบ",nf(pl.tokens)+" tokens per window"),
      L("มากกว่าแผนฟรีหลายเท่า","Many times the free allowance")],
    ["ti-message-2",L("คุยยาวได้ต่อเนื่อง","Longer conversations"),
      L("ไม่ต้องคอยตัดบทเพราะโควตาใกล้หมด","No stopping mid-diagnosis")],
  ];
  if(pl.key==="gourmet")base.push(
    ["ti-photo-scan",L("วิเคราะห์รูปและวิดีโออาการรถ","Photo & video diagnosis"),
      L("ถ่ายรอยรั่ว ฟังเสียงเครื่อง ส่งให้ดูได้เลย","Send a leak, a noise, a warning light")],
    ["ti-history",L("จำบริบทได้ยาวขึ้น","Remembers more of your history"),""]
  );
  base.push(["ti-headset",L("ช่วยเหลือก่อนใคร","Priority support"),""]);
  return base;
}

let quota=null;

function render(){
  const plans=(quota&&quota.plans&&quota.plans.length)?quota.plans:FALLBACK;
  const cur=(quota&&quota.plan)||"free";

  /* แผนที่ได้โทเคนต่อบาทมากที่สุดคือแผนที่ควรเน้น คำนวณจากข้อมูลจริง
     เปลี่ยนราคาวันหลังป้ายก็ย้ายตามเอง ไม่ต้องกลับมาแก้โค้ด */
  let heroKey="",best=0;
  plans.forEach(pl=>{ const r=(Number(pl.tokens)||0)/(Number(pl.price)||1);
    if(r>best){ best=r; heroKey=pl.key } });

  const card=(o)=>`
    <article class="tier${o.hero?" hero":""}" style="--i:${o.i}">
      ${o.badge?`<span class="badge">${esc(o.badge)}</span>`:""}
      <h2>${esc(o.name)}</h2>
      <div class="price"><b>${o.priceText}</b><span>${esc(o.priceSub||"")}</span></div>
      <p class="tag">${esc(o.tag||"")}</p>
      <button class="cta${o.solid?" solid":""}"${o.disabled?" disabled":""}
        ${o.plan?`data-plan="${esc(o.plan)}"`:""}>${o.cta}</button>
      <ul class="feat">${o.feats.map(f=>`<li><i class="ti ${f[0]}"></i><span>
        <b>${esc(f[1])}</b>${f[2]?`<small>${esc(f[2])}</small>`:""}</span></li>`).join("")}</ul>
    </article>`;

  const cards=[card({
    i:0, name:"Free",
    priceText:L("ฟรี","Free"), priceSub:L("ใช้ได้ตลอด","forever"),
    tag:L("เริ่มต้นดูแลรถได้ทันที ไม่ต้องใส่บัตร","Start looking after your car — no card needed"),
    cta:cur==="free"?`<i class="ti ti-check"></i> ${L("แพ็กเกจปัจจุบัน","Your current plan")}`:L("แผนพื้นฐาน","Basic plan"),
    disabled:true, feats:feats(null,true),
    badge:cur==="free"?L("ใช้อยู่","current"):""
  })];

  plans.forEach((pl,idx)=>{
    const isCur=cur===pl.key;
    cards.push(card({
      i:idx+1,
      name:en?(pl.en||pl.key):(pl.th||pl.key),
      priceText:nf(pl.price),
      priceSub:`${esc(pl.cur||"THB")} / ${L("เดือน","month")}`,
      tag:en?(pl.en_desc||pl.th_desc||""):(pl.th_desc||pl.en_desc||""),
      cta:isCur?`<i class="ti ti-check"></i> ${L("แพ็กเกจปัจจุบัน","Your current plan")}`
                :L("สนใจแผนนี้","I'm interested"),
      disabled:isCur, solid:pl.key===heroKey&&!isCur,
      hero:pl.key===heroKey, plan:pl.key,
      badge:isCur?L("ใช้อยู่","current"):(pl.key===heroKey?L("คุ้มที่สุด","best value"):""),
      feats:feats(pl,false)
    }));
  });

  $("tiers").innerHTML=cards.join("");

  $("foot").textContent=L(
    "ตอนนี้ยังไม่มีการเก็บเงิน กดสนใจไว้ได้เลย เราจะแจ้งให้ทราบก่อนเสมอถ้าจะเริ่มเก็บ และจะไม่ตัดเงินโดยไม่ได้รับอนุญาตจากคุณ",
    "Nothing is charged today. Register your interest and we'll tell you well before that changes — we will never charge without your say-so.");

  $("qa").innerHTML=[
    [L("โควตาหักยังไง","How is quota counted?"),
     L("หักตามความยาวจริงของบทสนทนา ถามสั้นก็หักน้อย ไม่ได้นับเป็นครั้ง โควตามีไว้กันค่าใช้จ่ายพุ่ง ไม่ได้มีไว้กันคุณใช้งาน",
       "By the real length of the conversation, not per message. Short questions cost little. The cap exists to control cost, not to limit you.")],
    [L("โควตาฟรีเติมเมื่อไหร่","When does the free quota refill?"),
     L("ทุก 5 ชั่วโมง ระบบเติมให้ใหม่อัตโนมัติ ไม่ต้องทำอะไร",
       "Every 5 hours, automatically. Nothing for you to do.")],
    [L("ถ้าชนโควตาบ่อยล่ะ","What if I keep hitting the cap?"),
     L("บอกเราได้เลยผ่านช่องส่งความเห็นในแอป เราอ่านทุกอัน",
       "Tell us through Feedback in the app — we read every one.")],
  ].map(x=>`<div><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join("");

  paintMirror();
  wire();
}

/* ── เงาสะท้อนในน้ำ ──
   โคลนการ์ดชุดจริงมาแทนที่จะเขียนซ้ำด้วยมือ ราคาเปลี่ยนเมื่อไหร่เงาก็ตามทันที
   ถ้าเขียนซ้ำ วันหนึ่งจะมีคนแก้ที่เดียวแล้วเงาโชว์ราคาเก่าค้างอยู่ */
function paintMirror(){
  const m=$("mirror"); if(!m)return;
  const src=$("tiers"); if(!src)return;
  const c=src.cloneNode(true);
  c.removeAttribute("id");
  /* เงาไม่ควรถูกอ่านโดยโปรแกรมอ่านหน้าจอ และต้องกดไม่ได้ */
  c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
  c.querySelectorAll("button,a").forEach(e=>{ e.tabIndex=-1; e.setAttribute("aria-hidden","true") });
  m.innerHTML="";
  m.appendChild(c);
  /* ชั้นเบลอต้องอยู่ทับเงา จึงต่อท้ายหลังโคลนเสมอ ไม่ใช่เขียนไว้ใน HTML
     เพราะ innerHTML ข้างบนล้างของเดิมทิ้งทุกครั้งที่ราคาเปลี่ยน */
  const d=D.createElement("div");
  d.className="mdepth";
  d.innerHTML="<i></i><i></i><i></i><i></i>";
  /* ต้องอยู่ในบ่อ ไม่ใช่ในเงา เพราะความมัวเป็นสมบัติของน้ำ ไม่ใช่ของเงา
     ถ้าใส่ในเงา ผิวน้ำที่ทับอยู่ข้างบนจะไม่โดนเบลอตาม แล้วเห็นเป็นสองชั้นแยกกัน */
  const pool=m.parentNode;
  const old=pool.querySelector(".mdepth"); if(old)old.remove();
  pool.appendChild(d);
}

function wire(){
  D.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{
    /* ยังไม่มีระบบเก็บเงิน ปุ่มนี้จึงเป็นการลงชื่อความสนใจ ไม่ใช่การซื้อ
       ต้องพูดให้ตรงกับสิ่งที่เกิดขึ้นจริง ไม่ให้ผู้ใช้เข้าใจว่าโดนตัดเงินไปแล้ว */
    b.disabled=true;
    b.classList.add("done");
    b.innerHTML='<i class="ti ti-check"></i> '+L("บันทึกความสนใจแล้ว","Interest noted");
    toast(L("บันทึกไว้แล้ว เปิดขายเมื่อไหร่เราจะบอกก่อนใคร",
            "Noted — we'll tell you the moment it opens"));
    try{ localStorage.setItem("spire_plan_interest",JSON.stringify(
      {plan:b.dataset.plan,at:Date.now()})) }catch(e){}
  });
}

/* ปุ่มเลื่อนลง — ช่วงบนกินเต็มจอพอดีจนไม่มีอะไรโผล่มาบอกว่ายังมีของข้างล่าง */
(function(){
  const btn=$("more"), deck=$("deck"), info=$("paneInfo");
  if(!btn||!deck||!info)return;
  btn.onclick=()=>info.scrollIntoView({behavior:"smooth",block:"start"});
  /* ถึงช่วงล่างแล้วปุ่มไม่มีประโยชน์ ซ่อนไปเลยดีกว่าปล่อยให้กดแล้วไม่มีอะไรเกิดขึ้น */
  deck.addEventListener("scroll",()=>{
    const past=deck.scrollTop>deck.clientHeight*0.4;
    btn.style.opacity=past?"0":"";
    btn.style.pointerEvents=past?"none":"";
  },{passive:true});
})();

let toastT=0;
function toast(msg){
  const el=$("toast");
  el.querySelector("span").textContent=msg;
  el.classList.add("on");
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove("on"),3600);
}

/* กลับไปหน้าที่มาจริง ๆ ถ้ารู้ ไม่งั้นกลับห้องแชต */
(function(){
  $("backTx").textContent=L("กลับ","Back");
  const from=new URLSearchParams(location.search).get("from");
  if(from&&/^[a-z-]+\.html$/.test(from))D.querySelector(".back").setAttribute("href","./"+from);
  if(en){
    $("hTitle").textContent="Pick the plan that fits";
    $("hSub").textContent="Quota is charged by the real length of the conversation — short questions cost little.";
    D.documentElement.lang="en";
    D.title="Plans · Cendon";
  }
})();

/* วาดด้วยค่าสำรองก่อน หน้าจะได้ไม่ว่างระหว่างรอเครือข่าย
   แล้วค่อยวาดทับเมื่อได้ข้อมูลจริง (ราคา/แผนปัจจุบันของบัญชีนี้) */
render();

(async function(){
  try{
    const fb=window.firebase;
    let tok=null;
    if(fb&&fb.auth&&fb.auth().currentUser)tok=await fb.auth().currentUser.getIdToken();
    const r=await fetch(BACKEND_URL+"/api/quota",
      tok?{headers:{Authorization:"Bearer "+tok}}:{});
    if(!r.ok)return;
    const d=await r.json();
    if(d&&(d.plans||d.plan)){ quota=d; render() }
  }catch(e){ /* ออฟไลน์หรือยังไม่ล็อกอิน — ค่าสำรองใช้ได้อยู่แล้ว */ }
})();

/* คนที่ตั้งเครื่องว่าไม่อยากเห็นการเคลื่อนไหว ต้องได้ผิวน้ำที่นิ่ง
   แอนิเมชันของ SVG (SMIL) สั่งหยุดด้วย CSS ไม่ได้ ต้องเรียก pauseAnimations เอง
   บางคนตั้งค่านี้เพราะภาพเคลื่อนไหวทำให้เวียนหัวจริง ๆ ไม่ใช่แค่ความชอบ */
(function(){
  try{
    const mq=matchMedia("(prefers-reduced-motion:reduce)");
    const fx=document.getElementById("fx");
    const sync=()=>{ if(!fx)return; mq.matches?fx.pauseAnimations():fx.unpauseAnimations() };
    sync();
    mq.addEventListener?mq.addEventListener("change",sync):mq.addListener(sync);
  }catch(e){}
})();
</script>
