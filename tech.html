<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Cendon — หาช่าง</title>
<meta name="theme-color" content="#131316"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./favicon.png"/>

<!-- ══ ธีมฝังมาในไฟล์ ══
     ตอนแรกแยกออกไปเป็น theme.css กับ theme.js เพื่อไม่ให้มีของสองชุด
     แต่พอไฟล์ใดไฟล์หนึ่งไม่ได้ถูกอัปขึ้นเซิร์ฟเวอร์ ตัวแปรสีหายทั้งชุด
     ปุ่มกลายเป็นขาวบนขาว ตัวหนังสือไล่สีกลายเป็นล่องหน — หน้าพังทั้งหน้า

     หน้าเว็บที่พังเพราะไฟล์เดียวหาย คือหน้าเว็บที่ออกแบบมาเปราะเกินไป
     จึงย้ายกลับมาฝังไว้ในไฟล์เดียวกัน หน้านี้ทำงานได้ด้วยตัวเองเสมอ
     ไฟล์ theme.css/theme.js ยังอยู่สำหรับหน้าใหม่ ๆ ที่จะเขียนทีหลัง
     ถ้าแก้ชุดสี ต้องแก้ทั้งสองที่ให้ตรงกัน -->
<style>
/* ── LIGHT — กระดาษอุ่น ── */
html[data-theme="light"]{
  --bg:#F7F4EE;--surface:#FFFFFF;--surface-2:#FBF9F4;--ink:#221F1A;--muted:#6C665A;--faint:#A6A093;
  --line:rgba(40,34,18,.12);--line-2:rgba(40,34,18,.07);
  --accent:#D9733C;--accent-2:#E8A23C;--accent-d:#B85A2A;
  --grad:linear-gradient(135deg,#E8943C,#D95E3C);
  --ok:#3E9E6E;--danger:#D64A4A;--radius:20px;
  --shadow:0 18px 50px -22px rgba(60,40,15,.30);--shadow-sm:0 6px 20px -10px rgba(60,40,15,.20);
  --wireframe-opacity:.15;--nav-bg:rgba(255,255,255,.86);--nav-link:#6C665A;
  --gloss:.5;--gloss-card:.65;--edge-sh:rgba(40,34,18,.16);--el-cast:rgba(60,40,15,.34);--sk-glow:.14;

  --c-bg0:#F4F1EB;--c-bg1:#FBF9F4;--c-bg2:#FFFFFF;
  --c-aura1:rgba(232,148,60,.10);--c-aura2:rgba(120,150,200,.07);--c-aura3:rgba(200,150,90,.06);
  --c-ink:#221F1A;--c-mut:#6C665A;--c-faint:#A6A093;
  --c-glass:rgba(40,34,18,.035);--c-glass2:rgba(40,34,18,.06);
  --c-line:rgba(40,34,18,.12);--c-line2:rgba(40,34,18,.07);
  --c-grad:linear-gradient(135deg,#E8943C,#D95E3C);--c-acc:#D9733C;
  --c-acc-soft:rgba(217,115,60,.14);
  --c-user:linear-gradient(135deg,#E8943C,#D9553C);--c-ai-bubble:rgba(40,34,18,.045);
  --pill-bg:rgba(255,255,255,.80);--sheet-bg:rgba(255,255,255,.95);
  --star-op:0;--star-c:40,34,18;
}

/* ── DARK — ถ่านอุ่น ── */
html[data-theme="dark"]{
  --bg:#131316;--surface:#1D1D21;--surface-2:#26262C;--ink:#E7E7EA;--muted:#9B9BA1;--faint:#616168;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.05);
  --accent:#E8843C;--accent-2:#F0A93C;--accent-d:#C96A28;
  --grad:linear-gradient(135deg,#F0A93C,#E85E3C);
  --ok:#4BB07C;--danger:#E05A54;--radius:20px;
  --shadow:0 18px 50px -22px rgba(0,0,0,.8);--shadow-sm:0 6px 20px -10px rgba(0,0,0,.5);
  --wireframe-opacity:.18;--nav-bg:rgba(29,29,33,.92);--nav-link:#9B9BA1;
  --gloss:.13;--gloss-card:.07;--edge-sh:rgba(0,0,0,.5);--el-cast:rgba(0,0,0,.75);--sk-glow:.07;

  --c-bg0:#0C0C0F;--c-bg1:#141418;--c-bg2:#1B1B21;
  --c-aura1:rgba(232,132,60,.12);--c-aura2:rgba(120,130,170,.08);--c-aura3:rgba(200,120,70,.07);
  --c-ink:#E7E7EA;--c-mut:#9B9BA1;--c-faint:#616168;
  --c-glass:rgba(255,255,255,.05);--c-glass2:rgba(255,255,255,.09);
  --c-line:rgba(255,255,255,.09);--c-line2:rgba(255,255,255,.05);
  --c-grad:linear-gradient(135deg,#F0A93C,#E85E3C);--c-acc:#E8843C;
  --c-acc-soft:rgba(232,132,60,.15);
  --c-user:linear-gradient(135deg,#F0A93C,#E8553C);--c-ai-bubble:rgba(255,255,255,.055);
  --pill-bg:rgba(20,20,24,.66);--sheet-bg:rgba(20,20,24,.94);
  --star-op:1;--star-c:255,255,255;
}

</style>
<script>
/* ═══════════════════════════════════════════════════════════════════
   ธีมและสีหลัก — ตัวเดียวกับที่หน้าหลักใช้
   ───────────────────────────────────────────────────────────────────
   ผู้ใช้ตั้งค่าสองอย่างแยกกัน และหน้าใดก็ตามที่อ่านไม่ครบทั้งสอง
   จะแสดงสีผิดทันที
     spire_theme    โครงสีพื้นหลังและตัวหนังสือ  light | dark
     spire_primary  สีหลักของปุ่มและไฮไลต์      รหัสสีหก หลัก

   ต้องโหลดไฟล์นี้แบบไม่มี defer และวางไว้ใน <head> ก่อนอย่างอื่น
   ไม่งั้นจะเห็นธีมตั้งต้นแวบหนึ่งก่อนสลับ ซึ่งน่ารำคาญกว่าไม่มีธีม
   ═══════════════════════════════════════════════════════════════════ */
(function(){
"use strict";
var D=document, TKEY="spire_theme", PKEY="spire_primary", DEF="#E8943C";

/* ── โครงสี ── */
var KEYS=["light","dark"];
/* ธีมรุ่นเก่าที่เลิกใช้แล้ว ให้ตกลงมาที่โครงสีที่ใกล้ที่สุด
   ไม่งั้นคนที่เคยตั้งไว้จะเปิดมาเจอสีผิดโดยไม่รู้ว่าทำไม
   ตารางนี้ต้องตรงกับของหน้าหลักทุกตัว */
var OLD={warm:"light",pearl:"light",emerald:"light",plant:"light",moss:"light",
         carbon:"dark",night:"dark",midnight:"dark",cyber:"dark",
         aurora:"dark",ocean:"dark",sunset:"dark",magma:"dark",
         wire:"dark",grid:"light"};
function readTheme(){
  var v=null;
  try{ v=JSON.parse(localStorage.getItem(TKEY)) }catch(e){}
  if(typeof v!=="string"){ try{ v=JSON.parse(localStorage.getItem("spire_chatTheme")) }catch(e){} }
  if(typeof v!=="string")return "light";
  if(KEYS.indexOf(v)>=0)return v;
  return OLD[v]||"light";
}
function applyTheme(k){
  var el=D.documentElement;
  /* ตั้งทั้งสองแอตทริบิวต์ให้เป็นค่าเดียวกัน เพราะสไตล์ของสองฝั่ง
     (หน้าเว็บกับห้องแชต) อ้างคนละชื่อกัน */
  el.setAttribute("data-theme",k);
  el.setAttribute("data-ctheme",k);
}

/* ── สีหลัก ── */
function hex2rgb(h){
  h=String(h||"").trim().replace(/^#/,"");
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-f]{6}$/i.test(h))return null;
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function rgb2hex(r,g,b){
  return "#"+[r,g,b].map(function(x){
    return Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")}).join("");
}
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
  if(d){ h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); h*=60 }
  var l=(mx+mn)/2, s=d?d/(1-Math.abs(2*l-1)):0;
  return [h,s,l];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, t;
  if(h<60)t=[c,x,0]; else if(h<120)t=[x,c,0]; else if(h<180)t=[0,c,x];
  else if(h<240)t=[0,x,c]; else if(h<300)t=[x,0,c]; else t=[c,0,x];
  return [(t[0]+m)*255,(t[1]+m)*255,(t[2]+m)*255];
}
function shift(hex,dl,dh){
  var c=hex2rgb(hex); if(!c)return hex;
  var a=rgb2hsl(c[0],c[1],c[2]), l=Math.max(0,Math.min(1,a[2]+dl));
  return rgb2hex.apply(null,hsl2rgb(a[0]+(dh||0),a[1],l));
}
function readPrim(){
  var v=null;
  try{ v=JSON.parse(localStorage.getItem(PKEY)) }catch(e){}
  return (typeof v==="string"&&hex2rgb(v))?v:DEF;
}
function applyPrim(raw){
  var base=hex2rgb(raw)?raw:DEF;
  var c=hex2rgb(base)||hex2rgb(DEF);
  var soft=function(a){ return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")" };
  var light=shift(base,.10,10), dark=shift(base,-.12,-6);
  var st=D.documentElement.style, set=function(k,v){ st.setProperty(k,v) };
  /* ชื่อตัวแปรของหน้าแดชบอร์ดกับห้องแชตไม่เหมือนกัน ตั้งให้ครบทั้งสองชุด
     ตกไปแม้แต่ตัวเดียว หน้านั้นจะมีสีปุ่มไม่ตรงกับที่ผู้ใช้เลือกไว้ */
  set("--accent",base); set("--accent-2",light); set("--accent-d",dark);
  set("--grad","linear-gradient(135deg,"+light+","+dark+")");
  set("--c-acc",base); set("--c-acc-soft",soft(.16));
  set("--c-grad","linear-gradient(135deg,"+light+","+dark+")");
  set("--c-user","linear-gradient(135deg,"+light+","+dark+")");
  set("--c-aura1",soft(.12));
  /* สีตัวหนังสือบนพื้นสีหลัก คำนวณจากความสว่างจริง ไม่ใช่เดา
     สีหลักอ่อน ๆ อย่างสีทอง ถ้าใช้ตัวหนังสือขาวจะอ่านไม่ออก */
  var lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
  set("--on-acc",lum>0.62?"#1A1204":"#ffffff");
  try{
    var mt=D.querySelector('meta[name="theme-color"]');
    if(mt){
      var cs=getComputedStyle(D.documentElement);
      var bg=cs.getPropertyValue("--c-bg0").trim()||cs.getPropertyValue("--bg").trim();
      if(bg)mt.setAttribute("content",bg);
    }
  }catch(e){}
}

function sync(){ applyTheme(readTheme()); applyPrim(readPrim()) }
sync();
/* ตั้งค่าจากอีกแท็บหนึ่ง ต้องมีผลกับแท็บนี้ด้วย
   ไม่งั้นเปลี่ยนธีมในหน้าตั้งค่าแล้วกลับมาหน้านี้ยังเป็นสีเดิม */
addEventListener("storage",function(e){
  if(e.key===TKEY||e.key===PKEY||e.key==="spire_chatTheme")sync();
});
window.spireThemeSync=sync;
})();

</script>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
/* ══════════════════════════════════════════════════════════════════
   หน้าช่าง — แอปใช้งาน ไม่ใช่หน้าโชว์
   ───────────────────────────────────────────────────────────────────
   กฎของหน้านี้ (จากที่เจ้าของแอปสั่งตรง ๆ)
   - ตัวหนังสือน้อยที่สุด ทุกอย่างบนจอต้องกดแล้วเกิดอะไรขึ้นจริง
   - หน้าตาแบบ Grab / Bolt: แผนที่ข้างบน รายการช่างเป็นแผ่นทับแผนที่
     ทุกขั้นตอนเปิดเป็นแผ่นเลื่อนขึ้นจากล่าง ไม่เปลี่ยนหน้า
   - มีการเคลื่อนไหวทุกจุดที่มีการเปลี่ยนสถานะ ให้รู้ว่ากดติด
   ══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Kanit",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
:root{--spring:cubic-bezier(.2,.9,.25,1.12);--ease:cubic-bezier(.16,1,.3,1);--r:18px;--top:58px}

/* ── ปุ่มพื้นฐาน ── ทุกปุ่มยุบลงนิดหนึ่งตอนกด คนจะรู้ทันทีว่ากดติด */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;font-weight:500;font-size:15px;transition:transform .15s var(--ease),filter .2s,opacity .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--grad);color:var(--on-acc,#fff);box-shadow:0 10px 24px -12px var(--accent)}
.btn.s{background:var(--surface-2);color:var(--ink)}
.btn.d{background:transparent;color:var(--danger)}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--surface);box-shadow:var(--shadow-sm);position:relative;transition:transform .15s var(--ease)}
.ic:active{transform:scale(.9)}
.dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;animation:pop .35s var(--spring)}
.dot[hidden]{display:none}

/* ── แถบบน + ปุ่มสลับ เมนู/แผนที่ ── */
.top{position:sticky;top:0;z-index:500;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 14px 10px}
.bar{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.bar .ttl{flex:1;font-weight:600;font-size:18px}
.bar .ic{box-shadow:none;background:var(--surface)}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;max-width:320px;margin:10px auto 0;padding:4px;border-radius:14px;background:var(--surface)}
.tabs button{position:relative;z-index:1;height:38px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .25s}
.tabs button.on{color:var(--ink)}
.tabs .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--bg);box-shadow:var(--shadow-sm);transition:transform .38s var(--spring)}
.tabs.map .knob{transform:translateX(100%)}
.view{animation:fade .3s}
.view[hidden]{display:none}

/* ── เมนู ── */
.menu{max-width:760px;margin:0 auto;padding:6px 16px calc(40px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin:18px 0 6px}
.svc{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);transition:transform .15s var(--ease);animation:rise .4s var(--ease) both}
.svc:active{transform:scale(.9)}
.svc i{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:27px;color:#fff;box-shadow:0 8px 18px -10px currentColor;background:var(--k);position:relative;overflow:hidden}
.svc i::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 55%)}
.svc.on i{outline:3px solid var(--ink);outline-offset:3px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.feat{position:relative;overflow:hidden;min-height:112px;padding:14px;border-radius:20px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:var(--g);box-shadow:0 14px 26px -18px var(--gc);transition:transform .18s var(--ease);animation:rise .45s var(--ease) both}
.feat:active{transform:scale(.96)}
.feat>i{font-size:26px}
.feat b{font-weight:600;font-size:15px;line-height:1.25;display:block}
.feat small{font-size:11.5px;opacity:.85;line-height:1.3;display:block;margin-top:2px}
.feat::before{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{display:none}
.act{flex:0 0 84%;max-width:340px;scroll-snap-align:start;display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);text-align:left;box-shadow:var(--shadow-sm);transition:transform .15s var(--ease);animation:rise .4s var(--ease) both}
.act:active{transform:scale(.97)}
.act .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:19px;flex-shrink:0}
.act div{flex:1;min-width:0}.act b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.act small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.used{flex:0 0 132px;scroll-snap-align:start;padding:12px;border-radius:18px;background:var(--surface);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:rise .4s var(--ease) both}
.used .av{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px;background-size:cover;background-position:center}
.used b{font-size:13px;font-weight:500;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.used span{font-size:12px;color:var(--accent);font-weight:500}
.filt{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:var(--ink);color:var(--bg);font-size:12px;animation:pop .3s var(--spring)}

/* ── แผนที่เต็มจอ + การ์ดเลื่อนข้างล่าง ── */
.mapv{position:fixed;left:0;right:0;bottom:0;top:var(--mtop,112px);z-index:1}
.map{position:absolute;inset:0;background:linear-gradient(160deg,var(--surface-2),var(--bg))}
.map .leaflet-container{width:100%;height:100%;background:var(--surface-2);font-family:inherit}
html[data-theme="dark"] .map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.6)}
.map-off{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:40px}
.locate{position:absolute;right:14px;bottom:188px;z-index:450}
.mfilt{position:absolute;left:14px;top:12px;z-index:450}
.carousel{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:450;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 16px;scroll-snap-type:x mandatory}
.carousel::-webkit-scrollbar{display:none}
.carousel .card{flex:0 0 min(86%,380px);scroll-snap-align:center;box-shadow:0 12px 30px -12px rgba(0,0,0,.45)}
.carousel .card.hl{box-shadow:0 0 0 2px var(--accent),0 12px 30px -12px rgba(0,0,0,.45)}
.carousel .empty{flex:1;background:var(--surface);border-radius:var(--r);padding:18px}
.pin{width:38px;height:38px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 6px 14px -4px rgba(0,0,0,.45);border:2px solid #fff;animation:drop .5s var(--spring) both;transition:scale .25s var(--spring)}
.pin.hl{scale:1.25}
.pin b{transform:rotate(45deg);color:#fff;font-size:14px;font-weight:600}
.pin.test{outline:2px dashed #fff;outline-offset:2px}
.me-dot{width:18px;height:18px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 0 rgba(59,130,246,.5);animation:pulse 2s infinite}
.search{display:flex;align-items:center;gap:10px;height:56px;padding:0 6px 0 16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm);transition:box-shadow .25s}
.search:focus-within{box-shadow:0 0 0 2px var(--accent),var(--shadow-sm)}
.search>i{color:var(--muted);font-size:20px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.search .x{width:36px;height:36px;border-radius:50%;color:var(--muted);display:none}
.search .ai{height:44px;padding:0 12px;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px;flex-shrink:0}
.search .ai:active{transform:scale(.94)}
.search.has .x{display:grid;place-items:center}
.staff{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.staff::-webkit-scrollbar{display:none}
.staff button{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;background:var(--c-acc-soft);color:var(--accent);font-size:13px;font-weight:500}
.staff button:active{transform:scale(.95)}
.staff .n{background:var(--accent);color:var(--on-acc,#fff);border-radius:9px;padding:0 6px;font-size:11px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font-size:17px;font-weight:600}
.sec span{font-size:13px;color:var(--muted)}

/* ── การ์ดช่าง ── */
.list{display:flex;flex-direction:column;gap:12px}
.card{display:flex;gap:14px;padding:12px;border-radius:var(--r);background:var(--surface);text-align:left;width:100%;box-shadow:var(--shadow-sm);transition:transform .18s var(--ease);animation:rise .45s var(--ease) both}
.card:active{transform:scale(.98)}
.thumb{width:84px;height:84px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:30px;font-weight:600;color:#fff;background-size:cover;background-position:center;position:relative;overflow:hidden}
.thumb .tag{position:absolute;left:6px;top:6px;font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}
.cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.cb .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.cb .nm .ti-rosette-discount-check-filled{color:#3b82f6;font-size:17px;flex-shrink:0}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta .st{color:var(--ink);font-weight:500}
.meta .st i{color:#f5b301}
.meta .new{color:var(--ok);font-weight:500}
.cb .row3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.mini{display:flex;gap:4px;overflow:hidden}
.mini span{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.price{font-size:13px;color:var(--muted);white-space:nowrap}.price b{color:var(--ink);font-size:15px}
.skel{height:108px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite}
.empty{text-align:center;padding:36px 20px;color:var(--muted);animation:rise .4s var(--ease) both}
.empty i{font-size:44px;color:var(--faint);display:block;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:16px}
.join{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px;border-radius:var(--r);background:var(--c-acc-soft);width:100%;text-align:left;transition:transform .15s var(--ease)}
.join:active{transform:scale(.98)}
.join>i{font-size:26px;color:var(--accent)}
.join div{flex:1}.join b{display:block;font-weight:600}.join small{color:var(--muted);font-size:13px}
.diag{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(214,74,74,.1);color:var(--danger);font-size:13px}

/* ── แผ่นเลื่อนขึ้น (bottom sheet) ── */
.bs{position:fixed;inset:0;z-index:1000;visibility:hidden}
.bs.on{visibility:visible}
.bs .bg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.bs.on .bg{opacity:1}
.bs .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .42s var(--ease);box-shadow:0 -20px 50px -20px rgba(0,0,0,.5)}
.bs.on .pn{transform:none}
.bs.full .pn{top:0;max-height:none;border-radius:0}
.bs .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.bs.full .hd{padding-top:calc(12px + env(safe-area-inset-top))}
.bs .hd h3{flex:1;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs .hd .ic{box-shadow:none;background:var(--surface-2);width:38px;height:38px;font-size:19px}
.bs .bd{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 20px}
.bs .ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;background:var(--bg);box-shadow:0 -1px 0 var(--line-2)}
.bs .ft:empty{display:none}
.bs .ft .btn{flex:1}
.bd>*{animation:rise .38s var(--ease) both}
.bd>*:nth-child(2){animation-delay:.03s}.bd>*:nth-child(3){animation-delay:.06s}.bd>*:nth-child(4){animation-delay:.09s}.bd>*:nth-child(n+5){animation-delay:.12s}

/* ── โปรไฟล์ช่าง ── */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img,.gal .ph{flex:0 0 78%;height:190px;border-radius:16px;object-fit:cover;scroll-snap-align:center;background:var(--surface-2)}
.gal .ph{display:grid;place-items:center;font-size:56px;font-weight:600;color:#fff}
.pf h2{font-size:22px;font-weight:600;display:flex;align-items:center;gap:6px}
.pf .sub{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stats div{background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:17px;font-weight:600}
.stats small{font-size:11px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{display:flex;align-items:center;gap:5px;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--surface)}
.tags i{color:var(--accent)}
.about{margin-top:14px;color:var(--muted);font-size:14px;white-space:pre-wrap}

/* ── ฟอร์ม ── */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>span{font-size:13px;color:var(--muted)}
.fld>span em{color:var(--danger);font-style:normal}
.inp{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1.5px solid transparent;background:var(--surface);font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:46px;padding:0 14px;border-radius:14px;background:var(--surface);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s,transform .15s var(--ease)}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--c-acc-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface);font-size:14px;cursor:pointer;margin-bottom:10px}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;margin-top:1px}
.err{color:var(--danger);font-size:14px;padding:10px 12px;border-radius:12px;background:rgba(214,74,74,.1);margin-bottom:12px;animation:shake .35s}
.err:empty{display:none}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin:4px 0 14px}
.note i{font-size:17px;flex-shrink:0;margin-top:1px}

/* ── เลือกตำแหน่ง — หมุดกลางจอแบบ Grab ── */
.picker{position:relative;isolation:isolate;height:260px;border-radius:16px;overflow:hidden;background:var(--surface-2);margin-bottom:10px}
.picker .lm{position:absolute;inset:0}
.picker .cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:40px;color:var(--accent);z-index:500;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.picker .noleaf{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:20px}
.coord{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px}

/* ── วิซาร์ดสมัคร ── */
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.steps i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.steps i.on::after{transform:none}
.rules{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.rule{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface)}
.rule>i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--c-acc-soft);color:var(--accent);flex-shrink:0}
.rule b{display:block;font-weight:500;font-size:15px}
.rule small{color:var(--muted);font-size:12px}
.rule .opt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--surface-2);padding:2px 8px;border-radius:6px;white-space:nowrap}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.doc{aspect-ratio:1;border-radius:14px;background:var(--surface);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);position:relative;overflow:hidden;transition:transform .15s var(--ease)}
.doc:active{transform:scale(.95)}
.doc i{font-size:24px}
.doc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pop .3s var(--spring)}
.doc .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:14px;z-index:2}
.dgrp{margin-bottom:16px}
.dgrp h4{font-size:14px;font-weight:500;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.dgrp h4 small{color:var(--muted);font-weight:400}
.dgrp h4 .okk{color:var(--ok);margin-left:auto;font-size:18px}
.state{text-align:center;padding:26px 10px 10px}
.state .big{width:88px;height:88px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:42px;animation:pop .5s var(--spring)}
.state h2{font-size:21px;font-weight:600;margin-bottom:6px}
.state p{color:var(--muted);font-size:14px}

/* ── ใบงาน ── */
.jl{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);width:100%;text-align:left;margin-bottom:10px;transition:transform .15s var(--ease);animation:rise .4s var(--ease) both}
.jl:active{transform:scale(.98)}
.jl .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px;flex-shrink:0}
.jl .jb{flex:1;min-width:0}
.jl .jb b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jl .jb small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.pill.act{background:var(--c-acc-soft);color:var(--accent)}
.pill.ok{background:rgba(62,158,110,.14);color:var(--ok)}
.pill.bad{background:rgba(214,74,74,.12);color:var(--danger)}
.ub{background:var(--danger);color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;font-size:11px;display:grid;place-items:center;font-weight:600}
.track{display:flex;align-items:center;margin:4px 0 18px}
.track .s{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;color:var(--faint);text-align:center}
.track .s i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:15px;z-index:1;transition:background .4s,color .4s,transform .4s var(--spring)}
.track .s::before{content:"";position:absolute;top:15px;right:50%;width:100%;height:3px;background:var(--surface-2)}
.track .s:first-child::before{display:none}
.track .s.done{color:var(--ink)}
.track .s.done i{background:var(--accent);color:var(--on-acc,#fff)}
.track .s.done::before{background:var(--accent)}
.track .s.now i{transform:scale(1.15);box-shadow:0 0 0 6px var(--c-acc-soft);animation:ring 1.8s infinite}
.who{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--surface);margin-bottom:12px}
.who .av{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px;flex-shrink:0}
.who div{flex:1;min-width:0}.who b{display:block;font-weight:600}.who small{color:var(--muted);font-size:13px}
.who .ic{box-shadow:none;background:var(--c-acc-soft);color:var(--accent)}
.kv{background:var(--surface);border-radius:18px;padding:4px 14px;margin-bottom:12px}
.kv p{display:flex;justify-content:space-between;gap:14px;padding:11px 0;font-size:14px;border-bottom:1px solid var(--line-2)}
.kv p:last-child{border:0}
.kv p span{color:var(--muted);flex-shrink:0}
.kv p b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.quote{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:12px}
.quote .tot{font-size:32px;font-weight:600;letter-spacing:-.02em}
.quote .ln{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 10px}
.quote p{font-size:14px;white-space:pre-wrap}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0 16px}
.stars button{width:50px;height:50px;display:grid;place-items:center;font-size:38px;color:var(--line);transition:transform .2s var(--spring),color .2s}
.stars button.on{color:#f5b301}
.stars button:active{transform:scale(1.25)}

/* ── แชต — เต็มจอแบบแอปแชต ── */
.chat{position:fixed;inset:0;z-index:1200;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s var(--ease);visibility:hidden}
.chat.on{transform:none;visibility:visible}
.chat .hd{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;box-shadow:0 1px 0 var(--line-2)}
.chat .hd .ic{box-shadow:none;background:transparent}
.chat .hd div{flex:1;min-width:0}.chat .hd b{display:block;font-weight:600}.chat .hd small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chat .hd small i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 2s infinite}
.msgs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--surface);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;animation:bub .28s var(--spring) both;align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--grad);color:var(--on-acc,#fff);border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.msg small{display:block;font-size:10px;opacity:.65;margin-top:2px;text-align:right}
.msg.pending{opacity:.6}
.day{align-self:center;font-size:11px;color:var(--muted);background:var(--surface-2);padding:2px 10px;border-radius:8px;margin:6px 0}
.sys{align-self:center;font-size:12px;color:var(--muted);text-align:center;max-width:90%;margin:4px 0}
.cbar{padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;box-shadow:0 -1px 0 var(--line-2)}
.cbar textarea{flex:1;min-height:44px;max-height:130px;resize:none;border:0;outline:none;border-radius:22px;background:var(--surface);padding:11px 16px;font-size:16px;line-height:1.4}
.cbar .send{width:44px;height:44px;border-radius:50%;background:var(--grad);color:var(--on-acc,#fff);display:grid;place-items:center;font-size:20px;flex-shrink:0;transition:transform .15s var(--spring)}
.cbar .send:active{transform:scale(.88)}
.as{display:flex;gap:6px;padding:8px 12px 0}
.as button{font-size:12px;padding:5px 12px;border-radius:12px;background:var(--surface-2);color:var(--muted)}
.as button.on{background:var(--c-acc-soft);color:var(--accent)}

/* ── รูปขยาย ── */
.zoom{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.92);display:grid;place-items:center;animation:fade .2s}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}

/* ── toast ── */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,160%);z-index:2000;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px);transition:transform .4s var(--spring),opacity .3s;opacity:0;pointer-events:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ── ใบสมัครพาร์ทเนอร์ ── ทางการ: หัวกระดาษ เลขที่เอกสาร ขั้นตอนมีชื่อ */
.hero{margin:-4px -16px 18px;padding:26px 20px 22px;background:linear-gradient(135deg,#1f2937,#0f172a);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 70%);opacity:.55}
.hero small{font-size:11px;letter-spacing:.14em;opacity:.7;display:block}
.hero h2{font-size:24px;font-weight:600;margin:6px 0 4px;position:relative;z-index:1}
.hero p{font-size:13px;opacity:.8;position:relative;z-index:1}
.ben{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.ben div{background:var(--surface);border-radius:14px;padding:12px 8px;text-align:center;font-size:12px;color:var(--muted)}
.ben i{display:block;font-size:24px;color:var(--accent);margin-bottom:4px}
.ben b{display:block;color:var(--ink);font-size:13px;font-weight:500}
.h4{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin:18px 0 10px;text-transform:uppercase}
.tl{position:relative;padding-left:26px;margin-bottom:6px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;padding:0 0 14px}
.tl div::before{content:attr(data-n);position:absolute;left:-26px;top:0;width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:600;display:grid;place-items:center}
.tl div.on::before{background:var(--accent);color:var(--on-acc,#fff)}
.tl div.ok::before{content:"✓";background:var(--ok);color:#fff}
.tl b{display:block;font-size:14px;font-weight:500}.tl small{font-size:12px;color:var(--muted)}
.stp{display:flex;margin:0 0 20px;gap:4px}
.stp div{flex:1;text-align:center;font-size:10.5px;color:var(--faint);line-height:1.3}
.stp div i{display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px;position:relative;overflow:hidden}
.stp div i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.stp div.on{color:var(--ink);font-weight:500}.stp div.on i::after,.stp div.ok i::after{transform:none}
.sect{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.sect h5{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px}
.sect h5 button{font-size:12px;color:var(--accent);font-weight:500}
.sect p{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0}
.sect p span{color:var(--muted)}.sect p b{font-weight:500;text-align:right}
.appno{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;border:1.5px dashed var(--line);margin-bottom:16px}
.appno small{color:var(--muted);font-size:12px;display:block}.appno b{font-size:18px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.terms{font-size:13px;color:var(--muted);line-height:1.8}
.terms h5{color:var(--ink);font-size:14px;font-weight:600;margin:14px 0 4px}
.lnk{color:var(--accent);text-decoration:underline;font-weight:500}
.grp3{display:flex;flex-direction:column;gap:10px}
.cmp{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);width:100%;text-align:left;animation:rise .4s var(--ease) both;position:relative}
.cmp.best{box-shadow:inset 0 0 0 2px var(--ok)}
.cmp .tag{position:absolute;top:-8px;right:12px;background:var(--ok);color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px}
.cmp .pr{margin-left:auto;text-align:right;font-weight:600;font-size:17px}.cmp .pr small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.pick input{width:22px;height:22px;accent-color:var(--accent)}
.pick .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:600;flex-shrink:0}
.pick div{flex:1;min-width:0}.pick b{display:block;font-weight:500}.pick small{font-size:12px;color:var(--muted)}
.qk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qk button{padding:7px 12px;border-radius:12px;background:var(--surface);font-size:13px}
.qk button.on{background:rgba(214,74,74,.14);color:var(--danger)}
.sev{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:10px;font-size:13px;font-weight:500}
.cause{padding:10px 0;border-bottom:1px solid var(--line-2)}
.cause:last-child{border:0}
.cause b{font-weight:500;display:flex;justify-content:space-between;gap:10px}
.cause small{font-size:12px;color:var(--muted);display:block}
.meter{height:5px;border-radius:3px;background:var(--surface-2);margin:6px 0 4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent);transform-origin:left;animation:grow .7s var(--ease) both}
.thinking{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;color:var(--muted)}
.thinking .orb{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,#8b5cf6,#d946ef,#f59e0b,#8b5cf6);animation:spin 1.4s linear infinite;mask:radial-gradient(circle,transparent 45%,#000 47%)}
.urg{margin:-4px -16px 16px;padding:22px 18px;background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.urg h2{font-size:22px;font-weight:600}.urg p{font-size:13px;opacity:.9}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes bub{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:rotate(-45deg) translate(0,-30px)}to{opacity:1;transform:rotate(-45deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}70%{box-shadow:0 0 0 14px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
@keyframes ring{50%{box-shadow:0 0 0 10px transparent}}
@keyframes blink{50%{opacity:.3}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fade{from{opacity:0}}

/* ── เรียกเซิร์ฟเวอร์ ── */
async function api(path,o){
  o=o||{};
  const h={};
  if(U){try{h.Authorization="Bearer "+await U.getIdToken()}catch(e){}}
  if(o.body)h["Content-Type"]="application/json";
  let r;
  try{r=await fetch(API+path,{method:o.method||(o.body?"POST":"GET"),headers:h,body:o.body?JSON.stringify(o.body):undefined,cache:"no-store"})}
  catch(e){throw new Error("เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง")}
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error((d&&d.error)||("ระบบยังไม่พร้อม ("+r.status+")"));
  return d;
}
function needLogin(){location.href="login.html?next="+encodeURIComponent("tech.html"+location.search)}
/* ปุ่มที่รอเซิร์ฟเวอร์ — หมุนระหว่างรอ กดซ้ำไม่ได้ ผิดพลาดแล้วขึ้นข้อความในแผ่นเดิม */
async function busy(btn,fn){
  if(btn&&btn.disabled)return;
  const html=btn&&btn.innerHTML;
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'}
  try{return await fn()}
  catch(e){const er=$("err");if(er&&$("bs").classList.contains("on")){er.textContent=e.message;er.style.animation="none";er.offsetWidth;er.style.animation=""}else toast(e.message,"ti-alert-triangle")}
  finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=html}}
}

/* ═══ แผ่นเลื่อนขึ้น ═══
   ทุกขั้นตอนเปิดในแผ่นนี้ มีประวัติย้อนกลับได้ (ปุ่มย้อนของมือถือก็ปิดแผ่นได้) */
const SH={stack:[],onClose:null};
/* history.back() ที่เราเรียกเองจะยิง popstate กลับมา — ต้องข้ามครั้งนั้น ไม่งั้นปิดแชตแล้วแผ่นใบงานข้างใต้ปิดตามไปด้วย */
let skipPop=0;
function goBack(){skipPop++;history.back()}
function sheet(o){
  /* o: {title, body, foot, full, back, mount} */
  const bs=$("bs");
  const was=bs.classList.contains("on");
  if(o.push&&was)SH.stack.push(SH.cur);
  SH.cur=o;
  $("bsT").textContent=o.title||"";
  $("bsB").innerHTML=(o.body||"")+'<p class="err" id="err" role="alert"></p>';
  $("bsF").innerHTML=o.foot||"";
  $("bsBack").hidden=!SH.stack.length;
  bs.classList.toggle("full",!!o.full);
  $("bsB").scrollTop=0;
  if(!was){bs.classList.add("on");bs.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";try{history.pushState({sheet:1},"")}catch(e){}}
  if(o.mount)o.mount($("bsB"),$("bsF"));
}
function back(){const prev=SH.stack.pop();if(prev){prev.push=false;sheet(prev)}else closeSheet()}
function closeSheet(fromPop){
  const bs=$("bs");if(!bs.classList.contains("on"))return;
  bs.classList.remove("on");bs.setAttribute("aria-hidden","true");document.body.style.overflow="";
  SH.stack=[];stopJob();
  const cb=SH.onClose;SH.onClose=null;if(cb)cb();
  if(!fromPop&&history.state&&history.state.sheet)goBack();
}
$("bsX").onclick=()=>closeSheet();$("bsBg").onclick=()=>closeSheet();$("bsBack").onclick=back;
addEventListener("popstate",()=>{if(skipPop){skipPop--;return}if($("chat").classList.contains("on")){closeChat(true);return}closeSheet(true)});

    document.documentElement.style.setProperty("--mtop",$("top").offsetHeight+"px");

/* ═══ รายชื่อช่าง ═══ */
function km(a,b){
  if(!a||!b||b.lat==null)return null;
  const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return Math.round(R*2*Math.asin(Math.sqrt(h))*10)/10;
}
function catsOf(text){const q=String(text||"").toLowerCase();return WORDS.filter(([re])=>re.test(q)).map(([,c])=>c)}
function shown(opt){
  const o=opt||F;
  let l=TECHS.map(t=>({...t,dist:km(HERE,t)}));
  if(o.cat==="mobile")l=l.filter(t=>t.mobile);
  else if(o.cat==="urgent")l=l.filter(t=>t.urgent);
  else if(o.cat&&o.cat!=="all")l=l.filter(t=>(t.cats||[]).includes(o.cat));
  const q=String(o.q||"").trim().toLowerCase();
  if(q){
    const hit=catsOf(q);
    l=l.filter(t=>[t.name,t.shop,t.area,t.about,...(t.skills||[])].join(" ").toLowerCase().includes(q)||(t.cats||[]).some(c=>hit.includes(c)));
  }
  /* ช่างทดสอบขึ้นก่อนสำหรับทีมงาน จะได้เจอทันทีตอนทดสอบ แล้วเรียงตามระยะ แล้วคะแนน */
  return l.sort((a,b)=>(b.test-a.test)||((a.dist??1e9)-(b.dist??1e9))||(b.rating-a.rating));
}
function thumb(t){

}
const distTxt=d=>d==null?"":d<1?Math.round(d*1000)+" ม.":d+" กม.";
function card(t,i){

    <span class="cb"><span class="nm">${esc(t.shop||t.name)}${t.verified?'<i class="ti ti-rosette-discount-check-filled" title="ตรวจแล้ว"></i>':""}</span>
    <span class="meta">${stars}${t.dist!=null?`<span>·</span><span>${distTxt(t.dist)}</span>`:""}${t.mobile?'<span>·</span><span>มาถึงที่</span>':""}</span>
    <span class="row3"><span class="mini">${(t.cats||[]).slice(0,2).map(c=>CAT[c]?`<span>${CAT[c].th}</span>`:"").join("")}</span>${t.from?`<span class="price">เริ่ม <b>฿${money(t.from)}</b></span>`:""}</span></span></button>`;
}

let grpTimer=0;
async function openGroup(G,push){
  if(!U)return needLogin();
  clearTimeout(grpTimer);
  let d;try{d=await api("/api/tech/groups/"+G)}catch(e){return toast(e.message,"ti-alert-triangle")}
  const L=d.jobs||[];
  const quoted=L.filter(j=>j.quote&&["quoted","accepted","enroute","working","done","completed"].includes(j.status));
  const best=quoted.length>1?quoted.reduce((a,b)=>a.quote.total<=b.quote.total?a:b):null;
  const chosen=L.find(j=>!["requested","quoted","cancelled"].includes(j.status));
  sheet({push,group:G,title:"เทียบราคา",body:`
    <p class="note"><i class="ti ti-${chosen?"circle-check":"clock"}"></i>${chosen?"คุณเลือกร้านแล้ว":`ได้ราคาแล้ว ${quoted.length} จาก ${L.length} ร้าน · หน้านี้อัปเดตเอง`}</p>
    <div class="grp3">${L.map((j,i)=>`<button class="cmp ${best&&best.id===j.id&&!chosen?"best":""}" data-j="${j.id}" style="animation-delay:${i*50}ms">${best&&best.id===j.id&&!chosen?'<span class="tag">ถูกสุด</span>':""}
      <span class="av" style="width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:600;background:${PALETTE[i%PALETTE.length]}">${initial(j.techName)}</span>
      <span><b style="display:block;font-weight:500">${esc(j.techName)}</b><span class="pill ${j.status==="cancelled"?"bad":j.status==="quoted"?"act":chosen&&chosen.id===j.id?"ok":""}">${j.status==="cancelled"&&j.resolution?esc(j.resolution):STATUS[j.status]}</span></span>
      <span class="pr">${j.quote?"฿"+money(j.quote.total)+`<small>รับประกัน ${j.quote.warranty} วัน</small>`:'<small>รอราคา…</small>'}</span></button>`).join("")}</div>`,
    mount(b){b.querySelectorAll("[data-j]").forEach(x=>x.onclick=()=>openJob(x.dataset.j,true))}});
  const tick=()=>{grpTimer=setTimeout(async()=>{if(SH.cur&&SH.cur.group===G&&$("bs").classList.contains("on")){const st=SH.stack;await openGroup(G,false);SH.stack=st;$("bsBack").hidden=!st.length}},6000)};
  if(!chosen)tick();
}

          ${g.recommendedAction?`<div class="kv"><p><span>ควรทำ</span><b>${esc(g.recommendedAction)}</b></p>${cat?`<p><span>ช่างที่เกี่ยว</span><b>${CAT[cat].th}</b></p>`:""}${lo?`<p><span>ราคาเริ่มต้นในระบบ</span><b>฿${money(lo)}${hi>lo?" – ฿"+money(hi):""}</b></p>`:""}</div>`:""}
          <p class="note"><i class="ti ti-info-circle"></i>${esc(g.disclaimer||"เป็นการประเมินเบื้องต้นจาก AI ควรให้ช่างตรวจจริง")}</p>`;
        $("bsF").innerHTML=`<button class="btn s" id="aiSee">ดูช่าง${cat?CAT[cat].th:""}</button><button class="btn p" id="aiMulti">ขอราคา 3 ร้าน</button>`;

/* งานที่ซ่อมเสร็จ บันทึกลงประวัติรถคันนั้นในโรงรถด้วย — ดูย้อนหลังได้ว่าซ่อมอะไร ที่ไหน เท่าไร */
function syncGarage(){
  let g;try{g=JSON.parse(localStorage.getItem("spire_garage")||"[]")}catch(e){return}
  if(!Array.isArray(g)||!g.length)return;
  let changed=false;
  JOBS.filter(j=>j.status==="completed"&&j.side!=="technician").forEach(j=>{
    const car=g.find(c=>{const lab=[c.name,c.year].filter(Boolean).join(" ");return lab===j.car||(c.name&&j.car.startsWith(c.name))});
    if(!car)return;car.history=car.history||[];
    if(car.history.some(h=>h.job===j.id))return;
    car.history.unshift({t:j.updatedAt||Date.now(),q:"ซ่อม: "+j.symptom,a:j.techName+(j.total?" · ฿"+money(j.total):""),kind:"repair",job:j.id});
    changed=true;
  });
  if(changed)try{localStorage.setItem("spire_garage",JSON.stringify(g))}catch(e){}
}

const FLOW=[["requested","ขอราคา","ti-send"],["quoted","ได้ราคา","ti-receipt"],["accepted","นัดแล้ว","ti-calendar-check"],["working","ซ่อม","ti-tool"],["completed","เสร็จ","ti-circle-check"]];
const RANK={requested:0,quoted:1,accepted:2,enroute:2,working:3,done:3,completed:4,disputed:3,cancelled:-1};
let JOB=null,jobTimer=0;
function stopJob(){clearTimeout(jobTimer);JOB=null}
async function openJob(id,push){
  if(!U)return needLogin();
  let j;
  try{j=(await api("/api/tech/jobs/"+id)).job}catch(e){return toast(e.message,"ti-alert-triangle")}
  drawJob(j,push);
}
function drawJob(j,push){
  const cust=j.role==="customer"||j.role==="both",tech=j.role==="technician"||j.role==="both",s=j.status,q=j.quote;
  const rk=RANK[s];
  const track=s==="cancelled"?'<p class="pill bad" style="margin-bottom:14px">ยกเลิกแล้ว</p>':`<div class="track">${FLOW.map(([k,l,ic],i)=>`<div class="s ${i<=rk?"done":""} ${i===rk&&s!=="completed"?"now":""}"><i class="ti ${ic}"></i>${l}</div>`).join("")}</div>`;
  const other=cust&&!tech?j.techName:tech&&!cust?"ลูกค้า":j.techName;
  const unread=(j.messages||[]).length;
  /* ปุ่มหลักตามสถานะ — ในแต่ละขั้นมีสิ่งที่ต้องทำอย่างเดียว คนจะได้ไม่ต้องคิด */
  const A=[];
  if(tech&&["requested","quoted"].includes(s))A.push(["quote",s==="quoted"?"แก้ราคา":"เสนอราคา","p"]);
  if(cust&&s==="quoted")A.push(["accept","ยืนยันราคา ฿"+money(q.total),"p"]);

function addMsgs(list){

/* ═══ ย่อรูปก่อนส่ง — รูปจากมือถือ 4–8MB ย่อเหลือราว 150KB อ่านบัตรยังชัด ═══ */
function shrink(file,max){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type))return rej(new Error("ต้องเป็นไฟล์รูปภาพ"));
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,(max||1280)/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.72,d=c.toDataURL("image/jpeg",q);while(d.length>900000&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}res(d)};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("เปิดรูปนี้ไม่ได้"))};img.src=u;
  });
}

function terms(){
  sheet({push:true,title:"ข้อตกลงพาร์ทเนอร์ช่าง",body:`<div class="terms">
    <h5>1. คุณสมบัติและการยืนยันตัวตน</h5>ผู้สมัครต้องมีอายุ 18 ปีบริบูรณ์ ให้ข้อมูลตามบัตรประจำตัวประชาชนที่เป็นจริง และยินยอมให้ Cendon ตรวจสอบตัวตน เบอร์โทรศัพท์ ผลงาน และสถานประกอบการ ข้อมูลอันเป็นเท็จเป็นเหตุให้ยกเลิกการเป็นพาร์ทเนอร์ได้ทันที
    <h5>2. การเสนอราคาและรับงาน</h5>พาร์ทเนอร์ต้องแจกแจงค่าแรง ค่าอะไหล่ และค่าเดินทางในใบเสนอราคาก่อนเริ่มงาน หากต้องเปลี่ยนแปลงราคา ต้องได้รับความยินยอมจากลูกค้าและบันทึกไว้ในใบงานก่อนลงมือ
    <h5>3. มาตรฐานงานและการรับประกัน</h5>พาร์ทเนอร์รับประกันงานตามจำนวนวันที่ระบุในใบเสนอราคา และต้องให้บริการด้วยความสุภาพ ตรงเวลา และปลอดภัย
    <h5>4. ข้อมูลส่วนบุคคล</h5>Cendon เก็บข้อมูลเท่าที่จำเป็นเพื่อพิจารณาใบสมัครและให้บริการ รูปบัตรประชาชนและรูปถ่ายคู่บัตรจะถูกลบทันทีเมื่อพิจารณาเสร็จ เลขประจำตัวประชาชนจะถูกเก็บไว้เพียงบางหลักเพื่อการตรวจสอบย้อนหลัง เบอร์โทรของพาร์ทเนอร์จะเปิดให้ลูกค้าเฉพาะงานที่ลูกค้ายืนยันราคาแล้ว
    <h5>5. การระงับบัญชี</h5>Cendon อาจระงับการแสดงผลของพาร์ทเนอร์ที่ได้รับการร้องเรียนซ้ำ ให้ข้อมูลเท็จ หรือกระทำการที่เป็นอันตรายต่อลูกค้า
    <h5>6. ค่าธรรมเนียม</h5>ปัจจุบัน Cendon ไม่เรียกเก็บค่าสมัครและค่าธรรมเนียมใด ๆ ลูกค้าชำระเงินกับพาร์ทเนอร์โดยตรง หากมีการเปลี่ยนแปลงจะแจ้งล่วงหน้าและต้องได้รับความยินยอมใหม่</div>`});
}
function stepHd(n){return `<div class="stp">${STEPS.map((l,i)=>`<div class="${i+1<n?"ok":i+1===n?"on":""}"><i></i>${i+1}. ${l}</div>`).join("")}</div>`}
function keep(){const g=id=>$(id)?$(id).value.trim():undefined;[["name","aN"],["shop","aS"],["phone","aP"],["birth","aD"],["years","aY"],["from","aF"],["warranty","aW"],["area","aR"],["radius","aK"],["about","aB"],["idNo","aI"]].forEach(([k,id])=>{const v=g(id);if(v!==undefined)APP[k]=v})}

    <p class="h4">ข้อมูลการให้บริการ</p>
    <label class="fld"><span>ชื่อสถานประกอบการ / ชื่อร้าน</span><input class="inp" id="aS" value="${esc(APP.shop||"")}" placeholder="ไม่มีร้าน เว้นว่างได้"/></label>
    <label class="fld"><span>ประสบการณ์ (ปี) <em>*</em></span><input class="inp" id="aY" type="number" inputmode="numeric" value="${esc(APP.years||"")}"/></label>

    <div class="fld"><span>บริการเสริม</span><div class="seg" id="aM"><button type="button" data-v="mobile" class="${APP.mobile?"on":""}"><i class="ti ti-truck"></i>ออกหน้างาน</button><button type="button" data-v="urgent" class="${APP.urgent?"on":""}"><i class="ti ti-urgent"></i>รับงานด่วน</button></div></div>
    <div class="two"><label class="fld"><span>ราคาเริ่มต้น (บาท) <em>*</em></span><input class="inp" id="aF" type="number" inputmode="numeric" value="${esc(APP.from||"")}"/></label>
    <label class="fld"><span>รับประกันงาน (วัน) <em>*</em></span><input class="inp" id="aW" type="number" inputmode="numeric" value="${esc(APP.warranty||30)}"/></label></div>
    <label class="fld"><span>ความชำนาญ / เครื่องมือ</span><textarea class="inp" id="aB" placeholder="เช่น ระบบแอร์ญี่ปุ่นทุกรุ่น มีเครื่องแวคคั่มและเครื่องเติมน้ำยา">${esc(APP.about||"")}</textarea></label>`,
    foot:'<button class="btn s" id="aBk">ย้อนกลับ</button><button class="btn p" id="aNx">ถัดไป</button>',
    mount(){
      wireSeg("aT",v=>APP.title=v);
      $("aI").addEventListener("input",()=>{const p=$("aI").selectionStart,before=$("aI").value.length;$("aI").value=fmtId($("aI").value);const d=$("aI").value.length-before;try{$("aI").setSelectionRange(p+d,p+d)}catch(e){}});
      $("aC").querySelectorAll("button").forEach(b=>b.onclick=()=>{b.classList.toggle("on");APP.cats=[...$("aC").querySelectorAll(".on")].map(x=>x.dataset.v)});
      $("aM").querySelectorAll("button").forEach(b=>b.onclick=()=>{b.classList.toggle("on");APP[b.dataset.v]=b.classList.contains("on")});
      $("aBk").onclick=()=>{keep();landing()};
      $("aNx").onclick=()=>{keep();const e=[];
        if(!APP.title)e.push("คำนำหน้า");if((APP.name||"").length<4)e.push("ชื่อ-นามสกุล");if(!thaiId(APP.idNo))e.push("เลขประจำตัวประชาชน");
        if(ageOf(APP.birth)<18)e.push("อายุ 18 ปีขึ้นไป");if(!/^0\d{8,9}$/.test((APP.phone||"").replace(/[\s-]/g,"")))e.push("เบอร์โทรศัพท์");
        if(!(+APP.years>=2))e.push("ประสบการณ์ 2 ปีขึ้นไป");if(!APP.cats.length)e.push("ประเภทงาน");
        if(!(+APP.from>0))e.push("ราคาเริ่มต้น");if(!(+APP.warranty>=7))e.push("รับประกันอย่างน้อย 7 วัน");
        if(e.length){$("err").textContent="กรุณาตรวจสอบ: "+e.join(", ");$("err").scrollIntoView({block:"nearest"});return}step(2)};
    }});
  if(n===2)return sheet({full:true,title:"ใบสมัครพาร์ทเนอร์",body:stepHd(2)+`

      let cur=null;

        host.innerHTML=L.map((d,i)=>`<div class="doc"><img src="${d}" alt=""/><button class="rm" data-i="${i}" aria-label="ลบ"><i class="ti ti-x"></i></button></div>`).join("")+(L.length<max?`<button class="doc" data-add="${k}"><i class="ti ${ic}"></i>เพิ่มรูป</button>`:"");

      const decs=[...b.querySelectorAll(".dec")];decs.forEach(x=>x.onchange=()=>$("aGo").disabled=!decs.every(y=>y.checked));
      $("aBk").onclick=()=>step(3);
      $("aGo").onclick=e=>busy(e.currentTarget,async()=>{
        const docs=[];DK.forEach(([k])=>(APP.docs[k]||[]).forEach(d=>docs.push({kind:k,data:d})));
        await api("/api/tech/apply",{body:{title:APP.title,name:APP.name,idNo:String(APP.idNo).replace(/\D/g,""),birth:APP.birth,age:ageOf(APP.birth),shop:APP.shop,phone:(APP.phone||"").replace(/[\s-]/g,""),years:+APP.years,area:APP.area,
          from:+APP.from,warranty:+APP.warranty,radius:+APP.radius||0,cats:APP.cats,mobile:!!APP.mobile,urgent:!!APP.urgent,about:APP.about||"",lat:APP.lat,lng:APP.lng,docs,consent:true}});
        APP=null;await refreshMe();SH.stack=[];statusPage(ME.application,true);
      })}});}
}
/* สถานะใบสมัคร — มีเลขที่ใบสมัครอ้างอิง และเห็นว่าอยู่ขั้นไหนของการพิจารณา */
function statusPage(a,fresh){
  const st=a.status,d=a.submittedAt||a.createdAt;
  const n=st==="approved"?5:st==="rejected"?2:2;
  sheet({full:true,title:"ใบสมัครพาร์ทเนอร์",body:`
    ${fresh?'<div class="state"><div class="big" style="background:rgba(62,158,110,.14);color:var(--ok)"><i class="ti ti-send"></i></div><h2>ยื่นใบสมัครเรียบร้อย</h2><p>ทีมงานจะติดต่อกลับภายใน 3 วันทำการ</p></div>':""}
    <div class="appno"><div><small>เลขที่ใบสมัคร</small><b>${esc(a.appNo||"—")}</b></div><div style="text-align:right"><small>วันที่ยื่น</small><b style="font-size:14px">${d?new Date(d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"}):"—"}</b></div></div>
    <p class="h4">สถานะการพิจารณา</p>
    <div class="tl">${[["ยื่นใบสมัครออนไลน์",esc(a.name)],["ตรวจสอบเอกสาร",st==="rejected"?"ต้องแก้ไขเพิ่มเติม":"1–3 วันทำการ"],["โทรยืนยันตัวตนและทักษะ","ทีมงานโทรหา "+esc(a.phone||"")],["อนุมัติ เริ่มรับงาน",st==="approved"?"ร้านของคุณแสดงในแอปแล้ว":""]].map(([b,s],i)=>`<div data-n="${i+1}" class="${i+1<n?"ok":i+1===n&&st!=="approved"?"on":""}"><b>${b}</b><small>${s}</small></div>`).join("")}</div>
    ${st==="rejected"?`<div class="err" style="animation:none"><b>หมายเหตุจากทีมงาน:</b> ${esc(a.review&&a.review.note||"")}</div>`:""}`,
    foot:st==="rejected"?'<button class="btn p w" id="sFix">แก้ไขและยื่นใหม่</button>':st==="approved"?'<button class="btn p w" id="sJobs">เปิดงานของฉัน</button>':'<button class="btn s w" id="sOk">ปิด</button>',
    mount(){if($("sFix"))$("sFix").onclick=()=>landing(true);if($("sJobs"))$("sJobs").onclick=()=>jobs();if($("sOk"))$("sOk").onclick=()=>closeSheet()}});
}
$("bJoin").onclick=()=>openJoin();

/* ═══ ทีมงาน ═══ */
function staffBar(){
  const s=$("staff");
  if(!ME||!ME.staff){s.hidden=true;s.innerHTML="";return}
  s.hidden=false;
  s.innerHTML=`<button id="sTest"><i class="ti ti-shield-check"></i>${ME.technician&&ME.technician.test?"ช่างทีมงานของฉัน":"เป็นช่างทีมงาน"}</button><button id="sApps"><i class="ti ti-id-badge-2"></i>ตรวจใบสมัคร<span class="n" id="sN" hidden></span></button><button id="sAll"><i class="ti ti-list-details"></i>งานทั้งหมด</button>`;
  $("sTest").onclick=testTech;$("sApps").onclick=reviewList;$("sAll").onclick=()=>jobs(true);
  api("/api/tech/applications").then(d=>{const n=(d.applications||[]).length;if(n&&$("sN")){$("sN").hidden=false;$("sN").textContent=n}}).catch(()=>{});
}
/* ช่างทีมงาน — ใช้แค่ตำแหน่งอู่ ไม่ต้องมีเอกสาร เห็นเฉพาะทีมงาน Cendon ลูกค้าทั่วไปไม่เห็น */
function testTech(){
  const t=ME.technician&&ME.technician.test?ME.technician:null;let pos=t&&t.lat?{lat:t.lat,lng:t.lng}:null;let gps=false;
  sheet({push:$("bs").classList.contains("on"),title:t?"ช่างทีมงานของฉัน":"เป็นช่างทีมงาน",body:`
    <div class="picker" id="tMap"></div><p class="coord" id="tXY"></p>
    <button class="btn s w" id="tGps" style="margin-bottom:14px"><i class="ti ti-current-location"></i> ใช้ตำแหน่งปัจจุบัน</button>
    <label class="fld"><span>ชื่ออู่ (ไม่ใส่ก็ได้)</span><input class="inp" id="tS" value="${esc(t?t.shop:"")}" placeholder="อู่ทดสอบ"/></label>
    <p class="note"><i class="ti ti-eye-off"></i>ร้านนี้เห็นเฉพาะทีมงาน Cendon ลูกค้าทั่วไปไม่เห็น ใช้รับงานและทดลองระบบได้ครบทุกขั้น</p>`,
    foot:`${t?'<button class="btn s" id="tOpen">ดูร้านของฉัน</button>':""}<button class="btn p" id="tGo">${t?"บันทึกตำแหน่ง":"เป็นช่างเลย"}</button>`,
    mount(){
      const pk=picker($("tMap"),pos,p=>{pos=p;$("tXY").textContent=p.lat.toFixed(5)+", "+p.lng.toFixed(5)});
      $("tGps").onclick=e=>busy(e.currentTarget,async()=>{const p=await locate();if(p){pk.set(p);gps=true}});
      if($("tOpen"))$("tOpen").onclick=()=>openTech(t.id);
      $("tGo").onclick=e=>busy(e.currentTarget,async()=>{
        if(!window.L&&!gps&&!t)throw new Error("กดใช้ตำแหน่งปัจจุบันก่อน");
        await api("/api/tech/apply",{body:{test:true,lat:pos.lat,lng:pos.lng,shop:$("tS").value.trim()}});
        await refreshMe();await load();closeSheet();toast(t?"บันทึกแล้ว":"คุณเป็นช่างทีมงานแล้ว");
        const me=ME.technician;if(me)setTimeout(()=>openTech(me.id),450);
      });
    }});
}
async function reviewList(){
  sheet({title:"ตรวจใบสมัคร",body:'<div class="skel"></div>'});
  try{
    const L=(await api("/api/tech/applications")).applications||[];
    sheet({title:"ตรวจใบสมัคร",body:(L.length?L.map((a,i)=>`<button class="jl" data-i="${i}" style="animation-delay:${i*35}ms"><span class="av" style="background:${PALETTE[i%PALETTE.length]}">${initial(a.name)}</span><span class="jb"><b>${esc(a.name)}</b><small>${esc(a.shop||"")} · ${esc(a.area)} · ${a.years} ปี</small></span><i class="ti ti-chevron-right"></i></button>`).join("")
      :'<div class="empty"><i class="ti ti-inbox"></i><b>ไม่มีใบสมัครรอตรวจ</b></div>'),
      mount(b){b.querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>reviewOne(L[+x.dataset.i]))}});
  }catch(e){$("bsB").innerHTML=`<div class="empty"><i class="ti ti-cloud-off"></i><b>${esc(e.message)}</b></div>`}
}
const CHECKS=[["identity","บัตรตรงกับหน้าในรูปคู่บัตร ชื่อตรง อายุ 18+"],["phone","โทรติดต่อได้ ยืนยันตัวตนแล้ว"],["work","รูปผลงานเป็นงานจริงของผู้สมัคร"],["skills","มีใบรับรอง หรือสัมภาษณ์ทักษะผ่าน"],["shop","อู่/เครื่องมือมีจริง ตำแหน่งตรง"],["terms","ตกลงราคา ขอบเขตงาน และรับประกันแล้ว"]];
async function reviewOne(a){
  sheet({push:true,title:a.name,body:'<div class="skel"></div>'});
  let docs=[];try{docs=(await api("/api/tech/docs?uid="+encodeURIComponent(a.uid))).docs||[]}catch(e){}
  const lab=Object.fromEntries(DK.map(d=>[d[0],d[1]]));
  sheet({title:a.name,body:`
    <div class="gal">${docs.map(d=>`<img src="${d.url}" data-z="${d.url}" alt="${esc(lab[d.kind])}" title="${esc(lab[d.kind])}"/>`).join("")||'<div class="ph" style="background:var(--surface-2);color:var(--muted);font-size:14px">ไม่มีเอกสาร</div>'}</div>
    <div class="kv"><p><span>เบอร์</span><b><a href="tel:${esc(a.phone)}" style="color:var(--accent)">${esc(a.phone)}</a></b></p><p><span>อู่</span><b>${esc(a.shop||"–")}</b></p><p><span>อายุ / ประสบการณ์</span><b>${a.age} ปี / ${a.years} ปี</b></p><p><span>พื้นที่</span><b>${esc(a.area)}${a.lat?` · <a href="https://maps.google.com/?q=${a.lat},${a.lng}" target="_blank" rel="noopener" style="color:var(--accent)">แผนที่</a>`:""}</b></p><p><span>งาน</span><b>${(a.cats||[]).map(c=>CAT[c]?CAT[c].th:c).join(", ")}</b></p><p><span>ราคา / รับประกัน</span><b>฿${money(a.from)} / ${a.warranty} วัน</b></p><p><span>ใบรับรอง</span><b>${a.hasCert?"มี":"ไม่มี — ต้องสัมภาษณ์"}</b></p>${a.about?`<p><span>ถนัด</span><b>${esc(a.about)}</b></p>`:""}</div>
    ${CHECKS.map(([k,l])=>`<label class="chk"><input type="checkbox" data-k="${k}"/> ${l}</label>`).join("")}
    <label class="fld"><span>บันทึก</span><textarea class="inp" id="rvN" placeholder="ตรวจอะไรไปบ้าง / ต้องแก้อะไร"></textarea></label>`,
    foot:'<button class="btn s" id="rvNo">ให้แก้ไข</button><button class="btn p" id="rvOk" disabled>อนุมัติ</button>',
    mount(b){
      b.querySelectorAll("[data-z]").forEach(i=>i.onclick=()=>zoom(i.dataset.z));
      const boxes=[...b.querySelectorAll("[data-k]")];boxes.forEach(x=>x.onchange=()=>$("rvOk").disabled=!boxes.every(y=>y.checked));
      const go=(decision,btn)=>busy(btn,async()=>{
        await api("/api/tech/review",{body:{uid:a.uid,revision:a.revision,decision,note:$("rvN").value.trim(),checks:Object.fromEntries(boxes.map(x=>[x.dataset.k,x.checked]))}});
        toast(decision==="approve"?"อนุมัติแล้ว":"ส่งกลับให้แก้ไขแล้ว");await load();staffBar();reviewList();
      });
      $("rvOk").onclick=e=>go("approve",e.currentTarget);$("rvNo").onclick=e=>go("reject",e.currentTarget);
    }});
}

/* ═══ บัญชี ═══ */
$("bMe").onclick=()=>{
  if(!U)return needLogin();
  const t=ME&&ME.technician,a=ME&&ME.application;
  sheet({title:"บัญชี",body:`<div class="who"><span class="av" style="background:var(--accent)">${initial(U.email)}</span><div><b>${esc(U.displayName||U.email)}</b><small>${esc(U.email)}${ME&&ME.staff?" · ทีมงาน":""}</small></div></div>
    <button class="jl" id="mJobs"><span class="av" style="background:#2f9bd8"><i class="ti ti-clipboard-list"></i></span><span class="jb"><b>งานของฉัน</b></span><i class="ti ti-chevron-right"></i></button>
    <button class="jl" id="mJoin"><span class="av" style="background:#22a06b"><i class="ti ti-tool"></i></span><span class="jb"><b>${t&&!t.test?"พื้นที่ช่าง":a&&!a.test?"ใบสมัครพาร์ทเนอร์ ("+({pending:"กำลังพิจารณา",rejected:"ต้องแก้ไข",approved:"อนุมัติแล้ว"}[a.status]||a.status)+")":"สมัครเป็นช่าง"}</b></span><i class="ti ti-chevron-right"></i></button>`,
    mount(){$("mJobs").onclick=()=>jobs();$("mJoin").onclick=()=>openJoin()}});
};

/* ═══ ข้อมูลของฉัน ═══ */
let meTimer=0;
async function refreshMe(){
  if(!U){ME=null;return}
  try{ME=await api("/api/tech/me")}catch(e){ME=null}
  const n=ME&&ME.attention||0;$("jobDot").hidden=!n;$("jobDot").textContent=n;
  const t=ME&&ME.technician,a=ME&&ME.application;
  $("joinT").textContent=t&&!t.test?"พื้นที่พาร์ทเนอร์":a&&!a.test&&a.status==="pending"?"ใบสมัครกำลังพิจารณา":"ร่วมเป็นพาร์ทเนอร์ช่าง";
  $("joinS").textContent=t&&!t.test?"ดูงานที่ลูกค้าส่งมา":a&&!a.test?"เลขที่ "+(a.appNo||"")+(a.status==="rejected"?" · ต้องแก้ไข":""):ME&&ME.staff?"ทีมงานเป็นช่างได้ทันที":"รับงานจากลูกค้าในพื้นที่";
  staffBar();refreshJobs();
  clearTimeout(meTimer);meTimer=setTimeout(()=>{if(!document.hidden)refreshMe()},60000);
}

/* ═══ เริ่มทำงาน ═══ */
(function init(){
  const p=new URLSearchParams(location.search);
  if(p.get("q")){$("q").value=p.get("q");F.q=p.get("q");$("sbox").classList.add("has")}
  if(p.get("cat")&&CAT[p.get("cat")])F.cat=p.get("cat");
  drawGrid();render();
  if(p.get("view")==="map"){let mt=0;(function w(){if(window.L||++mt>40)return setView("map",true);setTimeout(w,100)})()}
  /* รายชื่อโหลดทันทีโดยไม่รอล็อกอิน — คนรถเสียไม่ควรต้องรอ
     พอรู้ว่าใครเข้ามา ค่อยโหลดซ้ำ (ทีมงานจะเห็นช่างทีมงานเพิ่ม) */
  load();
  let bt=0;
  (function boot(){
    if(typeof firebase==="undefined"||!firebase.initializeApp){if(++bt<150)setTimeout(boot,120);return}
    try{
      if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(fbConfig);
      auth=firebase.auth();
      auth.onAuthStateChanged(async u=>{U=u||null;await refreshMe();if(U)await load();else diag()});
    }catch(e){}
  })();
})();
</script>
</body>
</html>
