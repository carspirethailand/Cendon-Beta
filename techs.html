<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Cendon — หาช่าง</title>
<meta name="theme-color" content="#F6F3EC"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./favicon.png"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap">
<style>
/* ═══ สีและตัวอักษร ═══
   ยกชุดเดียวกับหน้าอื่นมาทั้งก้อน เพื่อไม่ให้หน้านี้ดูเหมือนคนละแอป
   และไม่ไปแตะ app.css เพราะหน้าอื่นใช้ไฟล์นั้นร่วมกันอยู่ แก้ที่นั่นคือพังหมด */
:root{
  --bg:#F6F3EC;--surface:#FFFFFF;--surface-2:#FBF8F1;--ink:#22201A;--muted:#6E685B;--faint:#A8A192;
  --line:rgba(40,34,18,.12);--line-2:rgba(40,34,18,.07);
  --accent:#D9733C;--accent-2:#E8A23C;--accent-d:#B85A2A;
  --grad:linear-gradient(135deg,#E8943C,#D95E3C);
  --ok:#3E9E6E;--danger:#D64A4A;--info:#3C7FD9;
  --radius:20px;--shadow:0 18px 50px -22px rgba(60,40,15,.32);--shadow-sm:0 6px 20px -10px rgba(60,40,15,.22);
  --k:'Kanit',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14120E;--surface:#1D1A15;--surface-2:#231F19;--ink:#F0EBE0;--muted:#A9A192;--faint:#6E675A;
        --line:rgba(240,235,224,.13);--line-2:rgba(240,235,224,.07);
        --shadow:0 18px 50px -22px rgba(0,0,0,.7);--shadow-sm:0 6px 20px -10px rgba(0,0,0,.5)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--k);font-weight:400;
  font-size:15px;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(217,115,60,.24)}

/* ── แถบบน ── */
.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);
  background:color-mix(in srgb,var(--bg) 86%,transparent);border-bottom:1px solid var(--line-2)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.back{width:38px;height:38px;flex:0 0 38px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:.18s}
.back:active{transform:scale(.92)}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
.top .sub{font-size:11.5px;color:var(--muted);font-weight:400;line-height:1.2}
.top .sp{flex:1}
.btn-apply{border:0;border-radius:13px;padding:10px 16px;background:var(--grad);color:#fff;
  font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.18s;white-space:nowrap}
.btn-apply:active{transform:scale(.95)}

/* ── หัวเรื่องใหญ่ ── */
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 90px}
.hero{padding:30px 0 20px;position:relative}
.hero h2{margin:0 0 6px;font-size:clamp(25px,5.4vw,38px);font-weight:800;letter-spacing:-.7px;line-height:1.15}
.hero h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:56ch}

/* ── ช่องค้นหา ── */
.searchbar{display:flex;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:5px 6px 5px 15px;box-shadow:var(--shadow-sm);margin-top:18px;transition:.2s}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(217,115,60,.12)}
.searchbar i{color:var(--faint);font-size:19px}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:0;padding:11px 0;font-size:15px}
.searchbar .go{border:0;border-radius:12px;padding:10px 15px;background:var(--grad);color:#fff;
  font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.searchbar .go:active{transform:scale(.95)}
.hints{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.hints button{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;
  padding:6px 13px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:.16s}
.hints button:hover{border-color:var(--accent);color:var(--accent)}

/* ── แท็บหมวด ── */
.cats{display:flex;gap:9px;overflow-x:auto;padding:20px 0 6px;margin:0 -18px;
  padding-left:18px;padding-right:18px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:15px;
  padding:11px 16px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:9px;
  font-weight:600;font-size:13.5px;color:var(--muted)}
.cat i{font-size:17px}
.cat:hover{border-color:var(--accent)}
.cat.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-sm)}
.cat.on .n{color:rgba(255,255,255,.75)}
.cat .n{font-size:11.5px;font-weight:400;color:var(--faint)}
.catdesc{font-size:12.5px;color:var(--muted);padding:10px 2px 0;min-height:20px}

/* ── แถวตัวกรอง ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 13px;
  font-size:12.5px;cursor:pointer;color:var(--muted);transition:.16s;display:flex;align-items:center;gap:6px}
.chip.on{background:rgba(217,115,60,.13);border-color:var(--accent);color:var(--accent-d);font-weight:600}
.chip select{border:0;background:none;outline:0;font-size:12.5px;cursor:pointer}
.count{margin-left:auto;font-size:12.5px;color:var(--faint)}

/* ── การ์ดช่าง ── */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px;
  cursor:pointer;transition:.2s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--grad);
  opacity:0;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:transparent}
.card:hover::before{opacity:1}
.card:active{transform:scale(.99)}
.chead{display:flex;gap:12px;align-items:flex-start}
.av{width:50px;height:50px;flex:0 0 50px;border-radius:15px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:21px;font-weight:700;box-shadow:var(--shadow-sm)}
.cname{font-weight:700;font-size:15.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:5px}
.cname .vf{color:var(--info);font-size:15px}
.cshop{font-size:12.5px;color:var(--muted)}
.cwhere{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:4px;margin-top:2px}
.rate{margin-left:auto;text-align:right;flex:0 0 auto}
.rate b{font-size:16px;font-weight:700;color:var(--accent-d)}
.rate span{display:block;font-size:11px;color:var(--faint)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;
  padding:4px 9px;color:var(--muted)}
.tag.hi{background:rgba(217,115,60,.12);border-color:rgba(217,115,60,.25);color:var(--accent-d);font-weight:500}
.tag.ok{background:rgba(62,158,110,.12);border-color:rgba(62,158,110,.25);color:var(--ok);font-weight:500}
.cfoot{display:flex;align-items:flex-end;gap:10px;padding-top:11px;border-top:1px solid var(--line-2);margin-top:auto}
.price b{font-size:17px;font-weight:700}
.price span{font-size:11.5px;color:var(--faint);display:block;line-height:1.2}
.meta{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.45}

/* ── ไม่พบ ── */
.none{text-align:center;padding:60px 20px;color:var(--muted)}
.none i{font-size:44px;color:var(--faint);display:block;margin-bottom:12px}
.none b{display:block;font-size:16px;margin-bottom:5px;color:var(--ink)}

/* ── แผ่นรายละเอียด ── */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(20,16,10,.5);backdrop-filter:blur(4px);animation:fade .25s}
.sheet .pn{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--bg);
  overflow-y:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4);animation:slide .3s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@media (max-width:640px){.sheet .pn{top:auto;height:92dvh;width:100%;border-radius:24px 24px 0 0;
  animation:up .3s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}}}
.pn-x{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:13px 18px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-2)}
.pn-x b{font-size:15px}
.pn-x button{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;display:grid;place-items:center}
.pn-b{padding:20px 18px 40px}
.pbig{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.pbig .av{width:64px;height:64px;flex:0 0 64px;border-radius:19px;font-size:26px}
.pbig h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:700}
.stat span{font-size:10.5px;color:var(--faint)}
.sec{margin-top:20px}
.sec h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px}
.sec p{margin:0;font-size:14px;line-height:1.7}
.rowl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.rowl:last-child{border:0}
.rowl span:first-child{color:var(--muted)}
.rowl span:last-child{font-weight:500;text-align:right}
.cta{display:flex;gap:9px;margin-top:22px;position:sticky;bottom:0;padding:14px 0;
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta button{flex:1;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:14.5px;cursor:pointer;transition:.18s}
.cta .p{background:var(--grad);color:#fff;box-shadow:var(--shadow-sm)}
.cta .s{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.cta button:active{transform:scale(.96)}

/* ── ฟอร์มสมัคร ── */
.rules{display:grid;gap:9px;margin:14px 0}
.rule{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px}
.rule i{color:var(--ok);font-size:18px;flex:0 0 auto;margin-top:1px}
.rule.opt i{color:var(--faint)}
.rule b{display:block;font-size:13.5px;font-weight:600}
.rule small{color:var(--muted);font-size:12px;line-height:1.5}
.keep{background:rgba(217,115,60,.08);border:1px solid rgba(217,115,60,.2);border-radius:14px;
  padding:14px 16px;margin-top:14px}
.keep li{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.keep li:last-child{margin:0}
.f{margin-bottom:13px}
.f label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.f label em{font-style:normal;color:var(--danger)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:11px 13px;outline:0;transition:.18s;font-size:14px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,115,60,.12)}
.f textarea{min-height:88px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
.f.bad input,.f.bad textarea,.f.bad select{border-color:var(--danger)}
.f .err{font-size:11.5px;color:var(--danger);margin-top:4px;display:none}
.f.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:460px){.two{grid-template-columns:1fr}}
.pick{display:flex;gap:7px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 13px;
  font-size:12.5px;cursor:pointer;color:var(--muted);transition:.16s}
.pick button.on{background:rgba(217,115,60,.13);border-color:var(--accent);color:var(--accent-d);font-weight:600}
.ok-box{background:rgba(62,158,110,.1);border:1px solid rgba(62,158,110,.28);border-radius:16px;
  padding:20px;text-align:center}
.ok-box i{font-size:40px;color:var(--ok)}
.ok-box b{display:block;font-size:16px;margin:8px 0 4px}
.ok-box p{margin:0;font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);z-index:200;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;font-size:13.5px;
  font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.3s cubic-bezier(.2,.9,.3,1);pointer-events:none;
  display:flex;align-items:center;gap:9px;max-width:calc(100vw - 40px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <button class="back" onclick="goBack()" aria-label="ย้อนกลับ"><i class="ti ti-arrow-left"></i></button>
    <div>
      <h1>หาช่าง</h1>
      <div class="sub" id="topSub">ช่างที่ผ่านการตรวจสอบ ทั่วประเทศ</div>
    </div>
    <div class="sp"></div>
    <button class="btn-apply" onclick="openApply()"><i class="ti ti-tool"></i> สมัครเป็นช่าง</button>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <h2>รถมีอาการ<br><em>หาช่างที่ทำเรื่องนั้นเป็น</em></h2>
    <p>พิมพ์อาการที่เจอได้เลย ไม่ต้องรู้ว่าต้องเรียกช่างประเภทไหน ระบบจะจับคู่ให้เอง — ทุกคนที่ขึ้นในนี้บอกราคาเริ่มต้นและระยะรับประกันไว้ล่วงหน้าแล้ว</p>

    <div class="searchbar">
      <i class="ti ti-search"></i>
      <input id="q" placeholder="เช่น แอร์ไม่เย็น, ช่วงล่างมีเสียง, ยางแตกข้างทาง" autocomplete="off"/>
      <button class="go" onclick="run()">ค้นหา</button>
    </div>
    <div class="hints" id="hints"></div>
  </div>

  <div class="cats" id="cats"></div>
  <div class="catdesc" id="catdesc"></div>

  <div class="filters">
    <button class="chip" id="fMobile" onclick="tog('mobile')"><i class="ti ti-truck"></i> ออกนอกสถานที่</button>
    <button class="chip" id="fVerified" onclick="tog('verified')"><i class="ti ti-rosette-discount-check"></i> ตรวจสอบแล้ว</button>
    <label class="chip"><i class="ti ti-arrows-sort"></i>
      <select id="sort" onchange="run()">
        <option value="best">ตรงที่สุด</option>
        <option value="near">ใกล้ที่สุด</option>
        <option value="rating">คะแนนสูงสุด</option>
        <option value="cheap">ราคาเริ่มต้นถูกสุด</option>
        <option value="fast">ตอบเร็วสุด</option>
      </select></label>
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="sheet" id="sheet"><div class="bd" onclick="closeSheet()"></div>
  <div class="pn"><div class="pn-x"><b id="pnT">รายละเอียด</b>
    <button onclick="closeSheet()" aria-label="ปิด"><i class="ti ti-x"></i></button></div>
    <div class="pn-b" id="pnB"></div></div></div>

<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toastT"></span></div>

<script src="./techs.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function goBack(){ if(history.length>1)history.back(); else location.href="index.html" }
let TO=0;
function toast(t,ic){ $("toastT").textContent=t;
  $("toast").querySelector("i").className="ti "+(ic||"ti-check");
  $("toast").classList.add("on"); clearTimeout(TO); TO=setTimeout(()=>$("toast").classList.remove("on"),2600) }

/* สถานะของหน้า เก็บไว้ที่เดียว ทุกอย่างวาดจากตรงนี้
   ไม่มีใครไปแก้ DOM ตรง ๆ นอกจาก draw() จะได้ไม่มีวันที่จอกับข้อมูลไม่ตรงกัน */
const S={cat:"all",q:"",sort:"best",mobile:false,verified:false,here:null};

const HINTS=["แอร์ไม่เย็น","ช่วงล่างมีเสียง","สตาร์ทไม่ติด","ยางแตกข้างทาง","เกียร์กระตุก","แบตเตอรี่ EV","เคาะพ่นสี","เช็กระยะ"];
$("hints").innerHTML=HINTS.map(h=>`<button onclick="quick('${esc(h)}')">${esc(h)}</button>`).join("");
function quick(t){ $("q").value=t; S.q=t; run() }

/* แท็บหมวด — สามหมวดหลักขึ้นก่อน แล้วค่อยหมวดงานเฉพาะทาง
   ผู้ใช้ส่วนใหญ่ไม่รู้ว่าอาการของตัวเองเป็นงานหมวดไหน จึงต้องเห็น "ทั้งหมด" เป็นค่าเริ่มต้น */
function drawCats(){
  const list=[{id:"all",th:"ทั้งหมด",ic:"ti-layout-grid",desc:"ช่างทุกคนในระบบ"}].concat(Techs.CATS);
  $("cats").innerHTML=list.map(c=>{
    const n=c.id==="all"?Techs.all().length:Techs.search({cat:c.id,here:S.here}).length;
    return `<button class="cat${S.cat===c.id?" on":""}" data-c="${c.id}">
      <i class="ti ${c.ic}"></i><span>${esc(c.th)}<br><span class="n">${n} คน</span></span></button>`;
  }).join("");
  $("cats").querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
    S.cat=b.dataset.c;
    /* เลือกหมวดใกล้บ้านแล้วยังไม่รู้ว่าอยู่ไหน ก็ต้องถามตรงนี้แหละ
       ถามตั้งแต่เปิดหน้าจะดูเหมือนแอปหิวข้อมูล ทั้งที่ยังไม่รู้เลยว่าเขาจะใช้ไหม */
    if(S.cat==="near"&&!S.here){ Techs.askPos().then(p=>{ S.here=p;
      if(!p)toast("ยังไม่ได้ตำแหน่ง — เรียงตามคะแนนแทน","ti-map-pin-off");
      else { S.sort="near"; $("sort").value="near" }
      run(); drawCats() }) }
    const d=list.find(x=>x.id===S.cat);
    $("catdesc").textContent=d&&d.desc?d.desc:"";
    run(); drawCats();
  });
  const d=list.find(x=>x.id===S.cat); $("catdesc").textContent=d&&d.desc?d.desc:"";
}
function tog(k){ S[k]=!S[k];
  $(k==="mobile"?"fMobile":"fVerified").classList.toggle("on",S[k]); run() }

function money(n){ return Number(n).toLocaleString("th-TH") }
function cardHTML(t){
  const badges=[];
  if(t.verified)badges.push('<span class="tag ok"><i class="ti ti-rosette-discount-check"></i> ตรวจสอบแล้ว</span>');
  if(t.urgent)  badges.push('<span class="tag hi">รับงานด่วน</span>');
  if(t.mobile)  badges.push('<span class="tag">ออกนอกสถานที่</span>');
  const sk=(t.skills||[]).slice(0,3).map(s=>`<span class="tag">${esc(s)}</span>`).join("");
  return `<article class="card" data-id="${t.id}">
    <div class="chead">
      <div class="av">${esc((t.name||"?")[0])}</div>
      <div style="min-width:0">
        <div class="cname">${esc(t.name)}${t.verified?'<i class="ti ti-rosette-discount-check vf"></i>':""}</div>
        <div class="cshop">${esc(t.shop)}</div>
        <div class="cwhere"><i class="ti ti-map-pin"></i>${esc(t.area)}${
          t.dist!=null?` · ${t.dist} กม.`:""}</div>
      </div>
      <div class="rate"><b>${t.rating.toFixed(1)}</b><span>${t.jobs} งาน</span></div>
    </div>
    <div class="tags">${badges.join("")}${sk}</div>
    <div class="cfoot">
      <div class="price"><span>เริ่มต้น</span><b>฿${money(t.from)}</b></div>
      <div class="meta">ตอบใน ~${t.reply} นาที<br>รับประกัน ${t.warranty} วัน</div>
    </div>
  </article>`;
}
function run(){
  S.q=$("q").value.trim(); S.sort=$("sort").value;
  const list=Techs.search({q:S.q,cat:S.cat,here:S.here,sort:S.sort,mobile:S.mobile,verified:S.verified});
  $("count").textContent=list.length+" คน";
  $("grid").innerHTML=list.length?list.map(cardHTML).join("")
    :`<div class="none" style="grid-column:1/-1"><i class="ti ti-mood-empty"></i>
       <b>ยังไม่มีช่างที่ตรงกับที่หาอยู่</b>
       ลองพิมพ์อาการสั้นลง หรือเอาตัวกรองออกสักอัน แล้วดูใหม่อีกที</div>`;
  $("grid").querySelectorAll(".card").forEach(c=>c.onclick=()=>openTech(c.dataset.id));
}

function closeSheet(){ $("sheet").classList.remove("on"); document.body.style.overflow="" }
addEventListener("keydown",e=>{ if(e.key==="Escape")closeSheet() });

/* ส่งอาการต่อให้หน้าแชต พร้อมชื่อช่างที่กำลังดูอยู่
   ผู้ใช้จะได้ไม่ต้องเล่าเรื่องเดิมซ้ำอีกรอบ */
function askAI(id){
  const t=Techs.all().find(x=>x.id===id); if(!t)return;
  const q=(S.q?`${S.q} — `:"")+`ช่าง ${t.name} (${t.shop}) ที่ ${t.area} เหมาะกับงานของผมไหม`;
  location.href="chat.html?q="+encodeURIComponent(q);
}
function book(id){
  const t=Techs.all().find(x=>x.id===id); if(!t)return;
  /* ยังไม่มีระบบนัดหมายจริง จึงบอกตามตรงว่ายังทำอะไรได้แค่ไหน
     ขึ้นหน้าจอปลอมว่าจองสำเร็จแล้วปล่อยให้เขานั่งรอช่างที่ไม่มีวันมา คือเรื่องที่ทำไม่ได้ */
  toast("ระบบนัดหมายกำลังเปิดใช้เร็ว ๆ นี้ — ตอนนี้บันทึกช่างคนนี้ไว้ให้แล้ว","ti-bookmark");
  try{ const k="spire_tech_saved", a=JSON.parse(localStorage.getItem(k)||"[]");
    if(a.indexOf(id)<0){ a.push(id); localStorage.setItem(k,JSON.stringify(a)) } }catch(e){}
}

/* ═══ สมัครเป็นช่าง ═══ */

  $("pnT").textContent="สมัครเป็นช่าง";
  const req=Techs.RULES.filter(r=>r.req), opt=Techs.RULES.filter(r=>!r.req);

    <i class="ti ${r.req?"ti-circle-check":"ti-circle-plus"}"></i>
    <div><b>${esc(r.th)}</b><small>${esc(r.detail)}</small></div></div>`;
  $("pnB").innerHTML=`
    <div class="sec" style="margin-top:0"><h4>เกณฑ์ที่ต้องผ่าน</h4>
      <p style="font-size:13px;color:var(--muted)">ทุกข้อด้านล่างตรวจสอบได้จริง เพราะลูกค้าที่รถเสียต้องกล้าให้คนแปลกหน้าจับรถของเขา</p>
      <div class="rules">${req.map(rule).join("")}</div></div>

      <div class="f" id="f-name"><label>ชื่อ–นามสกุล <em>*</em></label>
        <input id="a-name" placeholder="ชื่อจริงตามบัตรประชาชน"/><div class="err">กรอกชื่อจริงอย่างน้อย 4 ตัวอักษร</div></div>
      <div class="f" id="f-shop"><label>ชื่อร้าน / ชื่อที่ใช้รับงาน <em>*</em></label>
        <input id="a-shop" placeholder="เช่น อู่ช่างเอ ยางดี"/><div class="err">กรอกชื่อที่ลูกค้าจะเห็น</div></div>
      <div class="two">

        <div class="f" id="f-age"><label>อายุ <em>*</em></label>
          <input id="a-age" inputmode="numeric" placeholder="18 ปีขึ้นไป"/><div class="err">ต้องอายุ 18 ปีขึ้นไป</div></div>
      </div>
      <div class="f" id="f-area"><label>พื้นที่ให้บริการ <em>*</em></label>
        <input id="a-area" placeholder="เช่น ลาดพร้าว กรุงเทพฯ (รัศมี 20 กม.)"/><div class="err">ระบุเขต/อำเภอ และจังหวัด</div></div>

        <div class="hint">อย่างน้อย 40 ตัวอักษร</div><div class="err">เขียนอย่างน้อย 40 ตัวอักษร</div></div>

function submitApply(){
  const v=id=>($(id)&&$(id).value||"").trim();
  const num=id=>parseFloat(v(id).replace(/[^\d.]/g,""))||0;
  const cats=[...$("a-cat").querySelectorAll("button.on")].map(b=>b.dataset.c);
  const ways=[...$("a-way").querySelectorAll("button.on")].map(b=>b.dataset.w);
  /* ตรวจทุกช่องก่อน แล้วค่อยบอกทีเดียวว่าอะไรไม่ผ่านบ้าง
     ถ้าบอกทีละข้อ คนกรอกจะต้องกดส่งแปดรอบกว่าจะรู้ว่าต้องแก้อะไร */
  const bad=[];
  const chk=(f,ok)=>{ const el=$(f); if(el)el.classList.toggle("bad",!ok); if(!ok)bad.push(f) };
  chk("f-name", v("a-name").length>=4);
  chk("f-shop", v("a-shop").length>=2);
  chk("f-phone",/^0\d{8,9}$/.test(v("a-phone").replace(/[-\s]/g,"")));
  chk("f-age",  num("a-age")>=18);
  chk("f-area", v("a-area").length>=4);
  chk("f-exp",  num("a-exp")>=1);
  chk("f-port", num("a-port")>=3);
  chk("f-from", num("a-from")>0);
  chk("f-warr", num("a-warr")>=7);
  chk("f-cat",  cats.length>0);
  chk("f-about",v("a-about").length>=40);
  if(bad.length){
    const first=$(bad[0]); if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
    toast("ยังมี "+bad.length+" ช่องที่ยังไม่ผ่านเกณฑ์","ti-alert-triangle");
    return;
  }
  const app={id:"app_"+Date.now().toString(36),t:Date.now(),status:"pending",
    name:v("a-name"),shop:v("a-shop"),phone:v("a-phone"),age:num("a-age"),area:v("a-area"),
    years:num("a-exp"),port:num("a-port"),from:num("a-from"),warranty:num("a-warr"),
    cats,mobile:ways.indexOf("mobile")>=0,urgent:ways.indexOf("urgent")>=0,about:v("a-about")};
  const a=Techs.apps(); a.push(app); Techs.saveApps(a);
  sendApply(app);
  $("pnB").innerHTML=`<div class="ok-box"><i class="ti ti-circle-check"></i>
    <b>ส่งใบสมัครแล้ว</b>
    <p>ทีมงานจะโทรไปที่เบอร์ ${esc(app.phone)} เพื่อยืนยันตัวตนและขอดูรูปผลงาน ภายใน 3 วันทำการ<br>
    ระหว่างนี้เตรียมบัตรประชาชนและรูปงานจริงไว้ให้พร้อม</p></div>
    <div class="cta"><button class="p" onclick="closeSheet()">เรียบร้อย</button></div>`;
  toast("ส่งใบสมัครเรียบร้อย","ti-check");
}

/* ส่งใบสมัครขึ้นเซิร์ฟเวอร์ — ถ้ายังไม่มีปลายทาง ก็เก็บไว้ในเครื่องรอส่งใหม่
   ไม่ขึ้นข้อความว่าล้มเหลวให้ผู้ใช้เห็น เพราะใบสมัครไม่ได้หายไปไหน */
async function sendApply(app){
  const url=(window.BACKEND_URL||localStorage.getItem("spire_backend")||"");
  if(!url)return;
  try{
    const r=await fetch(url.replace(/\/$/,"")+"/api/tech/apply",
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(app)});
    if(r.ok){ const a=Techs.apps().map(x=>x.id===app.id?Object.assign({},x,{sent:true}):x); Techs.saveApps(a) }
  }catch(e){}
}

/* ═══ เริ่มทำงาน ═══ */
(function init(){
  const p=new URLSearchParams(location.search);
  if(p.get("q")){ $("q").value=p.get("q") }
  if(p.get("cat"))S.cat=p.get("cat");
  S.here=Techs.pos();
  /* ดึงช่างที่อนุมัติแล้วจากเซิร์ฟเวอร์มาเติม ถ้ายังไม่มีปลายทางก็ใช้ของในระบบไปก่อน
     หน้าเว็บต้องใช้ได้ตั้งแต่วินาทีแรกเสมอ ไม่ใช่ค้างรอเน็ต */
  const url=(window.BACKEND_URL||localStorage.getItem("spire_backend")||"");
  if(url)fetch(url.replace(/\/$/,"")+"/api/tech")
    .then(r=>r.ok?r.json():null)
    .then(d=>{ if(d&&d.techs&&d.techs.length){ Techs.merge(d.techs); drawCats(); run() } })
    .catch(()=>{});
  drawCats(); run();
  $("q").addEventListener("keydown",e=>{ if(e.key==="Enter")run() });
  /* พิมพ์แล้วค้นให้เลย แต่รอให้หยุดพิมพ์ก่อน ไม่งั้นวาดใหม่ทุกตัวอักษร */
  let d=0; $("q").addEventListener("input",()=>{ clearTimeout(d); d=setTimeout(run,220) });
})();
</script>
