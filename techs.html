<title>Cendon — หาช่าง</title>

<!-- ══ ธีมฝังมาในไฟล์ ══
     ตอนแรกแยกออกไปเป็น theme.css กับ theme.js เพื่อไม่ให้มีของสองชุด
     แต่พอไฟล์ใดไฟล์หนึ่งไม่ได้ถูกอัปขึ้นเซิร์ฟเวอร์ ตัวแปรสีหายทั้งชุด
     ปุ่มกลายเป็นขาวบนขาว ตัวหนังสือไล่สีกลายเป็นล่องหน — หน้าพังทั้งหน้า

     หน้าเว็บที่พังเพราะไฟล์เดียวหาย คือหน้าเว็บที่ออกแบบมาเปราะเกินไป
     จึงย้ายกลับมาฝังไว้ในไฟล์เดียวกัน หน้านี้ทำงานได้ด้วยตัวเองเสมอ
     ไฟล์ theme.css/theme.js ยังอยู่สำหรับหน้าใหม่ ๆ ที่จะเขียนทีหลัง
     ถ้าแก้ชุดสี ต้องแก้ทั้งสองที่ให้ตรงกัน -->
<style>
/* ── LIGHT — กระดาษอุ่น ── */
html[data-theme="light"]{
  --bg:#F7F4EE;--surface:#FFFFFF;--surface-2:#FBF9F4;--ink:#221F1A;--muted:#6C665A;--faint:#A6A093;
  --line:rgba(40,34,18,.12);--line-2:rgba(40,34,18,.07);
  --accent:#D9733C;--accent-2:#E8A23C;--accent-d:#B85A2A;
  --grad:linear-gradient(135deg,#E8943C,#D95E3C);
  --ok:#3E9E6E;--danger:#D64A4A;--radius:20px;
  --shadow:0 18px 50px -22px rgba(60,40,15,.30);--shadow-sm:0 6px 20px -10px rgba(60,40,15,.20);
  --wireframe-opacity:.15;--nav-bg:rgba(255,255,255,.86);--nav-link:#6C665A;
  --gloss:.5;--gloss-card:.65;--edge-sh:rgba(40,34,18,.16);--el-cast:rgba(60,40,15,.34);--sk-glow:.14;

  --c-bg0:#F4F1EB;--c-bg1:#FBF9F4;--c-bg2:#FFFFFF;
  --c-aura1:rgba(232,148,60,.10);--c-aura2:rgba(120,150,200,.07);--c-aura3:rgba(200,150,90,.06);
  --c-ink:#221F1A;--c-mut:#6C665A;--c-faint:#A6A093;
  --c-glass:rgba(40,34,18,.035);--c-glass2:rgba(40,34,18,.06);
  --c-line:rgba(40,34,18,.12);--c-line2:rgba(40,34,18,.07);
  --c-grad:linear-gradient(135deg,#E8943C,#D95E3C);--c-acc:#D9733C;
  --c-acc-soft:rgba(217,115,60,.14);
  --c-user:linear-gradient(135deg,#E8943C,#D9553C);--c-ai-bubble:rgba(40,34,18,.045);
  --pill-bg:rgba(255,255,255,.80);--sheet-bg:rgba(255,255,255,.95);
  --star-op:0;--star-c:40,34,18;
}

/* ── DARK — ถ่านอุ่น ── */
html[data-theme="dark"]{
  --bg:#131316;--surface:#1D1D21;--surface-2:#26262C;--ink:#E7E7EA;--muted:#9B9BA1;--faint:#616168;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.05);
  --accent:#E8843C;--accent-2:#F0A93C;--accent-d:#C96A28;
  --grad:linear-gradient(135deg,#F0A93C,#E85E3C);
  --ok:#4BB07C;--danger:#E05A54;--radius:20px;
  --shadow:0 18px 50px -22px rgba(0,0,0,.8);--shadow-sm:0 6px 20px -10px rgba(0,0,0,.5);
  --wireframe-opacity:.18;--nav-bg:rgba(29,29,33,.92);--nav-link:#9B9BA1;
  --gloss:.13;--gloss-card:.07;--edge-sh:rgba(0,0,0,.5);--el-cast:rgba(0,0,0,.75);--sk-glow:.07;

  --c-bg0:#0C0C0F;--c-bg1:#141418;--c-bg2:#1B1B21;
  --c-aura1:rgba(232,132,60,.12);--c-aura2:rgba(120,130,170,.08);--c-aura3:rgba(200,120,70,.07);
  --c-ink:#E7E7EA;--c-mut:#9B9BA1;--c-faint:#616168;
  --c-glass:rgba(255,255,255,.05);--c-glass2:rgba(255,255,255,.09);
  --c-line:rgba(255,255,255,.09);--c-line2:rgba(255,255,255,.05);
  --c-grad:linear-gradient(135deg,#F0A93C,#E85E3C);--c-acc:#E8843C;
  --c-acc-soft:rgba(232,132,60,.15);
  --c-user:linear-gradient(135deg,#F0A93C,#E8553C);--c-ai-bubble:rgba(255,255,255,.055);
  --pill-bg:rgba(20,20,24,.66);--sheet-bg:rgba(20,20,24,.94);
  --star-op:1;--star-c:255,255,255;
}

</style>
<script>
/* ═══════════════════════════════════════════════════════════════════
   ธีมและสีหลัก — ตัวเดียวกับที่หน้าหลักใช้
   ───────────────────────────────────────────────────────────────────
   ผู้ใช้ตั้งค่าสองอย่างแยกกัน และหน้าใดก็ตามที่อ่านไม่ครบทั้งสอง
   จะแสดงสีผิดทันที
     spire_theme    โครงสีพื้นหลังและตัวหนังสือ  light | dark
     spire_primary  สีหลักของปุ่มและไฮไลต์      รหัสสีหก หลัก

   ต้องโหลดไฟล์นี้แบบไม่มี defer และวางไว้ใน <head> ก่อนอย่างอื่น
   ไม่งั้นจะเห็นธีมตั้งต้นแวบหนึ่งก่อนสลับ ซึ่งน่ารำคาญกว่าไม่มีธีม
   ═══════════════════════════════════════════════════════════════════ */
(function(){
"use strict";
var D=document, TKEY="spire_theme", PKEY="spire_primary", DEF="#E8943C";

/* ── โครงสี ── */
var KEYS=["light","dark"];
/* ธีมรุ่นเก่าที่เลิกใช้แล้ว ให้ตกลงมาที่โครงสีที่ใกล้ที่สุด
   ไม่งั้นคนที่เคยตั้งไว้จะเปิดมาเจอสีผิดโดยไม่รู้ว่าทำไม
   ตารางนี้ต้องตรงกับของหน้าหลักทุกตัว */
var OLD={warm:"light",pearl:"light",emerald:"light",plant:"light",moss:"light",
         carbon:"dark",night:"dark",midnight:"dark",cyber:"dark",
         aurora:"dark",ocean:"dark",sunset:"dark",magma:"dark",
         wire:"dark",grid:"light"};
function readTheme(){
  var v=null;
  try{ v=JSON.parse(localStorage.getItem(TKEY)) }catch(e){}
  if(typeof v!=="string"){ try{ v=JSON.parse(localStorage.getItem("spire_chatTheme")) }catch(e){} }
  if(typeof v!=="string")return "light";
  if(KEYS.indexOf(v)>=0)return v;
  return OLD[v]||"light";
}
function applyTheme(k){
  var el=D.documentElement;
  /* ตั้งทั้งสองแอตทริบิวต์ให้เป็นค่าเดียวกัน เพราะสไตล์ของสองฝั่ง
     (หน้าเว็บกับห้องแชต) อ้างคนละชื่อกัน */
  el.setAttribute("data-theme",k);
  el.setAttribute("data-ctheme",k);
}

/* ── สีหลัก ── */
function hex2rgb(h){
  h=String(h||"").trim().replace(/^#/,"");
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-f]{6}$/i.test(h))return null;
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function rgb2hex(r,g,b){
  return "#"+[r,g,b].map(function(x){
    return Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")}).join("");
}
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
  if(d){ h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4); h*=60 }
  var l=(mx+mn)/2, s=d?d/(1-Math.abs(2*l-1)):0;
  return [h,s,l];
}
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, t;
  if(h<60)t=[c,x,0]; else if(h<120)t=[x,c,0]; else if(h<180)t=[0,c,x];
  else if(h<240)t=[0,x,c]; else if(h<300)t=[x,0,c]; else t=[c,0,x];
  return [(t[0]+m)*255,(t[1]+m)*255,(t[2]+m)*255];
}
function shift(hex,dl,dh){
  var c=hex2rgb(hex); if(!c)return hex;
  var a=rgb2hsl(c[0],c[1],c[2]), l=Math.max(0,Math.min(1,a[2]+dl));
  return rgb2hex.apply(null,hsl2rgb(a[0]+(dh||0),a[1],l));
}
function readPrim(){
  var v=null;
  try{ v=JSON.parse(localStorage.getItem(PKEY)) }catch(e){}
  return (typeof v==="string"&&hex2rgb(v))?v:DEF;
}
function applyPrim(raw){
  var base=hex2rgb(raw)?raw:DEF;
  var c=hex2rgb(base)||hex2rgb(DEF);
  var soft=function(a){ return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")" };
  var light=shift(base,.10,10), dark=shift(base,-.12,-6);
  var st=D.documentElement.style, set=function(k,v){ st.setProperty(k,v) };
  /* ชื่อตัวแปรของหน้าแดชบอร์ดกับห้องแชตไม่เหมือนกัน ตั้งให้ครบทั้งสองชุด
     ตกไปแม้แต่ตัวเดียว หน้านั้นจะมีสีปุ่มไม่ตรงกับที่ผู้ใช้เลือกไว้ */
  set("--accent",base); set("--accent-2",light); set("--accent-d",dark);
  set("--grad","linear-gradient(135deg,"+light+","+dark+")");
  set("--c-acc",base); set("--c-acc-soft",soft(.16));
  set("--c-grad","linear-gradient(135deg,"+light+","+dark+")");
  set("--c-user","linear-gradient(135deg,"+light+","+dark+")");
  set("--c-aura1",soft(.12));
  /* สีตัวหนังสือบนพื้นสีหลัก คำนวณจากความสว่างจริง ไม่ใช่เดา
     สีหลักอ่อน ๆ อย่างสีทอง ถ้าใช้ตัวหนังสือขาวจะอ่านไม่ออก */
  var lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
  set("--on-acc",lum>0.62?"#1A1204":"#ffffff");
  try{
    var mt=D.querySelector('meta[name="theme-color"]');
    if(mt){
      var cs=getComputedStyle(D.documentElement);
      var bg=cs.getPropertyValue("--c-bg0").trim()||cs.getPropertyValue("--bg").trim();
      if(bg)mt.setAttribute("content",bg);
    }
  }catch(e){}
}

function sync(){ applyTheme(readTheme()); applyPrim(readPrim()) }
sync();
/* ตั้งค่าจากอีกแท็บหนึ่ง ต้องมีผลกับแท็บนี้ด้วย
   ไม่งั้นเปลี่ยนธีมในหน้าตั้งค่าแล้วกลับมาหน้านี้ยังเป็นสีเดิม */
addEventListener("storage",function(e){
  if(e.key===TKEY||e.key===PKEY||e.key==="spire_chatTheme")sync();
});
window.spireThemeSync=sync;
})();

</script>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════════
   หน้าหาช่าง — เขียนใหม่ทั้งไฟล์ ไม่ได้ต่อของเดิม
   ───────────────────────────────────────────────────────────────────
   สิ่งที่ผิดในรุ่นก่อน และกฎที่ตั้งไว้แก้ในรุ่นนี้

   1 ปุ่มเยอะจนรกตา
     รุ่นก่อนโชว์ปุ่มสิบกว่าปุ่มพร้อมกันตั้งแต่วินาทีแรก
     ทั้งที่เก้าในสิบครั้ง คนเข้ามาทำแค่เรื่องเดียวคือพิมพ์อาการแล้วหาช่าง
     กฎใหม่: หน้าแรกมีของให้กดสองอย่างเท่านั้น คือช่องค้นหากับหมวด
     ที่เหลือพับเก็บไว้หลังปุ่มเดียว กางออกเมื่อต้องการ

   2 กรอบเต็มไปหมด
     ทุกอย่างมีเส้นขอบล้อมรอบ สายตาจึงต้องข้ามเส้นสิบเส้นกว่าจะถึงเนื้อหา
     กฎใหม่: ไม่มีเส้นขอบเลย แยกของด้วยระยะห่างกับระดับพื้นผิวแทน
     เส้นมีได้ที่เดียวคือตอนโฟกัสช่องกรอก ซึ่งต้องบอกว่าเคอร์เซอร์อยู่ไหน

   3 ไม่มีสี
     รุ่นก่อนมีแต่สีส้มของแบรนด์กับสีเทา ทุกการ์ดจึงหน้าตาเหมือนกันหมด
     กฎใหม่: ทุกหมวดมีสีประจำตัว และช่างได้สีตามงานที่เขาถนัด
     สีมีหน้าที่บอกข้อมูล ไม่ใช่ตกแต่ง — เห็นสีเขียวก็รู้ว่างานช่วงล่าง

   4 แถบบนกินที่
     แถบที่มีปุ่มย้อนกลับกับปุ่มสมัคร ติดอยู่บนสุดตลอดเวลา
     ทั้งที่สองปุ่มนั้นถูกกดน้อยมาก
     กฎใหม่: ไม่มีแถบบน ปุ่มสมัครกับความคุ้มครองย้ายไปท้ายหน้า

   ระยะห่างเป็นสเกลเดียว 4 8 12 16 24 32 48 64 ไม่มีตัวเลขนอกสเกล
   ══════════════════════════════════════════════════════════════════ */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--s12:48px;--s16:64px;

  /* ══ ความลึกสามชั้น — สามมิติ ไม่ใช่ดินน้ำมัน ══
     ต่างกันตรงไหน — ดินน้ำมันคือก้อนนุ่มที่มีเงาในตัวหนา ๆ รอบด้าน
     ส่วนสามมิติจริงคือของแข็งที่วางอยู่ใต้แสงดวงเดียว จึงมีแค่สามอย่าง

       ขอบบนรับแสง   เส้นสว่างหนาหนึ่งพิกเซล ด้านที่หันเข้าหาแสง
       ขอบล่างพ้นแสง เส้นมืดหนาหนึ่งพิกเซล ด้านตรงข้าม
       เงาทอดลงพื้น  สองชั้น ชั้นติดตัวคมและเข้ม ชั้นนอกกว้างและจาง

     ยิ่งของลอยสูง เงาชั้นนอกยิ่งกว้างและจางลง นั่นคือสิ่งที่บอกระดับความสูง
     ถ้าเพิ่มความหนาของเงาในตัว มันจะกลายเป็นดินน้ำมันทันที */
  --edge-hi:rgba(255,255,255,.085);
  --edge-lo:rgba(0,0,0,.42);
  --e1:inset 0 1px 0 var(--edge-hi),inset 0 -1px 0 var(--edge-lo),
       0 2px 4px -2px rgba(0,0,0,.5),0 12px 28px -18px rgba(0,0,0,.7);
  --e2:inset 0 1px 0 var(--edge-hi),inset 0 -1px 0 var(--edge-lo),
       0 4px 8px -4px rgba(0,0,0,.55),0 22px 44px -22px rgba(0,0,0,.8);
  --e3:inset 0 1px 0 var(--edge-hi),inset 0 -1px 0 var(--edge-lo),
       0 8px 16px -8px rgba(0,0,0,.6),0 40px 70px -28px rgba(0,0,0,.85);
  /* กดแล้วต้องจมลงไปในพื้น แสงจึงสลับข้างกับตอนลอย */
  --e-in:inset 0 2px 5px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.05);

  /* สีประจำหมวด — เลือกให้ห่างกันบนวงล้อสี จะได้แยกออกด้วยหางตา
     ไม่ได้เลือกเพราะสวย แต่เลือกเพราะแยกจากกันได้จริง */
  --c-near:#4F8FF7; --c-quick:#F0655C; --c-pro:#B47CF0;
  --c-body:#E8743C; --c-ev:#3FC3D6;    --c-tyre:#3EA96E;
  --c-air:#48A9E8;  --c-eng:#E8A33D;
}
/* ธีมสว่าง — เงาต้องเป็นสีของแสงแวดล้อม ไม่ใช่สีดำ
   เงาสีดำบนพื้นสว่างจะดูเป็นคราบสกปรก ไม่ใช่เงา */
html[data-theme="light"]{
  --edge-hi:rgba(255,255,255,.95);
  --edge-lo:rgba(60,40,15,.13);
  --e1:inset 0 1px 0 var(--edge-hi),inset 0 -1px 0 var(--edge-lo),
       0 2px 4px -2px rgba(60,40,15,.14),0 12px 26px -16px rgba(60,40,15,.3);
  --e2:inset 0 1px 0 var(--edge-hi),inset 0 -1px 0 var(--edge-lo),
       0 4px 8px -4px rgba(60,40,15,.16),0 22px 42px -20px rgba(60,40,15,.34);
  --e3:inset 0 1px 0 var(--edge-hi),inset 0 -1px 0 var(--edge-lo),
       0 8px 16px -8px rgba(60,40,15,.18),0 40px 68px -26px rgba(60,40,15,.4);
  --e-in:inset 0 2px 5px rgba(60,40,15,.22),inset 0 -1px 0 rgba(255,255,255,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:none;height:auto}
body{background:var(--bg);color:var(--ink);
  font-family:'Kanit',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--c-acc-soft)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.025em;line-height:1.2}
/* ไม่มีเส้นขอบทั้งหน้า — นี่คือกฎ ไม่ใช่ค่าเริ่มต้นที่เผลอตั้ง */
button{border:0;background:none;cursor:pointer}

/* ══════════════════════════════════════════════════════════════════
   ปุ่มสีหลัก — ผิวโค้งที่มีประกายวิ่งผ่าน
   ───────────────────────────────────────────────────────────────────
   ปุ่มสีทึบ ๆ ใบเดียวอ่านเป็นสี่เหลี่ยมสี ไม่ใช่วัตถุ
   จะให้อ่านเป็นของจริงต้องมีสี่ชั้น เรียงจากล่างขึ้นบน

     1 ตัวปุ่ม     ไล่สีจากอ่อนบนไปเข้มล่าง = ผิวโค้งที่รับแสงจากด้านบน
     2 แสงตกกระทบ  แถบสว่างบางบนครึ่งบน = จุดที่แสงกระทบผิวโค้งโดยตรง
     3 ขอบ         สว่างบน มืดล่าง = ความหนาของตัวปุ่ม
     4 ประกาย      แถบแสงเฉียงที่วิ่งผ่านตอนชี้ = ผิวมัน ไม่ใช่ผิวด้าน

   ชั้นที่สี่คือชั้นที่ทำให้รู้ว่ามันเป็นวัตถุมันวาว
   และเป็นชั้นเดียวที่เคลื่อนไหว จึงต้องเบามือที่สุด
   ══════════════════════════════════════════════════════════════════ */
.gloss{
  position:relative;overflow:hidden;isolation:isolate;
  background:
    /* ชั้นแสงตกกระทบ อยู่บนสุดของกองพื้นหลัง */
    linear-gradient(180deg,rgba(255,255,255,.22) 0,rgba(255,255,255,.05) 46%,
      rgba(0,0,0,.06) 47%,rgba(0,0,0,.12) 100%),
    var(--grad);
  color:var(--on-acc,#fff);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -1px 0 rgba(0,0,0,.28),
    0 2px 4px -2px color-mix(in srgb,var(--accent) 60%,transparent),
    0 12px 26px -12px color-mix(in srgb,var(--accent) 78%,transparent);
  transition:transform .18s cubic-bezier(.3,1.2,.5,1),box-shadow .18s}
/* ประกาย — แถบแสงเฉียงที่จอดอยู่นอกจอ แล้ววิ่งผ่านตอนชี้ */
.gloss::after{
  content:"";position:absolute;top:-60%;bottom:-60%;left:-140%;width:55%;
  z-index:1;pointer-events:none;transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);
  transition:left .62s cubic-bezier(.25,.8,.3,1)}
.gloss:hover::after{left:150%}
.gloss:hover{transform:translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(0,0,0,.3),
    0 3px 6px -2px color-mix(in srgb,var(--accent) 65%,transparent),
    0 20px 38px -14px color-mix(in srgb,var(--accent) 85%,transparent)}
/* กดแล้วจมลงไป แสงสลับข้าง เงาที่พื้นหด */
.gloss:active{transform:translateY(1px);
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.34),
    inset 0 -1px 0 rgba(255,255,255,.14),
    0 2px 6px -3px color-mix(in srgb,var(--accent) 60%,transparent)}
.gloss>*{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.gloss::after{display:none}}

/* พื้นหลังมีชีวิต ไล่สีสองจุดเหมือนหน้าอื่นในเว็บ */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 8% -10%,var(--c-aura1,rgba(232,132,60,.14)),transparent 60%),
    radial-gradient(1000px 600px at 104% 104%,var(--c-aura3,rgba(200,120,70,.08)),transparent 58%)}

.wrap{max-width:1080px;margin:0 auto;padding:0 var(--s6) var(--s16)}

/* ══ เปิดหน้า ══ */
.lead{padding:var(--s8) 0 var(--s4)}
.homelink{display:inline-flex;align-items:center;gap:7px;font-size:13px;
  color:var(--muted);margin-bottom:var(--s8);transition:color .16s}
.homelink:hover{color:var(--accent)}
.homelink svg{width:15px;height:18px;color:var(--accent)}
.lead h1{font-size:clamp(30px,6vw,52px);font-weight:800;letter-spacing:-.04em;
  line-height:1.06;margin-bottom:var(--s4)}
.lead h1 em{font-style:normal;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lead p{color:var(--muted);font-size:15.5px;max-width:50ch;margin:0}

/* ══ ช่องค้นหา — ไม่มีกรอบ ใช้พื้นผิวคนละระดับแทน ══ */
.find{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s8);
  background:var(--surface);border-radius:22px;padding:var(--s2) var(--s2) var(--s2) var(--s6);
  box-shadow:var(--e-in),0 16px 34px -26px rgba(0,0,0,.7);
  transition:box-shadow .22s}
.find:focus-within{box-shadow:var(--e-in),0 0 0 3px var(--c-acc-soft),
  0 20px 44px -26px rgba(0,0,0,.8)}
.find>i{font-size:22px;color:var(--faint);flex:0 0 auto}
.find{cursor:pointer}
.fq{flex:1;min-width:0;padding:16px 0;font-size:16px;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fq.has{color:var(--ink);font-weight:500}
.find .go{border-radius:16px;padding:15px var(--s6);background:var(--grad);
  font-weight:600;font-size:15px;white-space:nowrap}
@media(max-width:560px){
  .find{padding:var(--s2) var(--s2) var(--s2) var(--s4);gap:var(--s2)}
  .find input{font-size:15px;padding:14px 0}
  .find .go{padding:13px var(--s4);font-size:14px}
}

/* ══════════════════════════════════════════════════════════════════
   ถาม Cendon — ช่องค้นหากับ AI รวมเป็นช่องเดียว
   ───────────────────────────────────────────────────────────────────
   ของเดิมมีสองทางแยกกัน ช่องค้นหาหาช่างได้อย่างเดียว
   ส่วนคำถามที่ตอบไม่ได้ด้วยรายชื่อ ต้องเดินไปหาหน้าแชตเอง
   คนที่พิมพ์ว่า "แอร์ไม่เย็นเกิดจากอะไร" ลงช่องค้นหา จึงได้ผลลัพธ์ว่างเปล่า
   ทั้งที่เป็นคำถามที่ระบบตอบได้ดีที่สุด

   รวมเป็นช่องเดียว แล้วให้ระบบอ่านเองว่าสิ่งที่พิมพ์คืออะไร
     พิมพ์เป็นคำ      → หาช่างทันที ไม่ต้องรอ
     พิมพ์เป็นคำถาม   → ยกปุ่มถาม Cendon ขึ้นมาไว้บนสุด
   ทั้งสองอย่างอยู่ในจอเดียวกัน ไม่ต้องเลือกก่อนว่าจะทำอะไร

   เปิดเป็นเต็มจอ เพราะตอนกำลังหาอะไรสักอย่าง ของอื่นบนหน้าคือสิ่งรบกวน
   ══════════════════════════════════════════════════════════════════ */
.ask{position:fixed;inset:0;z-index:150;display:none}
.ask.on{display:block}
.ask-bd{position:absolute;inset:0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
  opacity:0;transition:opacity .3s ease}
.ask.on .ask-bd{opacity:1}
/* ประกายพื้นหลังของจอถาม — เบากว่าหน้าหลัก เพราะจอนี้ต้องไม่แย่งสายตา */
.ask-bd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(760px 420px at 50% -6%,var(--c-acc-soft),transparent 64%)}

.ask-in{position:absolute;inset:0;display:flex;flex-direction:column;
  max-width:820px;margin:0 auto;padding:0 var(--s6)}

/* แถบพิมพ์ — ขยายขึ้นมาจากช่องเดิม ไม่ใช่โผล่มาเฉย ๆ
   การขยายจากที่เดิมทำให้สมองตามทันว่าของชิ้นเดียวกันเปลี่ยนรูป
   ไม่ใช่ของใหม่โผล่มาทับของเก่า */
.ask-bar{display:flex;align-items:center;gap:var(--s3);
  margin-top:clamp(24px,9vh,84px);
  background:var(--surface);border-radius:24px;
  padding:var(--s2) var(--s2) var(--s2) var(--s6);
  box-shadow:var(--e-in),0 24px 54px -30px rgba(0,0,0,.8);
  transform:translateY(18px) scale(.96);opacity:0;
  transition:transform .38s cubic-bezier(.2,.9,.25,1),opacity .28s}
.ask.on .ask-bar{transform:none;opacity:1}
.ask-bar>.mk{width:26px;height:30px;flex:0 0 auto;color:var(--accent)}
.ask-bar input{flex:1;min-width:0;background:none;border:0;outline:0;
  padding:18px 0;font-size:18px;font-weight:500}
.ask-bar .x{width:40px;height:40px;flex:0 0 40px;border-radius:14px;
  background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-size:19px}
.ask-bar .x:hover{color:var(--ink)}
@media(max-width:560px){
  .ask-in{padding:0 var(--s4)}
  .ask-bar{padding:var(--s2) var(--s2) var(--s2) var(--s4);border-radius:20px}
  .ask-bar input{font-size:16px;padding:15px 0}
}

/* พื้นที่ผลลัพธ์ */
.ask-body{flex:1;min-height:0;overflow-y:auto;padding:var(--s6) 0 var(--s16);
  scrollbar-width:none;
  /* จางที่ขอบล่าง บอกว่ายังมีของต่ออยู่ข้างล่าง
     ถ้าตัดตรง ๆ แถวที่ถูกตัดครึ่งจะดูเหมือนหน้าเสีย ไม่ใช่รายการที่ยังไม่จบ */
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 56px),transparent 100%);
  mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 56px),transparent 100%)}
.ask-body::-webkit-scrollbar{display:none}
.ask-sec{margin-bottom:var(--s6)}
.ask-sec>h5{margin:0 0 var(--s3);font-size:11.5px;font-weight:700;color:var(--faint);
  text-transform:uppercase;letter-spacing:.12em}

/* แถวผลลัพธ์ — ทยอยขึ้นทีละแถว ไม่ใช่โผล่พร้อมกันทั้งหน้า
   ทยอยขึ้นช่วยให้สายตาไล่จากบนลงล่างได้ทัน */
.ask-row{display:flex;align-items:center;gap:var(--s4);width:100%;text-align:left;
  padding:var(--s3) var(--s4);border-radius:18px;color:var(--ink);
  background:transparent;transition:background .16s,transform .16s;
  animation:rowIn .34s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}}
.ask-row:hover,.ask-row.sel{background:var(--surface)}
.ask-row:active{transform:scale(.99)}
.ask-ic{width:44px;height:44px;flex:0 0 44px;border-radius:15px;display:grid;
  place-items:center;font-size:20px;color:#fff;
  background:
    linear-gradient(180deg,rgba(255,255,255,.24) 0,rgba(255,255,255,.04) 48%,
      rgba(0,0,0,.08) 49%,rgba(0,0,0,.16) 100%),
    linear-gradient(150deg,color-mix(in srgb,var(--k,var(--accent)) 80%,#fff),var(--k,var(--accent)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.22),
             0 8px 18px -10px color-mix(in srgb,var(--k,var(--accent)) 75%,transparent)}
.ask-t{flex:1;min-width:0}
.ask-t b{display:block;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ask-t small{display:block;font-size:12.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ask-go{flex:0 0 auto;font-size:17px;color:var(--faint)}
.ask-row.sel .ask-go{color:var(--accent)}

/* แถวถาม Cendon — เด่นกว่าแถวอื่นเพราะมันคือสิ่งที่หน้านี้ทำได้ดีที่สุด */
.ask-hero{
  display:flex;align-items:center;gap:var(--s4);width:100%;text-align:left;
  padding:var(--s4) var(--s6);border-radius:22px;margin-bottom:var(--s6);
  color:var(--on-acc,#fff);position:relative;overflow:hidden;isolation:isolate;
  background:
    linear-gradient(180deg,rgba(255,255,255,.2) 0,rgba(255,255,255,.04) 46%,
      rgba(0,0,0,.06) 47%,rgba(0,0,0,.12) 100%),
    var(--grad);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.26),
             0 4px 10px -4px color-mix(in srgb,var(--accent) 55%,transparent),
             0 22px 46px -18px color-mix(in srgb,var(--accent) 80%,transparent);
  animation:rowIn .34s cubic-bezier(.2,.9,.3,1) backwards;
  transition:transform .18s cubic-bezier(.3,1.2,.5,1),box-shadow .18s}
.ask-hero::after{content:"";position:absolute;top:-60%;bottom:-60%;left:-140%;width:50%;
  z-index:1;pointer-events:none;transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transition:left .62s cubic-bezier(.25,.8,.3,1)}
.ask-hero:hover::after,.ask-hero.sel::after{left:150%}
.ask-hero:hover,.ask-hero.sel{transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.48),inset 0 -1px 0 rgba(0,0,0,.28),
             0 30px 56px -20px color-mix(in srgb,var(--accent) 88%,transparent)}
.ask-hero>*{position:relative;z-index:2}
.ask-hero .mk{width:30px;height:35px;flex:0 0 auto}
.ask-hero b{display:block;font-size:16.5px;font-weight:700}
.ask-hero small{display:block;font-size:12.5px;opacity:.82;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* จอเปล่า ก่อนพิมพ์อะไร */
.ask-idle{padding:var(--s4) 0}
.ask-idle .q{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.ask-idle .q button{background:var(--surface);border-radius:16px;padding:11px var(--s4);
  font-size:13.5px;color:var(--muted);box-shadow:var(--e1);
  transition:transform .16s,box-shadow .16s,color .16s}
.ask-idle .q button:hover{transform:translateY(-2px);box-shadow:var(--e2);color:var(--accent)}
.ask-hint{font-size:12.5px;color:var(--faint);padding:var(--s3) var(--s4);line-height:1.7}
.ask-hint kbd{background:var(--surface);border-radius:7px;padding:2px 7px;
  font-family:inherit;font-size:11.5px;box-shadow:var(--e1)}
@media (prefers-reduced-motion:reduce){
  .ask-row,.ask-hero{animation:none}
  .ask-bar{transition:none;transform:none;opacity:1}
  .ask-hero::after{display:none}
}

/* คำใบ้ — ตัวหนังสือล้วน ไม่ใช่ปุ่ม เพราะมันคือทางลัด ไม่ใช่คำสั่ง */
.tips{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s4);
  font-size:13.5px;color:var(--faint)}
.tips button{color:var(--muted);transition:color .16s;padding:0}
.tips button:hover{color:var(--accent)}

/* ══ ปุ่มเดียวที่พับเครื่องมือ AI ไว้ข้างใน ══ */
.morebar{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s6)}
.more{display:inline-flex;align-items:center;gap:var(--s2);
  background:var(--c-acc-soft);color:var(--accent);border-radius:30px;
  padding:11px var(--s6);font-size:13.5px;font-weight:600;
  box-shadow:var(--e1);transition:transform .18s,box-shadow .18s,filter .18s}
.more:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:var(--e2)}
.more:active{transform:translateY(1px);box-shadow:var(--e-in)}
.more i.ch{transition:transform .24s}
.more.on i.ch{transform:rotate(180deg)}
.tools{display:none;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-top:var(--s4)}
.tools.on{display:grid;animation:drop .3s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@media(max-width:820px){.tools.on{grid-template-columns:repeat(2,1fr)}}
.tool{display:flex;align-items:center;gap:var(--s3);text-align:left;
  background:var(--surface);border-radius:18px;padding:var(--s4);min-width:0;
  box-shadow:var(--e1);
  transition:transform .18s cubic-bezier(.3,1.2,.5,1),background .18s,box-shadow .18s}
.tool:hover{transform:translateY(-3px);background:var(--surface-2);box-shadow:var(--e2)}
.tool:active{transform:translateY(0);box-shadow:var(--e-in)}
.tool>i{font-size:22px;flex:0 0 auto}
.tool b{display:block;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool small{font-size:11.5px;color:var(--faint)}

/* ══ ผลจากเครื่องมือ AI ══ */
.aires{margin-top:var(--s4);border-radius:24px;padding:var(--s6);
  background:var(--surface);position:relative;
  box-shadow:var(--e3);
  animation:drop .3s cubic-bezier(.2,.9,.3,1)}
.aires h4{font-size:17px;display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.aires p{margin:0;font-size:14px;color:var(--muted);line-height:1.7}
.aires .x{position:absolute;right:var(--s4);top:var(--s4);width:32px;height:32px;
  border-radius:11px;background:var(--surface-2);color:var(--muted);
  display:grid;place-items:center}
.aires .x:hover{color:var(--ink)}
.band{display:flex;align-items:flex-end;gap:var(--s8);margin:var(--s6) 0 var(--s3);flex-wrap:wrap}
.band .c{flex:1;min-width:100px}
.band .c span{display:block;font-size:11px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.band .c b{font-size:24px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.band .c.hi b{font-size:34px;color:var(--accent)}
.rail{height:10px;border-radius:6px;background:var(--surface-2);position:relative;
  margin:var(--s3) 0;box-shadow:var(--e-in)}
.rail i{position:absolute;top:0;bottom:0;border-radius:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(0,0,0,.1)),var(--grad);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),
             0 2px 8px -2px color-mix(in srgb,var(--accent) 80%,transparent)}
.why{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.why span{font-size:12px;padding:6px 12px;border-radius:12px;
  background:var(--c-acc-soft);color:var(--accent)}

/* ══ แถบผู้ดูแล — ขึ้นเฉพาะคนที่เซิร์ฟเวอร์ยอมให้จัดการช่าง ══
   ใช้สีคนละโทนกับทั้งหน้า เพื่อให้เห็นชัดว่านี่ไม่ใช่ของที่ผู้ใช้ทั่วไปเห็น */
.abar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  margin-top:var(--s8);padding:var(--s3) var(--s4);border-radius:18px;
  background:color-mix(in srgb,var(--c-pro) 12%,var(--surface));
  box-shadow:var(--e1)}
.ab-t{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  color:var(--c-pro);margin-right:var(--s2)}
.ab-b{display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border-radius:13px;padding:9px var(--s4);font-size:13px;color:var(--ink);
  box-shadow:var(--e1);transition:transform .16s,box-shadow .16s}
.ab-b:hover{transform:translateY(-2px);box-shadow:var(--e2)}
.ab-b:active{transform:translateY(1px);box-shadow:var(--e-in)}

/* ══ หมวด — สีประจำตัว ══ */
.cats{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;
  padding:var(--s8) var(--s6) var(--s2);margin:0 calc(var(--s6) * -1);
  /* จางที่ขอบขวา บอกว่ายังมีหมวดต่ออยู่ข้างนอกจอ
     ถ้าตัดตรง ๆ คนจะคิดว่ามีแค่นี้แล้วไม่ปัดต่อ */
  -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 48px),transparent 100%);
  mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 48px),transparent 100%)}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);
  border-radius:18px;padding:13px var(--s4);font-weight:600;font-size:14px;
  color:var(--muted);background:var(--surface);white-space:nowrap;
  box-shadow:var(--e1);
  transition:transform .18s,background .18s,color .18s,box-shadow .18s}
.cat i{font-size:18px;color:var(--k,var(--muted));transition:color .18s}
.cat:hover{background:var(--surface-2);color:var(--ink);
  transform:translateY(-2px);box-shadow:var(--e2)}
.cat .n{font-size:12px;font-weight:400;opacity:.6}
/* หมวดที่เลือกอยู่ใช้สีของตัวเองเต็มที่ — เห็นทันทีว่ากำลังดูหมวดไหน */
.cat.on{
  background:
    linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,.06)),
    color-mix(in srgb,var(--k) 26%,transparent);
  color:var(--k);
  box-shadow:
    inset 0 1px 0 color-mix(in srgb,var(--k) 45%,transparent),
    inset 0 -1px 0 rgba(0,0,0,.28),
    0 2px 5px -2px color-mix(in srgb,var(--k) 40%,transparent),
    0 12px 26px -14px color-mix(in srgb,var(--k) 60%,transparent)}
.cat.on i{color:var(--k)}
.catnote{font-size:13.5px;color:var(--muted);padding:var(--s4) 2px 0;min-height:22px}

/* ══ แถวสรุป — จำนวนกับการเรียง ไม่มีปุ่มกรองเกะกะ ══ */
.sum{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
  padding:var(--s6) 0 var(--s2);font-size:13.5px;color:var(--muted)}
.sum b{color:var(--ink);font-weight:600}
.sum .sp{flex:1}
.sum select{background:var(--surface);border-radius:14px;padding:10px var(--s4);
  outline:0;font-size:13.5px;color:var(--ink);border:0}
.sum .f{padding:10px var(--s4);border-radius:14px;background:var(--surface);
  font-size:13.5px;color:var(--muted);transition:.16s}
.sum .f.on{background:var(--c-acc-soft);color:var(--accent);font-weight:600}

/* ══ การ์ดช่าง — ไม่มีกรอบ ══ */
.list{display:grid;gap:var(--s3);padding-top:var(--s4)}
@media(min-width:900px){.list{grid-template-columns:1fr 1fr;gap:var(--s4)}}
.pro{display:flex;gap:var(--s4);align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border-radius:24px;padding:var(--s6);
  box-shadow:var(--e1);
  transition:transform .2s cubic-bezier(.3,1.15,.5,1),background .2s,box-shadow .2s;
  position:relative;overflow:hidden}
/* แถบสีบางที่ขอบซ้าย บอกหมวดของช่างคนนี้โดยไม่ต้องอ่าน */
.pro::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--k);opacity:.85}
.pro:hover{transform:translateY(-4px);background:var(--surface-2);
  box-shadow:var(--e3)}
.pro:active{transform:translateY(0);box-shadow:var(--e-in)}
.face{width:56px;height:56px;flex:0 0 56px;border-radius:19px;display:grid;
  place-items:center;font-size:23px;font-weight:700;color:#fff;
  background:
    linear-gradient(180deg,rgba(255,255,255,.28) 0,rgba(255,255,255,.04) 48%,
      rgba(0,0,0,.08) 49%,rgba(0,0,0,.16) 100%),
    linear-gradient(150deg,color-mix(in srgb,var(--k) 80%,#fff),var(--k));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 -1px 0 rgba(0,0,0,.24),
    0 2px 4px -2px color-mix(in srgb,var(--k) 55%,transparent),
    0 12px 26px -12px color-mix(in srgb,var(--k) 75%,transparent)}
.pro .b{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:var(--s2);font-size:17px;font-weight:700;
  letter-spacing:-.02em}
.nm .vf{color:#4F8FF7;font-size:16px;flex:0 0 auto}
.nm .sc{margin-left:auto;font-size:15px;font-weight:700;color:var(--k);flex:0 0 auto}
.shop{font-size:13px;color:var(--muted);margin-top:1px}
.where{font-size:12.5px;color:var(--faint);margin-top:var(--s1)}
.skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s3)}
.skills span{font-size:12px;padding:5px 11px;border-radius:11px;
  background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k)}
.foot{display:flex;align-items:baseline;gap:var(--s3);margin-top:var(--s4);
  font-size:12.5px;color:var(--faint);flex-wrap:wrap}
.foot .pz{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.03em}
.foot .sp{flex:1}
@media(max-width:480px){
  .pro{padding:var(--s4);gap:var(--s3)}
  .face{width:48px;height:48px;flex:0 0 48px;border-radius:16px;font-size:20px}
  .nm{font-size:15.5px}
}

.empty{text-align:center;padding:var(--s16) var(--s6);color:var(--muted)}
.empty i{font-size:52px;color:var(--faint);display:block;margin-bottom:var(--s4)}
.empty b{display:block;font-size:17px;margin-bottom:var(--s2);color:var(--ink)}

/* ══ ท้ายหน้า — ที่อยู่ใหม่ของปุ่มที่เคยกินที่บนแถบบน ══ */
.tail{margin-top:var(--s16);display:grid;gap:var(--s3);
  grid-template-columns:1fr 1fr}
@media(max-width:640px){.tail{grid-template-columns:1fr}}
.tcard{text-align:left;border-radius:24px;padding:var(--s8) var(--s6);
  background:var(--surface);box-shadow:var(--e1);
  transition:transform .2s,background .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-3px);background:var(--surface-2);box-shadow:var(--e3)}
.tcard:active{transform:translateY(0);box-shadow:var(--e-in)}
.tcard i{font-size:26px;color:var(--accent);display:block;margin-bottom:var(--s3)}
.tcard b{display:block;font-size:17px;font-weight:700;margin-bottom:var(--s1)}
.tcard small{font-size:13px;color:var(--muted);line-height:1.6}

/* ══ แผ่นรายละเอียด ══ */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(6,5,3,.62);
  backdrop-filter:blur(8px);animation:fade .25s}
.sheet .pn{position:absolute;right:0;top:0;bottom:0;width:min(600px,100%);
  background:var(--bg);overflow-y:auto;
  box-shadow:-40px 0 90px -30px rgba(0,0,0,.7);
  animation:slide .34s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@media (max-width:640px){
  .sheet .pn{top:auto;height:94dvh;width:100%;border-radius:28px 28px 0 0;
    animation:up .34s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(50px);opacity:0}}
}
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--s3);
  padding:var(--s6);background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(18px)}
.ph b{font-size:16px}
.ph button{margin-left:auto;width:38px;height:38px;border-radius:13px;
  background:var(--surface);color:var(--ink);display:grid;place-items:center}
.pb{padding:0 var(--s6) var(--s12)}
.big{display:flex;gap:var(--s4);align-items:center;margin-bottom:var(--s6)}
.big .face{width:72px;height:72px;flex:0 0 72px;border-radius:24px;font-size:29px}
.big h3{font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin:var(--s6) 0}
@media(max-width:440px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border-radius:17px;padding:var(--s4) var(--s2);
  text-align:center;box-shadow:var(--e1)}
.kpi b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em}
.kpi span{font-size:11px;color:var(--faint)}
.grp{margin-top:var(--s8)}
.grp h4{font-size:12.5px;font-weight:700;color:var(--faint);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:var(--s3)}
.grp p{margin:0;font-size:14.5px;line-height:1.75}
.kv{display:flex;justify-content:space-between;gap:var(--s4);
  padding:13px 0;font-size:14px}
.kv+.kv{box-shadow:0 -1px 0 var(--line-2)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:500;text-align:right}
.acts{display:flex;gap:var(--s2);margin-top:var(--s8);position:sticky;bottom:0;
  padding:var(--s4) 0 var(--s6);
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.acts button{flex:1;border-radius:18px;padding:16px;font-weight:600;font-size:15px;
  transition:transform .16s,box-shadow .16s}
.acts .s{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
.acts .s:hover{box-shadow:var(--e2);transform:translateY(-2px)}
.acts .s:active{transform:translateY(1px);box-shadow:var(--e-in)}

/* ══ ด่านคัดช่าง ══ */
.vet{display:grid;gap:var(--s3);margin:var(--s4) 0}
.stg{border-radius:20px;padding:var(--s6);background:var(--surface);box-shadow:var(--e1)}
.sh{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.sn{width:32px;height:32px;flex:0 0 32px;border-radius:12px;background:var(--grad);
  color:var(--on-acc,#fff);display:grid;place-items:center;font-size:14px;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25),
             0 6px 14px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.sh b{font-size:16px;flex:1}
.sh small{font-size:11.5px;color:var(--faint);white-space:nowrap}
.stg li{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:var(--s1)}
.swhy{margin-top:var(--s3);font-size:12.5px;color:var(--accent);line-height:1.65}

/* ══ ความคุ้มครอง ══ */
.trow{display:flex;gap:var(--s4);align-items:flex-start;padding:var(--s4) 0}
.trow>i{font-size:22px;color:var(--accent);flex:0 0 auto;margin-top:2px}
.trow b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
.trow small{font-size:13px;color:var(--muted);line-height:1.65}
.fee{display:flex;align-items:center;gap:var(--s4);background:var(--surface);
  border-radius:17px;padding:var(--s4) var(--s6);margin-bottom:var(--s2);
  box-shadow:var(--e1)}
.fee b{font-size:23px;font-weight:700;color:var(--accent);flex:0 0 68px;letter-spacing:-.04em}
.fee span{flex:1;min-width:0}
.fee strong{display:block;font-size:14px;font-weight:600}
.fee small{font-size:12px;color:var(--faint)}
.keep{background:var(--c-acc-soft);border-radius:20px;padding:var(--s6);margin-top:var(--s4)}
.keep li{font-size:13px;color:var(--muted);margin-bottom:var(--s2)}
.keep li:last-child{margin:0}

/* ══ ฟอร์ม ══ */
.f{margin-bottom:var(--s4)}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:var(--s2)}
.f label em{font-style:normal;color:var(--danger)}
.f input,.f textarea{width:100%;background:var(--surface);border:0;border-radius:16px;
  padding:14px var(--s4);outline:0;font-size:15px;
  box-shadow:var(--e-in);transition:box-shadow .18s}
.f input:focus,.f textarea:focus{box-shadow:var(--e-in),0 0 0 3px var(--c-acc-soft)}
.f textarea{min-height:100px;resize:vertical}
.f .hint{font-size:12px;color:var(--faint);margin-top:var(--s2)}
.f.bad input,.f.bad textarea{box-shadow:0 0 0 2px var(--danger)}
.f .err{font-size:12px;color:var(--danger);margin-top:var(--s2);display:none}
.f.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media (max-width:460px){.two{grid-template-columns:1fr}}
.pick{display:flex;gap:var(--s2);flex-wrap:wrap}
.pick button{background:var(--surface);border-radius:14px;padding:11px var(--s4);
  font-size:13px;color:var(--muted);box-shadow:var(--e1);
  transition:transform .16s,box-shadow .16s,background .16s,color .16s}
.pick button:hover{transform:translateY(-1px);box-shadow:var(--e2)}
.pick button.on{background:var(--c-acc-soft);color:var(--accent);font-weight:600}
.pick button:active{transform:translateY(1px);box-shadow:var(--e-in)}
.done{background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:22px;
  padding:var(--s8);text-align:center}
.done i{font-size:48px;color:var(--ok)}
.done b{display:block;font-size:18px;margin:var(--s3) 0 var(--s2)}
.done p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.75}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(80px);
  z-index:200;background:var(--ink);color:var(--bg);border-radius:18px;
  padding:14px var(--s6);font-size:14px;font-weight:500;
  box-shadow:var(--e3);
  opacity:0;transition:.3s cubic-bezier(.2,.9,.3,1);pointer-events:none;
  display:flex;align-items:center;gap:var(--s2);max-width:calc(100vw - 48px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

         เพราะการค้นหากับการถามเป็นเรื่องเดียวกัน แค่คนพิมพ์ต่างกัน -->

   จอนี้จึงแสดงทั้งสองอย่างเสมอ แต่สลับลำดับตามสิ่งที่พิมพ์

const ASK_MARK=`<svg class="mk" viewBox="-6 -6 94.8 112" aria-hidden="true"><path fill="currentColor" d="${

const Q_WORDS="\\?|ทำไม|เพราะอะไร|เกิดจาก|อะไรได้บ้าง|อะไรบ้าง|อะไร|ยังไง|อย่างไร|ไหม|มั้ย|หรือเปล่า|ควรทำ|ควร|แปลว่า|วิธี|ดูยังไง|อันตราย|ปกติ";

   ซึ่งยังค้นไม่เจอเหมือนเดิม ต้องถอดให้หมดจนเหลือแต่อาการ */
const Q_STRIP=new RegExp(Q_WORDS,"g");

let askOn=false, askSel=0, askItems=[];

function openAsk(pre){
  if(askOn)return;
  askOn=true;
  const el=$("ask"); el.classList.add("on");
  document.body.style.overflow="hidden";
  const i=$("askQ");
  i.value=(pre!=null?pre:S.q)||"";

  /* รอให้ภาพเคลื่อนไหวเริ่มก่อนค่อยเรียกแป้นพิมพ์ขึ้น
     ถ้าเรียกทันที แป้นพิมพ์บนมือถือจะกระชากจอจนภาพเคลื่อนไหวสะดุด */
  setTimeout(()=>i.focus(),120);
  addEventListener("keydown",askKey);
}
function closeAsk(){
  if(!askOn)return;
  askOn=false;
  $("ask").classList.remove("on");
  document.body.style.overflow="";
  removeEventListener("keydown",askKey);
}
/* ขึ้นลงเลือกแถว เอนเทอร์ทำสิ่งที่เลือก เอสเคปปิด
   คนที่พิมพ์เร็วจะไม่ยอมย้ายมือไปแตะจอ ถ้าไม่มีปุ่มลูกศรก็เท่ากับใช้ไม่ได้ */
function askKey(e){
  if(e.key==="Escape"){ closeAsk(); return }
  if(!askItems.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    askSel=(askSel+(e.key==="ArrowDown"?1:-1)+askItems.length)%askItems.length;
    askPaintSel();
  }else if(e.key==="Enter"){
    e.preventDefault();
    const it=askItems[askSel]; if(it&&it.go)it.go();
  }
}
function askPaintSel(){
  const rows=$("askBody").querySelectorAll("[data-i]");
  rows.forEach(r=>r.classList.toggle("sel",+r.dataset.i===askSel));
  const cur=$("askBody").querySelector(".sel");
  if(cur)cur.scrollIntoView({block:"nearest"});
}

  const q=$("askQ").value.trim();

  if(!q){
    /* ยังไม่พิมพ์อะไร — เสนอคำถามจริงที่คนถามบ่อย
       ไม่ใช่จอว่างที่รอให้คิดเอง เพราะคนกดเข้ามาเพราะยังไม่รู้ว่าจะถามยังไง */
    body.innerHTML=`<div class="ask-idle">
      <h5 style="margin:0 0 12px;font-size:11.5px;font-weight:700;color:var(--faint);
        text-transform:uppercase;letter-spacing:.12em">ลองถามแบบนี้</h5>
      <div class="q">${ASK_IDLE.map(t=>
        `<button onclick="askFill('${esc(t).replace(/'/g,"\\'")}')">${esc(t)}</button>`).join("")}</div>
      <div class="ask-hint" style="margin-top:24px">
        พิมพ์เป็นคำสั้น ๆ จะได้รายชื่อช่างทันที · พิมพ์เป็นคำถามจะได้คำตอบจาก Cendon<br>
        <kbd>↑</kbd> <kbd>↓</kbd> เลือก · <kbd>Enter</kbd> ไปต่อ · <kbd>Esc</kbd> ปิด
      </div></div>`;
    return;
  }

  const isQ=IS_Q.test(q);
  /* คำถามยาว ๆ ค้นตรง ๆ ไม่เจอช่างสักคน เพราะไม่มีใครเขียนทักษะตัวเอง
     ว่า "แอร์ไม่เย็นเกิดจากอะไร" ต้องถอดคำถามออกก่อนเหลือแต่อาการ
     ผลคือถามเป็นประโยคยาวก็ยังเห็นช่างที่ทำเรื่องนั้นเป็น ไม่ใช่จอว่าง */
  const core=isQ?q.replace(Q_STRIP,"").replace(/\s+/g," ").trim():q;
  let hits=Techs.search({q,here:S.here,limit:6});
  if(!hits.length&&core&&core!==q)hits=Techs.search({q:core,here:S.here,limit:6});
  /* ยังไม่เจอ — กลับด้านการค้นหา
     แทนที่จะถามว่า "ช่างคนไหนมีคำนี้" ให้ถามว่า "คำไหนของช่างอยู่ในประโยคนี้"
     ภาษาไทยไม่เว้นวรรคระหว่างคำ การตัดคำจึงเชื่อถือไม่ได้
     แต่การหาว่าคำที่เรารู้จักอยู่ในประโยคหรือเปล่า ทำได้แน่นอนเสมอ
     "ช่วงล่างมีเสียงตอนข้ามลูกระนาด อันตรายไหม" จึงเจอคำว่า "ช่วงล่างมีเสียง" ที่ช่างเขียนไว้ */
  if(!hits.length){
    const key=askKeyword(q);
    if(key)hits=Techs.search({q:key,here:S.here,limit:6});
  }
  const cats=Techs.CATS.filter(c=>{
    const hay=c.th+" "+c.desc;
    return hay.indexOf(q)>=0||(core&&core.length>1&&hay.indexOf(core)>=0);
  }).slice(0,2);
  const est=Techs.estimate(q,S.here)||(core!==q?Techs.estimate(core,S.here):null);
  let n=0;
  const row=(o)=>{ askItems.push(o); return o };

  /* แถวถาม Cendon — อยู่บนสุดถ้าเป็นคำถาม ไม่งั้นลงไปอยู่ท้ายรายชื่อ */
  const heroHTML=(i)=>`<button class="ask-hero" data-kind="ask" data-i="${i}" style="animation-delay:${i*28}ms">
      ${ASK_MARK}
      <span style="min-width:0;flex:1">
        <b>ถาม Cendon ว่า “${esc(q.length>44?q.slice(0,44)+"…":q)}”</b>
        <small>${isQ?"คำถามแบบนี้ตอบได้ละเอียดกว่าในห้องแชต แนบรูปหรือเสียงเครื่องได้ด้วย"
                    :"ให้ AI อธิบายสาเหตุและขั้นตอนแก้ ก่อนตัดสินใจเรียกช่าง"}</small>
      </span>
      <i class="ti ti-arrow-right ask-go" style="color:currentColor"></i>
    </button>`;
  const heroItem=()=>row({go:()=>{ location.href="chat.html?q="+encodeURIComponent(q) }});

  let html="";
  if(isQ){ heroItem(); html+=heroHTML(n++) }

  if(est&&hits.length){
    const i=n++;
    row({go:()=>{ closeAsk(); $("q").value=q; S.q=q; syncBar(); aiEstimate() }});
    html+=`<div class="ask-sec"><h5>ราคาที่ควรเป็น</h5>
      <button class="ask-row" data-kind="est" data-i="${i}" style="animation-delay:${i*28}ms;--k:var(--c-eng)">
        <span class="ask-ic"><i class="ti ti-coin"></i></span>
        <span class="ask-t"><b>฿${money(est.typical)} โดยประมาณ</b>
          <small>ช่วง ฿${money(est.low)}–฿${money(est.high)} จากช่าง ${est.n} คนที่ทำงานนี้</small></span>
        <i class="ti ti-chevron-right ask-go"></i></button></div>`;
  }

  if(hits.length){
    html+=`<div class="ask-sec"><h5>ช่างที่ทำเรื่องนี้เป็น</h5>`;
    hits.forEach(t=>{
      const i=n++;
      row({go:()=>{ closeAsk(); $("q").value=q; S.q=q; syncBar(); run(); openTech(t.id) }});
      html+=`<button class="ask-row" data-kind="pro" data-i="${i}" style="animation-delay:${i*28}ms;--k:${hueOf(t)}">
        <span class="ask-ic">${esc(t.name[0])}</span>
        <span class="ask-t"><b>${esc(t.name)} · ${t.rating.toFixed(1)}★</b>
          <small>${esc(t.shop)} · ${esc(t.area)}${t.dist!=null?` · ${t.dist} กม.`:""} · เริ่ม ฿${money(t.from)}</small></span>
        <i class="ti ti-chevron-right ask-go"></i></button>`;
    });
    html+=`</div>`;
  }

  if(cats.length){
    html+=`<div class="ask-sec"><h5>หมวด</h5>`;
    cats.forEach(c=>{
      const i=n++;
      row({go:()=>{ closeAsk(); S.cat=c.id; $("q").value=""; S.q=""; syncBar(); drawCats(); run() }});
      html+=`<button class="ask-row" data-kind="cat" data-i="${i}" style="animation-delay:${i*28}ms;--k:var(--${"c-"+c.id})">
        <span class="ask-ic"><i class="ti ${c.ic}"></i></span>
        <span class="ask-t"><b>${esc(c.th)}</b><small>${esc(c.desc)}</small></span>
        <i class="ti ti-chevron-right ask-go"></i></button>`;
    });
    html+=`</div>`;
  }

  if(!isQ){ heroItem(); html+=heroHTML(n++) }

  if(!hits.length&&!cats.length){
    html+=`<div class="ask-hint">ยังไม่มีช่างที่ระบุว่าทำงานแบบนี้ในระบบ —
      แต่ถาม Cendon ได้เลย มันตอบเรื่องรถได้ทุกอย่าง</div>`;
  }
  body.innerHTML=html;
  body.querySelectorAll("[data-i]").forEach(el=>{
    el.onclick=()=>{ const it=askItems[+el.dataset.i]; if(it&&it.go)it.go() };
    el.onmouseenter=()=>{ askSel=+el.dataset.i; askPaintSel() };
  });
  askPaintSel();
}
/* คำทั้งหมดที่ช่างในระบบเขียนไว้ว่าตัวเองทำอะไรเป็น
   สร้างครั้งเดียวแล้วเก็บไว้ ไม่ต้องไล่ใหม่ทุกตัวอักษรที่พิมพ์ */
let SKILL_WORDS=null;
function askKeyword(text){
  if(!SKILL_WORDS){
    const set={};
    Techs.all().forEach(t=>(t.skills||[]).forEach(k=>{ if(k.length>=3)set[k]=1 }));
    Techs.CATS.forEach(c=>{ if(c.th.length>=3)set[c.th]=1 });
    /* เรียงจากคำยาวไปสั้น คำยาวเจาะจงกว่า จึงควรได้สิทธิ์ก่อน
       ถ้าเรียงจากสั้นไปยาว "เบรก" จะชนะ "เบรกมีเสียง" ทั้งที่อันหลังตรงกว่า */
    SKILL_WORDS=Object.keys(set).sort((a,b)=>b.length-a.length);
  }
  const t=String(text||"");
  for(const w of SKILL_WORDS)if(t.indexOf(w)>=0)return w;
  return "";
}
function askFill(t){ $("askQ").value=t; askDraw(); $("askQ").focus() }
/* ช่องบนหน้าหลักต้องสะท้อนสิ่งที่ค้นล่าสุด ไม่งั้นปิดจอถามแล้วดูเหมือนไม่ได้ทำอะไร */
function syncBar(){
  const el=$("fq"); if(!el)return;
  el.textContent=S.q||"ถามอาการรถ หรือหาช่าง…";
  el.classList.toggle("has",!!S.q);
}

/* ══ เครื่องมือ AI ══ */
function aiBox(html){
  $("aiOut").innerHTML=`<div class="aires">
    <button class="x" onclick="document.getElementById('aiOut').innerHTML=''" aria-label="ปิด">
      <i class="ti ti-x"></i></button>${html}</div>`;
  $("aiOut").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function needQ(){
  const q=($("q").value||"").trim();
  if(q)return q;
  /* ยังไม่ได้ค้นอะไร เปิดจอถามให้เลย ดีกว่าบอกให้ไปพิมพ์เองแล้วปล่อยทิ้งไว้ */
  openAsk("");
  toast("พิมพ์อาการที่เจอก่อน แล้วกดเครื่องมือนี้อีกครั้ง","ti-keyboard");
  return "";
}
function aiEstimate(){
  const q=needQ(); if(!q)return;
  const e=Techs.estimate(q,S.here);
  if(!e)return aiBox(`<h4><i class="ti ti-coin" style="color:var(--c-eng)"></i>ยังประเมินไม่ได้</h4>
    <p>ยังไม่มีช่างที่ระบุว่าทำงาน “${esc(q)}” เป็น ลองพิมพ์สั้นลงแล้วลองใหม่</p>`);
  const span=e.max-e.low||1;
  const l=((e.typical-e.low)/span*100).toFixed(0), w=((e.high-e.typical)/span*100).toFixed(0);
  aiBox(`<h4><i class="ti ti-coin" style="color:var(--c-eng)"></i>ราคาที่ควรเป็นสำหรับ “${esc(q)}”</h4>
    <div class="band">
      <div class="c"><span>ถูกที่สุด</span><b>฿${money(e.low)}</b></div>
      <div class="c hi"><span>ราคาที่พบบ่อย</span><b>฿${money(e.typical)}</b></div>
      <div class="c"><span>งานหนักสุด</span><b>฿${money(e.high)}</b></div>
    </div>
    <div class="rail"><i style="left:${l}%;width:${w}%"></i></div>
    <p>${esc(e.note)} · ช่างส่วนใหญ่รับประกันงานนี้ ${e.warranty} วัน</p>
    <p style="margin-top:12px">ถ้ามีใครเรียกเกิน <b style="color:var(--ink)">฿${money(e.max)}</b>
    ให้ขอใบเสนอราคาแยกค่าแรงกับค่าอะไหล่ก่อนตกลง</p>`);
}
function aiMatch(){
  const q=needQ(); if(!q)return;
  const car=(()=>{try{return JSON.parse(localStorage.getItem("spire_garage")||"[]")[0]||{}}catch(e){return{}}})();
  const m=Techs.match({symptom:q,here:S.here||Techs.home(),car,urgent:S.cat==="quick",mobile:S.mobile});
  if(!m)return aiBox(`<h4><i class="ti ti-wand" style="color:var(--c-pro)"></i>ยังจับคู่ให้ไม่ได้</h4>
    <p>ไม่มีช่างที่ตรงกับ “${esc(q)}” ลองพิมพ์สั้นลงแล้วกดใหม่</p>`);
  const b=m.best;
  aiBox(`<h4><i class="ti ti-wand" style="color:var(--c-pro)"></i>สำหรับงานนี้ ควรเป็น ${esc(b.name)}</h4>
    <p>${esc(b.shop)} · ${esc(b.area)}${b.dist!=null?` · ห่าง ${b.dist} กม.`:""}</p>
    <div class="why">${b.why.map(w=>`<span>${esc(w)}</span>`).join("")}</div>
    <div class="acts" style="position:static;background:none;padding:24px 0 0">
      <button class="s" onclick="openTech('${b.id}')">ดูโปรไฟล์</button>
      <button class="p gloss" onclick="aiJob('${b.id}')"><span>ส่งใบงานให้ช่าง</span></button>
    </div>
    ${m.others.length?`<p style="margin-top:12px;font-size:13px">รองลงมา ${
      m.others.map(o=>esc(o.name)).join(" · ")}</p>`:""}`);
}
function aiJob(id){
  const t=Techs.all().find(x=>x.id===id);
  const car=(()=>{try{return JSON.parse(localStorage.getItem("spire_garage")||"[]")[0]||{}}catch(e){return{}}})();
  const brief=Techs.jobBrief({car,symptom:$("q").value.trim()||S.q});
  const q="ช่วยเรียบเรียงใบงานนี้ให้ช่างอ่านเข้าใจใน 30 วินาที แล้วเติมคำถามที่ช่างน่าจะอยากรู้เพิ่ม"
    +(t?` (จะส่งให้ ${t.name} ${t.shop})`:"")+"\n\n"+brief;
  location.href="chat.html?q="+encodeURIComponent(q);
}
function aiInspect(){
  const job=prompt("ตกลงจ้างให้ทำอะไรไว้? (เช่น เปลี่ยนโช้กหน้าคู่หน้า)");
  if(!job)return;
  const price=prompt("ราคาที่เรียกเก็บ (บาท) — ไม่ใส่ก็ได้")||"";
  const q="ผมเพิ่งรับรถกลับมา ช่วยตรวจงานให้หน่อย เดี๋ยวผมแนบรูปก่อนซ่อมและหลังซ่อมให้\n\n"
    +Techs.inspectList({job,price});
  location.href="chat.html?q="+encodeURIComponent(q)+"&attach=image";
}
function aiHome(){
  const h=Techs.home();
  if(h){
    S.here={lat:h.lat,lng:h.lng}; S.cat="near"; S.sort="near"; $("sort").value="near";
    drawCats(); run();
    return aiBox(`<h4><i class="ti ti-home" style="color:var(--c-near)"></i>เรียงตามระยะจากบ้านแล้ว</h4>
      <p>${esc(h.label||"บ้านที่บันทึกไว้")} — กำลังแสดงช่างในรัศมี 25 กิโลเมตรจากบ้านคุณ</p>
      <p style="margin-top:12px">ทำไมต้องเป็นบ้าน ไม่ใช่ที่ที่ยืนอยู่ตอนนี้ — เพราะช่างข้างทางเจอกันครั้งเดียว
      ส่วนช่างใกล้บ้านคือคนที่จะดูแลรถคันนี้ไปอีกหลายปี</p>`);
  }
  if(!navigator.geolocation)return toast("เครื่องนี้บอกตำแหน่งไม่ได้","ti-map-pin-off");
  toast("กำลังขอตำแหน่ง…","ti-map-pin");
  navigator.geolocation.getCurrentPosition(p=>{
    const label=prompt("ตั้งชื่อที่นี่ว่าอะไร (เช่น บ้าน, ที่ทำงาน)","บ้าน")||"บ้าน";
    Techs.homeSet(p.coords.latitude,p.coords.longitude,label);
    toast("บันทึกตำแหน่งบ้านแล้ว","ti-check"); aiHome();
  },()=>toast("ไม่ได้รับอนุญาตให้ดูตำแหน่ง","ti-map-pin-off"),{timeout:9000});
}

/* ══ ความคุ้มครอง ══ */
/* The live marketplace controller is loaded below before initialization. */
let openTrust, openApply, openAdmin, openPending, reload;
let adminBar = () => {};

/* ══ เริ่มทำงาน ══ */
(function init(){
  const p=new URLSearchParams(location.search);
  if(p.get("q"))$("q").value=p.get("q");
  if(p.get("cat"))S.cat=p.get("cat");
  S.here=Techs.home()||Techs.pos();
  Techs.useApi(api);
  drawCats(); run(); syncBar();

  /* ── ต่อฐานข้อมูล ──
     ลองปลายทางสาธารณะก่อนโดยไม่ต้องล็อกอิน ถ้ายังไม่มีก็รอจนรู้ว่าใครเข้ามา
     แล้วค่อยลองอ่านผ่านสิทธิ์ของเขา
     ไม่บังคับให้ล็อกอินก่อนดูหน้า เพราะคนที่รถเสียไม่ควรต้องสมัครสมาชิกก่อนหาช่าง */
  Techs.load(BACKEND_URL).then(()=>{ drawCats(); run() });

  (function boot(){
    if(typeof firebase==="undefined"||!firebase.initializeApp)
      return setTimeout(boot,120);
    try{
      firebase.initializeApp(fbConfig);
      auth=firebase.auth();
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
      auth.onAuthStateChanged(async u=>{
        ME=u||null; CAN=false;
        if(u){
          /* ถามเซิร์ฟเวอร์ว่าคนนี้อ่านคลังกลางได้ไหม
             คำตอบนั้นคือคำตอบเดียวกับว่าเขาจัดการช่างได้ไหม
             ไม่ตั้งกฎเองในหน้าเว็บ เพราะกฎในเบราว์เซอร์ไม่ใช่ความปลอดภัย */
          try{ CAN=!!(await api("/api/tech/me")).admin }catch(e){ CAN=false }
          if(CAN){ await Techs.load(BACKEND_URL); drawCats(); run() }
        }
        adminBar(); run(); if(window.Marketplace)Marketplace.authChanged();
      });
    }catch(e){ adminBar() }
  })();
  /* วาดผลใหม่ระหว่างพิมพ์ แต่รอให้หยุดพิมพ์ก่อน
     ค้นทุกตัวอักษรจะทำให้รายการกระพริบจนอ่านไม่ทัน */
  let d=0;
  $("askQ").addEventListener("input",()=>{ clearTimeout(d); d=setTimeout(askDraw,140) });
})();
</script>
